const RICH_DAD_DATA = [{"title": "Reiche arbeiten nicht für Geld – sie lassen Geld für sich arbeiten", "content": "Die größte Lektion des Buches ist, dass die Reichen ihr Geld für sich arbeiten lassen, anstatt selbst für Geld zu arbeiten. Die Armen und die Mittelschicht arbeiten für ihr Gehalt – sie tauschen ihre Zeit gegen Geld. Die Reichen dagegen bauen Vermögenswerte auf, die Einkommen generieren, ohne dass sie selbst arbeiten müssen. Das nennt man passives Einkommen. Wenn reiche Menschen nicht arbeiten, arbeitet ihr Geld weiter für sie. Der entscheidende Unterschied: Arme Menschen fragen: „Wie viel Geld bekomme ich für meine Arbeit?“ Reiche Menschen fragen: „Wie kann ich mein Geld so einsetzen, dass es für mich arbeitet?“ Wer diese Lektion versteht, bricht aus dem Hamsterrad aus und beginnt, Vermögen aufzubauen.", "translation": "The biggest lesson of the book is that rich people make their money work for them instead of working for money themselves. Poor and middle-class people work for their salary—they trade their time for money. Rich people, on the other hand, build assets that generate income without requiring them to work themselves. This is called passive income. When rich people are not working, their money keeps working for them. The key difference is this: poor people ask, ‘How much money do I get for my work?’ Rich people ask, ‘How can I use my money so that it works for me?’ Anyone who understands this lesson breaks out of the hamster wheel and begins building wealth."}, {"title": "Verstehe den Unterschied zwischen Vermögenswerten und Verbindlichkeiten", "content": "Ein Vermögenswert ist etwas, das Geld in deine Tasche steckt. Eine Verbindlichkeit ist etwas, das Geld aus deiner Tasche nimmt. Das klingt einfach, aber die meisten Menschen verwechseln beides. Viele glauben, ihr eigenes Haus sei ihr größter Vermögenswert. In Wirklichkeit ist es oft eine riesige Verbindlichkeit, weil es ständig Geld kostet – Hypothek, Versicherungen, Steuern, Reparaturen. Die Reichen kaufen Vermögenswerte wie Aktien, Anleihen, Immobilien, die Mieteinnahmen bringen, oder Unternehmen, die Gewinne abwerfen. Die Armen und die Mittelschicht kaufen Verbindlichkeiten und nennen sie fälschlicherweise Vermögenswerte. Die Strategie ist einfach: Kaufe Dinge, die dir jeden Monat Geld einbringen, nicht Dinge, die dich Geld kosten.", "translation": "An asset is something that puts money into your pocket. A liability is something that takes money out of your pocket. It sounds simple, but most people confuse the two. Many believe that their own house is their biggest asset. In reality, it is often a huge liability because it constantly costs money—mortgage payments, insurance, taxes, and repairs. Rich people buy assets such as stocks, bonds, real estate that produces rental income, or businesses that generate profits. Poor and middle-class people buy liabilities and mistakenly call them assets. The strategy is simple: buy things that bring you money every month, not things that cost you money."}, {"title": "Kümmere dich um dein eigenes Geschäft", "content": "Viele Menschen arbeiten ihr ganzes Leben lang für das Geschäft eines anderen. Sie sichern sich einen Job, arbeiten hart und machen ihren Chef reich. Die Reichen dagegen bauen ihr eigenes Vermögen auf. Das bedeutet nicht, dass du sofort ein Unternehmen gründen musst. Du kannst weiterhin angestellt sein, aber gleichzeitig Vermögenswerte aufbauen – zum Beispiel Immobilien, Aktien oder ein Nebengeschäft. Dein „eigenes Geschäft“ ist deine Vermögenssäule. Solange du nur für dein Gehalt arbeitest, baust du das Geschäft deines Arbeitgebers auf. Wenn du Vermögenswerte kaufst, baust du dein eigenes Geschäft auf.", "translation": "Many people work their entire lives for someone else’s business. They secure a job, work hard, and make their boss rich. Rich people, on the other hand, build their own wealth. This does not mean that you have to start a company immediately. You can remain employed while building assets at the same time—for example, real estate, stocks, or a side business. Your ‘own business’ is your wealth pillar. As long as you work only for your salary, you are building your employer’s business. When you buy assets, you are building your own business."}, {"title": "Finanzielle Bildung ist wichtiger als akademische Bildung", "content": "In der Schule lernen wir, hart zu arbeiten und einen guten Job zu bekommen. Aber wir lernen nicht, wie man mit Geld umgeht, investiert oder Vermögen aufbaut. Kiyosaki sagt: „Ein Mensch kann hochgebildet, beruflich erfolgreich und dennoch finanziell analphabetisch sein“. Finanzielle Bildung bedeutet, die Sprache des Geldes zu verstehen – wie es funktioniert, wie man es vermehrt und wie man Steuern legal minimiert. Wer finanziell gebildet ist, trifft bessere Entscheidungen mit seinem Geld. Investiere in deine finanzielle Bildung – lies Bücher, besuche Seminare und lerne von erfolgreichen Menschen. Das ist die beste Investition, die du machen kannst.", "translation": "At school we learn to work hard and get a good job. But we do not learn how to manage money, invest, or build wealth. Kiyosaki says: ‘A person can be highly educated, professionally successful, and still be financially illiterate.’ Financial education means understanding the language of money—how it works, how to increase it, and how to legally minimize taxes. People who are financially educated make better decisions with their money. Invest in your financial education—read books, attend seminars, and learn from successful people. It is the best investment you can make."}, {"title": "Gehe kalkulierte Risiken ein", "content": "Die Angst vor Verlust hält die meisten Menschen davon ab, reich zu werden. Sie bleiben in ihrem sicheren Job, weil sie keine Risiken eingehen wollen. Aber ohne Risiko gibt es kein Wachstum. Die Reichen gehen kalkulierte Risiken ein – sie verlassen ihre Komfortzone und investieren in Chancen, die andere nicht sehen. Das bedeutet nicht, dass sie leichtsinnig sind. Sie bilden sich weiter, analysieren und treffen dann informierte Entscheidungen. Wer niemals Risiken eingeht, wird niemals große Gewinne erzielen. Risiko ist der Preis für Reichtum.", "translation": "The fear of loss keeps most people from becoming rich. They stay in their safe jobs because they do not want to take risks. But without risk there is no growth. Rich people take calculated risks—they leave their comfort zone and invest in opportunities that others do not see. This does not mean that they are reckless. They educate themselves, analyze, and then make informed decisions. Anyone who never takes risks will never achieve large profits. Risk is the price of wealth."}, {"title": "Arbeite, um zu lernen – nicht nur für das Gehalt", "content": "Viele Menschen wählen ihren Job nur nach dem Gehalt aus. Die Reichen wählen Jobs nach den Fähigkeiten, die sie lernen können. Kiyosaki sagt: „Job-Sicherheit bedeutete meinem armen Vater alles, während Lernen meinem reichen Vater alles bedeutete“. Ein Job ist nicht nur eine Einkommensquelle – er ist eine Gelegenheit, neue Fähigkeiten zu entwickeln, die dir später beim Aufbau deines eigenen Vermögens helfen. Lerne Verkaufen, Verhandeln, Führen und Investieren. Diese Fähigkeiten sind wertvoller als jedes Gehalt. Wer nur für Geld arbeitet, bleibt ein Sklave des Geldes. Wer fürs Lernen arbeitet, wird irgendwann sein eigener Chef.", "translation": "Many people choose their job only by salary. Rich people choose jobs according to the skills they can learn. Kiyosaki says: ‘Job security meant everything to my poor father, while learning meant everything to my rich father.’ A job is not only a source of income—it is an opportunity to develop new skills that will later help you build your own wealth. Learn sales, negotiation, leadership, and investing. These skills are more valuable than any salary. Anyone who works only for money remains a slave to money. Anyone who works to learn will eventually become their own boss."}, {"title": "Cashflow ist König – nicht das Gehalt", "content": "Es geht nicht darum, wie viel Geld du verdienst, sondern wie viel du behältst und wie viel davon in deine Tasche zurückfließt. Die Reichen konzentrieren sich auf ihren Cashflow – den stetigen Geldfluss aus ihren Vermögenswerten. Ein hohes Gehalt bedeutet nicht, dass du reich wirst. Wenn du alles ausgibst, was du verdienst, bleibst du arm, egal wie hoch dein Gehalt ist. Die Reichen achten darauf, dass ihr Geld immer wieder zu ihnen zurückkommt – durch Mieteinnahmen, Dividenden oder Unternehmensgewinne. Der Cashflow ist das Lebenselixier des Vermögens. Ohne ihn gibt es keinen Fortschritt.", "translation": "It is not about how much money you earn, but how much you keep and how much of it flows back into your pocket. Rich people focus on their cash flow—the steady flow of money from their assets. A high salary does not mean that you will become rich. If you spend everything you earn, you remain poor no matter how high your salary is. Rich people make sure that their money keeps coming back to them through rental income, dividends, or business profits. Cash flow is the lifeblood of wealth. Without it there is no progress."}, {"title": "Reiche erfinden ihr eigenes Geld", "content": "Millionäre sehen Chancen, wo andere nur Probleme sehen. Sie sind kreativ und finden Wege, Geld zu verdienen, die niemand sonst sieht. Sie sagen nicht: „Ich kann mir das nicht leisten.“ Sie fragen: „Wie kann ich mir das leisten?“ Diese eine Frage verändert alles. Sie öffnet den Geist für neue Möglichkeiten. Wer immer nur sagt „Das ist zu teuer“, bleibt arm. Wer fragt „Wie kann ich das finanzieren?“, findet Wege. Die Reichen erfinden ihr eigenes Geld, indem sie Probleme lösen, Werte schaffen und Chancen erkennen, die andere übersehen.", "translation": "Millionaires see opportunities where others see only problems. They are creative and find ways to make money that nobody else sees. They do not say, ‘I cannot afford it.’ They ask, ‘How can I afford it?’ This one question changes everything. It opens the mind to new possibilities. Anyone who always says ‘That is too expensive’ remains poor. Anyone who asks ‘How can I finance it?’ finds ways. Rich people invent their own money by solving problems, creating value, and recognizing opportunities that others overlook."}, {"title": "Nutze Schulden klug – aber nur für Vermögenswerte", "content": "Nicht alle Schulden sind schlecht. Es gibt gute Schulden und schlechte Schulden. Schlechte Schulden sind Kreditkartenschulden oder Konsumkredite – sie fressen dein Geld auf. Gute Schulden sind Schulden, die dir helfen, Vermögenswerte zu kaufen, die Einkommen generieren – zum Beispiel eine Hypothek für ein Mietshaus. Die Reichen nutzen Schulden, um ihr Vermögen zu vergrößern. Sie borgen Geld, um Vermögenswerte zu kaufen, die mehr Geld einbringen, als die Schulden kosten. Die Armen und die Mittelschicht hingegen verschulden sich für Dinge, die an Wert verlieren – Autos, Elektronik, Urlaube. Lerne, Schulden als Werkzeug zu sehen, nicht als Last.", "translation": "Not all debt is bad. There is good debt and bad debt. Bad debt is credit-card debt or consumer loans—they eat up your money. Good debt is debt that helps you buy assets that generate income—for example, a mortgage for a rental property. Rich people use debt to increase their wealth. They borrow money to buy assets that bring in more money than the debt costs. Poor and middle-class people, on the other hand, get into debt for things that lose value—cars, electronics, and vacations. Learn to see debt as a tool, not a burden."}, {"title": "Entwickle eine Fülle-Denkweise – nicht eine Mangel-Denkweise", "content": "Die größte Barriere zum Reichtum sitzt im Kopf. Wer denkt, es gebe nicht genug für alle, wird niemals reich. Diese Mangel-Denkweise hält Menschen klein und ängstlich. Die Reichen haben eine Fülle-Denkweise – sie glauben, dass es genug Chancen und Geld für alle gibt. Sie sehen überall Möglichkeiten. Wer an Überfluss glaubt, zieht Überfluss an. Wer an Mangel glaubt, zieht Mangel an. Kiyosaki sagt: „Pleite sein ist temporär. Arm sein ist ewig“. Pleite bedeutet, dass du gerade kein Geld hast – das kann sich ändern. Arm bedeutet, dass du keine Hoffnung hast, jemals reich zu werden – das ist eine Einstellung. Ändere deine Denkweise, und du änderst dein Leben. # 🧠 Ego ist der Feind – Die wichtigsten Lektionen von Ryan Holiday **Ego ist der Feind** (engl. *Ego is the Enemy*) von Ryan Holiday erschien 2016. Das Buch argumentiert, dass unsere größten Probleme nicht von außen kommen, sondern von innen – durch unser eigenes Ego. Ego ist nicht die Freudsche Definition, sondern im umgangssprachlichen Sinne: **ein ungesunder Glaube an die eigene Wichtigkeit, Arroganz und selbstzentrierter Ehrgeiz**. Die Lösung ist Demut, Selbstbewusstsein, Zielstrebigkeit und Realismus. Hier sind die wichtigsten Lektionen aus diesem Buch.", "translation": "The biggest barrier to wealth is in the mind. Anyone who thinks there is not enough for everyone will never become rich. This scarcity mindset keeps people small and afraid. Rich people have an abundance mindset—they believe there are enough opportunities and enough money for everyone. They see possibilities everywhere. Anyone who believes in abundance attracts abundance. Anyone who believes in scarcity attracts scarcity. Kiyosaki says: ‘Being broke is temporary. Being poor is forever.’ Being broke means that you currently have no money—that can change. Being poor means that you have no hope of ever becoming rich—that is a mindset. Change your mindset, and you change your life."}];
const EGO_ENEMY_DATA = [{"title": "Unser schlimmster Feind lebt in uns", "content": "Wo immer wir sind, was immer wir tun – unser schlimmster Feind wohnt bereits in uns: unser Ego. Externe Feinde sind sichtbar, aber das Ego ist unsichtbar. Es flüstert uns ein, dass wir besonders sind, dass wir mehr verdienen und dass wir über den Regeln stehen. Der erste Schritt zur Kontrolle des Egos ist, es zu erkennen und zu benennen. Ego ist nicht etwas, das wir einfach besiegen können – wir müssen lernen, es täglich zu managen.", "translation": "Wherever we are and whatever we do, our worst enemy already lives inside us: our ego. External enemies are visible, but the ego is invisible. It whispers that we are special, that we deserve more, and that we are above the rules. The first step in controlling the ego is to recognize it and name it. Ego is not something we can simply defeat—we have to learn to manage it every day."}, {"title": "Höre zu, statt zu reden", "content": "Ego sagt uns, wir sollen reden, prahlen und uns beweisen. Demut sagt uns, wir sollen zuhören. Wenn wir reden, lernen wir nichts. Wenn wir zuhören, verstehen wir die Welt besser. Ein kluger Mensch weiß, dass Schweigen oft mächtiger ist als viele Worte. Wer immer nur redet, zeigt, dass er nichts Neues lernen will. Wer zuhört, zeigt Respekt und gewinnt Wissen.", "translation": "Ego tells us to talk, brag, and prove ourselves. Humility tells us to listen. When we talk, we learn nothing. When we listen, we understand the world better. A wise person knows that silence is often more powerful than many words. Anyone who only talks shows that they do not want to learn anything new. Anyone who listens shows respect and gains knowledge."}, {"title": "Bleibe immer ein Student", "content": "Ego sagt, wir wissen schon alles. Aber wer denkt, er sei fertig mit Lernen, hat bereits verloren. Ein Leben lang zu lernen, ist der Schlüssel zu Wachstum. Bleibe neugierig und demütig. Egal wie erfolgreich du bist – es gibt immer etwas Neues zu entdecken. Wahre Meister wissen, dass sie niemals ausgelernt haben. Sei bereit, von jedem zu lernen, auch von denen, die unter dir stehen.", "translation": "Ego tells us that we already know everything. But anyone who thinks they are finished learning has already lost. Learning throughout life is the key to growth. Stay curious and humble. No matter how successful you are, there is always something new to discover. True masters know that they will never finish learning. Be ready to learn from everyone, even from people who are below you."}, {"title": "Zweck ist wichtiger als Leidenschaft", "content": "Leidenschaft ist emotional und oft unkontrolliert. Zweck dagegen ist klar und beständig. Ego liebt große Emotionen und dramatische Gesten. Zweck liebt harte Arbeit und Disziplin. Wer seinem Zweck folgt, bleibt auch in schwierigen Zeiten stabil. Leidenschaft kommt und geht – Zweck bleibt. Konzentriere dich auf das, was wirklich zählt, nicht auf das, was sich gerade gut anfühlt.", "translation": "Passion is emotional and often uncontrolled. Purpose, on the other hand, is clear and steady. Ego loves big emotions and dramatic gestures. Purpose loves hard work and discipline. Anyone who follows their purpose remains stable even in difficult times. Passion comes and goes—purpose stays. Focus on what really matters, not on what feels good right now."}, {"title": "Ego lenkt uns vom wahren Ziel ab", "content": "Wir beginnen mit einer klaren Vision. Aber wenn wir Erfolg haben, verlieren wir oft den Fokus. Ego flüstert uns ein, dass wir mehr wollen, dass wir das haben sollten, was andere haben. Plötzlich jagen wir falschen Zielen nach. Ein kluger Mensch erinnert sich immer daran, warum er angefangen hat. Bleibe deinem ursprünglichen Zweck treu, egal wie sehr das Ego dich ablenken will.", "translation": "We begin with a clear vision. But when we succeed, we often lose focus. Ego whispers that we want more, that we should have what other people have. Suddenly we chase false goals. A wise person always remembers why they started. Stay true to your original purpose, no matter how much the ego tries to distract you."}, {"title": "In Erfolg und Misserfolg – Ego ist immer da", "content": "Wenn wir Erfolg haben, will uns das Ego einreden, wir seien etwas Besonderes. Wenn wir scheitern, will es uns einreden, wir seien betrogen worden. Beides ist gefährlich. Erfolg macht uns arrogant, Misserfolg macht uns bitter. Wahre Größe zeigt sich darin, bei Erfolg demütig und bei Misserfolg gelassen zu bleiben. Das Ego ist der böse Zwilling von beiden Zuständen – erkenne es und wehre dich.", "translation": "When we succeed, ego tries to tell us that we are something special. When we fail, it tries to tell us that we have been cheated. Both are dangerous. Success makes us arrogant; failure makes us bitter. True greatness shows itself in staying humble in success and calm in failure. Ego is the evil twin of both states—recognize it and resist it."}, {"title": "Hilf anderen, groß zu werden", "content": "Ego ist auf sich selbst fixiert. Demut schaut auf andere. Wenn du anderen hilfst, groß zu werden, wirst du selbst größer. Das ist ein universelles Gesetz. Ein guter Mensch fördert das Talent anderer, statt es zu beneiden. Wer anderen den Weg ebnet, wird selbst respektiert. Ego hingegen isoliert und macht einsam. Wahre Größe entsteht im Dienst an anderen.", "translation": "Ego is focused on itself. Humility looks at others. When you help others become great, you become greater yourself. This is a universal law. A good person develops the talent of others instead of envying it. Anyone who clears the path for others will be respected. Ego, on the other hand, isolates and makes people lonely. True greatness comes from serving others."}, {"title": "Scheue die niedrige Position nicht", "content": "Ego treibt uns zu Entscheidungen, die andere beeindrucken sollen. Wir wollen wichtig aussehen. Aber manchmal müssen wir Dinge tun, die andere für unter ihrer Würde halten. Die Bereitschaft, die niedrige Position einzunehmen, ist ein Zeichen von Stärke, nicht von Schwäche. Tu, was getan werden muss, egal wie demütigend es scheint. Das Ego hasst das – und genau das ist der Punkt.", "translation": "Ego pushes us toward decisions that are meant to impress other people. We want to look important. But sometimes we have to do things that others consider beneath our dignity. The willingness to take a low position is a sign of strength, not weakness. Do what needs to be done, no matter how humiliating it may seem. Ego hates that—and that is exactly the point."}, {"title": "Werde ein Teammitglied", "content": "Ego sagt: „Du brauchst niemanden. Du bist der Beste.“ Aber niemand schafft etwas Großes allein. Wer ein Teamplayer ist, legt seinen Stolz ab. Er weiß, dass er nicht alles weiß, aber bereit ist, zu lernen. Ein Team ist stärker als der stärkste Einzelkämpfer. Wenn du dein Ego beiseite legst, wirst du nicht schwächer – du wirst unschlagbar.", "translation": "Ego says: ‘You do not need anyone. You are the best.’ But nobody achieves anything great alone. A team player puts aside their pride. They know that they do not know everything, but they are willing to learn. A team is stronger than the strongest individual. When you put your ego aside, you do not become weaker—you become unbeatable."}, {"title": "Ego macht uns impulsiv und irrational", "content": "Ego treibt uns zu voreiligen Entscheidungen. Wir wollen sofort handeln, um uns zu beweisen. Aber kluge Entscheidungen brauchen Zeit und Überlegung. Wer von Ego getrieben wird, trifft oft falsche Entscheidungen, die er später bereut. Atme tief durch, denke nach und handle dann. Rationalität besiegt Impulsivität.", "translation": "Ego drives us to make premature decisions. We want to act immediately to prove ourselves. But wise decisions need time and thought. Anyone driven by ego often makes wrong decisions that they later regret. Take a deep breath, think, and then act. Rationality defeats impulsiveness."}, {"title": "Ego blendet uns für unsere Schwächen", "content": "Wenn wir zu sehr mit unserer eigenen Größe beschäftigt sind, sehen wir unsere Fehler nicht mehr. Ego macht uns blind für die Bereiche, in denen wir uns verbessern müssen. Aber wer seine Schwächen nicht kennt, kann sie nicht beheben. Wahre Stärke liegt darin, die eigenen Grenzen zu kennen und daran zu arbeiten. Selbstreflexion ist der Feind des Egos.", "translation": "When we are too occupied with our own greatness, we no longer see our mistakes. Ego makes us blind to the areas where we need to improve. But anyone who does not know their weaknesses cannot fix them. True strength lies in knowing your own limits and working on them. Self-reflection is the enemy of ego."}, {"title": "Ego macht uns arrogant und überheblich", "content": "Wer denkt, er sei besser als alle anderen, verliert seine Mitmenschen. Arroganz vergiftet Beziehungen. Niemand mag einen Angeber oder einen Besserwisser. Ein demütiger Mensch wird geliebt und respektiert. Ein arroganter Mensch wird gemieden. Wenn du erfolgreich sein willst, bleibe auf dem Boden. Arroganz ist der schnellste Weg, Freunde und Verbündete zu verlieren.", "translation": "Anyone who thinks they are better than everyone else loses the people around them. Arrogance poisons relationships. Nobody likes a show-off or a know-it-all. A humble person is loved and respected. An arrogant person is avoided. If you want to be successful, stay grounded. Arrogance is the fastest way to lose friends and allies."}, {"title": "Ego macht uns angst vor dem Scheitern", "content": "Wer Angst hat zu versagen, traut sich nichts Neues. Ego will uns davor bewahren, Fehler zu machen, weil Fehler unser Image beschädigen. Aber ohne Risiko gibt es keinen Fortschritt. Wer nie scheitert, hat nie wirklich gelebt. Akzeptiere, dass Fehler zum Leben gehören. Sie sind nicht das Ende – sie sind der Anfang von etwas Besserem.", "translation": "Anyone who is afraid of failure does not dare to try anything new. Ego wants to protect us from making mistakes because mistakes damage our image. But without risk there is no progress. Anyone who never fails has never really lived. Accept that mistakes are part of life. They are not the end—they are the beginning of something better."}, {"title": "Ego sucht Bestätigung von außen", "content": "Ego will, dass andere uns bewundern. Wir jagen nach Lob und Anerkennung. Aber äußere Bestätigung macht nie wirklich glücklich. Sie ist wie eine Droge – wir brauchen immer mehr. Wahres Glück kommt von innen. Ein kluger Mensch misst seinen Wert nicht an der Meinung anderer. Er weiß, wer er ist, und das genügt.", "translation": "Ego wants other people to admire us. We chase praise and recognition. But external validation never really makes us happy. It is like a drug—we always need more. True happiness comes from within. A wise person does not measure their worth by other people’s opinions. They know who they are, and that is enough."}, {"title": "Ego macht uns neidisch und eifersüchtig", "content": "Wenn wir uns ständig mit anderen vergleichen, verlieren wir. Ego will, dass wir besser sind als alle anderen. Aber es wird immer jemand geben, der mehr hat, schneller ist oder erfolgreicher wirkt. Vergleiche sind der Dieb der Freude. Konzentriere dich auf deinen eigenen Weg. Dein einziger Konkurrent bist du selbst von gestern.", "translation": "When we constantly compare ourselves with others, we lose. Ego wants us to be better than everyone else. But there will always be someone who has more, is faster, or seems more successful. Comparisons are the thief of joy. Focus on your own path. Your only competitor is yourself from yesterday."}, {"title": "Ego macht uns rachsüchtig", "content": "Wenn uns jemand verletzt, will das Ego Rache. Aber Rache führt nur zu mehr Konflikten. Wer vergibt, zeigt wahre Größe. Wer Rache nimmt, bleibt in der Vergangenheit gefangen. Ein kluger Mensch lässt los und schaut nach vorne. Ego will kämpfen – Demut will Frieden.", "translation": "When someone hurts us, the ego wants revenge. But revenge only leads to more conflict. Anyone who forgives shows true greatness. Anyone who takes revenge remains trapped in the past. A wise person lets go and looks forward. Ego wants to fight—humility wants peace."}, {"title": "Ego macht uns unglücklich", "content": "Die ständige Jagd nach Anerkennung und Erfolg macht uns nie zufrieden. Ego verspricht Glück, aber es liefert nur Leere. Wahres Glück kommt von innen, nicht von außen. Wer sein Ego besiegt, findet Frieden. Wer es füttert, bleibt hungrig. Zufriedenheit ist kein Ziel – sie ist eine Haltung.", "translation": "The constant chase for recognition and success never makes us satisfied. Ego promises happiness, but it delivers only emptiness. True happiness comes from within, not from outside. Anyone who defeats their ego finds peace. Anyone who feeds it remains hungry. Contentment is not a goal—it is an attitude."}, {"title": "Ego verhindert gutes Urteilsvermögen", "content": "Ego trübt unseren Verstand und führt zu schlechten Entscheidungen. Wir sehen nicht mehr klar, was richtig ist. Wir wollen recht haben, statt weise zu sein. Ein kluger Mensch prüft seine Entscheidungen immer wieder. Er hinterfragt sich selbst. Ego sagt: „Ich habe recht.“ Demut sagt: „Vielleicht irre ich mich. Lass mich noch einmal nachdenken.“", "translation": "Ego clouds our judgment and leads to bad decisions. We can no longer see clearly what is right. We want to be right instead of wise. A wise person checks their decisions again and again. They question themselves. Ego says: ‘I am right.’ Humility says: ‘Maybe I am wrong. Let me think again.’"}, {"title": "Ego tötet, was wir lieben", "content": "Ob in der Karriere oder in Beziehungen – Ego zerstört, was uns wichtig ist. Es macht uns blind für die Bedürfnisse anderer. Es lässt uns vergessen, warum wir etwas begonnen haben. Liebe braucht Demut, nicht Stolz. Wenn du etwas wirklich liebst, stelle dein Ego zurück. Sonst verlierst du es.", "translation": "Whether in a career or in relationships, ego destroys what matters to us. It makes us blind to the needs of others. It makes us forget why we started something. Love needs humility, not pride. If you really love something, put your ego aside. Otherwise you will lose it."}, {"title": "Schau nicht auf andere herab", "content": "Wer auf andere herabschaut, verpasst, was über ihm ist. Jeder Mensch verdient Aufmerksamkeit und Respekt. Ego sagt: „Du bist besser.“ Die Wahrheit ist: Wir alle sind gleich. Wahre Größe zeigt sich darin, jeden Menschen mit Würde zu behandeln. Wer andere klein macht, macht sich selbst klein.", "translation": "Anyone who looks down on others misses what is above them. Every person deserves attention and respect. Ego says: ‘You are better.’ The truth is: we are all equal. True greatness shows itself in treating every person with dignity. Anyone who makes others small makes themselves small."}];
const RICH_DAD_TRANSLATIONS = RICH_DAD_DATA.map(x=>x.translation);
const EGO_ENEMY_TRANSLATIONS = EGO_ENEMY_DATA.map(x=>x.translation);
const LAWS_DATA = [{"title":"👑 Stelle nie den Meister in den Schatten","content":"Dein Chef oder Vorgesetzter muss sich immer überlegen fühlen. Wenn du zu klug oder zu talentiert wirkst, machst du ihn unsicher. Zeige deine Fähigkeiten, aber übertreibe nicht. Lass deinen Vorgesetzten brillant aussehen. Dann wirst du belohnt und steigst auf. Wenn du ihn jedoch überstrahlst, wirst du Feinde machen. Der Meister wird Angst bekommen und dich loswerden wollen. Sei klug und bleibe im Hintergrund, während du trotzdem erfolgreich bist.","vocab":[["Vorgesetzter","supervisor"],["überlegen","superior"],["Fähigkeiten","abilities"],["Feinde","enemies"],["Hintergrund","background"]]},{"title":"🤝 Vertraue deinen Freunden nie zu sehr – bediene dich deiner Feinde","content":"Freunde können dich schnell verraten, weil sie neidisch sind. Ein ehemaliger Feind muss dagegen mehr beweisen und ist oft loyaler. Freunde erwarten etwas von dir, Feinde nicht. Wenn du einen Feind in einen Verbündeten verwandelst, gewinnst du mehr Respekt. Aber vertraue nie blind. Sei immer vorsichtig. Es ist besser, einen Feind zu haben, den du kontrollierst, als einen Freund, der dich hintergeht.","vocab":[["verraten","betray"],["neidisch","envious"],["loyal","loyal"],["Feinde","enemies"],["Verbündete","allies"],["Verbündeten","allies"],["Wandel","change"],["vorsichtig","careful"]]},{"title":"🤐 Halte deine Absichten stets geheim","content":"Verrate niemals, was du wirklich vorhast. Wenn andere deine Pläne kennen, können sie sich verteidigen. Halte sie im Ungewissen. Lenke sie ab und verwirre sie. Je weniger sie wissen, desto mehr Macht hast du. Wenn du deine wahren Ziele versteckst, können sie dich nicht stoppen. Sei wie ein Schachspieler, der seine nächsten Züge nicht zeigt. Schweigen ist oft stärker als Reden.","vocab":[["Pläne","plans"],["verteidigen","defend"],["Ungewissen","uncertainty"],["Ziele","goals"],["Schachspieler","chess player"],["Schweigen","silence"]]},{"title":"🗣️ Sage immer weniger als nötig","content":"Je mehr du redest, desto schwächer wirkst du. Mächtige Menschen sprechen wenig. Wenn du wenig sagst, wirkst du geheimnisvoll und klug. Zu viele Worte können dich in Schwierigkeiten bringen. Schweigen macht dich interessant. Andere werden dir mehr zuhören, wenn du selten sprichst. Denke immer nach, bevor du etwas sagst. Weniger ist oft mehr.","vocab":[["Schwäche","weakness"],["Schweigen","silence"]]},{"title":"⭐ Ohne einen guten Ruf geht nichts – schütze ihn mit allen Mitteln","content":"Dein Ruf ist deine wichtigste Waffe. Ein guter Ruf schützt dich und macht dich mächtig. Wenn dein Ruf beschädigt wird, bist du verwundbar. Achte immer auf dein Image. Greife den Ruf deiner Feinde an, während du deinen eigenen verteidigst. Menschen vertrauen dem, was sie sehen. Sei also immer vorsichtig mit deinem Verhalten.","vocab":[["Ruf","reputation"],["beschädigt","damaged"],["verwundbar","vulnerable"],["Image","image"],["Feinde","enemies"],["vorsichtig","careful"],["Verhalten","behavior"]]},{"title":"🔦 Mache um jeden Preis auf dich aufmerksam","content":"Wenn dich niemand sieht, zählst du nicht. Du musst aus der Menge herausstechen. Zeige dich interessant, geheimnisvoll und besonders. Menschen beachten nur das Auffällige. Sei mutig und präsentiere dich selbstbewusst. Aber übertreibe nicht, sonst wirkst du lächerlich. Finde die richtige Balance.","vocab":[["Menge","crowd"],["herausstechen","stand out"],["mutig","brave"],["selbstbewusst","confident"]]},{"title":"🏆 Lass andere für dich arbeiten, doch streiche immer die Anerkennung dafür ein","content":"Nutze die Arbeit anderer für deine eigenen Ziele. Das spart Zeit und Energie. Du wirkst effizient und talentiert. Die Helfer werden vergessen, aber du wirst erinnert. Lass andere die schwere Arbeit machen, während du den Ruhm einheimst. Aber sei fair und zeige Dankbarkeit, sonst verlassen dich die Helfer.","vocab":[["Ziele","goals"],["Energie","energy"],["einheimst","reap"]]},{"title":"🎣 Lass die anderen zu dir kommen – ködere sie, wenn es nötig ist","content":"Zwinge andere nicht zu handeln. Lock sie zu dir. Mit Versprechungen kannst du sie anziehen und dann angreifen. Wenn du die Kontrolle behältst, bist du stärker. Warte geduldig, bis der Gegner kommt. Dann kannst du ihn nach deinen Regeln schlagen.","vocab":[["Kontrolle","control"],["Gegner","opponent"]]},{"title":"⚔️ Taten zählen, nicht Argumente","content":"Argumente gewinnen nur kurze Kämpfe. Taten überzeugen viel mehr. Erkläre nicht, handle einfach. Menschen vergessen Worte, aber sie erinnern sich an Taten. Wenn du etwas beweisen willst, zeige es. Rede nicht lange darüber. Mach es einfach.","vocab":[["Taten","actions"],["überzeugen","convince"]]},{"title":"😷 Meide Unglückliche und Glücklose","content":"Unglückliche Menschen ziehen dich mit runter. Ihre Probleme sind ansteckend. Wenn du ihnen hilfst, wirst du selbst leiden. Suche lieber die Gesellschaft von glücklichen Menschen. Positive Menschen geben dir Energie. Negative Menschen nehmen sie dir. Sei vorsichtig, mit wem du Zeit verbringst.","vocab":[["Unglückliche","unfortunate"],["Gesellschaft","company"],["Energie","energy"],["vorsichtig","careful"]]},{"title":"🔗 Mache Menschen von dir abhängig","content":"Andere sollen dich brauchen. Je mehr sie von dir abhängen, desto freier bist du. Wenn ihr Glück von dir kommt, hast du Macht. Bringe ihnen aber nie genug bei, um ohne dich auszukommen. Bleibe unersetzlich. Dann können sie dich nicht verlassen oder angreifen.","vocab":[["unersetzlich","irreplaceable"]]},{"title":"🎁 Entwaffne dein Opfer mit gezielter Ehrlichkeit und Großzügigkeit","content":"Ein ehrlicher Moment kann viele Lügen verstecken. Großzügigkeit macht misstrauische Menschen weich. Sobald sie dir vertrauen, kannst du sie manipulieren. Ein Geschenk zur richtigen Zeit ist wie ein Trojanisches Pferd. Sei freundlich, aber denk an deine Ziele.","vocab":[["Großzügigkeit","generosity"],["misstrauisch","suspicious"],["Ziele","goals"]]},{"title":"💡 Brauchst du Hilfe, appelliere an den Eigennutz","content":"Erinnere andere nicht daran, was du für sie getan hast. Zeige ihnen, wie sie selbst profitieren. Wenn sie etwas zu gewinnen haben, helfen sie gerne. Menschen sind egoistisch. Nutze das zu deinem Vorteil. Versprich ihnen einen Vorteil, und sie werden dir folgen.","vocab":[]},{"title":"🕵️ Gib dich wie ein Freund, aber handle wie ein Spion","content":"Kenntnis ist Macht. Sammle Informationen über andere. Stelle indirekte Fragen, um ihre Schwächen zu entdecken. Ein guter Spion kann aus jeder Situation Vorteile ziehen. Sei freundlich, aber beobachte genau. Wissen gibt dir Kontrolle.","vocab":[["Informationen","information"],["Schwäche","weakness"],["Schwächen","weaknesses"],["Kontrolle","control"]]},{"title":"💀 Vernichte deine Feinde vollständig","content":"Ein halb besiegter Feind kann zurückkommen. Wenn du einen Feind hast, zerstöre ihn ganz. Sonst wird er Rache nehmen. Vernichte ihn körperlich und geistig. Sei gnadenlos. Ein toter Feind ist kein Feind mehr.","vocab":[["Sieg","victory"],["Rache","revenge"],["gnadenlos","ruthless"]]},{"title":"👻 Glänze durch Abwesenheit, um Respekt und Ansehen zu erhöhen","content":"Wenn du immer da bist, wirst du langweilig. Wenn du zeitweise verschwindest, wirst du interessanter. Seltenheit steigert den Wert. Lerne, wann du gehen musst. Deine Abwesenheit wird dich begehrenswerter machen. Die Leute werden mehr über dich sprechen.","vocab":[["Abwesenheit","absence"]]},{"title":"🎭 Versetze andere in ständige Angst: Kultiviere die Aura der Unberechenbarkeit","content":"Wenn du vorhersehbar bist, haben andere Kontrolle. Sei unberechenbar. Das macht andere unsicher und ängstlich. Sie wissen nie, was du als nächstes tust. Das gibt dir Macht. Überrasche sie immer wieder.","vocab":[["Kontrolle","control"]]},{"title":"🏰 Baue zu deinem Schutz keine Festung – Isolation ist gefährlich","content":"Isolation macht dich schwach. Du verlierst den Kontakt zur Welt. Mische dich unter die Leute und suche Verbündete. Eine Gruppe schützt dich besser als eine Festung. Alleine bist du ein leichtes Ziel. Gemeinsam seid ihr stark.","vocab":[["Isolation","isolation"],["Verbündete","allies"],["Festung","fortress"]]},{"title":"🎯 Mache dir klar, mit wem du es zu tun hast: Kränke nicht die Falschen","content":"Nicht alle Menschen reagieren gleich. Manche werden nie vergeben. Wähle deine Opfer sorgfältig. Kränke niemals die falsche Person. Sei ein Wolf im Schafspelz. Kenne deine Feinde genau.","vocab":[["ergeben","surrender"],["Opfer","sacrifice"],["Kränke","offend"],["Feinde","enemies"]]},{"title":"🚫 Scheue Bindungen, wo immer es geht","content":"Lege dich nie zu früh auf eine Seite fest. Vertraue nur dir selbst. Bleibe unabhängig. So kannst du andere gegeneinander ausspielen. Narren ergreifen Partei. Kluge Menschen bleiben neutral. Das gibt dir Freiheit und Macht.","vocab":[["unabhängig","independent"],["abhängig","dependent"]]},{"title":"😇 Spiel den Deppen, um Deppen zu überlisten: Gib dich dümmer als deine Opfer","content":"Niemand mag es, wenn jemand klüger ist. Gib deinen Opfern das Gefühl, sie seien schlauer als du. Dann werden sie dich unterschätzen. Das gibt dir einen Vorteil. Unterschätzt zu werden, ist oft ein Vorteil.","vocab":[["Opfer","sacrifice"],["unterschätzen","underestimate"]]},{"title":"🙏 Ergebe dich zum Schein: Verwandle Schwäche in Stärke","content":"Wenn du der Schwächere bist, kämpfe nicht um der Ehre willen. Gib vor, dich zu ergeben. Das gibt dir Zeit, dich zu erholen. Warte, bis der Sieger schwach wird. Dann schlag zu. Scheinbare Schwäche kann eine Waffe sein.","vocab":[["Schwäche","weakness"],["ergeben","surrender"],["Sieg","victory"]]},{"title":"🎯 Konzentriere deine Kräfte","content":"Verteile deine Energie nicht auf zu viele Dinge. Konzentriere dich auf den wichtigsten Punkt. Tiefe Arbeit ist besser als viele kleine Projekte. Suche dir einen mächtigen Verbündeten. Eine starke Quelle ist besser als viele schwache.","vocab":[["Energie","energy"],["konzentriere","concentrate"],["Verbündete","allies"],["Verbündeten","allies"]]},{"title":"🎩 Spiele den perfekten Höfling","content":"In der Welt der Macht geht es um Geschick. Sei höflich und schmeichle deinem Herrn. Beanspruche Macht auf elegante Weise. Beachte alle Regeln der Etikette. Dann wird dein Aufstieg leicht sein. Ein perfekter Höfling kommt immer weiter.","vocab":[["Geschick","skill"],["Etikette","etiquette"]]},{"title":"🌟 Erschaffe dich neu","content":"Akzeptiere nicht die Rolle, die andere dir geben. Erschaffe deine eigene Identität. Sei interessant und dramatisch. Bestimme selbst, wie du gesehen wirst. Dann wirst du größer und mächtiger wirken. Sei der Regisseur deines eigenen Lebens.","vocab":[["Erschaffe","create"],["Identität","identity"]]},{"title":"🧼 Mache dir nicht die Finger schmutzig","content":"Bleibe sauber und makellos. Lass andere die schmutzige Arbeit machen. Verstecke deine Machenschaften hinter anderen. Wenn etwas schiefgeht, haben andere die Schuld. Du bleibst der Gute. Das ist eine kluge Strategie.","vocab":[["Makellos","flawless"],["Machenschaften","schemes"]]},{"title":"🙌 Befriedige das menschliche Bedürfnis, an etwas zu glauben, und fördere einen Kult um deine Person","content":"Menschen wollen an etwas glauben. Mach dich selbst zum Objekt ihres Glaubens. Biete ihnen eine neue Idee oder Religion. Verwende vage, aber vielversprechende Worte. Biete Rituale und Opfer an. Das gibt dir ungeahnte Macht. Sei ihr Führer.","vocab":[["Rituale","rituals"],["Opfer","sacrifice"],["Führer","leader"]]},{"title":"🦁 Packe Aufgaben mutig an","content":"Wenn du unsicher bist, lass es bleiben. Zögern ist gefährlich. Sei mutig und ergreife die Initiative. Fehler durch Mut können korrigiert werden. Aber Fehler durch Angst sind schlimmer. Sei tapfer und handle entschlossen.","vocab":[["Zögern","hesitation"],["mutig","brave"],["Initiative","initiative"],["entschlossen","determined"]]},{"title":"📋 Plane alles bis zum Ende","content":"Plane jeden Schritt bis zum Ende. Denke an alle möglichen Probleme. Wenn du einen Plan hast, kannst du ihn anpassen. Ohne Plan wirst du scheitern. Ein guter Plan ist die halbe Arbeit. Aber sei flexibel, falls etwas schiefgeht.","vocab":[["Plane","plan"],["anpassen","adapt"],["flexibel","flexible"]]},{"title":"🎭 Alles muss ganz leicht aussehen","content":"Lass deine Arbeit mühelos aussehen. Wenn etwas schwer aussieht, wirkt es anstrengend. Wenn es leicht aussieht, wirkt es elegant. Verstecke deine Mühe. Zeige nur das Ergebnis. Menschen bewundern, was leicht gelingt.","vocab":[["mühelos","effortless"]]},{"title":"🃏 Lass andere mit den Karten spielen, die du austeilst","content":"Kontrolliere das Spiel, nicht die Spieler. Gib anderen die Werkzeuge, aber behalte die Kontrolle. Bestimme die Regeln. Dann gewinnst du immer. Wenn andere nach deinen Regeln spielen, kannst du sie lenken.","vocab":[["Werkzeuge","tools"],["Kontrolle","control"]]},{"title":"💭 Spiele mit den Träumen der Menschen","content":"Menschen haben Träume und Wünsche. Nutze das zu deinem Vorteil. Versprich ihnen, ihre Träume zu erfüllen. Dann folgen sie dir. Aber erfülle nie alle Träume. Halte sie in der Schwebe. Das gibt dir Macht über sie.","vocab":[["Träume","dreams"]]},{"title":"🔧 Für jeden gibt es die passende Daumenschraube","content":"Jeder Mensch hat eine Schwäche. Finde sie heraus. Dann kannst du sie kontrollieren. Manche sind gierig, andere sind eitel. Nutze ihre Schwächen. Das ist der Schlüssel zu ihrer Macht.","vocab":[["Schwäche","weakness"],["Schwächen","weaknesses"]]},{"title":"👑 Handle wie ein König, um wie ein König behandelt zu werden","content":"Wenn du dich wie ein König benimmst, wirst du wie einer behandelt. Zeige Selbstbewusstsein und Würde. Erwarte Respekt. Dann wirst du ihn bekommen. Menschen behandeln dich so, wie du dich selbst behandelst. Sei königlich.","vocab":[["selbstbewusst","confident"],["Würde","dignity"]]},{"title":"⏰ Meistere die Kunst des Timings","content":"Der richtige Zeitpunkt ist alles. Warte auf den perfekten Moment. Handle nicht zu früh oder zu spät. Geduld ist eine Tugend. Wenn du den richtigen Zeitpunkt wählst, gewinnst du. Wenn du falsch timing hast, verlierst du.","vocab":[["Timing","timing"]]},{"title":"🙈 Vergiss, was du nicht haben kannst: Es zu ignorieren ist die beste Rache","content":"Wenn du etwas nicht bekommen kannst, ignoriere es. Das ist die beste Rache. Zeige, dass es dir egal ist. Das macht andere wütend. Wenn du trauerst, zeigst du Schwäche. Ignorieren zeigt Stärke.","vocab":[["Rache","revenge"],["Schwäche","weakness"]]},{"title":"🎪 Inszeniere packende Schauspiele","content":"Menschen lieben Spektakel. Inszeniere dramatische Ereignisse. Das zieht Aufmerksamkeit an. Mit Theater und Show kannst du Menschen beeinflussen. Sei ein guter Schauspieler. Die Bühne ist dein Werkzeug.","vocab":[["Spektakel","spectacle"],["aufmerksam","attentive"]]},{"title":"🐑 Denke, was du willst, aber verhalte dich wie die anderen","content":"Denke frei, aber zeige es nicht. Verhalte dich wie alle anderen. Sonst wirst du ausgegrenzt. Passe dich an, während du deine eigenen Gedanken behältst. Das ist klug. Außen Anpassung, innen Freiheit.","vocab":[["Anpassung","adaptation"]]},{"title":"🐟 Schlage Wellen, um Fische zu fangen","content":"Mache Aufsehen, um Aufmerksamkeit zu bekommen. Wenn du etwas bewegst, kommen die Leute. Nutze Kontroversen und Überraschungen. Das bringt dich ins Gespräch. Aber sei vorsichtig, dass du nicht untergehst.","vocab":[["aufmerksam","attentive"],["Kontroversen","controversies"],["vorsichtig","careful"]]},{"title":"💰 Verschmähe das Gratisangebot","content":"Nichts ist umsonst. Gratisangebote haben immer einen Haken. Wenn etwas zu gut klingt, ist es das meistens auch. Bezahle für das, was du bekommst. Das gibt dir mehr Kontrolle. Gratis kann dich abhängig machen.","vocab":[["Gratisangebote","free offers"],["Haken","catch"],["Kontrolle","control"],["abhängig","dependent"]]},{"title":"👣 Tritt nicht in die Fußstapfen eines großen Mannes","content":"Sei kein Nachahmer. Finde deinen eigenen Weg. Wenn du einem Großen folgst, wirst du nie so groß. Erschaffe deine eigene Geschichte. Sei originell. Das macht dich einzigartig.","vocab":[["Nachahmer","imitator"],["Erschaffe","create"]]},{"title":"🐑 Erschlage den Hirten, und die Schafe zerstreuen sich","content":"Wenn du den Führer einer Gruppe besiegst, zerfällt die Gruppe. Greife den Anführer an. Ohne ihn sind die anderen verwirrt und schwach. Das ist ein schneller Weg zum Sieg. Zerstöre die Führung.","vocab":[["Führer","leader"],["Sieg","victory"],["Führung","leadership"]]},{"title":"❤️ Arbeite mit Herz und Geist der anderen","content":"Verstehe, was andere fühlen und denken. Nutze ihr Herz und ihren Geist für deine Zwecke. Wenn du ihre Emotionen kennst, kannst du sie lenken. Das ist mächtig. Empathie kann eine Waffe sein.","vocab":[["Empathie","empathy"]]},{"title":"🪞 Halte anderen einen Spiegel vor","content":"Zeige den Menschen, was sie sehen wollen. Spiegle ihr Verhalten und ihre Wünsche. Dann mögen sie dich. Sie sehen sich selbst in dir. Das schafft Vertrauen. Nutze den Spiegel, um sie zu gewinnen.","vocab":[["Verhalten","behavior"],["Spiegel","mirror"]]},{"title":"🔄 Predige notwendigen Wandel, aber ändere nie zu viel auf einmal","content":"Veränderung ist gut, aber zu viel ist gefährlich. Ändere langsam und schrittweise. Sonst lehnen sich die Leute auf. Predige Wandel, aber sei vorsichtig. Zu viel Veränderung führt zu Chaos.","vocab":[["Veränderung","change"],["Wandel","change"],["vorsichtig","careful"]]},{"title":"😇 Sei nie zu perfekt","content":"Perfektion macht neidisch. Zeige auch Fehler. Das macht dich menschlich und sympathisch. Menschen mögen keine perfekten Menschen. Sie fühlen sich bedroht. Sei gut, aber nicht perfekt.","vocab":[["Perfektion","perfection"],["neidisch","envious"],["menschlich","humane"]]},{"title":"🛑 Schieße nie über das Ziel hinaus – Der Sieg ist der beste Zeitpunkt zum Aufhören","content":"Wenn du gewonnen hast, hör auf. Mehr zu wollen, kann dich zerstören. Genieße deinen Sieg. Gehe nicht zu weit. Das Ziel ist erreicht. Jetzt ist der beste Zeitpunkt, um aufzuhören.","vocab":[["Sieg","victory"]]},{"title":"🌊 Sei formlos","content":"Sei flexibel und anpassungsfähig. Sei wie Wasser, das jede Form annimmt. Wenn du formlos bist, können dich deine Feinde nicht einschätzen. Sie können keine Gegenmaßnahmen entwickeln. Bleibe immer in Bewegung. Das ist die höchste Kunst der Macht.","vocab":[["flexibel","flexible"],["Anpassung","adaptation"],["anpassungsfähig","adaptable"],["Feinde","enemies"],["Maßnahmen","measures"]]}];
const PRINCE_DATA = [{"title":"👑 Der Zweck heiligt die Mittel","content":"Ein Fürst muss bereit sein, unmoralische Mittel einzusetzen, um sein Ziel zu erreichen. Die Erhaltung der Macht und der Stabilität des Staates ist das höchste Gut. Wenn ein Herrscher sich immer an moralische Regeln hält, wird er scheitern. Die Realität ist oft grausam, und ein Fürst muss das akzeptieren. Ein kluger Herrscher tut, was nötig ist, nicht was schön ist. Manchmal muss er lügen, betrügen oder sogar töten. Aber er sollte diese Mittel nur einsetzen, wenn es wirklich notwendig ist. Der Zweck rechtfertigt nicht alles, aber ohne Macht kann ein Fürst nichts Gutes bewirken.","vocab":[["moralisch","moral"],["Stabilität","stability"],["Staat","state"],["Herrscher","ruler"]]},{"title":"🗡️ Besser gefürchtet als geliebt","content":"Ein Fürst sollte lieber gefürchtet als geliebt werden. Menschen sind undankbar und unbeständig. Sie lieben aus Eigennutz, aber sie fürchten aus Angst vor Strafe. Liebe kann schnell verschwinden, aber Furcht bleibt. Ein gefürchteter Herrscher wird respektiert. Aber Vorsicht: Der Fürst darf nicht gehasst werden. Hass ist gefährlich. Ein guter Herrscher findet die Balance. Er muss streng sein, aber nicht grausam. Er soll Furcht einflößen, aber nicht den Zorn des Volkes auf sich ziehen. Angst ist ein mächtiges Werkzeug, aber sie muss klug eingesetzt werden.","vocab":[["Eigennutz","self-interest"],["Herrscher","ruler"],["Zorn","anger"]]},{"title":"⚔️ Krieg ist die wichtigste Kunst","content":"Ein Fürst darf keine andere Kunst studieren als den Krieg. Frieden ist trügerisch. Wer in Friedenszeiten untätig ist, wird im Krieg scheitern. Ein kluger Herrscher lernt aus der Geschichte und bereitet sich ständig vor. Er muss sein Heer persönlich führen und die Kriegskunst verstehen. Denn nur mit einer starken Armee kann ein Staat überleben. Söldner sind unzuverlässig. Ein Fürst braucht eigene, loyale Truppen. Wer den Krieg vernachlässigt, verliert seine Macht. Der Frieden ist eine Vorbereitung auf den nächsten Krieg.","vocab":[["untätig","inactive"],["Herrscher","ruler"],["Staat","state"],["Söldner","mercenary"],["loyal","loyal"]]},{"title":"🏰 Erbmonarchien sind leicht zu behalten","content":"Ein erblicher Fürst hat es leicht. Das Volk ist an seine Herrschaft gewöhnt. Solange er die alten Traditionen respektiert und keine großen Fehler macht, wird er kaum Probleme haben. Die Menschen lieben das Vertraute. Ein erblicher Herrscher muss weniger kämpfen als ein neuer. Er hat weniger Feinde. Aber er darf nicht nachlässig werden. Auch ein Erbfürst muss klug regieren. Er sollte das Volk nicht zu sehr belasten. Sonst verliert er die Unterstützung der Bevölkerung. Ein erfahrener Herrscher weiß, dass Stabilität das Wichtigste ist.","vocab":[["Herrscher","ruler"],["Feinde","enemies"],["Erbfürst","hereditary prince"],["Stabilität","stability"]]},{"title":"🌍 Neue Fürstentümer sind schwierig","content":"Ein neuer Herrscher hat viele Probleme. Die Menschen haben hohe Erwartungen. Wenn er sie nicht erfüllt, werden sie enttäuscht. Er muss viele alte Eliten verdrängen, die ihre Macht verlieren. Das macht Feinde. Aber er gewinnt auch neue Verbündete. Ein kluger Fürst handelt schnell und entschlossen. Er muss hart sein, aber nicht grausam. Er sollte das Volk für sich gewinnen. Neue Herrscher haben die Chance, alles neu zu machen. Aber sie müssen vorsichtig sein. Ein Fehler kann alles zerstören.","vocab":[["Herrscher","ruler"],["Eliten","elites"],["Feinde","enemies"],["Verbündete","allies"],["entschlossen","determined"],["vorsichtig","careful"]]},{"title":"🛡️ Vermeide Söldner und Hilfstruppen","content":"Söldner sind unzuverlässig und gefährlich. Sie kämpfen nur für Geld, nicht für Loyalität. Im Krieg laufen sie oft davon oder wechseln die Seite. Hilfstruppen aus anderen Ländern sind noch schlimmer. Sie können dich verraten oder dein Land erobern. Ein kluger Fürst baut seine eigene Armee auf. Er braucht Bürger, die für ihr Land kämpfen. Eine eigene Armee ist teuer, aber sie ist die beste Investition. Nur so kann ein Herrscher unabhängig bleiben.","vocab":[["Söldner","mercenary"],["Loyalität","loyalty"],["loyal","loyal"],["Hilfstruppen","auxiliary troops"],["verraten","betray"],["Herrscher","ruler"],["unabhängig","independent"],["abhängig","dependent"]]},{"title":"🎯 Grausamkeit kann nützlich sein","content":"Grausamkeit kann gerechtfertigt sein, wenn sie dem Staat dient. Ein Fürst muss manchmal hart durchgreifen. Aber er sollte Grausamkeit nur einmal und schnell einsetzen. Wenn er viele kleine grausame Taten begeht, wird er gehasst. Eine einzige große, aber notwendige Tat ist besser. Der Fürst sollte erklären, warum er handeln musste. Das Volk versteht harte Maßnahmen, wenn sie begründet sind. Ein grausamer Herrscher ist manchmal barmherziger als ein schwacher, der Chaos zulässt.","vocab":[["Grausamkeit","cruelty"],["Staat","state"],["Taten","actions"],["Maßnahmen","measures"],["Herrscher","ruler"]]},{"title":"🎭 Scheine tugendhaft zu sein","content":"Ein Fürst muss tugendhaft erscheinen, aber nicht unbedingt tugendhaft sein. Er soll fromm, treu, menschlich, ehrlich und religiös wirken. Aber in Wirklichkeit muss er bereit sein, das Gegenteil zu tun. Das Volk glaubt, was es sieht. Wenn der Fürst gut aussieht, wird er geliebt. Aber er darf sich nicht von Moral einschränken lassen. Ein kluger Herrscher ist ein guter Schauspieler. Er zeigt, was die Menschen sehen wollen, aber er tut, was notwendig ist.","vocab":[["tugendhaft","virtuous"],["fromm","pious"],["menschlich","humane"],["Herrscher","ruler"]]},{"title":"💰 Geiz ist besser als Großzügigkeit","content":"Ein großzügiger Fürst macht sich schnell arm. Um großzügig zu sein, muss er Steuern erhöhen. Das macht das Volk unzufrieden. Ein geiziger Herrscher spart Geld für den Krieg. Das Volk hasst Steuern mehr als einen sparsamen Herrscher. Ein Fürst sollte nicht zu viel verschenken. Großzügigkeit wird schnell erwartet. Wer nicht mehr geben kann, wird verachtet. Ein sparsamer Herrscher ist klüger. Er hat Geld für Notfälle. Das Volk respektiert einen Herrscher, der nicht verschwenderisch ist.","vocab":[["Steuern","taxes"],["Geiz","frugality"],["Herrscher","ruler"],["sparsam","frugal"],["Großzügigkeit","generosity"],["Notfälle","emergencies"]]},{"title":"🦁 Sei wie Löwe und Fuchs","content":"Ein Fürst muss beide Seiten haben: Stärke und List. Der Löwe symbolisiert Kraft und Furcht. Der Fuchs symbolisiert Schlauheit und Täuschung. Ein Herrscher, der nur stark ist, wird betrogen. Einer, der nur schlau ist, wird besiegt. Er muss beides vereinen. Manchmal muss er kämpfen wie ein Löwe. Manchmal muss er tricksen wie ein Fuchs. Die größten Herrscher waren immer beides. Sie konnten Freunde und Feinde gleichermaßen überlisten.","vocab":[["List","cunning"],["Täuschung","deception"],["Herrscher","ruler"],["Sieg","victory"],["vereinen","unite"],["Feinde","enemies"]]},{"title":"📜 Lerne aus der Geschichte","content":"Ein kluger Fürst studiert die großen Männer der Vergangenheit. Er liest über ihre Siege und Niederlagen. Er versteht, warum sie erfolgreich waren oder scheiterten. Geschichte wiederholt sich. Die gleichen Fehler werden immer wieder gemacht. Ein weiser Herrscher vermeidet sie. Er ahmt die Großen nach. Aber er passt ihre Strategien an seine eigene Zeit an. Die Umstände ändern sich, aber die Prinzipien bleiben gleich.","vocab":[["Sieg","victory"],["Niederlagen","defeats"],["Herrscher","ruler"],["Umstände","circumstances"],["Prinzipien","principles"]]},{"title":"🎲 Das Glück ist eine Frau","content":"Machiavelli sagt, das Glück (Fortuna) ist wie eine Frau. Es lässt sich nur von mutigen Männern bezwingen. Wer zögert, verliert. Wer risikobereit ist, gewinnt. Der Fürst muss das Glück herausfordern. Er darf nicht untätig warten. Das Glück gehört den Mutigen. Aber der Fürst sollte sich nicht nur auf das Glück verlassen. Er muss auch fähig sein. Glück allein reicht nicht. Ein kluger Herrscher schafft sich sein eigenes Glück.","vocab":[["mutig","brave"],["risikobereit","willing to take risks"],["untätig","inactive"],["Herrscher","ruler"]]},{"title":"🏛️ Fürchte das Volk nicht zu sehr","content":"Ein Fürst muss das Volk respektieren, aber nicht fürchten. Das Volk ist mächtig, aber es ist auch faul. Wenn der Herrscher das Volk gut behandelt, wird es ihn unterstützen. Ein weiser Herrscher hört auf die Stimme des Volkes. Er gibt dem Volk, was es braucht. Aber er gibt nie zu viel Macht. Das Volk soll zufrieden sein, aber nicht rebellieren. Ein kluger Herrscher weiß, dass das Volk seine stärkste Waffe ist – oder seine größte Gefahr.","vocab":[["Herrscher","ruler"],["rebellieren","rebel"]]},{"title":"🤝 Freunde und Feinde klar benennen","content":"Ein Fürst muss sich klar positionieren. Er sollte entweder ein wahrer Freund oder ein wahrer Feind sein. Neutralität ist Schwäche. Wer sich nicht entscheidet, wird von beiden Seiten verachtet. Ein kluger Herrscher wählt seine Allianzen weise. Er unterstützt seine Freunde und bekämpft seine Feinde. Er lässt keine Zweifel an seiner Loyalität. Das gibt ihm Respekt und Macht. Unentschlossenheit ist der Feind des Herrschers.","vocab":[["Schwäche","weakness"],["Herrscher","ruler"],["Feinde","enemies"],["Loyalität","loyalty"],["loyal","loyal"],["Unentschlossenheit","indecision"],["entschlossen","determined"]]},{"title":"🏗️ Befestigungen sind nicht alles","content":"Viele Fürsten bauen Festungen, um sich zu schützen. Aber eine Festung schützt nicht vor einem unzufriedenen Volk. Wenn das Volk den Herrscher hasst, hilft keine Mauer. Ein weiser Fürst gewinnt die Herzen des Volkes. Er braucht keine Festungen, wenn das Volk ihn liebt. Aber wenn das Volk ihn hasst, sind Festungen nutzlos. Die beste Festung ist die Loyalität des Volkes. Ein kluger Herrscher investiert in sein Volk, nicht nur in Stein und Mörtel.","vocab":[["Festung","fortress"],["Herrscher","ruler"],["Mauer","wall"],["Loyalität","loyalty"],["loyal","loyal"]]},{"title":"💬 Vermeide Schmeichler","content":"Ein Fürst ist immer von Schmeichlern umgeben. Sie sagen ihm, was er hören will. Das ist gefährlich. Ein kluger Herrscher umgibt sich mit ehrlichen Beratern. Er hört die Wahrheit, auch wenn sie wehtut. Aber er entscheidet allein. Er lässt sich nicht von einem Berater dominieren. Ein weiser Fürst schafft ein System, in dem er die Wahrheit hört, aber die Kontrolle behält. Schmeichler sind wie Gift. Ein guter Herrscher erkennt sie und hält sie fern.","vocab":[["Schmeichler","flatterers"],["Herrscher","ruler"],["Berater","advisers"],["Kontrolle","control"]]},{"title":"⚡ Handle schnell und entschlossen","content":"Ein Fürst muss schnell handeln, wenn es nötig ist. Zögern ist gefährlich. Wer zu lange wartet, verliert die Chance. Ein kluger Herrscher ergreift die Initiative. Er zögert nicht, wenn eine Entscheidung getroffen werden muss. Er weiß, dass Untätigkeit schlimmer ist als ein Fehler. Ein entschlossener Herrscher wird respektiert. Ein zögerlicher Herrscher wird verachtet. Macht gehört den Schnellen.","vocab":[["Zögern","hesitation"],["Herrscher","ruler"],["Initiative","initiative"],["untätig","inactive"],["entschlossen","determined"]]},{"title":"🔄 Passe dich den Zeiten an","content":"Die Zeiten ändern sich, und ein Fürst muss sich anpassen. Was gestern funktionierte, kann morgen scheitern. Ein kluger Herrscher erkennt den Wandel. Er passt seine Strategien an. Er ist flexibel und nicht starr. Wer sich nicht anpasst, wird untergehen. Die Geschichte zeigt, dass erfolgreiche Herrscher immer anpassungsfähig waren. Ein weiser Fürst lernt ständig dazu und verbessert sich.","vocab":[["anpassen","adapt"],["Herrscher","ruler"],["Wandel","change"],["flexibel","flexible"],["starr","rigid"],["Anpassung","adaptation"],["anpassungsfähig","adaptable"]]},{"title":"🇮🇹 Befreie Italien von den Barbaren","content":"Das letzte Kapitel von *Der Fürst* ist ein leidenschaftlicher Aufruf. Machiavelli fordert die Medici-Familie auf, Italien von den fremden Mächten zu befreien. Er träumt von einem vereinten Italien. Ein starker Herrscher soll die italienischen Staaten vereinen. Das ist Machiavellis eigentliches Ziel. Er schreibt nicht nur über Macht, er will Italien retten. Seine Lehren sind nicht nur theoretisch. Sie sind ein Aufruf zum Handeln.","vocab":[["Aufruf","appeal"],["Ruf","reputation"],["fremden","foreign"],["Herrscher","ruler"],["Staat","state"],["vereinen","unite"],["theoretisch","theoretical"]]},{"title":"🧠 Sei ein moralischer Realist","content":"Machiavellis große Botschaft ist, dass ein Politiker ein moralischer Realist sein muss. Die ideale Welt existiert nicht. Wer versucht, nur nach moralischen Idealen zu leben, wird zerstört. Ein Fürst muss die Welt so sehen, wie sie wirklich ist. Er muss mit menschlicher Schwäche rechnen. Ein kluger Herrscher ist nicht naiv. Er weiß, dass Menschen egoistisch und unberechenbar sind. Er handelt nach der Realität, nicht nach Träumen. Das ist die wichtigste Lektion aus *Der Fürst*.","vocab":[["moralisch","moral"],["List","cunning"],["menschlich","humane"],["menschliche","human"],["Schwäche","weakness"],["Herrscher","ruler"],["naiv","naive"],["Träume","dreams"]]}];
