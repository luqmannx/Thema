const DATA = {"simple":[{"title":"Der gierige Hund 🐶","story":["Ein Hund hat einen großen, leckeren Knochen. Er läuft über eine kleine Brücke. Unter der Brücke fließt ein Fluss. Der Hund schaut ins Wasser und sieht sein Spiegelbild. Er denkt: \"Der andere Hund da unten hat auch einen Knochen. Sein Knochen ist viel größer als meiner!\"","Der Hund möchte den großen Knochen von dem anderen Hund haben. Er will ihn unbedingt. Er öffnet seinen Mund, um zu bellen, und springt nach dem Knochen im Wasser. Aber in diesem Moment fällt sein eigener Knochen aus dem Mund in den Fluss.","Jetzt hat der Hund keinen Knochen mehr. Er ist ganz traurig. Sein Spiegelbild ist auch verschwunden. Am Ende versteht er die Lektion: Man soll nicht immer mehr wollen. Manchmal ist das, was man hat, schon gut genug."],"translation":[["Ein Hund hat einen großen, leckeren Knochen.","A dog has a big, tasty bone."],["Er läuft über eine kleine Brücke.","He walks across a small bridge."],["Unter der Brücke fließt ein Fluss.","A river flows under the bridge."],["Der Hund schaut ins Wasser und sieht sein Spiegelbild.","The dog looks into the water and sees his reflection."],["Er denkt: \"Der andere Hund da unten hat auch einen Knochen. Sein Knochen ist viel größer als meiner!\"","He thinks: \"The other dog down there also has a bone. His bone is much bigger than mine!\""],["Der Hund möchte den großen Knochen von dem anderen Hund haben.","The dog wants to have the big bone from the other dog."],["Er will ihn unbedingt.","He really wants it."],["Er öffnet seinen Mund, um zu bellen, und springt nach dem Knochen im Wasser.","He opens his mouth to bark and jumps for the bone in the water."],["Aber in diesem Moment fällt sein eigener Knochen aus dem Mund in den Fluss.","But at that moment, his own bone falls out of his mouth into the river."],["Jetzt hat der Hund keinen Knochen mehr.","Now the dog has no bone left."],["Er ist ganz traurig.","He is very sad."],["Sein Spiegelbild ist auch verschwunden.","His reflection has also disappeared."],["Am Ende versteht er die Lektion:","In the end, he understands the lesson:"],["Man soll nicht immer mehr wollen.","One should not always want more."],["Manchmal ist das, was man hat, schon gut genug.","Sometimes what you have is already good enough."]],"vocab":[["der Knochen","bone"],["lecker","tasty, delicious"],["die Brücke","bridge"],["der Fluss","river"],["fließen","to flow"],["das Spiegelbild","reflection"],["bellen","to bark"],["springen","to jump"],["der Moment","moment"],["eigen","own"],["verschwinden","to disappear"],["verstehen","to understand"],["die Lektion","lesson"],["gierig","greedy"],["genug","enough"]],"speaking":[["Warum hat der Hund am Anfang gute Laune?","Weil er einen großen, leckeren Knochen hat.","Because he has a big, tasty bone."],["Was sieht der Hund im Wasser?","Er sieht sein Spiegelbild und denkt, der andere Hund habe einen größeren Knochen.","He sees his reflection and thinks the other dog has a bigger bone."],["Warum springt der Hund ins Wasser?","Er will den vermeintlich größeren Knochen haben.","He wants the supposedly bigger bone."],["Was passiert dabei mit seinem eigenen Knochen?","Er fällt ihm aus dem Maul und in den Fluss.","It falls out of his mouth into the river."],["Was versteht der Hund am Ende?","Er versteht, dass man nicht immer mehr haben muss.","He understands that you do not always need more."]],"wordCount":126,"grammar":{"title":"Akkusativ: der → den, ein → einen","text":"Der Akkusativ steht oft beim direkten Objekt. Bei maskulinen Nomen wird der Artikel im Akkusativ verändert: der → den, ein → einen.","examples":["Der Hund hat einen Knochen.","Er öffnet den Mund.","Ich sehe den Hund."]},"listening":[["auch","also, too","Der andere Hund hat auch einen Knochen."],["unbedingt","absolutely, very much","Er will ihn unbedingt."],["ganz","very, quite","Er ist ganz traurig."],["schon","already / indeed","... ist schon gut genug."]]},{"title":"Der verlorene Schlüssel 🗝️","story":["Ein junger Mann namens Lukas wohnt in einer kleinen Wohnung in der Stadt. Er ist Student und hat viel zu tun. Heute Morgen steht er spät auf. Er muss schnell zur Universität gehen. Er nimmt seine Tasche, seinen Laptop und sein Handy. Aber wo ist sein Schlüssel? Er sucht überall: auf dem Tisch, unter dem Bett und in der Jacke. Der Schlüssel ist nicht da.","Lukas ist sehr gestresst. Er denkt nach: \"Wo habe ich meinen Schlüssel gelassen?\" Plötzlich klingelt sein Handy. Es ist seine Freundin Anna. Sie sagt: \"Hallo Lukas! Dein Schlüssel liegt bei mir. Du hast ihn gestern bei mir vergessen.\" Lukas ist erleichtert. Er sagt: \"Oh, danke Anna! Ich komme sofort vorbei.\" Er fährt mit dem Bus zu Anna. Sie gibt ihm den Schlüssel.","Lukas lächelt und sagt: \"Du bist meine Heldin!\" Jetzt kann er endlich in seine Wohnung gehen. Er ist glücklich. Am Abend denkt er: \"Ich muss besser auf meine Sachen aufpassen.\""],"translation":[["Ein junger Mann namens Lukas wohnt in einer kleinen Wohnung in der Stadt.","A young man named Lukas lives in a small apartment in the city."],["Er ist Student und hat viel zu tun.","He is a student and has a lot to do."],["Heute Morgen steht er spät auf.","This morning he gets up late."],["Er muss schnell zur Universität gehen.","He has to get to the university quickly."],["Er nimmt seine Tasche, seinen Laptop und sein Handy.","He takes his bag, laptop and phone."],["Aber wo ist sein Schlüssel?","But where is his key?"],["Er sucht überall: auf dem Tisch, unter dem Bett und in der Jacke.","He searches everywhere: on the table, under the bed and in his jacket."],["Der Schlüssel ist nicht da.","The key is not there."],["Lukas ist sehr gestresst.","Lukas is very stressed."],["Er denkt nach: \"Wo habe ich meinen Schlüssel gelassen?\"","He thinks: \"Where did I leave my key?\""],["Plötzlich klingelt sein Handy.","Suddenly his phone rings."],["Es ist seine Freundin Anna.","It is his girlfriend Anna."],["Sie sagt: \"Hallo Lukas! Dein Schlüssel liegt bei mir. Du hast ihn gestern bei mir vergessen.\"","She says: \"Hello Lukas! Your key is with me. You forgot it at my place yesterday.\""],["Lukas ist erleichtert.","Lukas is relieved."],["Er sagt: \"Oh, danke Anna! Ich komme sofort vorbei.\"","He says: \"Oh, thank you Anna! I'll come over right away.\""],["Er fährt mit dem Bus zu Anna.","He takes the bus to Anna's place."],["Sie gibt ihm den Schlüssel.","She gives him the key."],["Lukas lächelt und sagt: \"Du bist meine Heldin!\"","Lukas smiles and says: \"You are my heroine!\""],["Jetzt kann er endlich in seine Wohnung gehen.","Now he can finally go into his apartment."],["Er ist glücklich.","He is happy."],["Am Abend denkt er: \"Ich muss besser auf meine Sachen aufpassen.\"","In the evening he thinks: \"I need to take better care of my things.\""]],"vocab":[["der Schlüssel","key"],["wohnen","to live"],["der Student","student"],["aufstehen","to get up"],["die Universität","university"],["die Tasche","bag"],["suchen","to search"],["überall","everywhere"],["gestresst","stressed"],["nachdenken","to think"],["plötzlich","suddenly"],["klingeln","to ring"],["die Freundin","girlfriend"],["vergessen","to forget"],["erleichtert","relieved"],["vorbeikommen","to come by"],["lächeln","to smile"],["die Heldin","heroine"],["endlich","finally"],["aufpassen","to pay attention"]],"speaking":[["Warum ist Lukas heute Morgen so gestresst?","Weil er spät aufsteht und seinen Schlüssel nicht findet.","Because he gets up late and cannot find his key."],["Wo sucht Lukas nach dem Schlüssel?","Er sucht auf dem Tisch, unter dem Bett und in seiner Jacke.","He looks on the table, under the bed, and in his jacket."],["Wer weiß, wo der Schlüssel ist?","Seine Freundin Anna weiß, dass er bei ihr liegt.","His girlfriend Anna knows that it is at her place."],["Wie bekommt Lukas seinen Schlüssel zurück?","Er fährt mit dem Bus zu Anna, und sie gibt ihn ihm.","He takes the bus to Anna, and she gives it back to him."],["Was nimmt sich Lukas für die Zukunft vor?","Er will besser auf seine Sachen aufpassen.","He wants to take better care of his things."]],"wordCount":152,"grammar":{"title":"Trennbare Verben","text":"Bei trennbaren Verben steht der Präfix im Hauptsatz am Ende.","examples":["Heute Morgen steht er spät auf.","Er denkt nach.","Ich komme später vorbei."]},"listening":[["plötzlich","suddenly","Plötzlich klingelt sein Handy."],["sofort","immediately","Ich komme sofort vorbei."],["endlich","finally","Jetzt kann er endlich gehen."]]},{"title":"Der fleißige Hase und die faule Maus 🐇🐭","story":["In einem großen Wald leben ein Hase und eine Maus. Der Hase ist sehr fleißig. Er arbeitet jeden Tag. Er sammelt Nüsse und Wurzeln für den Winter. Die Maus ist faul. Sie schläft gern und spielt den ganzen Tag. Der Hase sagt zu der Maus: \"Der Winter kommt bald. Du musst auch Vorräte sammeln.\" Die Maus lacht und sagt: \"Warum? Es gibt genug Essen im Wald.\"","Der Winter kommt. Es schneit stark. Der Hase hat viele Vorräte. Er sitzt in seinem warmen Haus und isst. Die Maus hat nichts. Sie friert und hat Hunger. Sie geht zum Hasen und fragt: \"Bitte, gib mir etwas zu essen!\" Der Hase hilft der Maus. Er teilt sein Essen. Die Maus ist dankbar.","Sie versteht ihre Lektion. Von nun an arbeitet sie fleißig. Sie sammelt Vorräte für den nächsten Winter. Der Hase lächelt. Zusammen sind sie jetzt gute Freunde."],"translation":[["In einem großen Wald leben ein Hase und eine Maus.","A rabbit and a mouse live in a big forest."],["Der Hase ist sehr fleißig.","The rabbit is very hardworking."],["Er arbeitet jeden Tag.","He works every day."],["Er sammelt Nüsse und Wurzeln für den Winter.","He collects nuts and roots for the winter."],["Die Maus ist faul.","The mouse is lazy."],["Sie schläft gern und spielt den ganzen Tag.","She likes sleeping and plays all day."],["Der Hase sagt zu der Maus: \"Der Winter kommt bald. Du musst auch Vorräte sammeln.\"","The rabbit says to the mouse: \"Winter is coming soon. You must collect supplies too.\""],["Die Maus lacht und sagt: \"Warum? Es gibt genug Essen im Wald.\"","The mouse laughs and says: \"Why? There is enough food in the forest.\""],["Der Winter kommt.","Winter comes."],["Es schneit stark.","It snows heavily."],["Der Hase hat viele Vorräte.","The rabbit has many supplies."],["Er sitzt in seinem warmen Haus und isst.","He sits in his warm house and eats."],["Die Maus hat nichts.","The mouse has nothing."],["Sie friert und hat Hunger.","She is cold and hungry."],["Sie geht zum Hasen und fragt: \"Bitte, gib mir etwas zu essen!\"","She goes to the rabbit and asks: \"Please, give me something to eat!\""],["Der Hase hilft der Maus.","The rabbit helps the mouse."],["Er teilt sein Essen.","He shares his food."],["Die Maus ist dankbar.","The mouse is grateful."],["Sie versteht ihre Lektion.","She understands her lesson."],["Von nun an arbeitet sie fleißig.","From now on she works hard."],["Sie sammelt Vorräte für den nächsten Winter.","She collects supplies for the next winter."],["Der Hase lächelt.","The rabbit smiles."],["Zusammen sind sie jetzt gute Freunde.","Together they are now good friends."]],"vocab":[["der Wald","forest"],["der Hase","rabbit"],["die Maus","mouse"],["fleißig","hardworking"],["faul","lazy"],["sammeln","to collect"],["die Nuss","nut"],["die Wurzel","root"],["der Winter","winter"],["die Vorräte","supplies"],["schneien","to snow"],["stark","strongly, heavily"],["warm","warm"],["frieren","to be cold"],["der Hunger","hunger"],["teilen","to share"],["dankbar","grateful"],["die Lektion","lesson"],["von nun an","from now on"],["zusammen","together"]],"speaking":[["Warum sammelt der Hase schon vor dem Winter Vorräte?","Weil er weiß, dass der Winter bald kommt.","Because he knows winter is coming soon."],["Was macht die Maus lieber als arbeiten?","Sie schläft gern und spielt den ganzen Tag.","She prefers sleeping and playing all day."],["Was passiert mit der Maus im Winter?","Sie hat nichts zu essen und friert.","She has nothing to eat and is cold."],["Wie hilft der Hase der Maus?","Er teilt sein Essen mit ihr.","He shares his food with her."],["Was ändert sich bei der Maus danach?","Sie wird fleißig und sammelt Vorräte für den nächsten Winter.","She becomes hardworking and collects supplies for the next winter."]],"wordCount":172,"grammar":{"title":"Dativ: der → dem, die → der","text":"Der Dativ zeigt oft, wer etwas bekommt oder wem etwas hilft. Häufige Formen sind der → dem, die → der, das → dem.","examples":["Der Hase hilft der Maus.","Die Maus geht zu dem Hasen.","Er teilt sein Essen mit der Maus."]},"listening":[["bald","soon","Der Winter kommt bald."],["genug","enough","Es gibt genug Essen im Wald."],["von nun an","from now on","Von nun an arbeitet sie fleißig."]]},{"title":"Kaufen 🛒","story":["Heute geht Anna in den Supermarkt, weil sie für das Abendessen einkaufen möchte. Zuerst nimmt sie einen Korb und schaut auf ihre Liste. Sie braucht Brot, Milch, Eier, Käse, Tomaten und Äpfel. Im ersten Gang findet sie das Brot.","Die Milch steht im Kühlschrank. Danach sucht sie die Eier, aber sie sind fast ausverkauft. Eine Verkäuferin zeigt ihr ein anderes Regal. Dort findet Anna noch zwei Packungen.","An der Kasse legt sie alle Sachen auf das Band. Sie bezahlt mit ihrer Karte und bekommt den Kassenbon. Zu Hause räumt sie die Einkäufe in die Küche. Sie ist zufrieden, denn sie hat alles bekommen, was sie für das Abendessen braucht. Vor dem Einschlafen denkt Anna, dass der Einkauf gut funktioniert hat."],"translation":[["Heute geht Anna in den Supermarkt, weil sie für das Abendessen einkaufen möchte.","Today Anna goes to the supermarket because she wants to shop for dinner."],["Zuerst nimmt sie einen Korb und schaut auf ihre Liste.","First she takes a basket and looks at her list."],["Sie braucht Brot, Milch, Eier, Käse, Tomaten und Äpfel.","She needs bread, milk, eggs, cheese, tomatoes and apples."],["Im ersten Gang findet sie das Brot.","In the first aisle she finds the bread."],["Die Milch steht im Kühlschrank.","The milk is in the refrigerator."],["Danach sucht sie die Eier, aber sie sind fast ausverkauft.","Then she looks for the eggs, but they are almost sold out."],["Eine Verkäuferin zeigt ihr ein anderes Regal.","A saleswoman shows her another shelf."],["Dort findet Anna noch zwei Packungen.","There Anna finds two more packages."],["An der Kasse legt sie alle Sachen auf das Band.","At the checkout she puts everything on the conveyor belt."],["Sie bezahlt mit ihrer Karte und bekommt den Kassenbon.","She pays with her card and gets the receipt."],["Zu Hause räumt sie die Einkäufe in die Küche.","At home she puts the groceries away in the kitchen."],["Sie ist zufrieden, denn sie hat alles bekommen, was sie für das Abendessen braucht.","She is satisfied because she got everything she needs for dinner."],["Vor dem Einschlafen denkt Anna, dass der Einkauf gut funktioniert hat.","Before going to sleep, Anna thinks that the shopping went well."]],"vocab":[["der Supermarkt","supermarket"],["der Korb","basket"],["die Liste","list"],["günstig","cheap, affordable"],["teuer","expensive"],["die Kasse","checkout"],["bezahlen","to pay"],["tragen","to carry"],["brauchen","to need"],["zufrieden","satisfied"]],"speaking":[["Was möchte Anna heute im Supermarkt einkaufen?","Sie möchte alles für das Abendessen besorgen.","She wants to buy everything for dinner."],["Was macht Anna, wenn sie die Eier nicht sofort findet?","Sie fragt eine Verkäuferin, und die zeigt ihr ein anderes Regal.","She asks a saleswoman, who shows her another shelf."],["Was passiert an der Kasse?","Anna legt ihre Einkäufe aufs Band und bezahlt mit Karte.","Anna puts her groceries on the belt and pays by card."],["Wie fühlt sich Anna nach dem Einkauf?","Sie ist zufrieden, weil sie alles bekommen hat.","She is satisfied because she got everything she needed."],["Was macht Anna zu Hause mit den Einkäufen?","Sie räumt sie in die Küche.","She puts them away in the kitchen."]],"wordCount":120,"grammar":{"title":"weil-Sätze","text":"Mit „weil“ nennt man einen Grund. Das Verb steht am Ende.","examples":["Ich bleibe zu Hause, weil ich müde bin.","Anna kauft den Käse, weil sie ihn braucht."]},"listening":[["günstig","cheap, affordable","Die Milch ist günstig."],["trotzdem","nevertheless, anyway","Anna kauft trotzdem den Käse."]]},{"title":"Mein Morgen ☀️","story":["Jeden Morgen steht Paul um sieben Uhr auf. Zuerst macht er das Fenster auf und lüftet sein Zimmer. Danach geht er ins Bad, wäscht sich und putzt seine Zähne.","In der Küche bereitet er ein einfaches Frühstück vor. Er isst Brot mit Käse und trinkt einen Tee. Während er frühstückt, schaut er kurz auf sein Handy. Dann zieht er sich an und packt seine Tasche.","Er kontrolliert noch einmal, ob er seinen Schlüssel, sein Portemonnaie und sein Handy dabei hat. Um halb acht verlässt er die Wohnung. Er geht zur Bushaltestelle und wartet auf den Bus. Paul mag seinen ruhigen Morgen, weil er so entspannt in den Tag startet. Bevor der Bus kommt, hört Paul noch kurz seine Lieblingsmusik."],"translation":[["Jeden Morgen steht Paul um sieben Uhr auf.","Every morning Paul gets up at seven."],["Zuerst macht er das Fenster auf und lüftet sein Zimmer.","First he opens the window and airs his room."],["Danach geht er ins Bad, wäscht sich und putzt seine Zähne.","Afterwards he goes to the bathroom, washes and brushes his teeth."],["In der Küche bereitet er ein einfaches Frühstück vor.","In the kitchen he prepares a simple breakfast."],["Er isst Brot mit Käse und trinkt einen Tee.","He eats bread with cheese and drinks tea."],["Während er frühstückt, schaut er kurz auf sein Handy.","While he has breakfast, he briefly looks at his phone."],["Dann zieht er sich an und packt seine Tasche.","Then he gets dressed and packs his bag."],["Er kontrolliert noch einmal, ob er seinen Schlüssel, sein Portemonnaie und sein Handy dabei hat.","He checks once more that he has his key, wallet and phone with him."],["Um halb acht verlässt er die Wohnung.","At half past seven he leaves the apartment."],["Er geht zur Bushaltestelle und wartet auf den Bus.","He goes to the bus stop and waits for the bus."],["Paul mag seinen ruhigen Morgen, weil er so entspannt in den Tag startet.","Paul likes his calm morning because it lets him start the day relaxed."],["Bevor der Bus kommt, hört Paul noch kurz seine Lieblingsmusik.","Before the bus comes, Paul listens briefly to his favorite music."]],"vocab":[["aufstehen","to get up"],["das Fenster","window"],["das Bett","bed"],["duschen","to shower"],["sich anziehen","to get dressed"],["die Küche","kitchen"],["kurz","briefly"],["die Tasche","bag"],["die Arbeit","work"],["ruhig","calm"]],"speaking":[["Wann steht Paul morgens auf?","Er steht jeden Morgen um sieben Uhr auf.","He gets up at seven every morning."],["Was macht Paul nach dem Aufstehen?","Er lüftet sein Zimmer, geht ins Bad und putzt seine Zähne.","He airs his room, goes to the bathroom, and brushes his teeth."],["Was frühstückt Paul?","Er isst Brot mit Käse und trinkt Tee.","He eats bread with cheese and drinks tea."],["Was kontrolliert er vor dem Losgehen?","Er prüft, ob er Schlüssel, Portemonnaie und Handy dabeihat.","He checks that he has his keys, wallet, and phone."],["Warum mag Paul seinen ruhigen Morgen?","Weil er entspannt in den Tag starten kann.","Because he can start the day in a relaxed way."]],"wordCount":119,"grammar":{"title":"Trennbare Verben","text":"Bei trennbaren Verben steht der Präfix im Hauptsatz am Ende.","examples":["Er steht um sieben Uhr auf.","Ich ziehe mich schnell an."]},"listening":[["kurz","briefly","Er schaut kurz auf sein Handy."],["danach","afterwards","Danach duscht er."]]},{"title":"Im Park 🌳","story":["Am Nachmittag geht Lina in den Park, weil das Wetter schön ist. Die Sonne scheint und es ist warm. Im Park laufen viele Menschen, aber es ist trotzdem ruhig. Lina geht langsam durch die Wege und hört die Vögel.","Auf einer Bank sitzt ein älterer Mann und liest eine Zeitung. Neben dem Spielplatz spielen Kinder mit einem Ball. Lina sieht auch einen kleinen Hund, der seinem Besitzer hinterherläuft. Danach setzt sie sich unter einen Baum und trinkt Wasser.","Sie liest ein paar Seiten in ihrem Buch. Nach einer Weile beginnt es leicht zu regnen. Lina nimmt ihre Tasche und geht nach Hause. Sie findet den Park schön, weil sie dort gut entspannen kann."],"translation":[["Am Nachmittag geht Lina in den Park, weil das Wetter schön ist.","In the afternoon Lina goes to the park because the weather is nice."],["Die Sonne scheint und es ist warm.","The sun is shining and it is warm."],["Im Park laufen viele Menschen, aber es ist trotzdem ruhig.","Many people are walking in the park, but it is still quiet."],["Lina geht langsam durch die Wege und hört die Vögel.","Lina walks slowly along the paths and listens to the birds."],["Auf einer Bank sitzt ein älterer Mann und liest eine Zeitung.","An older man sits on a bench and reads a newspaper."],["Neben dem Spielplatz spielen Kinder mit einem Ball.","Children are playing with a ball next to the playground."],["Lina sieht auch einen kleinen Hund, der seinem Besitzer hinterherläuft.","Lina also sees a small dog following its owner."],["Danach setzt sie sich unter einen Baum und trinkt Wasser.","Afterwards she sits under a tree and drinks water."],["Sie liest ein paar Seiten in ihrem Buch.","She reads a few pages of her book."],["Nach einer Weile beginnt es leicht zu regnen.","After a while it starts to rain lightly."],["Lina nimmt ihre Tasche und geht nach Hause.","Lina takes her bag and goes home."],["Sie findet den Park schön, weil sie dort gut entspannen kann.","She likes the park because she can relax there well."]],"vocab":[["der Park","park"],["die Sonne","sun"],["die Bank","bench"],["der Weg","path"],["das Fahrrad","bicycle"],["der Ball","ball"],["die Blume","flower"],["langsam","slowly"],["neben","next to"],["sich fühlen","to feel"]],"speaking":[["Warum geht Lina am Nachmittag in den Park?","Weil das Wetter schön ist.","Because the weather is nice."],["Was macht Lina dort?","Sie geht durch den Park und hört die Vögel.","She walks through the park and listens to the birds."],["Wen sieht Lina auf einer Bank?","Sie sieht einen älteren Mann, der Zeitung liest.","She sees an older man reading a newspaper."],["Was macht Lina, als es zu regnen beginnt?","Sie nimmt ihre Tasche und geht nach Hause.","She takes her bag and goes home."],["Warum geht Lina gern in den Park?","Weil sie dort gut entspannen kann.","Because she can relax there well."]],"wordCount":113,"grammar":{"title":"Akkusativ nach „durch“","text":"Die Präposition „durch“ verlangt den Akkusativ: durch den Park, durch den Wald.","examples":["Lisa läuft durch den Park.","Wir gehen durch den Wald."]},"listening":[["nach Hause","homeward / home","Danach geht sie nach Hause."],["neben","next to","Neben dem Weg stehen Blumen."]]},{"title":"Im Zoo 🦒","story":["Am Samstag besucht Tim mit seiner Schwester den Zoo. Sie kaufen zwei Eintrittskarten und gehen zuerst zu den Elefanten. Die großen Tiere stehen ruhig zusammen und fressen Gras. Danach sehen sie die Giraffen.","Tim findet ihre langen Hälse lustig. Seine Schwester möchte unbedingt die Affen sehen, weil sie dort immer viel Bewegung beobachten kann. Später gehen sie zu den Pinguinen. Einige schwimmen schnell durch das Wasser, während andere auf den Felsen sitzen.","Vor dem Ausgang kaufen die beiden eine kleine Flasche Wasser. Sie sind müde, aber zufrieden. Der Zoo ist groß, deshalb konnten sie nicht alle Tiere sehen. Tim möchte bald wiederkommen, um noch mehr Tiere kennenzulernen. Am Ende machen sie noch ein Foto vor dem großen Eingang."],"translation":[["Am Samstag besucht Tim mit seiner Schwester den Zoo.","On Saturday Tim visits the zoo with his sister."],["Sie kaufen zwei Eintrittskarten und gehen zuerst zu den Elefanten.","They buy two tickets and go to the elephants first."],["Die großen Tiere stehen ruhig zusammen und fressen Gras.","The large animals stand calmly together and eat grass."],["Danach sehen sie die Giraffen.","Afterwards they see the giraffes."],["Tim findet ihre langen Hälse lustig.","Tim finds their long necks funny."],["Seine Schwester möchte unbedingt die Affen sehen, weil sie dort immer viel Bewegung beobachten kann.","His sister really wants to see the monkeys because she can always watch lots of movement there."],["Später gehen sie zu den Pinguinen.","Later they go to the penguins."],["Einige schwimmen schnell durch das Wasser, während andere auf den Felsen sitzen.","Some swim quickly through the water while others sit on the rocks."],["Vor dem Ausgang kaufen die beiden eine kleine Flasche Wasser.","Before the exit, the two buy a small bottle of water."],["Sie sind müde, aber zufrieden.","They are tired but satisfied."],["Der Zoo ist groß, deshalb konnten sie nicht alle Tiere sehen.","The zoo is large, so they could not see all the animals."],["Tim möchte bald wiederkommen, um noch mehr Tiere kennenzulernen.","Tim wants to come back soon to see more animals."],["Am Ende machen sie noch ein Foto vor dem großen Eingang.","At the end they take a photo in front of the large entrance."]],"vocab":[["der Zoo","zoo"],["der Elefant","elephant"],["der Affe","monkey"],["das Tier","animal"],["der Ast","branch"],["das Gehege","enclosure"],["die Giraffe","giraffe"],["hoch","tall, high"],["das Foto","photo"],["besuchen","to visit"]],"speaking":[["Mit wem besucht Tim den Zoo?","Er besucht den Zoo mit seiner Schwester.","He visits the zoo with his sister."],["Welche Tiere sehen sie zuerst?","Sie sehen zuerst die Elefanten.","They see the elephants first."],["Welche Tiere möchte Tims Schwester unbedingt sehen?","Sie möchte unbedingt die Affen sehen.","She really wants to see the monkeys."],["Warum sehen sie nicht alle Tiere?","Weil der Zoo sehr groß ist.","Because the zoo is very large."],["Was möchte Tim nach dem Besuch machen?","Er möchte bald wiederkommen und noch mehr Tiere kennenlernen.","He wants to come back soon and see more animals."]],"wordCount":118,"grammar":{"title":"Relativsatz mit „die“","text":"Ein kurzer Relativsatz gibt mehr Information über ein Nomen: eine Giraffe, die sehr hoch ist.","examples":["Das ist der Hund, der im Park spielt.","Ich sehe die Frau, die dort arbeitet."]},"listening":[["zuerst","first","Zuerst sieht er die Elefanten."],["später","later","Später sieht er eine Giraffe."]]},{"title":"Im Café ☕","story":["Nach der Arbeit trifft sich Mia in einem kleinen Café mit ihrer Freundin. Sie setzt sich ans Fenster und schaut kurz auf die Straße. Das Café ist ruhig und nicht sehr voll. Mia bestellt einen Kaffee und ein Stück Kuchen.","Ihre Freundin nimmt einen Tee und ein Sandwich. Zuerst sprechen sie über die Arbeit, dann über ihre Pläne für das Wochenende. Draußen regnet es, aber im Café ist es warm und gemütlich. Nach einer Weile bringt der Kellner die Rechnung.","Mia bezahlt ihren Teil und gibt etwas Trinkgeld. Danach gehen die beiden langsam nach Hause. Mia mag das Café, weil der Service freundlich ist und sie dort in Ruhe sitzen kann. Sie möchten nächste Woche wiederkommen."],"translation":[["Nach der Arbeit trifft sich Mia in einem kleinen Café mit ihrer Freundin.","After work Mia meets her friend in a small café."],["Sie setzt sich ans Fenster und schaut kurz auf die Straße.","She sits by the window and briefly looks at the street."],["Das Café ist ruhig und nicht sehr voll.","The café is quiet and not very crowded."],["Mia bestellt einen Kaffee und ein Stück Kuchen.","Mia orders a coffee and a piece of cake."],["Ihre Freundin nimmt einen Tee und ein Sandwich.","Her friend has a tea and a sandwich."],["Zuerst sprechen sie über die Arbeit, dann über ihre Pläne für das Wochenende.","First they talk about work, then about their plans for the weekend."],["Draußen regnet es, aber im Café ist es warm und gemütlich.","It is raining outside, but the café is warm and cozy."],["Nach einer Weile bringt der Kellner die Rechnung.","After a while the waiter brings the bill."],["Mia bezahlt ihren Teil und gibt etwas Trinkgeld.","Mia pays her share and leaves a tip."],["Danach gehen die beiden langsam nach Hause.","Afterwards the two slowly go home."],["Mia mag das Café, weil der Service freundlich ist und sie dort in Ruhe sitzen kann.","Mia likes the café because the service is friendly and she can sit there in peace."],["Sie möchten nächste Woche wiederkommen.","They want to come back next week."]],"vocab":[["das Café","café"],["bestellen","to order"],["der Tee","tea"],["das Stück","piece"],["das Fenster","window"],["frei","free, available"],["die Tasche","bag"],["der Laptop","laptop"],["draußen","outside"],["vorbeifahren","to drive past"]],"speaking":[["Mit wem trifft sich Mia im Café?","Sie trifft sich dort mit ihrer Freundin.","She meets her friend there."],["Was bestellt Mia?","Sie bestellt einen Kaffee und ein Stück Kuchen.","She orders a coffee and a piece of cake."],["Worüber sprechen die beiden?","Sie sprechen zuerst über die Arbeit und dann über das Wochenende.","They talk first about work and then about the weekend."],["Wie ist die Stimmung im Café?","Es ist ruhig, warm und gemütlich.","It is quiet, warm, and cozy."],["Warum möchte Mia wiederkommen?","Weil sie das Café und den freundlichen Service mag.","Because she likes the café and the friendly service."]],"wordCount":116,"grammar":{"title":"„möchten“ als höfliche Form","text":"„möchten“ ist eine höfliche Form für Wünsche: Ich möchte einen Tee.","examples":["Ich möchte einen Kaffee, bitte.","Wir möchten zwei Stück Kuchen."]},"listening":[["noch","still, yet","Am Fenster ist noch ein Platz frei."],["draußen","outside","Draußen fahren viele Autos vorbei."]]},{"title":"Lalo hat einen Plan 📝","story":["Lalo möchte am Wochenende etwas Neues lernen. Er sitzt an seinem Schreibtisch und überlegt, was er machen kann. Zuerst schreibt er drei Ziele auf: Deutsch lernen, Sport machen und sein Zimmer aufräumen. Danach macht er einen einfachen Plan.","Am Samstag will er morgens eine Stunde Deutsch lernen. Danach möchte er im Park laufen. Am Nachmittag räumt er sein Zimmer auf und sortiert seine Bücher. Am Sonntag möchte er einen Film auf Deutsch sehen.","Lalo weiß, dass ein Plan nicht immer perfekt funktioniert. Trotzdem hilft er ihm, seine Zeit besser zu nutzen. Am Ende des Wochenendes ist er stolz, weil er viel geschafft hat. Er merkt, dass kleine Schritte oft besser sind als ein großer Plan."],"translation":[["Lalo möchte am Wochenende etwas Neues lernen.","Lalo wants to learn something new on the weekend."],["Er sitzt an seinem Schreibtisch und überlegt, was er machen kann.","He sits at his desk and thinks about what he can do."],["Zuerst schreibt er drei Ziele auf: Deutsch lernen, Sport machen und sein Zimmer aufräumen.","First he writes down three goals: learn German, exercise and tidy his room."],["Danach macht er einen einfachen Plan.","After that he makes a simple plan."],["Am Samstag will er morgens eine Stunde Deutsch lernen.","On Saturday morning he wants to study German for an hour."],["Danach möchte er im Park laufen.","Afterwards he wants to run in the park."],["Am Nachmittag räumt er sein Zimmer auf und sortiert seine Bücher.","In the afternoon he tidies his room and sorts his books."],["Am Sonntag möchte er einen Film auf Deutsch sehen.","On Sunday he wants to watch a film in German."],["Lalo weiß, dass ein Plan nicht immer perfekt funktioniert.","Lalo knows that a plan does not always work perfectly."],["Trotzdem hilft er ihm, seine Zeit besser zu nutzen.","Nevertheless, it helps him use his time better."],["Am Ende des Wochenendes ist er stolz, weil er viel geschafft hat.","At the end of the weekend he is proud because he accomplished a lot."],["Er merkt, dass kleine Schritte oft besser sind als ein großer Plan.","He realizes that small steps are often better than one big plan."]],"vocab":[["die Aufgabe","task"],["aufräumen","to tidy up"],["die Hausaufgabe","homework"],["die Liste","list"],["der Bäcker","baker"],["zuerst","first"],["dann","then"],["danach","afterwards"],["fertig","finished"],["funktionieren","to work, function"]],"speaking":[["Warum macht Lalo einen Plan für das Wochenende?","Weil er seine Zeit besser nutzen und mehrere Dinge schaffen möchte.","Because he wants to use his time better and get several things done."],["Welche drei Ziele schreibt er auf?","Deutsch lernen, Sport machen und sein Zimmer aufräumen.","Learning German, exercising, and tidying his room."],["Was macht Lalo am Samstagmorgen?","Er lernt eine Stunde Deutsch.","He studies German for an hour."],["Was macht er am Sonntag?","Er möchte einen Film auf Deutsch sehen.","He wants to watch a film in German."],["Wie fühlt sich Lalo am Ende?","Er ist stolz, weil er viel geschafft hat.","He is proud because he accomplished a lot."]],"wordCount":115,"grammar":{"title":"Nebensatz mit „weil“","text":"Nach „weil“ steht das Verb am Ende: weil sein Plan funktioniert hat.","examples":["Lalo ist zufrieden, weil sein Plan funktioniert hat.","Ich bleibe zu Hause, weil ich lernen muss."]},"listening":[["zuerst","first","Zuerst schreibt er eine Liste."],["fertig","finished","Am Abend sind alle Aufgaben fertig."]]},{"title":"Lalo in der Bibliothek 📚","story":["Lalo geht am Nachmittag in die Bibliothek, weil er für einen Deutschkurs lernen muss. Er nimmt seinen Rucksack und bringt ein Heft, einen Stift und ein Wörterbuch mit. In der Bibliothek ist es sehr ruhig. Lalo findet einen freien Tisch am Fenster und setzt sich hin.","Zuerst liest er einen kurzen Text. Dann markiert er neue Wörter und schreibt ihre Bedeutung in sein Heft. Danach macht er einige Übungen und kontrolliert seine Antworten. Nach einer Stunde braucht er eine kurze Pause.","Er geht nach draußen, trinkt Wasser und kommt wieder zurück. Später liest er noch ein Kapitel. Bevor er nach Hause geht, leiht er ein einfaches Buch aus. Lalo ist zufrieden, weil er heute viel gelernt hat."],"translation":[["Lalo geht am Nachmittag in die Bibliothek, weil er für einen Deutschkurs lernen muss.","In the afternoon Lalo goes to the library because he needs to study for a German course."],["Er nimmt seinen Rucksack und bringt ein Heft, einen Stift und ein Wörterbuch mit.","He takes his backpack and brings a notebook, a pen and a dictionary."],["In der Bibliothek ist es sehr ruhig.","The library is very quiet."],["Lalo findet einen freien Tisch am Fenster und setzt sich hin.","Lalo finds a free table by the window and sits down."],["Zuerst liest er einen kurzen Text.","First he reads a short text."],["Dann markiert er neue Wörter und schreibt ihre Bedeutung in sein Heft.","Then he marks new words and writes their meaning in his notebook."],["Danach macht er einige Übungen und kontrolliert seine Antworten.","Afterwards he does some exercises and checks his answers."],["Nach einer Stunde braucht er eine kurze Pause.","After an hour he needs a short break."],["Er geht nach draußen, trinkt Wasser und kommt wieder zurück.","He goes outside, drinks water and comes back."],["Später liest er noch ein Kapitel.","Later he reads another chapter."],["Bevor er nach Hause geht, leiht er ein einfaches Buch aus.","Before he goes home, he borrows a simple book."],["Lalo ist zufrieden, weil er heute viel gelernt hat.","Lalo is satisfied because he learned a lot today."]],"vocab":[["die Bibliothek","library"],["der Deutschkurs","German course"],["das Regal","shelf"],["die Bibliothekarin","librarian"],["der Platz","place, seat"],["die Seite","page"],["das Heft","notebook"],["ausleihen","to borrow"],["zurückbringen","to return"],["ruhig","quiet"]],"speaking":[["Warum geht Lalo in die Bibliothek?","Weil er für seinen Deutschkurs lernen muss.","Because he needs to study for his German course."],["Was bringt Lalo mit?","Er bringt ein Heft, einen Stift und ein Wörterbuch mit.","He brings a notebook, a pen, and a dictionary."],["Was macht er mit den neuen Wörtern?","Er markiert sie und schreibt ihre Bedeutung in sein Heft.","He marks them and writes their meaning in his notebook."],["Was macht Lalo in seiner Pause?","Er geht nach draußen und trinkt Wasser.","He goes outside and drinks water."],["Was leiht Lalo am Ende aus?","Er leiht ein einfaches Buch aus.","He borrows a simple book."]],"wordCount":117,"grammar":{"title":"„bevor“ + Verb am Ende","text":"„bevor“ verbindet zwei Handlungen. Im Nebensatz steht das Verb am Ende.","examples":["Bevor ich schlafe, lese ich.","Bevor er nach Hause geht, leiht er das Buch aus."]},"listening":[["deshalb","therefore","Deshalb geht er in die Bibliothek."],["zurückbringen","to return","Er muss es zurückbringen."]]},{"title":"Auf dem Markt 🍎","story":["Am Samstagmorgen geht Sara auf den Markt. Dort gibt es viele Stände mit frischem Obst, Gemüse, Brot und Käse. Zuerst kauft sie Tomaten und Gurken für einen Salat. Danach sieht sie einen Stand mit frischen Erdbeeren.","Die Erdbeeren sehen lecker aus, deshalb nimmt sie eine kleine Schachtel. Nebenan verkauft ein Mann frisches Brot. Sara kauft ein warmes Brötchen und isst es sofort. Danach sucht sie noch Käse für das Abendessen.","Der Markt ist voll, aber die Menschen sind freundlich. Sara bezahlt ihre Einkäufe und trägt die Tasche vorsichtig nach Hause. Auf dem Weg denkt sie an das Abendessen. Sie freut sich, weil sie viele frische Sachen gekauft hat und heute einfach kochen kann."],"translation":[["Am Samstagmorgen geht Sara auf den Markt.","On Saturday morning Sara goes to the market."],["Dort gibt es viele Stände mit frischem Obst, Gemüse, Brot und Käse.","There are many stalls with fresh fruit, vegetables, bread and cheese."],["Zuerst kauft sie Tomaten und Gurken für einen Salat.","First she buys tomatoes and cucumbers for a salad."],["Danach sieht sie einen Stand mit frischen Erdbeeren.","Then she sees a stall with fresh strawberries."],["Die Erdbeeren sehen lecker aus, deshalb nimmt sie eine kleine Schachtel.","The strawberries look delicious, so she takes a small box."],["Nebenan verkauft ein Mann frisches Brot.","A man sells fresh bread next door."],["Sara kauft ein warmes Brötchen und isst es sofort.","Sara buys a warm bread roll and eats it immediately."],["Danach sucht sie noch Käse für das Abendessen.","Afterwards she also looks for cheese for dinner."],["Der Markt ist voll, aber die Menschen sind freundlich.","The market is crowded, but the people are friendly."],["Sara bezahlt ihre Einkäufe und trägt die Tasche vorsichtig nach Hause.","Sara pays for her groceries and carefully carries the bag home."],["Auf dem Weg denkt sie an das Abendessen.","On the way she thinks about dinner."],["Sie freut sich, weil sie viele frische Sachen gekauft hat und heute einfach kochen kann.","She is happy because she bought many fresh things and can cook easily today."]],"vocab":[["der Markt","market"],["die Kartoffel","potato"],["das Obst","fruit"],["der Stand","stall"],["die Erdbeere","strawberry"],["der Verkäufer","seller"],["bar bezahlen","to pay cash"],["das Kilo","kilo"],["die Tasche","bag"],["das Wochenende","weekend"]],"speaking":[["Warum geht Sara am Samstagmorgen auf den Markt?","Sie möchte frische Lebensmittel für das Wochenende kaufen.","She wants to buy fresh food for the weekend."],["Was kauft sie für einen Salat?","Sie kauft Tomaten und Gurken.","She buys tomatoes and cucumbers."],["Warum nimmt Sara die Erdbeeren?","Weil sie lecker aussehen.","Because they look delicious."],["Wie bezahlt Sara ihre Einkäufe?","Sie bezahlt bar.","She pays in cash."],["Warum freut sie sich zu Hause?","Weil sie viele frische Sachen gekauft hat und kochen kann.","Because she bought many fresh things and can cook."]],"wordCount":113,"grammar":{"title":"Akkusativ nach „für“","text":"Die Präposition „für“ steht mit dem Akkusativ: für das Wochenende.","examples":["Das Geschenk ist für meinen Bruder.","Wir kaufen Essen für das Wochenende."]},"listening":[["noch","also, still","Danach kauft sie noch Brot."],["frisch","fresh","frisches Obst"]]},{"title":"Beim Arzt 🩺","story":["Seit zwei Tagen fühlt sich Ben nicht gut. Er hat Kopfschmerzen, ist müde und hat etwas Fieber. Deshalb geht er am Morgen zum Arzt. Im Wartezimmer sitzen schon einige Menschen.","Nach kurzer Zeit wird Ben aufgerufen. Der Arzt fragt nach seinen Beschwerden und untersucht ihn. Er hört Bens Lunge ab und misst seine Temperatur. Zum Glück ist es nur eine starke Erkältung. Der Arzt empfiehlt viel Wasser, Ruhe und genug Schlaf.","Ben soll auch zu Hause bleiben und sich erholen. Danach geht er in die Apotheke und kauft die notwendigen Medikamente. Am Nachmittag liegt er im Bett und liest ein Buch. Ben hofft, dass es ihm bald besser geht. Er weiß jetzt, dass Ruhe wichtig ist."],"translation":[["Seit zwei Tagen fühlt sich Ben nicht gut.","Ben has not been feeling well for two days."],["Er hat Kopfschmerzen, ist müde und hat etwas Fieber.","He has a headache, is tired and has a slight fever."],["Deshalb geht er am Morgen zum Arzt.","Therefore he goes to the doctor in the morning."],["Im Wartezimmer sitzen schon einige Menschen.","Some people are already sitting in the waiting room."],["Nach kurzer Zeit wird Ben aufgerufen.","After a short time Ben is called in."],["Der Arzt fragt nach seinen Beschwerden und untersucht ihn.","The doctor asks about his symptoms and examines him."],["Er hört Bens Lunge ab und misst seine Temperatur.","He listens to Ben's lungs and measures his temperature."],["Zum Glück ist es nur eine starke Erkältung.","Luckily it is only a bad cold."],["Der Arzt empfiehlt viel Wasser, Ruhe und genug Schlaf.","The doctor recommends plenty of water, rest and enough sleep."],["Ben soll auch zu Hause bleiben und sich erholen.","Ben should also stay at home and recover."],["Danach geht er in die Apotheke und kauft die notwendigen Medikamente.","Afterwards he goes to the pharmacy and buys the necessary medicine."],["Am Nachmittag liegt er im Bett und liest ein Buch.","In the afternoon he lies in bed and reads a book."],["Ben hofft, dass es ihm bald besser geht.","Ben hopes that he will feel better soon."],["Er weiß jetzt, dass Ruhe wichtig ist.","He now knows that rest is important."]],"vocab":[["der Kopfschmerz","headache"],["müde","tired"],["der Arzt","doctor"],["das Wartezimmer","waiting room"],["die Reihe","turn"],["untersuchen","to examine"],["der Rat","advice"],["sollen","should"],["sich ausruhen","to rest"],["schlafen","to sleep"]],"speaking":[["Warum geht Ben zum Arzt?","Weil er Kopfschmerzen, Müdigkeit und etwas Fieber hat.","Because he has a headache, feels tired, and has a slight fever."],["Was macht der Arzt bei der Untersuchung?","Er hört Bens Lunge ab und misst seine Temperatur.","He listens to Ben’s lungs and measures his temperature."],["Was empfiehlt der Arzt Ben?","Er empfiehlt viel Wasser, Ruhe und genug Schlaf.","He recommends plenty of water, rest, and enough sleep."],["Was macht Ben nach dem Arztbesuch?","Er geht in die Apotheke und kauft die nötigen Medikamente.","He goes to the pharmacy and buys the necessary medicine."],["Was hat Ben am Ende verstanden?","Er hat verstanden, dass Ruhe wichtig ist.","He has understood that rest is important."]],"wordCount":116,"grammar":{"title":"Modalverb „sollen“","text":"„sollen“ zeigt einen Rat oder eine Empfehlung: Du sollst Wasser trinken.","examples":["Du sollst heute zu Hause bleiben.","Er soll viel Wasser trinken."]},"listening":[["schon","already","Im Wartezimmer sitzen schon Menschen."],["an die Reihe kommen","to get one’s turn","Tom kommt an die Reihe."]]},{"title":"Im Bus 🚌","story":["Jeden Morgen fährt Nina mit dem Bus zur Arbeit. Heute ist die Bushaltestelle besonders voll, weil viele Menschen zur Arbeit müssen. Nina wartet geduldig und kontrolliert noch einmal die Uhr. Endlich kommt der Bus.","Die Türen öffnen sich und alle steigen schnell ein. Nina findet einen freien Platz am Fenster. Während der Fahrt schaut sie auf die Straßen und Häuser. Nach zehn Minuten muss der Bus plötzlich anhalten, weil ein Auto vor ihm steht.","Einige Fahrgäste sind ungeduldig, aber Nina bleibt ruhig. Kurz danach fährt der Bus weiter. An ihrer Haltestelle steigt sie aus und geht zu Fuß zum Büro. Sie kommt pünktlich an. Nina mag den Bus, weil sie während der Fahrt lesen oder Musik hören kann."],"translation":[["Jeden Morgen fährt Nina mit dem Bus zur Arbeit.","Every morning Nina takes the bus to work."],["Heute ist die Bushaltestelle besonders voll, weil viele Menschen zur Arbeit müssen.","Today the bus stop is especially crowded because many people have to go to work."],["Nina wartet geduldig und kontrolliert noch einmal die Uhr.","Nina waits patiently and checks the time again."],["Endlich kommt der Bus.","Finally the bus arrives."],["Die Türen öffnen sich und alle steigen schnell ein.","The doors open and everyone gets on quickly."],["Nina findet einen freien Platz am Fenster.","Nina finds a free seat by the window."],["Während der Fahrt schaut sie auf die Straßen und Häuser.","During the ride she looks at the streets and houses."],["Nach zehn Minuten muss der Bus plötzlich anhalten, weil ein Auto vor ihm steht.","After ten minutes the bus suddenly has to stop because a car is in front of it."],["Einige Fahrgäste sind ungeduldig, aber Nina bleibt ruhig.","Some passengers are impatient, but Nina stays calm."],["Kurz danach fährt der Bus weiter.","Shortly afterwards the bus continues."],["An ihrer Haltestelle steigt sie aus und geht zu Fuß zum Büro.","At her stop she gets off and walks to the office."],["Sie kommt pünktlich an.","She arrives on time."],["Nina mag den Bus, weil sie während der Fahrt lesen oder Musik hören kann.","Nina likes the bus because she can read or listen to music during the ride."]],"vocab":[["die Haltestelle","bus stop"],["pünktlich","on time"],["einsteigen","to get on"],["aussteigen","to get off"],["der Platz","seat, place"],["die Tasche","bag"],["die Station","station, stop"],["mehrere","several"],["aus dem Fenster schauen","to look out the window"],["fahren","to travel, drive"]],"speaking":[["Warum ist die Bushaltestelle heute so voll?","Weil viele Menschen zur Arbeit müssen.","Because many people have to go to work."],["Wo findet Nina im Bus einen Platz?","Sie findet einen freien Platz am Fenster.","She finds a free seat by the window."],["Warum muss der Bus plötzlich anhalten?","Weil ein Auto vor ihm steht.","Because a car is in front of it."],["Wie reagiert Nina auf die Verzögerung?","Sie bleibt ruhig und wartet, bis der Bus weiterfährt.","She stays calm and waits until the bus continues."],["Warum fährt Nina gern mit dem Bus?","Weil sie unterwegs lesen oder Musik hören kann.","Because she can read or listen to music on the way."]],"wordCount":118,"grammar":{"title":"Trennbare Verben: einsteigen / aussteigen","text":"Bei trennbaren Verben steht der Präfix im Hauptsatz am Ende: Nina steigt ein.","examples":["Wir steigen am Bahnhof aus.","Steig bitte schnell ein."]},"listening":[["pünktlich","on time","Der Bus kommt pünktlich."],["mehrere","several","Mehrere Personen steigen aus."]]},{"title":"Zu Hause 🏠","story":["Nach einem langen Arbeitstag kommt Daniel nach Hause. Er stellt seine Tasche im Flur ab und zieht seine Schuhe aus. Danach geht er in die Küche und bereitet schnell etwas zu essen vor.","Er macht Nudeln mit Gemüse und trinkt ein Glas Wasser. Während das Essen kocht, räumt er die Küche ein wenig auf. Später setzt er sich ins Wohnzimmer und ruht sich aus. Er liest Nachrichten auf seinem Handy, aber er möchte nicht zu lange am Bildschirm bleiben.","Deshalb legt er das Handy weg und liest stattdessen ein Buch. Gegen zehn Uhr duscht Daniel und macht sich für die Nacht fertig. Bevor er ins Bett geht, stellt er den Wecker für den nächsten Morgen. Er ist müde, aber zufrieden."],"translation":[["Nach einem langen Arbeitstag kommt Daniel nach Hause.","After a long workday Daniel comes home."],["Er stellt seine Tasche im Flur ab und zieht seine Schuhe aus.","He puts his bag down in the hallway and takes off his shoes."],["Danach geht er in die Küche und bereitet schnell etwas zu essen vor.","Then he goes to the kitchen and quickly prepares something to eat."],["Er macht Nudeln mit Gemüse und trinkt ein Glas Wasser.","He makes pasta with vegetables and drinks a glass of water."],["Während das Essen kocht, räumt er die Küche ein wenig auf.","While the food is cooking, he tidies the kitchen a little."],["Später setzt er sich ins Wohnzimmer und ruht sich aus.","Later he sits in the living room and rests."],["Er liest Nachrichten auf seinem Handy, aber er möchte nicht zu lange am Bildschirm bleiben.","He reads news on his phone, but he does not want to stay on the screen for too long."],["Deshalb legt er das Handy weg und liest stattdessen ein Buch.","Therefore he puts the phone away and reads a book instead."],["Gegen zehn Uhr duscht Daniel und macht sich für die Nacht fertig.","Around ten o'clock Daniel showers and gets ready for the night."],["Bevor er ins Bett geht, stellt er den Wecker für den nächsten Morgen.","Before he goes to bed, he sets the alarm for the next morning."],["Er ist müde, aber zufrieden.","He is tired but satisfied."]],"vocab":[["zu Hause","at home"],["aufhängen","to hang up"],["die Tür","door"],["sich waschen","to wash oneself"],["die Küche","kitchen"],["der Salat","salad"],["den Tisch decken","to set the table"],["der Teller","plate"],["wegräumen","to put away"],["helfen","to help"]],"speaking":[["Was macht Daniel, wenn er nach Hause kommt?","Er stellt seine Tasche ab und zieht seine Schuhe aus.","He puts down his bag and takes off his shoes."],["Was kocht Daniel zum Abendessen?","Er macht Nudeln mit Gemüse.","He makes pasta with vegetables."],["Was macht er später im Wohnzimmer?","Er ruht sich aus und liest Nachrichten.","He relaxes and reads the news."],["Warum legt Daniel sein Handy weg?","Weil er nicht zu lange am Bildschirm bleiben möchte.","Because he does not want to spend too long on a screen."],["Was macht Daniel vor dem Schlafengehen?","Er duscht, macht sich fertig und stellt den Wecker.","He showers, gets ready for bed, and sets the alarm."]],"wordCount":120,"grammar":{"title":"Akkusativ: „den Teller“","text":"Das direkte Objekt steht im Akkusativ: Ben räumt den Teller weg.","examples":["Ich wasche die Hände.","Sie räumt den Teller weg."]},"listening":[["zusammen","together","Die Familie isst zusammen."],["später","later","Später duscht er."]]},{"title":"Deutschland und seine Nachbarn 🇩🇪","story":["Deutschland ist ein Land in Europa. Es liegt in der Mitte von Europa. Deutschland hat neun Nachbarländer. Die Nachbarn sind im Norden, Osten, Süden und Westen. Im Norden liegt Dänemark und die Nordsee. Im Osten liegen Polen und Tschechien. Im Süden liegen Österreich und die Schweiz. Im Westen liegen Frankreich, Luxemburg, Belgien und die Niederlande.","Die Menschen reisen gern. Sie fahren in den Norden an die Nordsee. Sie fahren in den Süden in die Berge. Sie fahren in den Westen nach Frankreich oder in den Osten nach Polen. Deutschland ist ein wichtiges Land. Die Hauptstadt ist Berlin. Berlin liegt im Osten. Viele Touristen kommen nach Deutschland.","Sie besuchen die Städte und die Natur. Deutschland hat viele Flüsse und Wälder. Die Nachbarn sind freundlich. Die Länder arbeiten zusammen. Sie helfen sich in Krisen. Das ist gut für Europa. Deutschland mag seine Nachbarn, und die Nachbarn mögen Deutschland."],"translation":[["Deutschland ist ein Land in Europa. Es liegt in der Mitte von Europa. Deutschland hat neun Nachbarländer.","Germany is a country in Europe. It lies in the middle of Europe. Germany has nine neighboring countries."],["Die Nachbarn sind im Norden, Osten, Süden und Westen. Im Norden liegt Dänemark und die Nordsee. Im Osten liegen Polen und Tschechien.","The neighbors are in the north, east, south and west. In the north are Denmark and the North Sea. In the east are Poland and the Czech Republic."],["Im Süden liegen Österreich und die Schweiz. Im Westen liegen Frankreich, Luxemburg, Belgien und die Niederlande.","In the south are Austria and Switzerland. In the west are France, Luxembourg, Belgium and the Netherlands."],["Die Menschen reisen gern. Sie fahren in den Norden an die Nordsee. Sie fahren in den Süden in die Berge.","People like to travel. They go north to the North Sea. They go south to the mountains."],["Sie fahren in den Westen nach Frankreich oder in den Osten nach Polen. Deutschland ist ein wichtiges Land.","They go west to France or east to Poland. Germany is an important country."],["Die Hauptstadt ist Berlin. Berlin liegt im Osten. Viele Touristen kommen nach Deutschland.","The capital is Berlin. Berlin lies in the east. Many tourists come to Germany."],["Sie besuchen die Städte und die Natur. Deutschland hat viele Flüsse und Wälder.","They visit the cities and nature. Germany has many rivers and forests."],["Die Nachbarn sind freundlich. Die Länder arbeiten zusammen. Sie helfen sich in Krisen.","The neighbors are friendly. The countries work together. They help each other in crises."],["Das ist gut für Europa. Deutschland mag seine Nachbarn, und die Nachbarn mögen Deutschland.","That is good for Europe. Germany likes its neighbors, and the neighbors like Germany."]],"vocab":[["das Land","country"],["der Nachbar","neighbor"],["der Norden","north"],["der Osten","east"],["der Süden","south"],["der Westen","west"],["die Hauptstadt","capital"],["der Tourist","tourist"],["der Wald","forest"],["zusammen","together"]],"speaking":[["Wie viele Nachbarländer hat Deutschland?","Deutschland hat neun Nachbarländer.","Germany has nine neighboring countries."],["Welches Land liegt im Norden von Deutschland?","Im Norden liegt Dänemark.","Denmark is in the north."],["Wo liegt Berlin?","Berlin liegt im Osten von Deutschland.","Berlin is in the east of Germany."],["Welche Länder liegen im Süden?","Im Süden liegen Österreich und die Schweiz.","Austria and Switzerland are in the south."],["Was machen die Länder zusammen?","Sie arbeiten zusammen und helfen sich in Krisen.","They work together and help each other in crises."]],"wordCount":198,"grammar":null,"listening":[]},{"title":"Über mich 👨","story":["Hallo! Ich heiße Thomas. Ich bin 30 Jahre alt. Ich wohne in Hamburg. Hamburg ist eine große Stadt im Norden von Deutschland. Ich bin verheiratet. Meine Frau heißt Julia. Wir haben keine Kinder. Ich arbeite in einem Büro. Ich bin Bürokaufmann.","Mein Tag beginnt früh. Ich stehe um 6 Uhr auf. Ich dusche und putze meine Zähne. Dann frühstücke ich. Ich esse Müsli mit Milch und trinke Kaffee. Um 7 Uhr gehe ich aus dem Haus. Ich fahre mit dem Bus zur Arbeit.","Die Fahrt dauert 30 Minuten. Um 8 Uhr beginne ich zu arbeiten. Ich arbeite am Computer und schreibe E-Mails. Um 12 Uhr mache ich Mittagspause. Ich esse in der Kantine. Das Essen ist gut. Um 17 Uhr ist Feierabend. Ich fahre nach Hause.","Zu Hause koche ich Abendessen. Julia kommt um 18 Uhr nach Hause. Wir essen zusammen und reden über den Tag. Wir hören Musik oder sehen fern. Manchmal lesen wir ein Buch. Ich lese gern Krimis. Um 21 Uhr dusche ich. Um 22 Uhr gehe ich ins Bett. Ich schlafe gut.","Am Wochenende stehe ich später auf. Ich treffe Freunde oder mache Ausflüge. Das ist mein Leben. Ich mag mein Leben in Hamburg."],"translation":[["Hallo! Ich heiße Thomas. Ich bin 30 Jahre alt. Ich wohne in Hamburg. Hamburg ist eine große Stadt im Norden von Deutschland.","Hello! My name is Thomas. I am 30 years old. I live in Hamburg. Hamburg is a big city in the north of Germany."],["Ich bin verheiratet. Meine Frau heißt Julia. Wir haben keine Kinder. Ich arbeite in einem Büro. Ich bin Bürokaufmann.","I am married. My wife is called Julia. We have no children. I work in an office. I am an office clerk."],["Mein Tag beginnt früh. Ich stehe um 6 Uhr auf. Ich dusche und putze meine Zähne. Dann frühstücke ich.","My day starts early. I get up at 6 o'clock. I shower and brush my teeth. Then I have breakfast."],["Ich esse Müsli mit Milch und trinke Kaffee. Um 7 Uhr gehe ich aus dem Haus. Ich fahre mit dem Bus zur Arbeit.","I eat muesli with milk and drink coffee. At 7 o'clock I leave the house. I go to work by bus."],["Die Fahrt dauert 30 Minuten. Um 8 Uhr beginne ich zu arbeiten. Ich arbeite am Computer und schreibe E-Mails.","The journey takes 30 minutes. At 8 o'clock I start working. I work on the computer and write emails."],["Um 12 Uhr mache ich Mittagspause. Ich esse in der Kantine. Das Essen ist gut. Um 17 Uhr ist Feierabend. Ich fahre nach Hause.","At 12 o'clock I have a lunch break. I eat in the canteen. The food is good. At 5 pm the workday ends. I go home."],["Zu Hause koche ich Abendessen. Julia kommt um 18 Uhr nach Hause. Wir essen zusammen und reden über den Tag.","At home I cook dinner. Julia comes home at 6 pm. We eat together and talk about the day."],["Wir hören Musik oder sehen fern. Manchmal lesen wir ein Buch. Ich lese gern Krimis.","We listen to music or watch TV. Sometimes we read a book. I like to read crime novels."],["Um 21 Uhr dusche ich. Um 22 Uhr gehe ich ins Bett. Ich schlafe gut. Am Wochenende stehe ich später auf.","At 9 pm I shower. At 10 pm I go to bed. I sleep well. On the weekend I get up later."],["Ich treffe Freunde oder mache Ausflüge. Das ist mein Leben. Ich mag mein Leben in Hamburg.","I meet friends or go on excursions. That is my life. I like my life in Hamburg."]],"vocab":[["das Büro","office"],["aufstehen","to get up"],["duschen","to shower"],["frühstücken","to have breakfast"],["der Bus","bus"],["die Mittagspause","lunch break"],["die Kantine","canteen"],["der Feierabend","end of working day"],["das Wochenende","weekend"],["der Ausflug","excursion"]],"speaking":[["Wie heißt der Mann und wo wohnt er?","Er heißt Thomas und wohnt in Hamburg.","His name is Thomas and he lives in Hamburg."],["Wann steht Thomas auf?","Er steht um 6 Uhr auf.","He gets up at 6 o'clock."],["Wie fährt Thomas zur Arbeit?","Er fährt mit dem Bus zur Arbeit.","He goes to work by bus."],["Was macht Thomas um 12 Uhr?","Er macht Mittagspause und isst in der Kantine.","He has a lunch break and eats in the canteen."],["Was macht Thomas am Wochenende?","Er steht später auf, trifft Freunde oder macht Ausflüge.","He gets up later, meets friends, or goes on excursions."]],"wordCount":196,"grammar":null,"listening":[]},{"title":"Am Samstag in Berlin 🏙️","story":["Heute ist Samstag. Ich bin in Berlin. Berlin ist die Hauptstadt von Deutschland. Ich besuche meine Freundin Lisa. Lisa wohnt in Berlin. Sie ist Studentin. Ich fahre mit dem Zug nach Berlin. Die Fahrt ist lang, aber ich lese ein Buch.","Um 10 Uhr komme ich an. Lisa wartet am Bahnhof. Sie ist sehr nett. Wir gehen in ein Café. Wir trinken Kaffee und essen Kuchen. Der Kuchen ist lecker. Wir reden über unsere Familien und unsere Arbeit. Lisa studiert Medizin. Das ist schwer.","Dann gehen wir zum Brandenburger Tor. Das Tor ist berühmt. Viele Touristen machen Fotos. Wir machen auch Fotos. Lisa zeigt mir die Stadt. Wir sehen den Reichstag und die Spree. Die Spree ist ein Fluss. Wir gehen über eine Brücke.","Die Stadt ist schön, aber voll. Mittags essen wir in einem Restaurant. Ich esse Currywurst mit Pommes. Das ist typisch Berlin! Lisa isst einen Salat. Wir trinken Wasser. Am Nachmittag gehen wir in ein Museum. Das Museum ist interessant.","Ich sehe Bilder und Statuen. Lisa erklärt mir viel. Um 17 Uhr gehen wir in einen Park. Der Park ist grün und ruhig. Wir setzen uns auf eine Bank. Die Sonne scheint. Es ist warm. Am Abend fahre ich zurück. Ich bin müde, aber glücklich. Berlin ist toll. Ich möchte wiederkommen."],"translation":[["Heute ist Samstag. Ich bin in Berlin. Berlin ist die Hauptstadt von Deutschland. Ich besuche meine Freundin Lisa.","Today is Saturday. I am in Berlin. Berlin is the capital of Germany. I visit my friend Lisa."],["Lisa wohnt in Berlin. Sie ist Studentin. Ich fahre mit dem Zug nach Berlin. Die Fahrt ist lang, aber ich lese ein Buch.","Lisa lives in Berlin. She is a student. I travel to Berlin by train. The journey is long, but I read a book."],["Um 10 Uhr komme ich an. Lisa wartet am Bahnhof. Sie ist sehr nett. Wir gehen in ein Café. Wir trinken Kaffee und essen Kuchen.","At 10 o'clock I arrive. Lisa waits at the train station. She is very nice. We go to a café. We drink coffee and eat cake."],["Der Kuchen ist lecker. Wir reden über unsere Familien und unsere Arbeit. Lisa studiert Medizin. Das ist schwer.","The cake is delicious. We talk about our families and our work. Lisa studies medicine. That is difficult."],["Dann gehen wir zum Brandenburger Tor. Das Tor ist berühmt. Viele Touristen machen Fotos. Wir machen auch Fotos.","Then we go to the Brandenburg Gate. The gate is famous. Many tourists take photos. We also take photos."],["Lisa zeigt mir die Stadt. Wir sehen den Reichstag und die Spree. Die Spree ist ein Fluss. Wir gehen über eine Brücke.","Lisa shows me the city. We see the Reichstag and the Spree. The Spree is a river. We walk over a bridge."],["Die Stadt ist schön, aber voll. Mittags essen wir in einem Restaurant. Ich esse Currywurst mit Pommes. Das ist typisch Berlin!","The city is beautiful but crowded. At noon we eat in a restaurant. I eat currywurst with fries. That is typical Berlin!"],["Lisa isst einen Salat. Wir trinken Wasser. Am Nachmittag gehen wir in ein Museum. Das Museum ist interessant.","Lisa eats a salad. We drink water. In the afternoon we go to a museum. The museum is interesting."],["Ich sehe Bilder und Statuen. Lisa erklärt mir viel. Um 17 Uhr gehen wir in einen Park. Der Park ist grün und ruhig.","I see paintings and statues. Lisa explains a lot to me. At 5 pm we go to a park. The park is green and quiet."],["Wir setzen uns auf eine Bank. Die Sonne scheint. Es ist warm. Am Abend fahre ich zurück. Ich bin müde, aber glücklich.","We sit on a bench. The sun is shining. It is warm. In the evening I go back. I am tired but happy."],["Berlin ist toll. Ich möchte wiederkommen.","Berlin is great. I would like to come again."]],"vocab":[["der Samstag","Saturday"],["der Zug","train"],["der Bahnhof","train station"],["der Kuchen","cake"],["berühmt","famous"],["der Fluss","river"],["die Brücke","bridge"],["das Museum","museum"],["die Bank","bench"],["wiederkommen","to come again"]],"speaking":[["Wen besucht der Erzähler in Berlin?","Er besucht seine Freundin Lisa.","He visits his friend Lisa."],["Womit fährt er nach Berlin?","Er fährt mit dem Zug.","He travels by train."],["Was sehen sie am Vormittag?","Sie sehen das Brandenburger Tor, den Reichstag und die Spree.","They see the Brandenburg Gate, the Reichstag and the Spree."],["Was isst er zu Mittag?","Er isst Currywurst mit Pommes.","He eats currywurst with fries."],["Wie findet er Berlin?","Er findet Berlin toll und möchte wiederkommen.","He thinks Berlin is great and wants to come again."]],"wordCount":197,"grammar":null,"listening":[]},{"title":"Im Supermarkt 🛒","story":["Anna geht heute in den Supermarkt. Sie braucht Essen für die Woche. Sie nimmt einen Einkaufswagen und geht durch die Gänge. Zuerst kauft sie Obst: Äpfel, Bananen und Orangen. Dann geht sie zur Gemüseabteilung. Sie nimmt Tomaten, Gurken und Salat. Anna mag frisches Gemüse. Jetzt geht sie zur Milchtheke. Sie kauft Milch, Joghurt und Käse. Ihr Bruder mag Käse sehr gerne. Danach kauft sie Brot und Brötchen. Die Bäckerei riecht gut. Anna kauft auch Nudeln, Reis und Soße. Sie braucht noch Fleisch für das Abendessen. Sie nimmt Hähnchen und Wurst. An der Kasse wartet Anna. Die Schlange ist lang. Sie stellt alles auf das Band. Die Kassiererin scannt die Produkte. Anna bezahlt mit Bargeld. Sie packt alles in Tüten. Der Einkauf kostet 45 Euro. Anna ist zufrieden. Sie geht nach Hause. Heute kocht sie ein leckeres Abendessen für ihre Familie. Morgen kommt ihre Mutter zu Besuch."],"translation":[["Anna geht heute in den Supermarkt.","Anna goes to the supermarket today."],["Sie braucht Essen für die Woche.","She needs food for the week."],["Sie nimmt einen Einkaufswagen und geht durch die Gänge.","She takes a shopping cart and walks through the aisles."],["Zuerst kauft sie Obst: Äpfel, Bananen und Orangen.","First she buys fruit: apples, bananas and oranges."],["Dann geht sie zur Gemüseabteilung.","Then she goes to the vegetable section."],["Sie nimmt Tomaten, Gurken und Salat.","She takes tomatoes, cucumbers and lettuce."],["Anna mag frisches Gemüse.","Anna likes fresh vegetables."],["Jetzt geht sie zur Milchtheke.","Now she goes to the dairy counter."],["Sie kauft Milch, Joghurt und Käse.","She buys milk, yogurt and cheese."],["Ihr Bruder mag Käse sehr gerne.","Her brother really likes cheese."],["Danach kauft sie Brot und Brötchen.","Afterwards she buys bread and rolls."],["Die Bäckerei riecht gut.","The bakery smells good."],["Anna kauft auch Nudeln, Reis und Soße.","Anna also buys pasta, rice and sauce."],["Sie braucht noch Fleisch für das Abendessen.","She still needs meat for dinner."],["Sie nimmt Hähnchen und Wurst.","She takes chicken and sausage."],["An der Kasse wartet Anna.","Anna waits at the checkout."],["Die Schlange ist lang.","The line is long."],["Sie stellt alles auf das Band.","She puts everything on the conveyor belt."],["Die Kassiererin scannt die Produkte.","The cashier scans the products."],["Anna bezahlt mit Bargeld.","Anna pays with cash."],["Sie packt alles in Tüten.","She packs everything into bags."],["Der Einkauf kostet 45 Euro.","The shopping costs 45 euros."],["Anna ist zufrieden.","Anna is satisfied."],["Sie geht nach Hause.","She goes home."],["Heute kocht sie ein leckeres Abendessen für ihre Familie.","Today she cooks a delicious dinner for her family."],["Morgen kommt ihre Mutter zu Besuch.","Tomorrow her mother is coming to visit."]],"vocab":[["der Supermarkt","supermarket"],["der Einkaufswagen","shopping cart"],["der Gang","aisle"],["das Obst","fruit"],["die Gemüseabteilung","vegetable section"],["die Milchtheke","dairy counter"],["die Bäckerei","bakery"],["das Abendessen","dinner"],["die Kasse","checkout"],["die Kassiererin","cashier"],["das Bargeld","cash"],["die Tüte","bag"],["kosten","to cost"],["zufrieden","satisfied"],["brauchen","to need"],["kaufen","to buy"],["bezahlen","to pay"],["scannen","to scan"],["packen","to pack"]],"speaking":[["Wohin geht Anna heute?","Anna geht heute in den Supermarkt.","Anna goes to the supermarket today."],["Was kauft Anna zuerst?","Zuerst kauft sie Obst: Äpfel, Bananen und Orangen.","First she buys fruit: apples, bananas and oranges."],["Was kauft sie bei der Milchtheke?","Sie kauft Milch, Joghurt und Käse.","She buys milk, yogurt and cheese."],["Was macht Anna an der Kasse?","Sie stellt alles auf das Band und bezahlt mit Bargeld.","She puts everything on the conveyor belt and pays with cash."],["Wie viel kostet der Einkauf?","Der Einkauf kostet 45 Euro.","The shopping costs 45 euros."],["Was kocht Anna heute?","Sie kocht ein leckeres Abendessen für ihre Familie.","She cooks a delicious dinner for her family."]],"wordCount":146},{"title":"Meine Freizeit ⚽","story":["Ich heiße Max und bin 12 Jahre alt. In meiner Freizeit mache ich viele Dinge. Am liebsten spiele ich Fußball mit meinen Freunden. Wir treffen uns jeden Samstag auf dem Sportplatz. Das Wetter ist oft schön. Wir spielen zwei Stunden lang. Manchmal gewinnen wir, manchmal verlieren wir. Aber das macht nichts. Es macht immer Spaß. Nach dem Fußball gehe ich nach Hause und dusche. Dann esse ich zu Mittag. Am Nachmittag lese ich gerne Bücher. Ich lese Abenteuergeschichten. Sie sind sehr spannend. Ich habe viele Bücher zu Hause. Manchmal male ich auch Bilder. Ich male Tiere und Landschaften. Das entspannt mich. Am Abend sehe ich fern oder höre Musik. Ich höre gerne Popmusik. Meine Schwester tanzt oft dazu. Am Wochenende gehe ich mit meiner Familie ins Kino. Wir sehen einen lustigen Film. Ich habe eine tolle Freizeit. Ich habe viele Hobbys. Meine Freunde haben auch Hobbys. Wir machen oft etwas zusammen. Das ist schön."],"translation":[["Ich heiße Max und bin 12 Jahre alt.","My name is Max and I am 12 years old."],["In meiner Freizeit mache ich viele Dinge.","In my free time I do many things."],["Am liebsten spiele ich Fußball mit meinen Freunden.","I like playing football with my friends the most."],["Wir treffen uns jeden Samstag auf dem Sportplatz.","We meet every Saturday at the sports field."],["Das Wetter ist oft schön.","The weather is often nice."],["Wir spielen zwei Stunden lang.","We play for two hours."],["Manchmal gewinnen wir, manchmal verlieren wir.","Sometimes we win, sometimes we lose."],["Aber das macht nichts.","But that doesn't matter."],["Es macht immer Spaß.","It is always fun."],["Nach dem Fußball gehe ich nach Hause und dusche.","After football I go home and shower."],["Dann esse ich zu Mittag.","Then I have lunch."],["Am Nachmittag lese ich gerne Bücher.","In the afternoon I like to read books."],["Ich lese Abenteuergeschichten.","I read adventure stories."],["Sie sind sehr spannend.","They are very exciting."],["Ich habe viele Bücher zu Hause.","I have many books at home."],["Manchmal male ich auch Bilder.","Sometimes I also paint pictures."],["Ich male Tiere und Landschaften.","I paint animals and landscapes."],["Das entspannt mich.","That relaxes me."],["Am Abend sehe ich fern oder höre Musik.","In the evening I watch TV or listen to music."],["Ich höre gerne Popmusik.","I like listening to pop music."],["Meine Schwester tanzt oft dazu.","My sister often dances to it."],["Am Wochenende gehe ich mit meiner Familie ins Kino.","On the weekend I go to the cinema with my family."],["Wir sehen einen lustigen Film.","We watch a funny movie."],["Ich habe eine tolle Freizeit.","I have a great free time."],["Ich habe viele Hobbys.","I have many hobbies."],["Meine Freunde haben auch Hobbys.","My friends also have hobbies."],["Wir machen oft etwas zusammen.","We often do something together."],["Das ist schön.","That is nice."]],"vocab":[["die Freizeit","free time"],["der Sportplatz","sports field"],["gewinnen","to win"],["verlieren","to lose"],["der Spaß","fun"],["duschen","to shower"],["zu Mittag essen","to have lunch"],["die Abenteuergeschichte","adventure story"],["spannend","exciting"],["malen","to paint"],["die Landschaft","landscape"],["entspannen","to relax"],["fernsehen","to watch TV"],["die Popmusik","pop music"],["das Wochenende","weekend"],["das Kino","cinema"],["lustig","funny"],["das Hobby","hobby"],["zusammen","together"]],"speaking":[["Wie alt ist Max?","Max ist 12 Jahre alt.","Max is 12 years old."],["Was macht Max am liebsten in seiner Freizeit?","Er spielt am liebsten Fußball mit seinen Freunden.","He likes playing football with his friends the most."],["Wann treffen sich die Freunde?","Sie treffen sich jeden Samstag auf dem Sportplatz.","They meet every Saturday at the sports field."],["Was liest Max am Nachmittag?","Er liest Abenteuergeschichten.","He reads adventure stories."],["Was macht Max am Abend?","Er sieht fern oder hört Musik.","He watches TV or listens to music."],["Wohin geht Max am Wochenende?","Er geht mit seiner Familie ins Kino.","He goes to the cinema with his family."]],"wordCount":154},{"title":"Das Wetter ☀️🌧️❄️","story":["Heute ist das Wetter sehr schön. Die Sonne scheint hell am Himmel. Es ist warm und angenehm. Die Temperatur ist 22 Grad Celsius. Viele Menschen gehen im Park spazieren. Kinder spielen auf der Wiese. Ein Hund läuft glücklich herum. Die Vögel singen in den Bäumen. Es weht ein leichter Wind. Die Blumen blühen in vielen Farben. Es ist ein perfekter Frühlingstag. Gestern war das Wetter ganz anders. Es hat stark geregnet. Der Himmel war grau. Die Straßen waren nass. Es war kalt und ungemütlich. Ich bin zu Hause geblieben. Morgen wird es wahrscheinlich wieder regnen. Die Wolken kommen schon. Der Wetterbericht sagt Regen für morgen. Aber am Wochenende wird es wieder sonnig. Dann gehe ich zum See. Ich mag das Wetter im Sommer am liebsten. Es ist heiß und ich kann schwimmen. Der Winter ist mir zu kalt. Im Winter schneit es oft. Ich bleibe dann lieber zu Hause. Das Wetter in Deutschland ist sehr wechselhaft. Man muss immer einen Regenschirm dabei haben."],"translation":[["Heute ist das Wetter sehr schön.","Today the weather is very nice."],["Die Sonne scheint hell am Himmel.","The sun shines brightly in the sky."],["Es ist warm und angenehm.","It is warm and pleasant."],["Die Temperatur ist 22 Grad Celsius.","The temperature is 22 degrees Celsius."],["Viele Menschen gehen im Park spazieren.","Many people go for a walk in the park."],["Kinder spielen auf der Wiese.","Children play on the meadow."],["Ein Hund läuft glücklich herum.","A dog runs around happily."],["Die Vögel singen in den Bäumen.","The birds sing in the trees."],["Es weht ein leichter Wind.","A light wind blows."],["Die Blumen blühen in vielen Farben.","The flowers bloom in many colors."],["Es ist ein perfekter Frühlingstag.","It is a perfect spring day."],["Gestern war das Wetter ganz anders.","Yesterday the weather was completely different."],["Es hat stark geregnet.","It rained heavily."],["Der Himmel war grau.","The sky was grey."],["Die Straßen waren nass.","The streets were wet."],["Es war kalt und ungemütlich.","It was cold and uncomfortable."],["Ich bin zu Hause geblieben.","I stayed at home."],["Morgen wird es wahrscheinlich wieder regnen.","Tomorrow it will probably rain again."],["Die Wolken kommen schon.","The clouds are already coming."],["Der Wetterbericht sagt Regen für morgen.","The weather forecast says rain for tomorrow."],["Aber am Wochenende wird es wieder sonnig.","But on the weekend it will be sunny again."],["Dann gehe ich zum See.","Then I go to the lake."],["Ich mag das Wetter im Sommer am liebsten.","I like the weather in summer the most."],["Es ist heiß und ich kann schwimmen.","It is hot and I can swim."],["Der Winter ist mir zu kalt.","Winter is too cold for me."],["Im Winter schneit es oft.","In winter it often snows."],["Ich bleibe dann lieber zu Hause.","I prefer to stay at home then."],["Das Wetter in Deutschland ist sehr wechselhaft.","The weather in Germany is very changeable."],["Man muss immer einen Regenschirm dabei haben.","One must always have an umbrella with them."]],"vocab":[["das Wetter","weather"],["scheinen","to shine"],["der Himmel","sky"],["angenehm","pleasant"],["die Temperatur","temperature"],["spazieren gehen","to go for a walk"],["die Wiese","meadow"],["der Vogel","bird"],["wehen","to blow"],["der Wind","wind"],["die Blume","flower"],["blühen","to bloom"],["regnen","to rain"],["grau","grey"],["nass","wet"],["ungemütlich","uncomfortable"],["die Wolke","cloud"],["der Wetterbericht","weather forecast"],["sonnig","sunny"],["der See","lake"],["heiß","hot"],["schneien","to snow"],["wechselhaft","changeable"],["der Regenschirm","umbrella"]],"speaking":[["Wie ist das Wetter heute?","Heute ist das Wetter sehr schön. Die Sonne scheint.","Today the weather is very nice. The sun is shining."],["Wie warm ist es heute?","Die Temperatur ist 22 Grad Celsius.","The temperature is 22 degrees Celsius."],["Was machen die Menschen im Park?","Sie gehen spazieren und spielen auf der Wiese.","They go for a walk and play on the meadow."],["Wie war das Wetter gestern?","Gestern hat es stark geregnet. Es war kalt und grau.","Yesterday it rained heavily. It was cold and grey."],["Was sagt der Wetterbericht für morgen?","Der Wetterbericht sagt Regen für morgen.","The weather forecast says rain for tomorrow."],["Welche Jahreszeit mag der Autor am liebsten?","Er mag den Sommer am liebsten.","He likes summer the most."]],"wordCount":163},{"title":"Meine Familie 👨‍👩‍👧‍👦","story":["Ich heiße Lena und bin 15 Jahre alt. Ich wohne mit meiner Familie in Berlin. Meine Familie ist nicht groß. Wir sind zu viert: meine Eltern, mein Bruder und ich. Mein Vater heißt Thomas. Er ist 45 Jahre alt und arbeitet als Lehrer. Er unterrichtet Geschichte. Er ist sehr intelligent und hilfsbereit. Meine Mutter heißt Maria. Sie ist 42 Jahre alt und arbeitet in einem Krankenhaus. Sie ist Ärztin. Sie hilft kranken Menschen. Sie ist sehr geduldig und nett. Mein Bruder heißt Paul. Er ist 10 Jahre alt und geht in die Schule. Er ist in der vierten Klasse. Er spielt gerne Fußba
