function getBookKnownLevelTerms(){
  const known=new Set();
  const add=(value)=>{ if(value==null) return; const t=String(value).trim().toLocaleLowerCase(); if(t) known.add(t); };
  try{ (DATA.simple||[]).forEach(t=>(t.vocab||[]).forEach(v=>add(v&&v[0]))); }catch(e){}
  try{ (DATA.understandable||[]).forEach(t=>(t.vocab||[]).forEach(v=>add(v&&v[0]))); }catch(e){}
  try{ Object.values(SCHRIBEN_TERMS||{}).forEach(map=>Object.keys(map||{}).forEach(add)); }catch(e){}
  return known;
}

function bookTermIsKnownLevel(term,known){
  const raw=String(term||'').trim().toLocaleLowerCase();
  if(!raw) return true;
  if(known.has(raw)) return true;
  const singular=raw.replace(/(?:e|en|er|es|s)$/,'');
  if(singular && singular!==raw && known.has(singular)) return true;
  return false;
}

function collectBookHighlightTerms(text, vocab=[], additionalMap=null, maxItems=20){
  const source=String(text||'').replace(/\*\*/g,'');
  const known=getBookKnownLevelTerms();
  const candidates=[];
  const seen=new Set();
  const add=(term,en,priority=0)=>{
    const t=String(term||'').trim();
    const meaning=String(en||'').trim();
    if(!t || !meaning || meaning.length<2 || seen.has(t.toLocaleLowerCase())) return;
    if(bookTermIsKnownLevel(t,known)) return;
    const re=new RegExp('(^|[^\\p{L}])'+escapeRegExp(t)+'(?=$|[^\\p{L}])','iu');
    if(!re.test(source)) return;
    seen.add(t.toLocaleLowerCase());
    candidates.push({term:t,en:meaning,priority});
  };

  // Preserve deliberate bold terms first; these are already marked by the book.
  const boldRe=/\*\*([\s\S]+?)\*\*/g;
  let bm;
  while((bm=boldRe.exec(String(text||'')))){
    const raw=bm[1].trim();
    const en=resolveTermTranslation(raw,vocab);
    if(en) add(raw,en,100);
  }

  (Array.isArray(vocab)?vocab:[]).forEach(row=>add(row&&row[0],row&&row[1],80));

  if(additionalMap){
    if(additionalMap instanceof Map){ additionalMap.forEach((en,de)=>add(de,en,60)); }
    else Object.entries(additionalMap||{}).forEach(([de,en])=>add(de,en,60));
  }

  try{ (EXTRA_BOOK_VOCAB||[]).forEach(row=>add(row&&row[0],row&&row[1],40)); }catch(e){}

  // Prefer the most useful, longer phrases/terms while preserving priority.
  candidates.sort((a,b)=>b.priority-a.priority || String(b.term).length-String(a.term).length);
  return candidates.slice(0,maxItems);
}

function renderBookInline(text,vocab=[],additionalMap=null,maxItems=20){
  const src=String(text||'');
  const terms=collectBookHighlightTerms(src,vocab,additionalMap,maxItems);
  if(!terms.length) return esc(src.replace(/\*\*/g,''));
  return renderTermHighlights(src.replace(/\*\*/g,''),terms);
}

function renderTermHighlights(text, terms){
  const plain=String(text||'');
  const choices=(terms||[]).filter(x=>x && x.term && x.en).slice().sort((a,b)=>b.term.length-a.term.length);
  if(!choices.length) return esc(plain);
  const re=new RegExp('(^|[^\\p{L}])('+choices.map(x=>escapeRegExp(x.term)).join('|')+')(?=$|[^\\p{L}])','giu');
  let out='',last=0,m;
  while((m=re.exec(plain))){
    const raw=m[2];
    const hit=choices.find(x=>x.term.toLocaleLowerCase()===raw.toLocaleLowerCase());
    if(!hit) continue;
    const start=m.index+(m[1]?m[1].length:0);
    out+=esc(plain.slice(last,start));
    const safeRaw=JSON.stringify(raw);
    const safeEn=esc(hit.en);
    out+=`<span class="term-link" tabindex="0" role="button" onclick='event.stopPropagation();speak(${safeRaw})' onkeydown='if(event.key==="Enter"||event.key===" "){event.preventDefault();event.stopPropagation();speak(${safeRaw})}' aria-label="${safeEn}">${esc(raw)}<span class="term-tip">${safeEn}</span></span>`;
    last=start+raw.length;
  }
  out+=esc(plain.slice(last));
  return out;
}


function getA2B1B2ReadingTranslations(){
  const map=new Map();
  const add=(de,en)=>{
    const d=String(de||'').trim(), e=String(en||'').trim();
    if(!d || !e || e.length<2) return;
    if(/^(translation not available|english translation|important word|wichtiger wortschatz)$/i.test(e)) return;
    map.set(d.toLocaleLowerCase(),e);
  };
  // A2 vocabulary only (not A1): this is the learner's baseline for new reading vocabulary.
  try{
    (DATA.understandable||[]).forEach(t=>(t.vocab||[]).forEach(v=>add(v&&v[0],v&&v[1])));
  }catch(e){}
  // B1/B2 vocabulary used across the learning platform.
  try{
    Object.entries(SCHRIBEN_TERMS?.B1||{}).forEach(([de,en])=>add(de,en));
    Object.entries(SCHRIBEN_TERMS?.B2||{}).forEach(([de,en])=>add(de,en));
  }catch(e){}
  return map;
}

let MORD_READING_PLAN = null;

function buildMordReadingPlan(){
  if(MORD_READING_PLAN) return MORD_READING_PLAN;
  const sources = getA2B1B2ReadingTranslations();
  const all = new Map();
  sources.forEach((en,de)=>all.set(de.toLocaleLowerCase(),{term:de,en}));

  // The book's own vocabulary is also useful for an A2 reader.
  try{
    (MORD_BOOK_DATA||[]).forEach(item=>{
      const content=String(item?.content||'');
      const rowRe=/^\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*$/gm;
      let m;
      while((m=rowRe.exec(content))){
        const de=m[1].trim(), en=m[2].trim();
        if(/^(german|--------)$/i.test(de)) continue;
        if(!de || !en) continue;
        all.set(de.toLocaleLowerCase(),{term:de,en});
      }
    });
  }catch(e){}

  const ignored=/^(der|die|das|den|dem|des|ein|eine|einer|einem|einen|eines|ich|du|er|sie|es|wir|ihr|mich|dich|sich|uns|euch|und|oder|aber|doch|denn|weil|wenn|dass|als|ob|auch|nur|noch|schon|so|sehr|zu|von|mit|bei|nach|aus|für|gegen|ohne|über|unter|vor|hinter|neben|zwischen|durch|um|auf|an|in|ist|sind|war|waren|sein|haben|hat|hatte|werden|wird|wurde|kann|konnte|muss|musste|soll|sollte|will|wollte|man|wer|was|wie|wo|wann|warum)$/i;
  const candidates=[...all.values()].filter(x=>x.term.length>=3 && !ignored.test(x.term) && !/[|\n]/.test(x.term));

  const variantsFor = term => {
    const raw=String(term).trim();
    const vs=new Set([raw]);
    if(/^[\p{L}ÄÖÜäöüß-]+$/u.test(raw)){
      const lower=raw.toLocaleLowerCase();
      if(lower.endsWith('en')){
        vs.add(lower.replace(/en$/,'te')); vs.add(lower.replace(/en$/,'ten')); vs.add(lower.replace(/en$/,'t')); vs.add(lower.replace(/en$/,'e'));
      }
      if(lower.endsWith('e')){ vs.add(lower+'n'); vs.add(lower+'r'); vs.add(lower.replace(/e$/,'en')); }
      if(lower.endsWith('er')){ vs.add(lower+'e'); vs.add(lower+'n'); }
    }
    return [...vs].filter(Boolean);
  };

  const plan=new Map();
  const book=MORD_BOOK_DATA||[];
  book.forEach((item,index)=>{
    const title=String(item?.title||'');
    if(/answer key|about the author|acknowledg/i.test(title)) return;
    let text=cleanBookMarkup(String(item?.content||''));
    text=text.replace(/\*\*(\d+)\.([\s\S]*?)\*\*/g,'').replace(/\*\*Vocabulary:\*\*[\s\S]*?(?=\n---|$)/i,'').replace(/\n## Übung[\s\S]*$/i,'');
    const local=[];
    candidates.forEach(c=>{
      if(plan.has(c.term.toLocaleLowerCase())) return;
      let best=-1;
      for(const v of variantsFor(c.term)){
        const re=new RegExp('(^|[^\p{L}])'+escapeRegExp(v)+'(?=$|[^\p{L}])','iu');
        const m=re.exec(text);
        if(m){
          const pos=m.index+(m[1]?m[1].length:0);
          if(best<0 || pos<best) best=pos;
        }
      }
      if(best>=0) local.push({key:c.term.toLocaleLowerCase(),term:c.term,en:c.en,pos:best});
    });
    local.sort((a,b)=>a.pos-b.pos || b.term.length-a.term.length);
    local.forEach(x=>plan.set(x.key,{...x,chapter:index}));
  });
  MORD_READING_PLAN=plan;
  return plan;
}

const MORD_NON_VOCAB = new Set([
  'der','die','das','den','dem','des','ein','eine','einer','einem','einen','eines',
  'ich','du','er','sie','es','wir','ihr','sie','mich','dich','sich','uns','euch',
  'mein','meine','meiner','meinem','meinen','meines','dein','deine','seine','seiner','seinem','ihre','ihrer','ihrem',
  'und','oder','aber','doch','denn','weil','wenn','dass','als','ob','auch','nur','noch','schon','so','sehr',
  'zu','von','mit','bei','nach','aus','für','gegen','ohne','über','unter','vor','hinter','neben','zwischen','durch','um','auf','an','in',
  'ist','sind','war','waren','sein','haben','hat','hatte','werden','wird','wurde','kann','konnte','muss','musste','soll','sollte','will','wollte',
  'man','wer','was','wie','wo','wann','warum','welcher','welche','welches','diese','dieser','diesem','diesen','das'
]);

function mordTermIsLexical(term){
  const t=String(term||'').trim().toLocaleLowerCase();
  if(!t || t.length<3) return false;
  if(MORD_NON_VOCAB.has(t)) return false;
  // Do not underline isolated grammar/function fragments.
  if(/^[-–—.,!?;:]+$/.test(t)) return false;
  return true;
}

function mordTermVariants(term){
  const raw=String(term||'').trim();
  const out=[raw];
  // Add common readable inflected forms so base-form vocabulary still highlights in stories.
  if(/^[A-Za-zÄÖÜäöüß-]+$/.test(raw) && raw.includes(' ' )===false){
    const lower=raw.toLocaleLowerCase();
    if(lower.length>=4){
      if(/en$/.test(lower)) out.push(lower.replace(/en$/,'e'), lower.replace(/en$/,'t'), lower.replace(/en$/,'ten'), lower.replace(/en$/,'te'));
      if(/n$/.test(lower)) out.push(lower+'s');
      if(/e$/.test(lower)) out.push(lower+'n', lower+'r', lower.replace(/e$/,'en'));
      if(/er$/.test(lower)) out.push(lower+'e', lower+'n');
    }
  }
  return [...new Set(out.filter(Boolean))];
}

function renderMordBookContent(markdown,vocab=[],chapterIndex=null){
  const cleaned=cleanBookMarkup(markdown);
  const plan=buildMordReadingPlan();
  const chapterTerms=[];
  plan.forEach(x=>{
    if(chapterIndex===null || x.chapter===chapterIndex) chapterTerms.push(x);
  });

  const variantsFor = term => {
    const raw=String(term).trim();
    const vs=new Set([raw]);
    if(/^[\p{L}ÄÖÜäöüß-]+$/u.test(raw)){
      const lower=raw.toLocaleLowerCase();
      if(lower.endsWith('en')){
        vs.add(lower.replace(/en$/,'te')); vs.add(lower.replace(/en$/,'ten')); vs.add(lower.replace(/en$/,'t')); vs.add(lower.replace(/en$/,'e'));
      }
      if(lower.endsWith('e')){ vs.add(lower+'n'); vs.add(lower+'r'); vs.add(lower.replace(/e$/,'en')); }
      if(lower.endsWith('er')){ vs.add(lower+'e'); vs.add(lower+'n'); }
    }
    return [...vs];
  };

  const usable=[];
  chapterTerms.forEach(c=>variantsFor(c.term).forEach(v=>usable.push({base:c.term,en:c.en,term:v})));
  usable.sort((a,b)=>b.term.length-a.term.length);

  const renderText=(text)=>{
    const plain=String(text||'').replace(/\*\*/g,'');
    if(!usable.length) return esc(plain);
    const re=new RegExp('(^|[^\p{L}])('+usable.map(x=>escapeRegExp(x.term)).join('|')+')(?=$|[^\p{L}])','giu');
    let out='',last=0,m;
    const emitted=new Set();
    while((m=re.exec(plain))){
      const raw=m[2];
      const hit=usable.find(x=>x.term.toLocaleLowerCase()===raw.toLocaleLowerCase());
      if(!hit) continue;
      const key=hit.base.toLocaleLowerCase();
      if(emitted.has(key)) continue;
      const start=m.index+(m[1]?m[1].length:0);
      out+=esc(plain.slice(last,start));
      const safeRaw=JSON.stringify(raw), safeEn=esc(hit.en);
      out+=`<span class="term-link" tabindex="0" role="button" onclick='event.stopPropagation();speak(${safeRaw})' onkeydown='if(event.key==="Enter"||event.key===" " ){event.preventDefault();event.stopPropagation();speak(${safeRaw})}' aria-label="${safeEn}">${esc(raw)}<span class="term-tip">${safeEn}</span></span>`;
      last=start+raw.length;
      emitted.add(key);
    }
    out+=esc(plain.slice(last));
    return out;
  };

  return cleaned.split(/\n\s*\n/).map(block=>{
    const text=block.trim(); if(!text) return '';
    if(/^###\s+/.test(text)) return `<h3 class="cafe-subheading">${renderText(text.replace(/^###\s+/,''))}</h3>`;
    if(/^##\s+/.test(text)) return `<h3 class="cafe-subheading">${renderText(text.replace(/^##\s+/,''))}</h3>`;
    if(/^#\s+/.test(text)) return `<h2 class="cafe-subheading">${renderText(text.replace(/^#\s+/,''))}</h2>`;
    return `<p>${renderText(text).replace(/\n/g,'<br>')}</p>`;
  }).join('');
}

function cafeRichText(text){
  return renderBookInline(text,[],CAFE_TRANSLATIONS,18);
}

const FRANKFURT_DATA = [{"title":"Ferien in Frankfurt","content":"## Introduction\n\nIn this sequel to \"Café in Berlin\", Dino makes his way towards the central German metropolis of Frankfurt am Main, caught in between quaint cider-pubs, the international banking elite, old acquaintances and the eternal question what to do with his life.\n\nExplore Frankfurt's city life, learn about local sights and sounds, and improve your German effortlessly along the way!\n\nThis book is designed to help beginners make the leap from studying isolated words and phrases to reading (and enjoying) naturally flowing German texts.\n\nUsing simplified sentence structures and a very basic vocabulary, this collection of short stories is carefully crafted to allow even novice learners to appreciate and understand the intricacies of coherent German speech.\n\nEach chapter comes with a complete German-English dictionary, with a special emphasis on collocative phrases (high frequency word combinations), short sentences and expressions.\n\nBy working with these \"building blocks\" instead of just single words, learners can accelerate their understanding and active usage of new material and make the learning process more fluid and fun.\n\n## How To Read This Book\n\nBefore we start, we should acknowledge that there will be many unknown words in the following stories and that there are, in fact, various ways to deal with this very common problem for language learners of all ages and stages.\n\n1. If you want to get the most out these stories, you'll have to establish some kind of **Lesefluss** (reading flow). You might be reading quickly or slowly, it doesn't matter - as long as you keep on reading and allow context and continuity to clear your questions.\n\n2. Furthermore, important or difficult words (and short phrases) are appended to each chapter with an English translation for quick look-ups.\n\n3. If you're reading this book on an e-reader or tablet, you can get instant translations by clicking/tapping on the word. To find out if your device supports this feature and how to enable it, please consult your manual or customer support.\n\n4. As a final option we recommend using a good German-English online dictionary such as dict.cc on your computer or mobile device while reading the following stories."},{"title":"✈️ Willkommen in Frankfurt","content":"**Der Frankfurter Flughafen ist wie Deutschland: modern, sauber, ordentlich**. Aber **mein Gepäck** ist **trotzdem verschwunden**.\n\n\"Palermo IA3537\", **stand auf dem Bildschirm**. **Nach fünf Minuten startete** das **Gepäckband**. Die anderen **Passagiere nahmen ihre Koffer und Taschen**. Ich habe **eine halbe Stunde gewartet**. Aber das Gepäckband **war leer**.\n\n\"Singapore SA1428\", stand jetzt auf dem Bildschirm. Fünf Minuten später startete das Gepäckband und die Passagiere **aus Singapur** nahmen ihre Koffer und Taschen.\n\nIch **ging zu einem Schalter mit der Aufschrift** \"Verlorenes Gepäck\".\n\nDer Mann **hinter** dem Schalter sagte: \"Ja?\"\n\n\"Mein Gepäck\", sagte ich. \"**Es ist nicht angekommen**.\"\n\n\"**Gepäckabschnitt**\", sagte der Mann.\n\n\"**Entschuldigung?**\", sagte ich.\n\n\"**Ihre Bordkarte**\", sagte der Mann.\n\nIch **suchte in meiner Hosentasche** und **gab** dem Mann die **zerknitterte** Bordkarte. Er **tippte** etwas in seinen Computer. \"Palermo?\", sagte er. Ich nickte. Dann gab er mir ein **Formular**.\n\n\"Name, Adresse, Telefon\", sagte er.\n\n\"Adresse?\", fragte ich.\n\n\"**Ihre Adresse in Deutschland**\", sagte der Mann.\n\n\"Ich ... wohne in Sizilien\", sagte ich.\n\n\"Ja, aber **wo werden Sie in Deutschland wohnen**?\", fragte der Mann.\n\n\"**Bei meinem Bruder**\", sagte ich.\n\n\"Und wo wohnt Ihr Bruder?\", fragte er.\n\n\"In Frankfurt\", sagte ich.\n\n\"Aber wo?\", sagte der Mann und **schüttelte seinen Kopf**. \"Frankfurt ist eine große Stadt.\"\n\n\"In einem Haus?\", sagte ich. \"**Ich weiß nicht** ...\"\n\nDer Mann **seufzte** und sagte: \"Okay, dann Ihre Email, bitte!\"\n\nIch **schrieb** meine E-Mail-Adresse auf und sagte: \"Telefonnummer ...\"\n\n\"**Wissen Sie nicht**? **Macht nichts**. **Wiedersehen!**\", sagte der Mann.\n\n\"**Eine Frage noch**\", sagte ich.\n\nDer Mann hinter dem Schalter **runzelte seine Stirn**.\n\n\"**Wann bekomme ich** mein Gepäck?\", fragte ich.\n\nDer Mann lachte und sagte: \"**Das kann ich Ihnen nicht sagen**. Vielleicht schon in drei Tagen, aber **vielleicht** auch **erst in zwei Wochen**.\"\n\n\"Zwei Wochen?\", sagte ich. \"Aber meine **Kleidung** ist in dem Koffer! **Was soll ich tun**?\"\n\n\"**Tut mir Leid**\", sagte der Mann. \"**Jedes Jahr gehen** 25 Millionen **Gepäckstücke verloren**. Das sind **knapp** 3000 Koffer und Taschen **pro Stunde**! **Wenn es Sie beruhigt**, Sie sind **nicht der einzige**.\"\n\n## Übung\n\n**1. Dinos Gepäck ist ...**\n\na) angekommen.\n\nb) verschwunden.\n\nc) schmutzig.\n\n**2. Wie lange hat Dino auf sein Gepäck gewartet?**\n\na) eine halbe Stunde\n\nb) eine Viertelstunde\n\nc) eine Stunde\n\n**3. Wo wird Dino in Frankfurt wohnen?**\n\na) in einem Hotel\n\nb) bei seiner Schwester\n\nc) bei seinem Bruder"},{"title":"🏙️ Ein Name, zwei Städte","content":"**Mein Bruder Alfredo hat mich vom Flughafen abgeholt**. Er **fährt** einen silbernen BMW Cabrio. Der **Kofferraum** ist **sehr klein**. Aber ich habe **glücklicherweise** kein Gepäck. **Glück im Unglück**?\n\n**Von der Autobahn kann man Wolkenkratzer sehen**. \"Die Skyline von Frankfurt\", sagt Alfredo. **Es dämmert langsam**.\n\n\"**Wohnst du in** einem Wolkenkratzer?\", frage ich.\n\nAlfredo **lacht** und sagt: \"Nein. **Die meisten Türme** sind **Banken**. Frankfurt ist **Deutschlands finanzielles Herz**.\"\n\nMein Bruder **arbeitet für** eine amerikanische Bank. \"**In Frankfurt gibt es mehr als** 240 Banken **aus aller Welt**\", sagt er. \"**Hier** ist die **Börse**. **Hier liegt das Geld in der Luft**!\"\n\nAlfredo wohnt jetzt in Frankfurt, **weil** sein **Chef** in New York gesagt hat, er **soll** **ein Jahr** in Frankfurt wohnen. Die amerikanischen Banken haben **Probleme**. Alfredo soll von den deutschen Banken **lernen**, **wie man mehr Geld macht**.\n\n\"Deutschland ist **wichtig** für Europa. Und Europa ist ein wichtiger Partner für Amerika\", sagt mein Bruder.\n\nWir fahren **eine Weile** durch die **Dämmerung**. Die Wolkenkratzer **glitzern** in der **Dunkelheit**. Dann parkt Alfredo den BMW, und wir gehen in seine **Wohnung**.\n\nAlfredos Wohnung ist ein **Loft mit Ausblick auf** den **Main**, Frankfurts **Fluss**. \"**Schön, oder?**\", sagt Alfredo und **zeigt** durch die **Fenster** auf die **Lichter der Stadt**.\n\n\"**Wusstest du, dass** es **zwei Städte** mit dem **Namen** Frankfurt gibt?\", sagt Alfredo. \"Es gibt Frankfurt am Main, und Frankfurt an der Oder.\"\n\n\"Oder was?\", frage ich.\n\n\"Nein\", sagt Alfredo und lacht. \"Das ist **der Name des Flusses**. Der Fluss **heißt** Oder!\"\n\n\"**Ach so!**\", sage ich. \"**Ein komischer Name für** einen Fluss.\"\n\n\"Okay\", sagt Alfredo. \"**Ich muss geh'n**. **Im Kühlschrank** ist **Bier**, und **wenn du hungrig bist**, kannst du **eine Pizza bestellen**.\"\n\n\"**Wo gehst du hin?**\", frage ich.\n\n\"**Wohin**? **Zur Arbeit**, natürlich\", sagt Alfredo. \"**Bis später!**\"\n\nIch **höre** die **Tür**. Dann ist alles **still**. Ich bin **allein** in Alfredos Loft, allein mit den Lichtern der Stadt.\n\n## Übung\n\n**1. Für wen arbeitet Alfredo?**\n\na) Er arbeitet für eine amerikanische Bank.\n\nb) Er arbeitet an der Frankfurter Börse.\n\nc) Er arbeitet für eine deutsche Bank.\n\n**2. Wo wohnt Alfredo?**\n\na) in einem Wolkenkratzer\n\nb) in einem Loft\n\nc) in einer Villa\n\n**3. Wie heißt der Fluss in Frankfurt?**\n\na) Rhein\n\nb) Main\n\nc) Donau\n\n**4. Die andere Stadt heißt ...**\n\na) Frankfurt am Rhein\n\nb) Frankfurt an der Oder\n\nc) Frankfurt am Neckar\n\n**5. Wohin geht Alfredo?**\n\na) zur Arbeit\n\nb) in eine Kneipe\n\nc) zu seiner Freundin"},{"title":"🛍️ Shoppingtour","content":"Ich bin jetzt **fast eine Woche lang** in Frankfurt. **Ich schaue viel Fernsehen** und surfe im Internet. Meinen Bruder **sehe ich nicht oft**. **Er steht auf**, **wenn ich noch schlafe**. Und **wenn er von der Arbeit kommt**, bin ich **meistens schon im Bett**.\n\nMein Gepäck ist **immer noch nicht angekommen**. Ich habe beim Flughafen angerufen. Sie sagen, **sie wissen nichts**.\n\n**In der Zwischenzeit trage ich** die Kleidung **meines Bruders**. Er ist **ein bisschen größer als ich**. Die **Hosen** sind ein bisschen **zu lang**, die Hemden ein bisschen **zu weit**, aber es ist **besser als nichts**.\n\n**Vorgestern** war ich auf der Zeil. Das ist eine große **Fußgängerzone in der Innenstadt**. **Dort** kann man alles **kaufen**: Italienische Mode, Delikatessen, Plasmafernseher, Meerschweinchen und **vieles mehr**.\n\nIch habe eine Zahnbürste, Unterhosen und Socken **gekauft**. Dann bin ich **mit der U-Bahn nach Hause gefahren**. In der U-Bahn waren **Menschen** aus aller Welt. Ich habe **eine Gruppe japanischer Touristen** gesehen, zwei Frauen in Burka, einen Mann mit einem Turban und viele Leute mit grauen Anzügen. Ich glaube, die Männer und Frauen mit den grauen Anzügen arbeiten in den Banken. Oder sie haben alle ihr Gepäck verloren und tragen die Kleidung ihrer Geschwister, wie ich.\n\nIn Alfredos Wohnung habe ich mit meiner Mutter telefoniert. Sie hat gesagt, sie ist sehr glücklich, dass ich zusammen mit Alfredo in einer Bank arbeite. Sie weiß nicht, dass ich nicht arbeite. Ich muss zuerst Deutsch lernen. Das ist das Wichtigste, wenn man in Deutschland lebt. Nur wenn man gut Deutsch spricht, kann man eine Arbeit finden. Leider ist mein Deutsch noch nicht gut genug.\n\nIch lerne zur Zeit Deutsch im Internet. Es gibt dort eine Gruppe. Wir sollen auf Deutsch chatten, aber meistens sprechen wir Englisch. Vielleicht muss ich einen Deutschkurs in Frankfurt besuchen? Ehrlich gesagt ist der Fernseher im Moment mein bester Lehrer. Ich schaue Talkshows und Filme auf Deutsch. Ich verstehe nicht alles, aber das ist egal. Alfredo hat einen großen Fernseher, ein gemütliches Sofa, und mein Deutsch ist gut genug, um jeden Tag Pizza zu bestellen.\n\n## Übung\n\n**1. Wie lange ist Dino schon in Frankfurt?**\n\na) fast zwei Wochen\n\nb) fast eine Woche\n\nc) fast drei Wochen\n\n**2. Was macht Dino in seiner Freizeit?**\n\na) Er schreibt Briefe.\n\nb) Er schaut viel Fernsehen und surft im Internet.\n\nc) Er geht jeden Tag ins Kino.\n\n**3. Warum trägt Dino die Kleidung seines Bruders?**\n\na) Seine eigene Kleidung ist schmutzig.\n\nb) Sein Gepäck ist noch nicht angekommen.\n\nc) Er mag die Kleidung seines Bruders lieber.\n\n**4. Was hat Dino auf der Zeil gekauft?**\n\na) Neue Schuhe und eine Jacke.\n\nb) Eine Zahnbürste, Unterhosen und Socken.\n\nc) Einen neuen Fernseher.\n\n**5. Was denkt Dinos Mutter über ihn?**\n\na) Sie denkt, er arbeitet in einer Bank.\n\nb) Sie denkt, er ist arbeitslos.\n\nc) Sie denkt, er studiert in Frankfurt."},{"title":"👩 Überraschungsbesuch","content":"Heute Morgen ist etwas Komisches passiert. Wie jeden Morgen habe ich einen Kaffee getrunken. Dann habe ich geduscht. Als ich aus der Dusche kam – nur mit einem Handtuch bekleidet – stand eine brünette junge Frau im Wohnzimmer.\n\n\"Oh\", sagte sie und lächelte. \"Guten Morgen!\"\n\n\"Wer sind Sie?\", fragte ich. \"Was wollen Sie?\"\n\n\"Dasselbe kann ich dich fragen. Was machst du hier?\", fragte sie.\n\n\"Ich ... ich habe geduscht\", sagte ich.\n\n\"Das sieht man\", sagte die junge Frau. Ihre grünen Augen starrten mich an. \"Aber wie bist du in die Wohnung gekommen?\"\n\n\"Mein Bruder\", sagte ich. \"Das ist die Wohnung meines Bruders.\"\n\n\"Oh\", sagte die junge Frau und lachte. \"Entschuldigung. Ich ... ich dachte ...\"\n\nSie ging zur Tür. \"Einen Moment\", sagte ich und ging ins Schlafzimmer. Dort zog ich schnell etwas an. Dann ging ich zurück ins Wohnzimmer.\n\n\"Was dachten Sie?\", fragte ich.\n\n\"Lass das Siezen, bitte!\", sagte sie.\n\n\"Okay\", sagte ich. \"Was dachtest du?\"\n\n\"Christa\", sagte die Frau und gab mir die Hand. \"Ich wohne im Erdgeschoss. Mein Vater ist der Vermieter.\"\n\n\"Du bist die Tochter des Vermieters?\", sagte ich.\n\n\"Ja\", sagte sie. \"Ich komme oft hier ins Loft. Hier habe ich meine Ruhe. Ich mag den Ausblick auf den Main. Der silberne BMW war nicht auf dem Parkplatz. Und ich dachte ...\"\n\n\"Niemand ist zu Hause?\", fragte ich.\n\nSie nickte.\n\n\"Dino\", sagte ich und gab ihr meine Hand. \"Es ist gut, dass du hier bist. Frankfurt ist so eine langweilige Stadt.\"\n\n\"Moomendemal!\", sagte Christa.\n\n\"Wie bitte?\", sagte ich.\n\nChrista lachte und sagte: \"Verstehst du kein Hessisch? Ich habe gesagt: Moment mal! Frankfurt ist keine langweilige Stadt.\"\n\n\"Aber man kann hier nichts machen\", sagte ich. \"Nur arbeiten und einkaufen.\"\n\nChrista schüttelte den Kopf. \"Komm, wir gehen jetzt erst einmal einen Äbbelwoi trinken.\"\n\n\"Was? Moment!\", sagte ich. \"Ich ... vielleicht habe ich andere Pläne ...\"\n\n\"Und? Hast du andere Pläne?\", fragte sie.\n\n\"Äh ... nein\", sagte ich.\n\n\"Gut, ich auch nicht\", sagte Christa. \"Komm!\"\n\n## Übung\n\n**1. Was hat Dino gemacht, als Christa in die Wohnung kam?**\n\na) Er hat geschlafen.\n\nb) Er hat geduscht.\n\nc) Er hat ferngesehen.\n\n**2. Wer ist Christa?**\n\na) Die Schwester von Alfredo.\n\nb) Die Tochter des Vermieters.\n\nc) Eine Freundin von Alfredo.\n\n**3. Warum dachte Christa, dass niemand in der Wohnung ist?**\n\na) Die Tür war offen.\n\nb) Der silberne BMW war nicht auf dem Parkplatz.\n\nc) Sie hat niemanden gehört.\n\n**4. Was will Christa mit Dino machen?**\n\na) In ein Museum gehen.\n\nb) Einen Äbbelwoi trinken gehen.\n\nc) Spazieren gehen.\n\n**5. Was bedeutet \"Moomendemal!\" auf Hessisch?**\n\na) Guten Morgen!\n\nb) Moment mal!\n\nc) Auf Wiedersehen!"},{"title":"🍷 Handkäse mit Musik","content":"Christa und ich sitzen in einer Apfelwein-Kneipe in Sachsenhausen. Das ist ein Stadtteil in Frankfurt mit vielen Restaurants und Kneipen. Hier gibt es keine Wolkenkratzer. Alles ist klein und traditionell.\n\n\"Wie schmeckt der Äbbelwoi?\", fragt Christa und zeigt auf mein Glas.\n\n\"Sehr sauer\", sage ich.\n\nChrista lacht.\n\n\"Okay, hör zu!\", sagt Christa. \"Der Krug hier, das ist der Bembel. In dem Bembel ist Apfelwein. Ich habe den Apfelwein mit Mineralwasser gemischt. Das heißt Saurer.\"\n\n\"Okay\", sage ich.\n\n\"Es gibt auch eine süße Variante\", sagt Christa.\n\n\"Wirklich?\", sage ich.\n\n\"Ja\", sagt Christa. \"Das ist Apfelwein mit Limonade.\"\n\nIch habe Kopfschmerzen. Zu viele Wörter, oder zu viel Wein?\n\nIn der Kneipe sitzen Touristen und Einheimische zusammen. In einer Ecke sitzt eine Gruppe amerikanischer Touristen. Sie singen Lieder aus den 80er Jahren. Am Tisch neben uns sitzt ein Mann und eine Frau. Sie trinken ihren Äbbelwoi.\n\n\"Schau mal\", sagt Christa und zeigt auf einen japanischen Touristen mit einer Brille. Der Japaner sitzt ganz alleine an einem großen Tisch. Vor ihm steht ein großer Bembel und ein Teller voll mit Fleisch.\n\n\"Schläft er?\", frage ich. \"Er bewegt sich nicht.\"\n\nPlötzlich fällt der Tourist mit dem Kopf auf den Tisch. Sein Gesicht landet auf dem Teller. Er schnarcht.\n\n\"Keine Sorge! Das passiert hier jeden Tag\", sagt Christa. \"Oh, da kommt der nächste Bembel.\"\n\n\"Was ist das?\", frage ich. \"Riechst du das?\"\n\n\"Ja. Ich habe Handkäse mit Musik bestellt\", sagt Christa. \"Hier, nimm ein Stück!\"\n\nChrista gibt mir ein Stück Handkäse. Ich versuche, nicht durch die Nase zu atmen.\n\n\"Wie schmeckt es?\", fragt Christa. Ich kaue. \"Gut?\", fragt sie. Ich schlucke. \"Noch ein Stück?\". Ich schüttle den Kopf und sage: \"Gib mir Äbbelwoi!\"\n\nIch trinke schnell ein großes Glas. Dann sage ich: \"Der Handkäse ist ... okay. Aber wo ist die Musik?\"\n\n\"Die Musik kommt später\", sagt Christa und lacht.\n\n\"Verstehe ich nicht\", sage ich.\n\n\"Hast du schon einmal Bohnen gegessen?\", fragt Christa. \"Der Handkäse macht dieselbe 'Musik'!\"\n\nIch trinke meinen Apfelwein. Die amerikanischen Touristen singen keine Lieder mehr. Sie haben zu viel getrunken.\n\n\"Schau\", sage ich und zeige auf den japanischen Touristen. Er öffnet seine Augen, hebt den Kopf und schaut auf seine Uhr. Dann nimmt er einen schwarzen Koffer und verlässt die Kneipe.\n\n## Übung\n\n**1. In welchem Stadtteil ist die Apfelwein-Kneipe?**\n\na) In der Innenstadt\n\nb) In Sachsenhausen\n\nc) Am Mainufer\n\n**2. Was ist ein Bembel?**\n\na) Ein Glas für Bier\n\nb) Ein Krug für Apfelwein\n\nc) Ein Teller für Handkäse\n\n**3. Was bedeutet \"Saurer\"?**\n\na) Apfelwein mit Limonade\n\nb) Apfelwein mit Mineralwasser\n\nc) Apfelwein ohne Wasser\n\n**4. Was passiert mit dem japanischen Touristen?**\n\na) Er schläft ein und fällt mit dem Kopf auf den Tisch.\n\nb) Er bezahlt und geht.\n\nc) Er singt mit den amerikanischen Touristen.\n\n**5. Was bedeutet \"Handkäse mit Musik\"?**\n\na) Handkäse mit einer CD\n\nb) Handkäse, der Blähungen verursacht\n\nc) Handkäse mit einem Konzert"},{"title":"🏗️ 200 Meter über Frankfurt","content":"Nach der Apfelweinkneipe sind Christa und ich in der Frankfurter Altstadt spazieren gegangen.\n\nChrista hat mir den Römer gezeigt. So heißt das Rathaus Frankfurts. Es ist ein sehr altes Haus. \"Warum Römer?\", fragte ich Christa. \"Warum nicht Deutscher oder Frankfurter?\"\n\n\"Ich weiß nicht\", sagte Christa und lachte. \"Ich glaube, hier war einmal ein römisches Militärlager.\"\n\n\"Wie alt sind diese Häuser?\", fragte ich und zeigte auf ein paar Fachwerkhäuser auf der anderen Seite.\n\n\"Das sind Rekonstruktionen aus den 80er Jahren\", sagte Christa. \"Die Originale wurden im Zweiten Weltkrieg zerstört.\"\n\n\"Oh\", sagte ich. \"Das ist schade.\"\n\nDas Wetter war gut. Der Himmel war blau und die Sonne schien. Christa und ich sind am Mainufer spazieren gegangen. Es ist nett dort. Man kann auf grünen Wiesen am Ufer sitzen.\n\nDanach sind wir zum Maintower gegangen. Das ist ein Wolkenkratzer mit einer Aussichtsplattform. Man muss Eintritt bezahlen und durch einen Sicherheitscheck gehen, wie im Flughafen. Dann kann man mit dem Fahrstuhl 200 Meter nach oben fahren.\n\nVon der Plattform aus hat man eine gute Aussicht über Frankfurt. \"Es gibt hier vielleicht nicht so viele Wolkenkratzer wie in New York oder London, aber die zehn höchsten Gebäude Deutschlands sind alle in Frankfurt\", sagte Christa.\n\nEs wurde langsam Abend. Der Himmel war rot. \"Was ist das?\", fragte ich und zeigte auf ein paar Berge. \"Die Alpen?\"\n\n\"Machst du Witze?\", sagte Christa. \"Das ist der Taunus!\"\n\n\"Ja\", sagte ich und lachte. \"Ich mache Witze.\"\n\nWir standen still auf der Aussichtsplattform, 200 Meter über Frankfurt. Hinter den Bergen ging die Sonne langsam unter.\n\nChrista gähnte und sagte: \"So, jetzt hast du Frankfurt gesehen. Du hast recht, es ist ein bisschen langweilig hier.\"\n\n\"Nein\", sagte ich. \"Ich habe sehr viel gesehen heute. Frankfurt ist sehr interessant!\"\n\n\"Ich hoffe, du sagst das nicht nur\", sagte Christa.\n\n\"Nein, ehrlich\", sagte ich.\n\n## Übung\n\n**1. Wie heißt das Rathaus von Frankfurt?**\n\na) Der Dom\n\nb) Der Römer\n\nc) Das Schloss\n\n**2. Warum sind die Fachwerkhäuser in der Altstadt Rekonstruktionen?**\n\na) Sie wurden im Zweiten Weltkrieg zerstört.\n\nb) Sie waren zu alt und baufällig.\n\nc) Sie wurden durch einen Brand zerstört.\n\n**3. Was ist der Maintower?**\n\na) Eine alte Kirche\n\nb) Ein Wolkenkratzer mit Aussichtsplattform\n\nc) Ein Museum\n\n**4. Wie hoch ist der Maintower ungefähr?**\n\na) 100 Meter\n\nb) 200 Meter\n\nc) 300 Meter\n\n**5. Was sieht Dino von der Aussichtsplattform?**\n\na) Die Alpen\n\nb) Den Taunus\n\nc) Das Meer"},{"title":"🍕 Fast wie zu Hause","content":"Heute ist mein Gepäck angekommen. Endlich! Ich habe gefragt, was das Problem war. Man hat mir gesagt, dass mein Koffer nie in Frankfurt angekommen ist. Er ist mit einem anderen Flugzeug von Palermo nach Marrakesch geflogen.\n\nDer Koffer sieht nicht gut aus. Er hat viele Beulen und Kratzer. Aber alle meine Sachen sind noch da. Jetzt muss ich nicht mehr die Kleidung meines Bruders tragen.\n\nApropos, heute habe ich mit Alfredo Mittag gegessen. Zum ersten Mal seit sieben Tagen hat er Zeit für mich gefunden.\n\nWir sind in ein kleines italienisches Restaurant gegangen. \"Die Pizza und Pasta hier ist fast wie zu Hause\", sagte Alfredo. \"Was willst du trinken?\"\n\n\"Wasser\", sagte ich.\n\n\"Kein Bier?\", fragte Alfredo.\n\n\"Nein\", sagte ich. \"Ich habe einen Kater von dem Apfelwein.\"\n\n\"Apfelwein?\", fragte Alfredo.\n\n\"Es ist eine lange Geschichte\", sagte ich.\n\n## Übung\n\n**1. Was ist mit Dinos Gepäck passiert?**\n\na) Es ist in Frankfurt angekommen.\n\nb) Es ist nach Marrakesch geflogen.\n\nc) Es ist gestohlen worden.\n\n**2. Wie sieht der Koffer jetzt aus?**\n\na) Er ist neu und sauber.\n\nb) Er hat viele Beulen und Kratzer.\n\nc) Er ist komplett zerstört.\n\n**3. Wie oft hat Alfredo Zeit für Dino gefunden?**\n\na) Jeden Tag\n\nb) Zum ersten Mal seit sieben Tagen\n\nc) Nie\n\n**4. Was essen Dino und Alfredo?**\n\na) Deutsche Spezialitäten\n\nb) Italienisches Essen\n\nc) Asiatisches Essen\n\n**5. Warum will Dino kein Bier trinken?**\n\na) Er mag kein Bier.\n\nb) Er hat einen Kater vom Apfelwein.\n\nc) Er muss noch arbeiten."},{"title":"🚉 Sechs Stunden Aufenthalt","content":"Heute Morgen hat Alfredo mich geweckt. \"Dino, wach auf!\", sagte er. \"Ich muss nach New York fliegen. Ich habe einen Notfall. Du musst etwas für mich tun.\"\n\n\"Was?\", fragte ich und rieb mir die Augen.\n\n\"Mein Kollege Michael kommt heute aus München. Er hat einen Zwischenstopp in Frankfurt. Sein Flug hat sechs Stunden Aufenthalt. Du musst ihn abholen und ihm die Stadt zeigen.\"\n\n\"Aber ich kenne Frankfurt doch gar nicht!\", sagte ich.\n\n\"Das macht nichts\", sagte Alfredo. \"Michael war noch nie in Frankfurt. Zeig ihm einfach, was du gesehen hast. Den Römer, den Main, den Maintower ...\"\n\n\"Und Apfelwein?\", fragte ich.\n\n\"Ja, aber nicht zu viel!\", sagte Alfredo und lachte. \"Hier ist seine Handynummer. Ruf ihn an, wenn er landet.\"\n\nDann ist Alfredo gegangen.\n\nIch habe geduscht, mich angezogen und bin zum Flughafen gefahren. Am Flughafen habe ich Michael angerufen. \"Hallo, Michael? Ich bin Dino, Alfredos Bruder. Ich warte am Ausgang.\"\n\n\"Perfekt\", sagte Michael. \"Ich komme gleich.\"\n\nMichael war ein großer Mann mit einer Brille und einem grauen Anzug. \"Dino!\", rief er und gab mir die Hand. \"Schön, dich kennenzulernen. Alfredo hat viel von dir erzählt.\"\n\n\"Wirklich?\", fragte ich.\n\n\"Ja\", sagte Michael. \"Du studierst doch in Frankfurt, oder?\"\n\nIch schwieg. Alfredo hat gelogen. Er hat gesagt, dass ich studiere. \"Äh ... ja\", sagte ich. \"Ich studiere Deutsch.\"\n\n\"Ah, sehr gut!\", sagte Michael. \"Dann kannst du mir ja alles erklären.\"\n\n\"Natürlich\", sagte ich.\n\nWir sind mit der S-Bahn in die Stadt gefahren. Ich habe Michael den Römer gezeigt, den Main und den Maintower. Wir sind in eine Apfelwein-Kneipe gegangen und haben einen Äbbelwoi getrunken.\n\n\"Das ist eine interessante Stadt\", sagte Michael. \"Ganz anders als München.\"\n\n\"Ja\", sagte ich. \"Frankfurt ist ... besonders.\"\n\nDann habe ich Michael wieder zum Flughafen gebracht. \"Vielen Dank, Dino\", sagte Michael. \"Es war ein schöner Tag. Sag Alfredo, ich rufe ihn an.\"\n\n\"Mach ich\", sagte ich.\n\nMichael ist in den Flughafen gegangen. Ich bin nach Hause gefahren. Alfredo hat mich angelogen. Aber ich habe auch gelogen. Vielleicht ist das normal in Frankfurt.\n\n## Übung\n\n**1. Warum muss Alfredo nach New York fliegen?**\n\na) Er hat Urlaub.\n\nb) Er hat einen Notfall.\n\nc) Er muss eine Konferenz besuchen.\n\n**2. Wer ist Michael?**\n\na) Alfredos Bruder\n\nb) Alfredos Kollege aus München\n\nc) Ein Freund von Dino\n\n**3. Wie lange hat Michael Aufenthalt in Frankfurt?**\n\na) Drei Stunden\n\nb) Sechs Stunden\n\nc) Acht Stunden\n\n**4. Was hat Alfredo über Dino erzählt?**\n\na) Dino arbeitet in einer Bank.\n\nb) Dino studiert in Frankfurt.\n\nc) Dino ist arbeitslos.\n\n**5. Was machen Dino und Michael zusammen?**\n\na) Sie besichtigen die Stadt und trinken Apfelwein.\n\nb) Sie gehen ins Kino.\n\nc) Sie bleiben am Flughafen."},{"title":"🚨 Blaulicht im Rotlichtviertel","content":"Es ist jetzt Abend. Ich bin allein in Alfredos Loft. Ich schaue fern. Plötzlich höre ich ein Geräusch. Es kommt von der Straße. Ich gehe zum Fenster und schaue nach unten.\n\nAuf der Straße stehen drei Polizeiautos mit Blaulicht. Die Polizisten laufen in ein Gebäude auf der anderen Straßenseite. Ich öffne das Fenster und höre Stimmen. Die Polizisten schreien: \"Polizei! Hände hoch!\"\n\nIch habe Angst. Was ist passiert?\n\nDann sehe ich Christa. Sie steht auf der Straße und schaut zu. Ich rufe: \"Christa! Was ist los?\"\n\nSie schaut nach oben. \"Dino! Komm runter!\"\n\nIch ziehe mir schnell eine Jacke an und laufe nach unten. Christa steht immer noch auf der Straße.\n\n\"Was ist passiert?\", frage ich.\n\n\"Ein Überfall\", sagt Christa. \"Jemand hat eine Bank überfallen. Die Polizei sucht den Täter.\"\n\n\"Eine Bank?\", frage ich. \"Hier?\"\n\n\"Ja\", sagt Christa. \"Das ist das Rotlichtviertel. Hier gibt es viele Banken, aber auch viele Bars und Nachtclubs.\"\n\nIch sehe die Polizisten. Sie bringen einen Mann in Handschellen aus dem Gebäude. Der Mann hat eine Kapuze auf dem Kopf. Ich kann sein Gesicht nicht sehen.\n\n\"Der Täter?\", frage ich.\n\n\"Ja\", sagt Christa. \"Die Polizei hat ihn gefasst.\"\n\nDie Polizisten setzen den Mann in ein Polizeiauto. Dann fahren die Autos mit Blaulicht davon.\n\n\"Das war ja aufregend\", sage ich.\n\n\"Das ist Frankfurt\", sagt Christa und lacht. \"Langweilig ist es hier nie.\"\n\n\"Stimmt\", sage ich. \"Aber ich habe Hunger. Hast du Lust auf eine Pizza?\"\n\n\"Gute Idee\", sagt Christa. \"Ich kenne eine gute Pizzeria in der Nähe.\"\n\nWir gehen zusammen durch die Straßen. Die Lichter der Stadt leuchten. Frankfurt ist eine Stadt der Gegensätze. Banken und Rotlichtviertel, Wolkenkratzer und Fachwerkhäuser, Apfelwein und Pizza. Vielleicht ist das gar nicht so schlecht.\n\n## Übung\n\n**1. Was sieht Dino von seinem Fenster aus?**\n\na) Ein Feuer\n\nb) Polizeiautos mit Blaulicht\n\nc) Eine Demonstration\n\n**2. Was ist passiert?**\n\na) Ein Unfall\n\nb) Ein Banküberfall\n\nc) Ein Streit\n\n**3. Wo ist das passiert?**\n\na) Im Bankenviertel\n\nb) Im Rotlichtviertel\n\nc) In der Altstadt\n\n**4. Was ist mit dem Täter passiert?**\n\na) Er ist geflohen.\n\nb) Die Polizei hat ihn gefasst.\n\nc) Er hat sich versteckt.\n\n**5. Was machen Dino und Christa danach?**\n\na) Sie gehen nach Hause.\n\nb) Sie gehen Pizza essen.\n\nc) Sie gehen in eine Bar."},{"title":"🌍 Alle Städte, ein Preis","content":"Meine Zeit in Frankfurt ist fast vorbei. In drei Tagen fliege ich zurück nach Sizilien. Aber diesmal mit Gepäck.\n\nIch habe viel gelernt in Frankfurt. Ich habe gelernt, dass es zwei Städte mit dem Namen Frankfurt gibt. Ich habe gelernt, dass Apfelwein sauer schmeckt und dass Handkäse \"Musik\" machen kann. Ich habe gelernt, dass man in Frankfurt alles kaufen kann, von italienischer Mode bis zu Meerschweinchen.\n\nUnd ich habe Christa kennengelernt.\n\nHeute Abend sitze ich mit Christa in einer Apfelwein-Kneipe. Es ist unsere letzte gemeinsame Nacht.\n\n\"Wirst du mich vermissen?\", fragt Christa.\n\n\"Ja\", sage ich. \"Sehr sogar.\"\n\n\"Und was machst du jetzt?\", fragt sie. \"Gehst du zurück nach Sizilien?\"\n\n\"Ja\", sage ich. \"Aber nur für ein paar Wochen. Dann komme ich zurück nach Deutschland.\"\n\n\"Nach Frankfurt?\", fragt Christa.\n\n\"Ich weiß nicht\", sage ich. \"Vielleicht. Oder nach Berlin. Oder nach München. Oder nach Köln.\"\n\n\"Warum so viele Städte?\", fragt Christa.\n\n\"Ich möchte Deutschland kennenlernen\", sage ich. \"Alle Städte haben etwas Besonderes. Berlin ist multikulti, Frankfurt ist das Finanzzentrum, München ist traditionell, Köln ist freundlich ...\"\n\n\"Und was ist mit mir?\", fragt Christa.\n\nIch schweige. Dann sage ich: \"Du kannst mich besuchen. Egal, wo ich bin.\"\n\nChrista lächelt. \"Das ist ein Versprechen?\"\n\n\"Ja\", sage ich. \"Das ist ein Versprechen.\"\n\nWir trinken unseren Apfelwein. Draußen regnet es. Die Lichter der Stadt spiegeln sich im nassen Asphalt.\n\n\"Alle Städte, ein Preis\", sage ich.\n\n\"Was?\", fragt Christa.\n\n\"Nichts\", sage ich. \"Nur so ein Gedanke.\"\n\nChrista nimmt meine Hand. \"Dino\", sagt sie. \"Ich werde dich vermissen.\"\n\n\"Ich dich auch\", sage ich.\n\nWir sitzen noch lange in der Kneipe. Dann gehen wir nach Hause. Morgen ist ein neuer Tag. Und übermorgen fliege ich nach Sizilien. Aber ich komme zurück. Das ist sicher.\n\n## Übung\n\n**1. Wie lange bleibt Dino noch in Frankfurt?**\n\na) Einen Tag\n\nb) Drei Tage\n\nc) Eine Woche\n\n**2. Was hat Dino in Frankfurt gelernt?**\n\na) Dass Apfelwein süß schmeckt.\n\nb) Dass es zwei Städte mit dem Namen Frankfurt gibt.\n\nc) Dass Handkäse keine Musik macht.\n\n**3. Wohin fliegt Dino als nächstes?**\n\na) Nach Berlin\n\nb) Nach Sizilien\n\nc) Nach München\n\n**4. Was verspricht Dino Christa?**\n\na) Dass er in Frankfurt bleibt.\n\nb) Dass sie ihn besuchen kann, egal wo er ist.\n\nc) Dass er sie heiratet.\n\n**5. Was bedeutet \"Alle Städte, ein Preis\"?**\n\na) Alle Städte sind gleich teuer.\n\nb) Alle Städte haben ihren eigenen Charme.\n\nc) Alle Städte haben die gleichen Probleme."},{"title":"Answer Key","content":"**Chapter 1:** 1. b, 2. a, 3. c\n\n**Chapter 2:** 1. a, 2. b, 3. b, 4. b, 5. a\n\n**Chapter 3:** 1. b, 2. b, 3. b, 4. b, 5. a\n\n**Chapter 4:** 1. b, 2. b, 3. b, 4. b, 5. b\n\n**Chapter 5:** 1. b, 2. b, 3. b, 4. a, 5. b\n\n**Chapter 6:** 1. b, 2. a, 3. b, 4. b, 5. b\n\n**Chapter 7:** 1. b, 2. b, 3. b, 4. b, 5. b\n\n**Chapter 8:** 1. b, 2. b, 3. b, 4. b, 5. a\n\n**Chapter 9:** 1. b, 2. b, 3. b, 4. b, 5. b\n\n**Chapter 10:** 1. b, 2. b, 3. b, 4. b, 5. b"},{"title":"About the Author","content":"André Klein was born in Germany, has grown up and lived in many different places including Thailand, Sweden and Israel. He has produced two music albums, performed and organized literary readings, curated an experimental television program and is the author of various short stories and non-fiction works."},{"title":"Acknowledgements","content":"Special thanks to Vivian Farago, Dennis Thompson, Andrew Schur, Rosy Limbach, Eti Shani and Marilyn Robertson.\n\nThis book is an independent production. Did you find any typos or broken links? Send an email to the author at andre@learnoutlive.com and if your suggestion makes it into the next edition, your name will be listed here."},{"title":"You Might Also Like","content":"**Mord am Morgen** - In an abandoned house at the outskirts of a small town, an unidentified body has been found. Can you help Kommissar Harald Baumgartner and his colleague Katharina Momsen solve this case and improve your vocabulary along the way?\n\n**Karneval in Köln** - In this third episode of the Dino lernt Deutsch series, Dino explores the carnival season in Cologne and discovers more about German culture.\n\n**Momente in München** - Join Dino on his journey to Munich, the heart of Bavaria, and experience the contrasts between tradition and modernity.\n\n**Ahoi aus Hamburg** - A picture book for the young and young at heart about an unusual friendship between two pets."}];

const CAFE_ANSWERS=[[],['a','a','c','c','b'],['c','b','a','b','a','c'],['c','a','b','a','c','a'],['a','b','c','a','a'],['b','c','b','c','c','b'],['a','c','b','a','b','c'],['b','b','b','a','a'],['a','c','b','a','b','c'],['a','b','a','a','a'],['a','b','b','c','b','b','c']];
function cafeDisplayTitle(title){return String(title).replace(/^(.+?)\s+Chapter\s+\d+:\s*/,'$1 ');}
function parseCafeExercise(content, chapterIndex){
  const m=content.split(/\n## Übung\s*\n/i);
  if(m.length!==2) return {main:content,exercise:[]};
  const main=m[0], ex=m[1];
  const blocks=[];
  const re=/\*\*(\d+)\.\s*([^*]+)\*\*\s*\n([\s\S]*?)(?=\n\s*\*\*\d+\.\s|$)/g;
  let q;
  while((q=re.exec(ex))){
    const num=Number(q[1]);
    const question=q[2].trim();
    const options=[];
    const optRe=/(?:^|\n)\s*([abc])\)\s*([^\n]+?)(?=\n\s*[abc]\)\s|$)/g;
    let o;
    while((o=optRe.exec(q[3]))) options.push({letter:o[1],text:o[2].trim()});
    blocks.push({num,question,options,answer:(CAFE_ANSWERS[chapterIndex]||[])[num-1]||null});
  }
  return {main,exercise:blocks};
}
function renderCafeExercise(blocks){
  if(!blocks.length) return '';
  const id='exercise-'+Math.random().toString(36).slice(2,9);
  return `<div class="section"><button class="exercise-toggle" type="button" aria-expanded="false" aria-controls="${id}" onclick="toggleExercise('${id}',this)"><span>✍️ Übung</span><span class="exercise-chevron" aria-hidden="true">＋</span></button><div id="${id}" class="cafe-exercises" hidden style="display:none">${blocks.map(b=>`<div class="cafe-exercise-card"><div class="cafe-exercise-question">${b.num}. ${esc(b.question)}</div>${b.options.map(o=>`<button class="cafe-exercise-option" type="button" data-answer="${esc(o.letter)}" data-correct="${esc(b.answer||'')}" onclick="checkCafeAnswer(this)">${esc(o.letter)}) ${esc(o.text)}</button>`).join('')}<div class="cafe-exercise-feedback" aria-live="polite"></div></div>`).join('')}</div></div>`;
}
function toggleExercise(id,btn){
  const el=document.getElementById(id);
  if(!el) return;
  const open=el.hidden || el.style.display==='none';
  el.hidden=!open;
  el.style.display=open?'grid':'none';
  btn.setAttribute('aria-expanded',String(open));
  const icon=btn.querySelector('.exercise-chevron');
  if(icon) icon.textContent=open?'−':'＋';
}
function checkCafeAnswer(btn){
  const card=btn.closest('.cafe-exercise-card');
  if(!card) return;
  const correct=card.querySelector('[data-correct]')?.dataset.correct||'';
  const chosen=btn.dataset.answer;
  const feedback=card.querySelector('.cafe-exercise-feedback');
  const correctBtn=card.querySelector(`[data-answer="${correct}"]`);
  card.querySelectorAll('.cafe-exercise-option').forEach(b=>{b.classList.remove('correct','wrong');});
  if(chosen===correct){btn.classList.add('correct');if(feedback)feedback.innerHTML='✓ Correct. The answer matches the exercise key.';}
  else{btn.classList.add('wrong');const answerText=correctBtn?.textContent?.trim()||correct.toUpperCase();if(feedback)feedback.innerHTML=`✗ Not quite. The correct answer is <strong>${esc(answerText)}</strong>. Read the question again and look for the matching detail in the text.`;}
}
function cafeRichText(text){
  const used=new Set();
  return text.split(/(\*\*[^*]+\*\*)/g).map(part=>{
    if(part.startsWith('**') && part.endsWith('**')){
      const raw=part.slice(2,-2); const key=raw.toLocaleLowerCase();
      if(used.has(key)) return esc(raw); used.add(key);
      const en=resolveTermTranslation(raw);
      if(!en) return esc(raw);
      return `<span class="term-link" onclick='event.stopPropagation();speak(${JSON.stringify(raw)})' aria-label="${esc(en)}">${esc(raw)}<span class="term-tip">${esc(en)}</span></span>`;
    }
    return esc(part);
  }).join('').replace(/\n/g,'<br>');
}
function renderCafeContent(markdown,isChapter){
  let source=cleanBookMarkup(markdown||'');
  if(isChapter) source=source.replace(/^#\s+[^\n]*\n*/,'');
  const blocks=source.split(/\n\s*\n/);
  return blocks.map(block=>{
    const text=block.trim();
    if(!text) return '';
    if(/^###\s+/.test(text)) return `<h3 class="cafe-subheading">${cafeRichText(text.replace(/^###\s+/,''))}</h3>`;
    if(/^##\s+/.test(text)) return `<h3 class="cafe-subheading">${cafeRichText(text.replace(/^##\s+/,''))}</h3>`;
    if(/^#\s+/.test(text)) return `<h2 class="cafe-subheading">${cafeRichText(text.replace(/^#\s+/,''))}</h2>`;
    if(/^\d+\.\s+/.test(text)){
      const lines=text.split('\n').map(line=>line.trim()).filter(Boolean);
      return `<div class="cafe-reading-list">${lines.map(line=>`<div>${cafeRichText(line)}</div>`).join('')}</div>`;
    }
    return `<p>${cafeRichText(text).replace(/\n/g,'<br>')}</p>`;
  }).join('');
}
function renderCafeTopic(i){
  const t=CAFE_DATA[i];
  if(!t) return '<div class="empty">Noch kein Kapitel.</div>';
  const isChapter=i>=1 && i<=10;
  const parsed=isChapter?parseCafeExercise(t.content,i):{main:t.content,exercise:[]};
  const chapterText=parsed.main.replace(/\*\*/g,'').replace(/^#\s+[^\n]*\n*/,'').replace(/\n+/g,' ');
  return `<button class="back" onclick="${level==='lesen'?'showLessonBooks()':'window.scrollTo({top:0,behavior:\'smooth\'})'}">← ${level==='lesen'?'Bücher':'Kapitel'}</button><h2 class="cafe-chapter-heading" onclick='speak(${JSON.stringify(chapterText)})' title="Kapitel anhören">${esc(normalizeTopicTitle(cafeDisplayTitle(t.title),true))}</h2><div class="cafe-reading">${renderCafeContent(parsed.main,isChapter)}</div>${renderCafeExercise(parsed.exercise)}`;
}

let cachedGermanFemaleVoice=null;
let cachedGermanMaleVoice=null;
function getGermanVoice(role){
  if(!('speechSynthesis' in window)) return null;
  const voices=speechSynthesis.getVoices().filter(v=>/^de(-|_)/i.test(v.lang||''));
  if(!voices.length) return null;
  if(cachedGermanFemaleVoice && role==='A') return cachedGermanFemaleVoice;
  if(cachedGermanMaleVoice && role==='B') return cachedGermanMaleVoice;

  const femaleHints=['female','frau','katja','anna','hedda','petra','vicki','marie','susan','german female','google deutsch weib'];
  const maleHints=['male','herr','stefan','markus','michael','thomas','andreas','martin','daniel','david','jan','lukas','hans','klaus','conrad','german male','google deutsch männ'];
  const hints=role==='A'?femaleHints:maleHints;
  const hinted=voices.find(v=>hints.some(h=>(v.name||'').toLowerCase().includes(h)));

  if(role==='A'){
    cachedGermanFemaleVoice=hinted || voices.find(v=>/^de-DE$/i.test(v.lang)) || voices[0];
    return cachedGermanFemaleVoice;
  }

  cachedGermanMaleVoice=hinted || voices.find(v=>v!==cachedGermanFemaleVoice && /^de-DE$/i.test(v.lang)) || voices.find(v=>v!==cachedGermanFemaleVoice) || voices[0];
  return cachedGermanMaleVoice;
}
if('speechSynthesis' in window){
  speechSynthesis.addEventListener('voiceschanged',()=>{cachedGermanFemaleVoice=null;cachedGermanMaleVoice=null;getGermanVoice('A');getGermanVoice('B');});
}
function speakWithRole(text,role){
  if(!('speechSynthesis' in window)) return;
  const u=new SpeechSynthesisUtterance(String(text||''));
  u.lang='de-DE';
  u.rate=.95;
  u.volume=1.12;
  u.pitch=role==='A'?1.06:.98;
  const voice=getGermanVoice(role);
  if(voice) u.voice=voice;
  speechSynthesis.speak(u);
}
function speakDialogue(i){
  const t=DIALOGUE_DATA[i];
  if(!t || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const pairs=[];
  for(let j=0;j<t.rows.length;j+=2){ pairs.push([t.rows[j], t.rows[j+1] || ['', '', '', '']]); }
  let index=0;
  const playNext=()=>{
    if(index>=pairs.length) return;
    const a=String(pairs[index][0]?.[0]||'').trim();
    const b=String(pairs[index][1]?.[0]||'').trim();
    index+=1;
    const parts=[];
    if(a) parts.push({text:a,role:'A'});
    if(b) parts.push({text:b,role:'B'});
    let k=0;
    const nextPart=()=>{
      if(k>=parts.length){playNext();return;}
      const part=parts[k++];
      const u=new SpeechSynthesisUtterance(part.text);
      u.lang='de-DE';
      u.rate=.95;
      u.volume=1.12;
      u.pitch=part.role==='A'?1.06:.98;
      const voice=getGermanVoice(part.role);
      if(voice) u.voice=voice;
      u.onend=nextPart;
      speechSynthesis.speak(u);
    };
    nextPart();
  };
  playNext();
}

let themaUtterance=null;
function speak(text){
  const textValue=String(text||'').trim();
  if(!textValue) return;
  const synth=window.speechSynthesis;
  if(!synth || typeof window.SpeechSynthesisUtterance!=='function'){
    console.warn('Speech synthesis is unavailable in this browser.');
    return;
  }
  try{
    synth.cancel();
    const u=new SpeechSynthesisUtterance(textValue);
    u.lang='de-DE';
    u.rate=.88;
    u.pitch=1;
    const voices=synth.getVoices ? synth.getVoices() : [];
    const deVoice=voices.find(v=>/^de(-|_)/i.test(v.lang)) || voices.find(v=>/german|deutsch/i.test(v.name||''));
    if(deVoice) u.voice=deVoice;
    themaUtterance=u;
    const play=()=>{try{ synth.speak(themaUtterance); }catch(err){ console.warn('Speech synthesis failed:',err); }};
    if(synth.getVoices && !voices.length){
      setTimeout(play,80);
    }else{
      play();
    }
  }catch(err){
    console.warn('Speech synthesis failed:',err);
  }
}

function parseBookExercise(content, answers){
  const m=String(content||'').split(/\n## Übung\s*\n/i);
  if(m.length!==2) return {main:content,exercise:[]};
  const main=m[0], ex=m[1], blocks=[];
  const re=/\*\*(\d+)\.\s*([^*]+)\*\*\s*\n([\s\S]*?)(?=\n\s*\*\*\d+\.\s|$)/g;
  let q;
  while((q=re.exec(ex))){
    const num=Number(q[1]), question=q[2].trim(), options=[];
    const optRe=/(?:^|\n)\s*([abc])\)\s*([^\n]+?)(?=\n\s*[abc]\)\s|$)/g;
    let o; while((o=optRe.exec(q[3]))) options.push({letter:o[1],text:o[2].trim()});
    blocks.push({num,question,options,answer:(answers[num-1]||null)});
  }
  return {main,exercise:blocks};
}
function renderFrankfurtTopic(i){
  const t=FRANKFURT_DATA[i];

}

function normalizeTopicTitle(title, moveEmojiToStart=false){
  if(!moveEmojiToStart) return title;
  const text=String(title).trim();
  const emojiRegex=/\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*/gu;
  const matches=[...text.matchAll(emojiRegex)];
  if(!matches.length) return text;
  const emoji=matches[0][0];
  const clean=text.replace(emojiRegex,'').replace(/\s+/g,' ').trim();
  return `${emoji} ${clean}`.trim();
}

function renderCultureNote(title){
  const t=String(title||'').toLowerCase();
  const notes=[];
  if(t.includes('kaufen')||t.includes('supermarkt')) notes.push('In Germany, many shops use the euro, and bottle or can deposits ("Pfand") are common on returnable and many single-use beverage containers.');
  else if(t.includes('schule')) notes.push('German schools commonly use terms such as Klasse, Unterricht and Pause. School routines and timetables vary by state and school type.');
  else if(t.includes('morgen')||t.includes('frühstück')) notes.push('Breakfast habits in Germany vary widely: bread, rolls, cheese, cold cuts and muesli are all common choices.');
  else if(t.includes('park')) notes.push('German parks are often used for walking, jogging, cycling, relaxing and meeting friends, especially on warm days.');
  else if(t.includes('wohnung')||t.includes('schlüssel')) notes.push('In Germany, apartment buildings often have shared entrances and neighbours are expected to be considerate about noise and shared spaces.');
  else if(t.includes('arzt')||t.includes('krank')) notes.push('For many everyday situations in Germany, appointments are common. Learners will often hear words such as Termin, Praxis and Krankmeldung.');
  else if(t.includes('arbeit')||t.includes('job')) notes.push('German workplace language often distinguishes between informal and formal communication, especially with colleagues, customers and supervisors.');
  if(!notes.length) return '';
  return `<div class="section culture-note-section"><div class="section-title">🇩🇪 Cultural Note</div><div class="section-note culture-note-text">${esc(notes[0])}</div></div>`;
}

function toggleSpeechRecognition(){
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=document.getElementById('sprechenRecognitionBtn');
  const out=document.getElementById('sprechenTranscript');
  if(!Recognition){ if(out) out.textContent='Speech recognition is not supported in this browser. Try Chrome or Edge.'; return; }
  if(speechRecognitionRunning){ speechRecognition?.stop(); return; }
  speechRecognition=new Recognition();
  speechRecognition.lang='de-DE'; speechRecognition.interimResults=true; speechRecognition.continuous=false;
  let finalText='';
  speechRecognition.onstart=()=>{speechRecognitionRunning=true;if(btn)btn.textContent='■ Stop Speech Check';if(out)out.textContent='Listening… speak naturally in German.';};
  speechRecognition.onresult=(event)=>{let interim='';for(let i=event.resultIndex;i<event.results.length;i++){const text=event.results[i][0]?.transcript||'';if(event.results[i].isFinal)finalText+=text+' ';else interim+=text;}if(out)out.textContent=(finalText+interim).trim()||'Listening…';};
  speechRecognition.onerror=(event)=>{speechRecognitionRunning=false;if(btn)btn.textContent='🎤 Start Speech Check';if(out)out.textContent=event.error==='not-allowed'?'Microphone access was denied.':`Speech recognition error: ${event.error}.`;};
  speechRecognition.onend=()=>{speechRecognitionRunning=false;if(btn)btn.textContent='🎤 Start Speech Check';if(out && finalText.trim())out.textContent=finalText.trim();};
  try{speechRecognition.start();}catch(err){speechRecognitionRunning=false;if(btn)btn.textContent='🎤 Start Speech Check';if(out)out.textContent='Speech recognition could not be started.';}
}

function setRecorderStatus(text){ const el=document.getElementById('sprechenRecorderStatus'); if(el)el.textContent=text; }
async function toggleSprechenRecording(){
  if(mediaRecorder?.state==='recording'){ stopSprechenRecording(); return; }
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==='undefined'){ setRecorderStatus('This browser does not support microphone recording.'); return; }
  try{
    recorderStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const preferred=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t));
    mediaRecorder=new MediaRecorder(recorderStream,preferred?{mimeType:preferred}:undefined);
    recorderChunks=[];
    mediaRecorder.ondataavailable=e=>{ if(e.data?.size) recorderChunks.push(e.data); };
    mediaRecorder.onstop=()=>{
      recorderStream?.getTracks().forEach(t=>t.stop()); recorderStream=null;
      const type=preferred||'audio/webm';
      const blob=new Blob(recorderChunks,{type});
      const stamp=new Date();
      const name=`Deutsch-Sprechen-${stamp.toISOString().slice(0,16).replace('T','_').replace(':','-')}`;
      showCurrentSprechenRecording(blob,name,type);
    };
    mediaRecorder.start();
    const btn=document.getElementById('sprechenRecordBtn'); if(btn){btn.classList.add('recording');btn.innerHTML='<span class="record-dot">■</span> Stop';}
    setRecorderStatus('Recording in progress … Speak in German now.');
  }catch(err){ setRecorderStatus('Microphone access was denied or is unavailable.'); }
}
function stopSprechenRecording(){
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
  const btn=document.getElementById('sprechenRecordBtn'); if(btn){btn.classList.remove('recording');btn.innerHTML='<span class="record-dot">●</span> Say something';}
  setRecorderStatus('Processing recording …');
}
function showCurrentSprechenRecording(blob,name,type){
  if(currentRecordingUrl)URL.revokeObjectURL(currentRecordingUrl);
  currentRecordingUrl=URL.createObjectURL(blob);
  const wrap=document.getElementById('sprechenAudioWrap'); if(!wrap)return;
  const size=Math.max(1,Math.round(blob.size/1024));
  wrap.hidden=false;
  const ext=type.includes('ogg')?'ogg':'webm';
  const safeName=esc(name);
  wrap.innerHTML=`<audio id="sprechenCurrentAudio" src="${currentRecordingUrl}"></audio><button type="button" class="sprechen-audio-play" id="sprechenCurrentPlay" aria-label="Play recording" title="Play recording" onclick="toggleCurrentSprechenPlayback()">▶</button><div class="sprechen-audio-info"><div class="sprechen-audio-name">${safeName}</div><div class="sprechen-audio-meta">${size} KB · ${ext.toUpperCase()} audio</div></div><div class="sprechen-audio-actions"><button class="sprechen-secondary-btn" type="button" onclick='saveCurrentSprechenRecording(${JSON.stringify(name)},${JSON.stringify(type)})'>💾 Save</button><button class="sprechen-secondary-btn" type="button" onclick='downloadCurrentSprechenRecording()'>↧ Download</button></div>`;
  const audio=document.getElementById('sprechenCurrentAudio');
  if(audio){audio.addEventListener('ended',()=>{const b=document.getElementById('sprechenCurrentPlay');if(b){b.textContent='▶';b.setAttribute('aria-label','Play recording')}})}
  setRecorderStatus('Recording complete. Press play to listen, or save/download it.');
}

function toggleCurrentSprechenPlayback(){
  const audio=document.getElementById('sprechenCurrentAudio');
  const btn=document.getElementById('sprechenCurrentPlay');
  if(!audio||!btn)return;
  if(audio.paused){ audio.play(); btn.textContent='Ⅱ'; btn.setAttribute('aria-label','Pause recording'); btn.title='Pause recording'; }
  else { audio.pause(); btn.textContent='▶'; btn.setAttribute('aria-label','Play recording'); btn.title='Play recording'; }
}

function downloadCurrentSprechenRecording(){
  const audio=document.getElementById('sprechenCurrentAudio');
  if(!audio || !currentRecordingUrl){setRecorderStatus('No recording is available to download.');return;}
  const type=(mediaRecorder?.mimeType || recorderChunks[0]?.type || 'audio/webm');
  const ext=type.includes('ogg')?'ogg':'webm';
  const stamp=new Date().toISOString().slice(0,16).replace('T','_').replace(/:/g,'-');
  const blob=new Blob(recorderChunks,{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`Deutsch-Sprechen-${stamp}.${ext}`;
  a.rel='noopener';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function clearCurrentSprechenRecording(){
  if(mediaRecorder?.state==='recording')stopSprechenRecording();
  recorderChunks=[];
  if(currentRecordingUrl){URL.revokeObjectURL(currentRecordingUrl);currentRecordingUrl=null;}
  const wrap=document.getElementById('sprechenAudioWrap'); if(wrap){wrap.hidden=true;wrap.innerHTML='';}
  setRecorderStatus('Ready for your next recording.');
}
function openSpeakingDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(SPEAKING_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(SPEAKING_STORE))db.createObjectStore(SPEAKING_STORE,{keyPath:'id',autoIncrement:true});};
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function saveCurrentSprechenRecording(name,type){
  if(!currentRecordingUrl || !recorderChunks.length){setRecorderStatus('No recording is available to save.');return;}
  try{
    const blob=new Blob(recorderChunks,{type});
    const db=await openSpeakingDB();
    await new Promise((resolve,reject)=>{const tx=db.transaction(SPEAKING_STORE,'readwrite');tx.objectStore(SPEAKING_STORE).add({name,type,blob,createdAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
    db.close();
    setRecorderStatus('Recording saved.');
    await loadSavedSprechenRecordings();
  }catch(err){setRecorderStatus('The recording could not be saved.');}
}
async function getSavedSprechenRecordings(){
  const db=await openSpeakingDB();
  return await new Promise((resolve,reject)=>{const tx=db.transaction(SPEAKING_STORE,'readonly');const req=tx.objectStore(SPEAKING_STORE).getAll();req.onsuccess=()=>{db.close();resolve(req.result.sort((a,b)=>b.createdAt-a.createdAt));};req.onerror=()=>{db.close();reject(req.error);};});
}
async function loadSavedSprechenRecordings(){
  const list=document.getElementById('sprechenSavedList');
  const section=document.getElementById('sprechenSavedSection');
  if(!list || !section) return;
  try{
    const rows=await getSavedSprechenRecordings();
    if(!rows.length){
      list.innerHTML='';
      section.hidden=true;
      return;
    }
    section.hidden=false;
    list.innerHTML=rows.map(r=>`<div class="sprechen-saved-item"><div><div class="sprechen-saved-name">${esc(r.name)}</div><div class="sprechen-saved-meta">${new Date(r.createdAt).toLocaleString('de-DE')}</div></div><div class="sprechen-saved-actions"><button class="sprechen-icon-btn" title="Listen" aria-label="Listen" onclick="playSavedSprechen(${r.id})">▶</button><button class="sprechen-icon-btn" title="Download" aria-label="Download" onclick="downloadSavedSprechen(${r.id})">↧</button><button class="sprechen-icon-btn" title="Delete" aria-label="Delete" onclick="deleteSavedSprechen(${r.id})">×</button></div></div>`).join('');
  }catch(err){
    section.hidden=false;
    list.innerHTML='<div class="speaking-placeholder">Saved recordings could not be loaded.</div>';
  }
}
async function getSavedSprechen(id){
  const db=await openSpeakingDB(); return await new Promise((resolve,reject)=>{const tx=db.transaction(SPEAKING_STORE,'readonly');const req=tx.objectStore(SPEAKING_STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result)};req.onerror=()=>{db.close();reject(req.error)};});
}
async function playSavedSprechen(id){const r=await getSavedSprechen(id);if(!r)return;const url=URL.createObjectURL(r.blob);const audio=new Audio(url);audio.onended=()=>URL.revokeObjectURL(url);audio.play();}
async function downloadSavedSprechen(id){const r=await getSavedSprechen(id);if(!r)return;const url=URL.createObjectURL(r.blob);const ext=(r.type||'').includes('ogg')?'ogg':'webm';const a=document.createElement('a');a.href=url;a.download=`${r.name}.${ext}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
async function deleteSavedSprechen(id){const db=await openSpeakingDB();await new Promise((resolve,reject)=>{const tx=db.transaction(SPEAKING_STORE,'readwrite');tx.objectStore(SPEAKING_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();loadSavedSprechenRecordings();}

function renderInstructions(){

}

function renderVokabular(){
  const vocab=[];
  const seen=new Set();
  (DATA.simple||[]).concat(DATA.understandable||[]).forEach(t=>(t.vocab||[]).forEach(r=>{
    const k=String(r[0]||'').toLocaleLowerCase();
    if(k&&!seen.has(k)){seen.add(k);vocab.push(r);}
  }));
  $('#topicLabel').textContent='Vokabular';
  $('#topicButtons').innerHTML=vocab.length?vocab.map((r,i)=>`<button class="topic-btn ${i===current?'active':''}" onclick="openVocabTopic(${i})">${esc(r[0])}</button>`).join(''):'<div class="empty">Noch kein Wortschatz.</div>';
}
function openVocabTopic(i){
  current=i;
  const vocab=[]; const seen=new Set();
  (DATA.simple||[]).concat(DATA.understandable||[]).forEach(t=>(t.vocab||[]).forEach(r=>{const k=String(r[0]||'').toLocaleLowerCase();if(k&&!seen.has(k)){seen.add(k);vocab.push(r);}}));
  const r=vocab[i];
  renderVokabular();
  $('#detail').innerHTML=r?`<button class="back" onclick="window.scrollTo({top:0,behavior:'smooth'})">← Vokabular</button><h2 class="story-heading" onclick='speak(${JSON.stringify(r[0])})'>${esc(r[0])}</h2><div class="section"><div class="section-title">🇬🇧 English</div><div class="section-note">${esc(r[1]||'')}</div></div>`:'<div class="empty">Wort nicht gefunden.</div>';
  window.scrollTo({top:document.querySelector('.detail').offsetTop-80,behavior:'smooth'});
}
