rangensaft.**\n\n\"Unser Gast hat einen guten Appetit\", sagte meine Mutter zu mir und lächelte.\n\nFadiyah hatte bereits drei Spiegeleier **verschlungen** und biss gerade in eine **Scheibe** Brot.\n\n\"Aber die Würstchen hat sie nicht **angerührt!** \", **murrte** mein Vater. Er hatte sich **in der Zwischenzeit** Hemd und Hose angezogen, aber er war noch immer **mürrisch,** weil er das Fußballspiel **zum zweiten Mal verpasst** hatte.\n\n\"**Lass gut sein**, Bruder!\", sagte Vincente. \"**Andere Länder, andere Sitten.** \"\n\nNach dem Frühstück gingen wir zurück ins Wohnzimmer. Fadiyah nahm das Telefon in die Hand und **schaltete** es **an.** Die Plastiktüte hatte die Elektronik gut vor dem Wasser **geschützt.** Es **funktionierte** ohne Probleme.\n\nFadiyah **wischte** und **tippte** auf dem Bildschirm **herum.** Sie ging ein paar Schritte im Wohnzimmer **auf und ab.** \"Kein Signal!\", sagte sie auf Englisch.\n\n\"Wo ist der Router?\", fragte ich. Onkel Vincente **lachte.** Zu meinem Vater sagte er: \"Ja, genau, Enzo! Wo ist der Router?\" Mein Vater **verzog das Gesicht** und **schwieg.** \"Er hat den Router ins Meer **geworfen!** \", rief Vincente.\n\n\"Was?\", rief ich. \"**Wieso?** \"\n\n\"**Angeblich stört** die **Strahlung** seinen **Schlaf!** \", sagte Vincente. \"Und jetzt haben wir kein Internet mehr!\" Mein Vater **starrte** aus dem Fenster.\n\n\"Kommt!\", sagte Vincente. \"**Ich fahre euch** in die Stadt.\"\n\n---\n\n## Übung\n\n**1. Alfredo und Loretta haben die Hochzeit ... beendet.**\n\na) spät\nb) frühzeitig\nc) zu spät\n\n**2. Alfredo hat Flitterwochen ... gebucht.**\n\na) auf den Malediven\nb) auf Ustica\nc) auf Mallorca\n\n**3. Dino und Elisabeth schlafen in ...**\n\na) einem Gästezimmer\nb) Dinos Kinderzimmer\nc) dem Wohnzimmer\n\n**4. Dinos Vater wollte ... gucken.**\n\na) die Nachrichten\nb) einen Film\nc) ein Fußballspiel\n\n**5. Fadiyah nimmt ... aus ihrem Rucksack.**\n\na) ein Kopftuch\nb) eine Plastiktüte\nc) ein Kissen\n\n**6. Sie sucht nach einer ... für ihr Handy.**\n\na) Steckdose\nb) SIM-Karte\nc) Antenne\n\n**7. Was gibt es zum Frühstück?**\n\na) Würstchen, Spiegeleier und Fetakäse\nb) Würstchen, Rührei und Fetakäse\nc) Cornflakes, Spiegeleier und Fetakäse\n\n**8. Dinos Vater hat den Router ...**\n\na) verkauft\nb) ins Meer geworfen\nc) ausgeschaltet\n\n**9. Warum konnte Dinos Vater nicht schlafen?**\n\na) wegen den Wellen\nb) wegen den Autos\nc) wegen der Strahlung\n\n**10. Vincente fährt Dino, Fadiyah und Elisabeth ...**\n\na) zum Flughafen\nb) in die Stadt\nc) zum Strand"},{"title":"☕ Chapter 6: Kaffee und WLAN","content":"Onkel Vincente **parkte** seinen Geländewagen am Piazza Ruggero Settimo. Das ist einer der zentralen **Plätze** von Palermo. Hier **befindet sich** das **berühmte** Teatro Politeama und es gibt viele Hotels, Geschäfte und Restaurants.\n\n**Wir setzten uns** in ein kleines Café **in einer Seitenstraße.** Onkel Vincente **bestellte** vier Espressos und das Giornale di Sicilia, eine **palermische Tageszeitung.**\n\nElisabeth **klappte** ihren Laptop **auf.** Fadiyah wischte und tippte konzentriert auf ihrem Handy herum. \"Mein Bruder!\", sagte sie nach einer Weile und zeigte mir ein **Bild** von einem **jungen Mann** mit einem kleinen **Mädchen** auf dem Arm.\n\n\"Das ist Fadi\", sagte sie und lächelte. \"Fadi und Fadiyah, verstehst du?\"\n\n\"Und er ist in München?\", sagte ich. Fadiyah nickte und zeigte mir **ein paar weitere** Bilder von Fadi an der Isar und im Englischen Garten. \"Wohnt er **schon lange** dort?\", fragte ich.\n\n\"Ein Jahr\", sagte sie. \"Er ist über die **Türkei** nach **Griechenland** gekommen. **Von dort** ist er durch Mazedonien, Serbien und Ungarn nach Österreich bis nach Deutschland **gereist.** \"\n\n\"Wirklich?\", sagte ich und trank einen Schluck Espresso. \"Das ist ein weiter Weg!\"\n\nFadiyah nickte und sagte: \"Eigentlich wollten wir zusammen gehen, aber ich habe ihn im **Krieg aus den Augen verloren.** \"\n\n\"**Das tut mir leid**\", sagte ich. \"Am Ende bin ich mit meinem Cousin zu meiner **Tante** nach Ägypten gegangen\", erklärte sie. \"Sie wohnt in **Kairo.** Aber ihre Wohnung ist sehr klein. Und sie hat sieben Kinder.\"\n\n\"Also bist du nach **Tunesien** gegangen?\", sagte ich.\n\n\"Nein\", sagte Fadiyah und nippte an ihrem Kaffee. \"Zuerst mussten wir durch Libyen **reisen.** Ich war zusammen mit einer **Gruppe** von anderen Syrern. **Unter uns** waren viele Frauen und Kinder. Wir hatten große **Angst.** Aber wir haben **überlebt!** \"\n\nIn dem Moment **klingelte** Vincentes Telefon. Er schaute auf seine Uhr und sagte zu mir: \"Ich muss los, Dino! In einer halben Stunde bin ich wieder zurück, in Ordnung?\" Er stand auf und nahm die Zeitung. \"**Wo gehst du hin?** \", rief ich. \"**Geschäftliches**\", murmelte er und **verschwand.**\n\n\"Sorry\", sagte ich zu Fadiyah. \"**Wo sind wir stehen geblieben?** \"\n\n\"Libyen\", sagte sie. \"Es war ein **Albtraum!** Sandstürme, Rebellen, nichts zu essen und zu trinken ...\"\n\n\"Aber am Ende seid ihr in Tunesien **angekommen**\", sagte ich. Fadiyah nickte. \"Ich habe eine **Telefonnummer** auf Facebook gefunden. Tausend Euro für die **Überfahrt** von Tunis nach Sizilien ...\"\n\n\"**Halsabschneider!** \", sagte ich und schüttelte den Kopf. \"Und was willst du jetzt tun?\"\n\n\"Es gibt einen Mann in **Neapel,** er fährt für zwölfhundert Euro mit einem **Lastwagen** über Österreich nach Deutschland\", sagte Fadiyah.\n\n\"Mhm ...\", sagte ich. \"Und wie willst du **dorthin** kommen? Neapel ist auf dem **Festland.** Wir sind auf einer Insel!\"\n\n\"Messina\", sagte Fadiyah. \"Es gibt dort eine **Fähre,** glaube ich.\"\n\n\"Ja\", sagte ich. \"Das ist richtig. Aber von hier bis Messina sind es circa zwei Stunden Fahrt. Vielleicht kann Onkel Vincente dich zur Fähre **bringen** ...\"\n\n\"**Wirklich?** \", sagte Fadiyah. \"**Gott sei gesegnet!** \"\n\n\"**Sorry, dass ich unterbreche**\", sagte Elisabeth. Sie hatte die ganze Zeit still **zugehört** und auf ihrem Laptop **getippt.** \"Kann ich dich etwas fragen, Fadiyah?\"\n\nFadiyah nickte und die beiden Frauen **wechselten** ein paar Worte auf Arabisch. Elisabeth lächelte.\n\n\"Was habt ihr **besprochen?** \", fragte ich.\n\n\"Ich habe Fadiyah gefragt, **ob** ich ihre **Geschichte** auf meinem Blog **veröffentlichen** kann\", sagte Elisabeth. \"Sie hat **zugestimmt.** \"\n\nIch trank den letzten Rest meines Kaffees und sagte: \"**Sobald** Onkel Vincente **zurückkommt,** frage ich ihn, ob er sie nach Messina bringt.\"\n\n\"Was macht er eigentlich **beruflich,** dein Onkel?\", fragte Elisabeth. \"**Ehrlich gesagt, keine Ahnung**\", sagte ich. \"Irgendetwas mit Import/Export, glaube ich.\"\n\nPlötzlich wurde Fadiyah unruhig. \"Was ist?\", fragte ich. Sie starrte auf den **Bürgersteig.** Ein Carabiniere, ein **italienischer Polizist** in schwarzer Uniform, **kam geradewegs auf** unseren Tisch **zu.** \"**Papiere,** bitte!\", sagte er zu Fadiyah. Sie begann zu **zittern.**\n\n\"**Entschuldigen Sie!** \", sagte ich. \"Diese Dame ist unser Gast.\"\n\n\"**Soso...** \", sagte der Polizist. \"**Ich nehme an,** sie hat ein **gültiges Visum?** \"\n\n\"Warum fragen Sie nicht mich nach meinen Papieren?\", sagte Elisabeth in **tadellosem** Italienisch und stand auf. \"Weil ich kein **Kopftuch** trage?\" Die anderen Gäste im Café beobachteten die Szene mit **gespannten** Blicken.\n\n\"Signora!\", sagte der Polizist zu Elisabeth. \"**Beruhigen Sie sich!** Ich möchte bloß ihre Papiere **sehen.** \"\n\nDa erschien Onkel Vincente neben dem Polizisten und sagte: \"**Wo liegt das Problem,** mein Herr?\"\n\n\"Sie hat keine Aufenthaltsgenehmigung!\", sagte der Carabiniere und zeigte auf Fadiyah.\n\n\"Oh\", sagte Vincente und lachte. \"**Das muss ein Irrtum sein. Wissen Sie,** diese Dame ist ein Gast unseres Hauses.\" Er klopfte dem Polizisten auf die Schulter. Dann gab er ihm die Hand und **zwinkerte.**\n\n\"**In Ordnung**\", sagte der Polizist. \"**Dann hat sich das erledigt.** \" Er zog seine Mütze, sagte: \"Buon giorno!\" und verließ unseren Tisch.\n\n\"**Hat dein Onkel gerade einen Polizisten bestochen?** \", flüsterte Elisabeth.\n\n\"**Anscheinend** ...\", sagte ich.\n\n---\n\n## Übung\n\n**1. Fadiyah zeigt Dino Fotos von ...**\n\na) ihrem Vater\nb) ihrem Bruder\nc) ihrem Cousin\n\n**2. Fadi ist über ... nach Deutschland gekommen.**\n\na) Osteuropa\nb) Südeuropa\nc) Westeuropa\n\n**3. Fadiyah ist ... nach Kairo gegangen.**\n\na) zu ihrer Großmutter\nb) zu ihrer Tante\nc) zu ihrem Onkel\n\n**4. Warum hat sie Ägypten verlassen?**\n\na) Sie hatte Probleme mit der Polizei.\nb) Sie hatte keine Arbeit.\nc) Die Wohnung war zu klein.\n\n**5. Fadiyah ist über ... nach Tunesien gereist.**\n\na) Libyen\nb) Libanon\nc) Algerien\n\n**6. Wie viel hat die Überfahrt nach Sizilien gekostet?**\n\na) 10 €\nb) 100 €\nc) 1000 €\n\n**7. Fadiyah will ...**\n\na) einen Lastwagen in Messina kaufen\nb) eine Fähre in Messina nehmen\nc) ein Auto in Palermo mieten\n\n**8. Elisabeth möchte Fadiyahs Geschichte ...**\n\na) auf ihrem Blog veröffentlichen\nb) in einer Zeitung veröffentlichen\nc) im Fernsehen veröffentlichen\n\n**9. Wessen Papiere will der Polizist sehen?**\n\na) Fadiyahs\nb) Elisabeths\nc) Vincentes\n\n**10. Warum verlässt der Polizist das Café?**\n\na) Vincente hat ihn gebrochen.\nb) Vincente hat ihn gestochen.\nc) Vincente hat ihn bestochen."},{"title":"🗺️ Chapter 7: Der Plan","content":"Wir saßen wieder in Onkel Vincentes Geländewagen. Fadiyah schaute **besorgt** aus dem Fenster. \"**Keine Sorge!** \", sagte ich. \"Der Polizist kommt nicht zurück!\" Aber Fadiyah schüttelte den Kopf und sagte: \"Ich muss **weiterreisen.** Sizilien ist nicht **sicher.** \"\n\n\"Onkel?\", sagte ich. \"Kann ich dich **um einen Gefallen bitten?** \"\n\n\"Bist du mein **Neffe,** oder nicht?\", sagte er und lächelte.\n\n\"Fadiyah will zu ihrem Bruder nach München\", sagte ich. \"**Könntest du** sie nach Messina fahren? Von dort kann sie die Fähre nehmen.\"\n\n\"Kein Problem\", sagte Vincente. \"Aber die Fähre ist keine gute Idee.\" Er zeigte auf die **zusammengerollte** Zeitung. \"Ich habe gelesen, die Polizei macht seit gestern wieder **strenge Passkontrollen.** \"\n\n\"Wirklich?\", sagte ich. \"Warum?\"\n\n\"Du solltest mehr Zeitung lesen, **mein Junge!** \", sagte Vincente. \"Jeden Tag kommen Hunderte von Flüchtlingen auf Sizilien an! Hast du die **Lager** gesehen?\" Ich schüttelte den Kopf. Vincente startete den Motor und sagte: \"Die italienische **Regierung** ist **unter großem Druck.** Sie **dürfen** die Flüchtlinge nicht in die EU reisen **lassen.** Aber unsere Lager sind **überfüllt!** Hast du **von** Mineo **gehört?** \"\n\n\"Ja\", sagte ich. \"Das ist eine kleine Stadt im Osten Siziliens, oder? Aber **was hat das mit** den Flüchtlingen **zu tun?** \"\n\n\"In Mineo gibt es eine **ehemalige** US-Militärbasis\", erklärte Vincente. \"Jetzt ist dort ein **riesiges Flüchtlingslager** mit mehr als 3000 Menschen, **bewacht** von italienischer Polizei mit **Sturmgewehren.** \" Er zeigte mit dem Daumen auf Fadiyah. \"Wenn die Carabiniere sie finden, dann kommt sie nach Mineo und **es ist aus** mit dem **Traum** von Deutschland.\"\n\n\"Mmh\", sagte ich. \"Was schlägst du vor?\"\n\n\"Ich habe eine Idee\", sagte Vincente und **hielt den Wagen** an einer Tankstelle. \"Aber es ist ein bisschen **riskant.** Hat sie eine **europäische** SIM-Karte?\"\n\nElisabeth übersetzte. Fadiyah schüttelte den Kopf. \"Okay\", sagte Vincente und gab mir einen **Fünfzigeuroschein.** \"Du gehst jetzt in die Tankstelle und kaufst eine Prepaid-SIM, eine **Reisetasche,** ein **Sechserpack** Wasser und ein paar **Müllsäcke.** \"\n\n\"**Wozu** Müllsäcke?\", fragte ich. \"Dino ...\", sagte Vincente. \"Willst du, dass ich ihr helfe, oder nicht?\"\n\n\"**In Ordnung**\", sagte ich und stieg aus dem Auto.\n\nWenig später waren wir wieder **unterwegs.** Fadiyah legte die neue SIM-Karte in ihr Handy. \"Auf der Karte sind 25 Euro\", erklärte Vincente. \"**Ruf mich** bitte auf ihrem Handy an! Dann habe ich ihre Nummer, und sie hat meine.\"\n\nIch wählte Vincentes Nummer auf Fadiyahs Handy. Es klingelte. \"Und jetzt?\", sagte ich.\n\n\"**Sagt ihr,** wenn sie Schwierigkeiten mit der italienischen Polizei **bekommt,** soll sie mich anrufen!\", sagte er. \"Ich werde mit ihnen sprechen.\"\n\nElisabeth übersetzte. \"Danke!\", sagte Fadiyah und **strahlte.** \"Ich schicke meinem Bruder eine SMS. Ihr seid meine **Engel!** \" Sie begann zu tippen.\n\nWir fuhren auf der **Autobahn Richtung Osten,** das Meer **zu unserer Linken,** die Gipfel der Madonien **zu unserer Rechten.**\n\nNach circa einer Stunde Fahrt **piepte** Fadiyahs Handy. \"**Gibt es hier** eine **Post?** \", fragte sie. \"Mein Bruder hat mir **Geld geschickt.** \"\n\nWir befanden uns in der Nähe von Cefalù, einer **beliebten** Touristenstadt. Onkel Vincente nahm die **nächste Abfahrt** und wir **fuhren** in die Stadt **hinein.** Überall liefen sonnenverbrannte Nordeuropäer und Amerikaner mit Strohhüten herum. Aber es war auch viel Polizei auf den Straßen.\n\n\"**Schaut!** \", sagte Elisabeth und zeigte auf einen **Pritschenwagen** an der Straßenseite. Drei Polizisten standen hinter dem **Fahrzeug** und diskutierten mit dem **Fahrer.** Auf der **Ladefläche** saß eine Gruppe Afrikaner. Es **waren auch Mütter** mit kleinen Kindern **dabei.**\n\n\"Seht ihr?\", sagte Vincente. \"Die kommen jetzt alle nach Mineo oder in ein anderes Lager.\"\n\n\"Aber warum Polizei?\", sagte Elisabeth. \"Diese Menschen sind doch **keine Kriminelle!** Sie **brauchen** Essen, Wasser und **medizinische Hilfe.** \"\n\nVincente zuckte mit den Schultern und sagte: \"Wahrscheinlich. Aber **laut Gesetz** sind sie erst einmal **illegale Einwanderer.** \"\n\nWenig später parkte Vincente neben einer Post. \"**Ich würde vorschlagen,** das Kopftuch **abzunehmen**\", sagte er und zeigte auf Fadiyah. Elisabeth übersetzte und Fadiyah schüttelte den Kopf. \"Sie will nicht\", sagte Elisabeth. \"Sie sagt, das ist ihr **letztes bisschen Würde.** \"\n\n\"**Wie dem auch sei!** \", sagte Vincente. \"Hier sind **zu viele** Polizisten. Wir können sie nicht alle **schmieren!** \"\n\nElisabeth versuchte, Fadiyah zu überzeugen, aber sie **weigerte sich,** das Kopftuch abzunehmen. Vincente seufzte und sagte: \"Dann gebt ihr **zumindest** einen **Strohhut.** Schaut im **Kofferraum!** \"\n\nElisabeth und ich **begleiteten** Fadiyah in die Post. Sie **füllte** ein **Formular aus,** zeigte einen Code auf ihrem Handy und der **Angestellte** gab ihr ein paar Hundert Euro. Als wir die Post **verlassen** wollten, **trat** ein junger Polizist durch die Tür. Er starrte auf Fadiyah und sie zog den Hut tiefer ins Gesicht.\n\n\"Excuse me, dear Sir!\", sagte Elisabeth mit **vornehmem** englischen Akzent. \"Könnten Sie uns sagen, wo das nächste **Krankenhaus** ist? Meine Tante hat eine **schreckliche Sonnenallergie!** \"\n\nDer Polizist schaute Elisabeth an und begann, in gebrochenem Englisch, den Weg zu **beschreiben.** \"You're a darling!\", sagte sie und **berührte** seinen Arm. Der junge Polizist **errötete.** Wir verließen schnell die Post und stiegen in Vincentes Auto.\n\n\"**Fahr,** Onkel!\", rief ich. \"**Nichts wie weg hier!** \"\n\n---\n\n## Übung\n\n**1. Warum ist die Fähre \"keine gute Idee\"?**\n\na) Die Strömungen sind zu stark.\nb) Die Fähre hat Probleme mit dem Motor.\nc) Die Polizei macht Passkontrollen.\n\n**2. Die italienische Regierung ist unter großem ...**\n\na) Schmuck\nb) Druck\nc) Stuck\n\n**3. Wenn die Polizei Fadiyah findet ...**\n\na) muss sie zurück nach Tunesien fahren\nb) kommt sie in ein Flüchtlingslager\nc) muss sie nach Syrien zurück\n\n**4. Was kauft Dino in der Tankstelle?**\n\na) eine SIM-Karte, eine Reisetasche und Schlafsäcke\nb) eine SIM-Karte, einen Rucksack und Müllsäcke\nc) eine SIM-Karte, eine Reisetasche und Müllsäcke\n\n**5. Cefalù ist eine ...**\n\na) Touristenstadt\nb) Arbeiterstadt\nc) Weltstadt\n\n**6. \"Schmieren\" ist ein anderes Wort für ...**\n\na) bestechen\nb) sprechen\nc) kaufen\n\n**7. Vincente sagt, Fadiyah soll ... anziehen?**\n\na) eine Regenjacke\nb) ein Abendkleid\nc) einen Strohhut\n\n**8. Elisabeth sagt dem jungen Polizisten, dass ...**\n\na) Fadiyah ihre Tante ist\nb) Fadiyah ein Flüchtling ist\nc) Fadiyah ihre Mutter ist"},{"title":"🐟 Chapter 8: Mittagspause","content":"Nach circa einer Stunde Fahrt **erreichten** wir Capo d'Orlando, eine kleine **Küstenstadt.** Als Onkel Vincente die Autobahn verließ, fragte ich: \"Was machst du, Onkel?\"\n\n\"Ich muss hier etwas Geschäftliches **erledigen**\", sagte Vincente. \"**Keine Sorge! Es wird nicht lange dauern.** \"\n\nWir **fuhren** in das **Städtchen hinein,** vorbei an Olivenbäumen und Palmen. In der Innenstadt parkte Vincente vor einem Restaurant mit dem Namen \"Tartaruga d'Oro\", auf Deutsch: \"Goldene Schildkröte.\"\n\n\"Sollen wir im Auto warten?\", fragte ich. \"**Quatsch!** \", sagte mein Onkel und **zog die Handbremse.** \"**Kommt rein!** Hier gibt es die besten Sarde e beccafico in ganz Sizilien.\"\n\n\"Was ist das?\", fragte Elisabeth. \"Gefüllte Sardinen\", sagte ich und stieg aus.\n\nWir folgten meinem Onkel in das Restaurant. Der **Inhaber** trug einen schwarzen Anzug mit einer weißen Rose im **Revers.** Er **begrüßte** Vincente mit einer **Umarmung** und zeigte auf einen Tisch direkt am Fenster, mit **Aussicht** auf das Meer.\n\n\"Setzt euch!\", sagte Vincente zu uns. \"Ich komme gleich wieder.\" Fadiyah, Elisabeth und ich setzten uns.\n\nDer Inhaber **schnippte mit den Fingern** und innerhalb von wenigen **Sekunden** brachte uns ein Kellner Wasser, Wein, Weißbrot und drei riesige **Teller** Sardinen.\n\nWir begannen zu essen. Das Restaurant war leer. Wir waren die einzigen Gäste. Mein Onkel und der Inhaber saßen an einem kleinen Tisch **am anderen Ende** des Restaurants und redeten. Sie machten viele **Gesten,** aber ich verstand kein Wort, denn der **Fernseher** über der **Theke** war **zu laut.** Es liefen die Nachrichten.\n\n\"Die sizilianische Küstenwache hat heute morgen drei **Schlepper festgenommen**\", sagte die **Nachrichtensprecherin.** Im Fernsehen erschien ein Bild von einem **hoffnungslos überfüllten Holzkahn.** \"Die Schlepper **stammen aus** Libyen und hatten versucht, mehr als fünfzig Menschen illegal nach Europa zu **schleusen.** \" **Man sah** ein Bild von drei Männern in **Handschellen.** Ihre Gesichter waren **verpixelt.** \"Die Flüchtlinge **wurden** in ein zentrales Auffanglager **gebracht.** Das Boot **wurde** von der Marine **zerstört.** \" Man sah eine kleine Explosion und ein paar **Wrackteile.**\n\n\"Das ist Wahnsinn!\", sagte ich und schüttelte den Kopf. \"Warst du auch auf so einem Boot?\", fragte Elisabeth Fadiyah und zeigte auf den Fernseher. Fadiyah nickte kurz, trank einen kleinen Schluck Wasser und sagte: \"Wo ist die Toilette?\"\n\n\"**Da vorne!** \", sagte ich und zeigte auf eine Tür. Fadiyah wischte sich mit einer **Serviette** den **Mund** ab und stand auf. Ich **goss** ein Glas Weißwein **ein** und schüttelte den Kopf. \"Warum zerstört die Marine die Boote?\", sagte ich. \"Sie sollte den Menschen helfen!\"\n\n\"**Ganz einfach**\", sagte Elisabeth und steckte eine gefüllte Sardine in den Mund. \"Sie wollen die Schlepper stoppen. Die Überfahrt ist zu **gefährlich** für die Menschen. Die Boote sind alt und **brüchig.** \"\n\n\"Aber ...\", sagte ich. \"Glaubst du, **das wird** die Schlepper stoppen?\"\n\n\"**Höchstwahrscheinlich nicht**\", sagte Elisabeth. \"Das ist **eine Sache von Angebot und Nachfrage. Weniger** Boote, **höheres** Risiko, **höhere Preise.** Die Schlepper werden jetzt **noch mehr** Geld **verlangen.** \"\n\nWir aßen still weiter. Im Fernsehen lief nun ein Fußballspiel. Nach einer Weile sagte ich: \"Elisabeth ...?\"\n\n\"Ja?\", sagte sie.\n\n\"Sind wir ...\", flüsterte ich. \"Sind wir jetzt nicht auch Schlepper?\"\n\nElisabeth trank einen Schluck Wein und schaute aus dem Fenster. Sie **überlegte** kurz und sagte dann: \"Nein.\"\n\n\"Aber was wir machen ist illegal!\", sagte ich.\n\n\"Ja\", sagte Elisabeth. \"Vielleicht. Aber wir sind keine Schlepper.\"\n\n\"**Und wo ist der Unterschied?** \", sagte ich.\n\n\"Na ja\", sagte sie. \"Schlepper verlangen Geld für ihre Hilfe. Sie **beuten Menschen aus.** Wir nicht.\"\n\n\"Mhm\", sagte ich. \"Das stimmt. Aber glaubst du, die Polizei **interessiert das?** \"\n\n\"Was ist die Alternative?\", sagte Elisabeth. \"Sollen wir Fadiyah zur Polizei bringen? Dann kommt sie in ein Lager. Ganz ,legal' ...\"\n\n\"Nein\", sagte ich. \"Wir haben **versprochen,** ihr zu helfen.\"\n\n\"Keine Sorge\", sagte Elisabeth. \"Dein Onkel **weiß, was er tut.** \"\n\n\"**Ich hoffe es** ...\", sagte ich. Da kam Fadiyah von der Toilette zurück. Sie lächelte und sagte: \"Mein Bruder hat mir gerade eine SMS geschickt. Er ist sehr **dankbar** für eure Hilfe. Er will euch **zum Essen einladen.** Er macht **die besten** Falafeln **der Welt!** In Damaskus war er Chefkoch in einem **Fünfsternehotel.** \"\n\n\"Oh\", sagte ich. \"Danke! Arbeitet er als Koch in München?\"\n\nFadiyah nickte. \"In einer kleinen **Imbissbude**\", sagte sie. \"Warst du schon einmal in München?\"\n\nElisabeth und ich **schauten uns an** und lächelten. In dem Moment kam Onkel Vincente an den Tisch und sagte: \"Wie sind die Sardinen? Habe ich **zu viel** versprochen?\"\n\n\"Ziemlich gut\", sagte Elisabeth.\n\n\"Siehst du?\", sagte Onkel Vincente. \"Das ist ein altes **Familienrezept!** \" Er setzte sich, aß eine Sardine und trank ein Glas Wein dazu.\n\n\"**Göttlich!** \", sagte er und **kaute.** Dann schnippte er mit den Fingern und rief: \"**Herr Ober! Noch eine Flasche** Wein, bitte!\" Zu uns sagte er: \"Wer hat Lust auf Dessert? Ein Stück Cassata-**Torte,** Cannoli-**Gebäck** oder ein **Eis,** vielleicht?\"\n\n\"Onkel\", sagte ich und tippte auf seine Schulter. \"Wir sollten nicht zu viel essen und trinken.\"\n\n\"**Papperlapapp!** \", rief Vincente. \"Ein **Mahl** ohne Dessert ist **kein richtiges** Mahl.\"\n\n\"Ich glaube, Dino **hat Recht**\", sagte Elisabeth. \"Wir sollten nicht zu spät **losfahren.** \"\n\n\"**Na gut**\", sagte Onkel Vincente und seufzte. \"Aber ich bestelle **trotzdem** ein paar Cannoli für Fadiyah, **zum Mitnehmen.** \"\n\n---\n\n## Übung\n\n**1. Warum fährt Vincente nach Capo d'Orlando?**\n\na) Er muss etwas Geschäftliches erledigen.\nb) Er muss etwas zu essen kaufen.\nc) Er muss einen Polizisten bestechen.\n\n**2. Der Inhaber des Restaurants trägt ...**\n\na) einen blauen Anzug mit einer Rose im Revers\nb) einen schwarzen Anzug mit einer Rose im Revers\nc) einen schwarzen Anzug mit einem Taschentuch im Revers\n\n**3. Der Kellner bringt ...**\n\na) Wasser, Wein, Weißbrot und Sardinen\nb) Bier, Wein, Weißbrot und Sardinen\nc) Wasser, Bier, Weißbrot und Sardinen\n\n**4. Vincente und der Inhaber sitzen ...**\n\na) in der Küche\nb) draußen vor dem Restaurant\nc) am anderen Ende des Restaurants\n\n**5. Was läuft im Fernsehen?**\n\na) die Nachrichten\nb) ein Fußballspiel\nc) ein Krimi\n\n**6. Ein \"Schlepper\" ist eine Person, die ...**\n\na) Zigaretten schmuggelt\nb) Menschen schmuggelt\nc) Autos schmuggelt\n\n**7. Warum zerstört die Marine die Boote?**\n\na) Sie wollen die Schlepper töten.\nb) Sie wollen bessere Boote kaufen.\nc) Sie wollen die Schlepper stoppen.\n\n**8. Elisabeth findet, dass ...**\n\na) Dino, Vincente und sie Schlepper sind\nb) Dino, Vincente und sie keine Schlepper sind\nc) nur Vincente ein Schlepper ist\n\n**9. Fadiyahs Bruder will Dino und Elisabeth ...**\n\na) zu einem Bier einladen\nb) zum Essen einladen\nc) nach Syrien einladen\n\n**10. Er arbeitet in München in ...**\n\na) einem Fünfsternehotel\nb) einer Imbissbude\nc) einem Restaurant\n\n**11. Vincente will ... bestellen.**\n\na) mehr Wein und Sardinen\nb) mehr Bier und Dessert\nc) mehr Wein und Dessert"},{"title":"🚤 Chapter 9: Die Überfahrt","content":"Vincente verließ die Autobahn bei Rometta. Von dort fuhren wir auf einer **Landstraße** durch **eine Reihe** kleiner Dörfer.\n\nDie Sonne **hing** tiefer über dem Mittelmeer. Es war später Nachmittag. Die Straße war **staubig** und die **Dörfer wurden immer kleiner.** Hier und dort standen einzelne Häuser zwischen Asphalt und Strand.\n\n\"Wo sind wir?\", fragte ich.\n\n\"Siehst du das?\", sagte Vincente und zeigte auf einen rot-weißen Hochspannungsmast am Horizont.\n\n\"Ja\", sagte ich. \"Was ist das?\"\n\n\"Torre Faro\", sagte Vincente. \"Ein kleines Fischerdorf und die **nordöstlichste Ecke** von Sizilien.\"\n\nWir fuhren weiter über kleine Straßen, vorbei an **flachen** Häusern, durch **schmale Gassen** – den **Mast** immer vor Augen. Nach knapp einer halben Stunde Fahrt parkte Vincente den Wagen am Ufer. Wir stiegen aus.\n\n\"Seht ihr die Berge dort?\", fragte Vincente und zeigte über das Meer. Wir nickten. \"Das ist Kalabrien\", sagte er. \"Italienisches Festland.\"\n\n\"Wow!\", sagte Elisabeth. \"**So nah!** \"\n\n\"Ja\", sagte Vincente. \"Die **Straße von Messina** ist hier sehr schmal. Knapp drei Kilometer.\"\n\n\"**Und wie geht es jetzt weiter?** \", fragte ich und schaute mich um. \"Mit dem Schlauchboot?\"\n\n\"**Bist du verrückt?!** \", sagte Vincente. \"Es sind vielleicht nur drei Kilometer, aber die Küstenwache **patrouilliert** auch hier Tag und Nacht.\"\n\nMein Onkel nahm sein Telefon und wählte eine Nummer. \"Wir sind hier\", sagte er und **legte auf.** Dann gingen wir auf einen Steg. Die **Dämmerung** hatte bereits begonnen. Die Sonne glitzerte auf dem Meer und die Berge von Kalabrien glühten rötlich. Fadiyah schaute mit **festem** Blick auf das Festland. Es schien so nah, und doch so **fern.**\n\nWir warteten eine Weile. Niemand sagte ein Wort. Es wurde langsam dunkler. In der **Ferne** hörten wir einen **Dieselmotor.** Da sahen wir ein kleines **Fischerboot.** Es näherte sich langsam der Küste.\n\n\"Okay\", sagte Vincente. \"**Seid ihr bereit?** \"\n\n\"Für was?\", sagte ich.\n\n\"Das ist Marcello\", sagte Vincente und zeigte auf das Fischerboot. \"Ein alter Freund. **Er nimmt sie mit.** \"\n\n\"Und was ist mit der Küstenwache?\", fragte Elisabeth.\n\n\"Marcello wohnt in Kalabrien. Aber er hat Familie hier in Torre Faro. Er fährt jede Woche **mehrmals** hin und her. **Jeder kennt ihn.** \"\n\n\"Onkel!\", sagte ich. \"Du bist ein **Genie!** \"\n\nVincente hob den Zeigefinger und sagte: \"Es ist trotzdem nicht ganz **ungefährlich.** Wenn die Küstenwache Fadiyah **entdeckt,** kommt Marcello ins **Gefängnis** und unsere syrische **Freundin** in ein Lager.\"\n\n\"Kein kleines Risiko für deinen Freund ...\", sagte Elisabeth.\n\n\"Ich habe ihm vor vielen Jahren **einen Gefallen getan**\", sagte Vincente. \"Lange Geschichte ...\"\n\nDas Boot kam immer näher. \"Schnell!\", sagte er. \"Hol die **Sachen** aus dem Kofferraum!\"\n\nIch brachte die Reisetasche, das Wasser und die Müllsäcke ans Ufer. \"Anziehen!\", sagte Vincente zu Fadiyah und zeigte auf die Müllsäcke. Fadiyah schien verwirrt.\n\n\"**Was meinst du mit ,anziehen'** ... ?\", fragte Elisabeth.\n\n\"Das Boot ist sehr klein\", erklärte Vincente. \"Marcello wird Fadiyah im **Unterdeck verstecken.** \"\n\n\"Aber wozu die Müllsäcke?\", fragte ich. Vincente seufzte und sagte: \"Marcello ist ein **Fischer,** richtig?\" Ich nickte. \"Und was hat ein Fischer **an Bord?** \", fragte er.\n\n\"Äh ... Fische?\", sagte ich.\n\n\"**Bingo!** \", rief Vincente. \"Fadiyah muss das Unterdeck **leider** mit einer **Tonne** Sardinen und **Makrelen teilen.** \"\n\n\"Oh ...\", sagte ich.\n\nElisabeth übersetzte. Fadiyah nickte. Ich riss ein paar Löcher in die Müllsäcke. Langsam zog Fadiyah das schwarze Plastik über Arme, Beine und Oberkörper. Ich packte ein paar Flaschen Wasser in die Reisetasche.\n\nWenige Sekunden später legte das Boot an. Marcello war ein Mann mittleren Alters mit dunkelbrauner Haut, grauem Haar und einem kühlen Blick. Er begrüßte meinen Onkel mit einem kurzen Händedruck.\n\nFadiyah nahm die Reisetasche in die Hand. Sie schaute ängstlich auf das kleine Boot. Der Himmel war dunkelrot und das Meer schimmerte wie ein Ölteppich.\n\n\"**Keine Angst!** \", sagte Vincente in gebrochenem Englisch. \"Marcello ist ein guter Freund!\"\n\nFadiyah umarmte Elisabeth und sagte etwas auf Arabisch. Elisabeth lächelte. Dann stieg sie ins Boot.\n\n\"Schreib uns eine SMS, wenn du angekommen bist!\", sagte ich. Fadiyah nickte und drehte sich um.\n\n\"Moment!\", rief Vincente. Er rannte zum Auto und kam mit einem kleinen Päckchen zurück. Er war außer Atem.\n\n\"Die Cannoli!\", rief er und gab Fadiyah das Päckchen. Sie lächelte. Marcello öffnete eine Luke. Ein schrecklicher Geruch kam aus dem Unterdeck. Fadiyah winkte ein letztes Mal und stieg stoisch hinein.\n\nDann ging alles sehr schnell. Marcello legte ab und startete den Motor. Wir starrten auf das Licht des Fischerboots, bis es in der Dunkelheit verschwunden war. Dann sagte Vincente: \"So, Kinder! Zeit zum Abendessen!\"\n\n---\n\n## Übung\n\n**1. Vincente fährt an die ... Ecke Siziliens.**\n\na) nordöstlichste\nb) südöstlichste\nc) nordwestlichste\n\n**2. Von Torre Faro kann man ... sehen.**\n\na) Tunesien\nb) das italienische Festland\nc) Palermo\n\n**3. Was nähert sich der Küste?**\n\na) ein Schlauchboot\nb) ein Schiff der Küstenwache\nc) ein Fischerboot\n\n**4. Wer ist Marcello?**\n\na) Vincentes Cousin\nb) ein alter Freund von Vincente\nc) Dinos Cousin\n\n**5. Warum fährt Marcello oft hin und her?**\n\na) Er wohnt in Kalabrien und hat Familie in Messina.\nb) Er wohnt in Torre Faro und hat Familie in Kalabrien.\nc) Er wohnt in Kalabrien und hat Familie in Torre Faro.\n\n**6. Vincente hat Marcello vor vielen Jahren ...**\n\na) ein Boot gekauft\nb) einen Gefallen getan\nc) Geld geliehen\n\n**7. Warum soll Fadiyah Müllsäcke anziehen?**\n\na) Sie hat keine andere Kleidung.\nb) Es regnet sehr stark.\nc) Sie muss sich zwischen Fischen verstecken.\n\n**8. Aus dem Unterdeck kommt ein ... Geruch.**\n\na) wunderbarer\nb) schrecklicher\nc) neutraler"},{"title":"🌅 Chapter 10: Auf Wiedersehen, Sizilien","content":"Zurück in Palermo, im Haus meiner Eltern, war es sehr **ruhig.** Meine Mutter **arbeitete tagsüber** im Garten und mein Vater **friemelte** in der Garage an seinem alten Fiat. Elisabeth und ich hatten nun endlich ein bisschen Zeit **nur für uns.** Wir machten lange Spaziergänge, redeten und lagen am Strand. Die Tage **vergingen,** aber wir hörten kein Wort von Fadiyah.\n\n\"Glaubst du, sie ist angekommen?\", fragte ich eines Abends. Wir saßen im Garten und tranken Marsala. Die Grillen **zirpten.**\n\n\"**Klar**\", sagte Elisabeth und nippte an ihrem Wein. \"**Kein Zweifel.** \"\n\n\"Aber warum schreibt sie nicht?\", fragte ich.\n\n\"Keine Ahnung\", sagte Elisabeth. \"Gib ihr ein bisschen Zeit! Sie ist ein **Fremder** in einem **fremden** Land.\"\n\n\"Mmh\", sagte ich und schaute in den Himmel. Nach einer Weile **fügte ich hinzu:** \"Hast du eigentlich den Artikel **veröffentlicht?** \"\n\nElisabeth nickte und sagte: \"Ja. Der Blogpost hat schon viele **Kommentare.** Und heute Morgen hat **sogar** eine internationale **Hilfsorganisation** den Artikel geteilt!\"\n\nIn dem **Augenblick trat** Onkel Vincente aus dem Haus. Er **rauchte** eine Zigarre und sagte: \"Was für eine wunderschöne Nacht, Kinder!\"\n\n\"Onkel!\", sagte ich und zeigte auf einen **Stuhl.** \"**Setz dich!** \" Er lachte und sagte: \"Nein, ich will euren romantischen Abend nicht **stören.** \"\n\n\"Es ist in Ordnung\", sagte Elisabeth. \"Wir reden gerade über Fadiyah.\"\n\n\"Oh, apropos\", sagte Vincente und zog sein Handy aus der Hosentasche. \"Ich habe vor ein paar Stunden eine SMS von ihr **bekommen.** Auf Arabisch ...\"\n\n\"Was?\", sagte ich. Elisabeth stand auf. Vincente zeigte ihr die SMS und sie begann zu lesen: \"Liebe Freunde, ich bin in München angekommen. Das Wetter ist ein bisschen kalt, aber die Menschen sind sehr nett. **Ich werde nie vergessen,** was ihr für mich getan habt. **Gott segne euch!** Fadiyah\"\n\nOnkel Vincente lächelte und sagte: \"**Ende gut, alles gut.** \"\n\n\"Ja ...\", sagte Elisabeth. \"Aber das ist **erst der Anfang.** Jetzt muss sie Deutsch lernen und Arbeit finden ...\"\n\n\"**Das kommt mir irgendwie bekannt vor** ...\", sagte ich und trank einen Schluck Wein. Elisabeth lachte und sagte: \"Wie dem auch sei. **Sie hat es geschafft!** \"\n\n\"**Dank** Onkel Vincente!\", sagte ich und gab ihm ein Glas.\n\n\"Was trinkt ihr?\", fragte er und schaute auf das **Etikett** der Flasche. \"Oh, Marsala! Sehr gut! Das Leben ist **zu kurz,** um schlechten Wein zu trinken.\"\n\nWir lachten und **stießen an.** Vincente **rauchte** seine Zigarre **zu Ende** und ging zurück ins Haus. Elisabeth und ich saßen noch eine Weile im Garten und schauten in den Sternenhimmel.\n\n\"Weißt du was...?\", sagte sie plötzlich.\n\n\"Was?\", sagte ich.\n\n\"Ich war **selten so glücklich wie** in diesem Moment\", sagte sie leise. Ich nahm ihre Hand und lächelte. Sie schloss die Augen und ich küsste sie.\n\n**Am nächsten Morgen wachten** wir nebeneinander auf. Wir duschten, zogen uns an und gingen nach unten. Es war bereits elf Uhr. Meine Mutter **pflückte draußen** Tomaten und mein Vater **las** die Zeitung im Wohnzimmer.\n\nNach einem **ausgiebigen** Frühstück nahmen wir den Bus in die Innenstadt. Ich zeigte Elisabeth meine alte **Schule** und wir spazierten durch die **Altstadt,** über den Piazza Pretoria, vorbei an der Chiesa Santissimo Salvatore, zur Kathedrale von Palermo.\n\nDort setzten wir uns auf ein paar Treppenstufen und tranken einen Schluck Wasser. \"**Ich liebe** diese Stadt!\", sagte Elisabeth.\n\n\"Ja ...\", sagte ich und wischte den **Schweiß** von meiner Stirn. \"**Wenn es nur nicht so** heiß wäre ...\" Ich warf die leere Wasserflasche in einen Mülleimer und sagte: \"Mann, ich habe einen **Durst!** \"\n\n\"Schau!\", sagte Elisabeth. \"Da vorne ist ein Internet-Café. Du kannst dort etwas trinken, und ich kann **nachsehen,** ob es neue Kommentare gibt.\"\n\nWir **überquerten** die Straße und betraten das Café. Eine **Klimaanlage blies** kühle Luft über unsere Köpfe. Wir bestellten zwei Softdrinks mit **Eis.** Ich checkte meine Emails und fand ein paar **Fotos** von Alfredo und Loretta beim Schnorcheln, auf einem Motorrad, in einer Hängematte. \"**Liebe Grüße** aus den Malediven\", **stand darunter.**\n\n\"Hey, Elisabeth!\", rief ich. \"Willst du die Flitterwochenfotos von Alfredo und Loretta sehen?\" Sie antwortete nicht, **sondern starrte** bloß **stumm** auf ihren Bildschirm.\n\n\"**Was ist?** \", sagte ich. \"Hast du neue Kommentare?\"\n\n\"Ja ... nein. Ich ...\", **stammelte** sie. \"**Was hast du denn?** \", rief ich und **beugte mich zu ihr herüber.**\n\n\"Ich habe eine Email bekommen\", sagte sie. \"Vom **Chefredakteur** einer großen englischen Zeitung. Er hat meinen Artikel **gelesen.** \"\n\n\"Wirklich?\", sagte ich. \"Was **schreibt** er?\"\n\n\"Er fand Fadiyahs Geschichte ,sehr **ergreifend**' und will den Artikel veröffentlichen\", erklärte Elisabeth. \"**Gegen angemessenes Honorar!** \"\n\n\"Oh!\", sagte ich. \"**Glückwunsch!** \"\n\n\"**Und nicht nur das** ...\", sagte Elisabeth. \"Sie wollen jetzt **jede Woche** einen Artikel über die **Lebensgeschichte** von Flüchtlingen **drucken.** Er fragt, **ob ich Interesse habe** ...\"\n\n\"Und ...?\", sagte ich.\n\n\"**Was für eine Frage!** \", sagte Elisabeth. \"Natürlich habe ich Interesse! Aber es gibt eine **Bedingung** ...\"\n\n\"**Nämlich?** \", sagte ich.\n\n\"Die Zeitung will, dass ich mit Flüchtlingen in **Wien** spreche. **Übermorgen!** Sie **bezahlen** Flug und Hotel.\"\n\n\"Mhm\", sagte ich. \"Wien? **Ich war noch nie in Österreich.** \"\n\n\"**Ich auch nicht** ...\", sagte Elisabeth.\n\n\"Warum fliegen wir nicht zusammen?\", sagte ich.\n\n\"**Im Ernst?** \", sagte sie. \"Aber ... was willst du dort machen?\"\n\n\"Die **Österreicher** sprechen Deutsch, oder nicht?\", sagte ich. Elisabeth nickte.\n\n\"Na also\", sagte ich. \"Du kannst dort deinen Artikel schreiben, und ich werde ein bisschen Deutsch lernen! Ich habe **schon wieder** so viel **vergessen.** \"\n\n---\n\n## Übung\n\n**1. Dino und Elisabeth haben jetzt ...**\n\na) ein bisschen Zeit nur für sich\nb) keine Zeit mehr\nc) viel Zeit zum Arbeiten\n\n**2. Vincente hat ... von Fadiyah bekommen.**\n\na) einen Brief\nb) einen Anruf\nc) eine SMS\n\n**3. Fadiyah ist ...**\n\na) zurück nach Syrien gegangen\nb) in München angekommen\nc) in Neapel geblieben\n\n**4. Am nächsten Morgen fahren Dino und Elisabeth ...**\n\na) zum Flughafen\nb) nach Cefalù\nc) in die Innenstadt von Palermo\n\n**5. Wie findet Elisabeth Palermo?**\n\na) Sie liebt diese Stadt.\nb) Sie hasst diese Stadt.\nc) Sie findet diese Stadt in Ordnung.\n\n**6. Dino bekommt eine Email mit Fotos ...**\n\na) von Alfredo und Loretta\nb) von Fadiyah\nc) von Onkel Vincente\n\n**7. Elisabeth bekommt eine Email ...**\n\na) von Alfredo und Loretta\nb) von Fadiyah\nc) vom Chefredakteur einer englischen Zeitung\n\n**8. Die Zeitung will Elisabeths Artikel ...**\n\na) veröffentlichen\nb) verändern\nc) löschen\n\n**9. Warum soll Elisabeth nach Wien reisen?**\n\na) Sie soll dort mit Flüchtlingen sprechen.\nb) Sie soll dort im Büro arbeiten.\nc) Sie soll dort Deutsch lernen.\n\n**10. Was schlägt Dino vor?**\n\na) Dass er alleine nach Wien geht.\nb) Dass Elisabeth alleine nach Wien geht.\nc) Dass sie zusammen nach Wien gehen.\n\n**11. Was will Dino in Wien machen?**\n\na) mit Flüchtlingen sprechen\nb) Deutsch lernen\nc) Arbeit suchen"}];
const MORD_BOOK_DATA = [{"title": "📖 Introduction", "content": "### Introduction\n\nIn German, detective stories are called **Krimis**. One of the most famous German Krimis is perhaps the TV-series **Tatort** which means crime scene and has been running since 1970 on television channels in Austria, Switzerland and Germany. Watching the weekly Tatort has become an almost iconic activity in everyday German culture. Each Sunday at 8:15pm, shortly after the evening news, millions are flocking to the screen to solve fresh crimes and mysteries.\n\nThis book is a detective story especially written for German learners. Not only does it invite readers to help solve a crime but also to pick up important Krimi vocabulary that can serve as a preparation for watching series such as Tatort and many others in the original.\n\nEach chapter contains a selection of relevant words translated into English, and is followed by questions regarding the content. (The correct answers are to be found at the end of the book.)\n\nWhile the writing itself primarily aims at an entertaining and interactive experience, the language is specially designed to familiarize the reader with unique forms of spoken German, with an emphasis on dialogue and the daily culture of speech.\n\n---\n\n### How To Read This Book\n\nBefore we start, we should note that there will be unknown words in the following story and that there are, in fact, various ways to deal with this very common problem for language learners of all ages and stages.\n\nPerhaps the best advice can be found in the words of Roald Dahl that appear in his children's novel Matilda: \"And don't worry about the bits you can't understand. Sit back and allow the words to wash around you, like music.\"\n\nSome readers will be content with this more intuitive approach while others feel they need to know each word in a sentence before they advance to the next.\n\nThere are two ways to satisfy these needs directly, without ever having to leave the text itself.\n\n1. As already pointed out above, important or difficult words are appended to each chapter with an English translation.\n\n2. For some readers this special selection will not be enough. Depending on the reading device you own you can download a German-English dictionary and get translations as you go along."}, {"title": "🏚️ Chapter 1: Die Ankunft", "content": "**Kommissar Baumgartner stieg aus dem Auto, klappte seinen Kragen hoch und schlüpfte unter dem Absperrband hindurch in den Vorgarten.** Das ungemähte Gras stand ihm bis zu den Knien.\n\n\"**Mistwetter!** \", hörte er seine Kollegin sagen.\n\nSie eilte zur Haustür und ging hinein. Baumgartner schüttelte den Regen aus seinem Mantel und folgte ihr.\n\nDas Haus stand am Ende eines langen Waldweges. **Die Fenster waren eingeschlagen und im Dach klafften große Löcher. Es schüttete aus allen Wolken.**\n\n---\n\n**Vocabulary:**\n\n| German | English |\n|--------|---------|\n| eingeschlagen | bashed in |\n| klaffen | gaping |\n| Löcher | holes |\n| aus allen Wolken schütten | raining cats and dogs |\n| Kragen hochklappen | turn one's collar up |\n| hindurchschlüpfen | to slip through |\n| Absperrband | police line |\n| ungemäht | unmown |\n| Mistwetter | crappy weather |\n| eilen | to hurry |\n\n---\n\n## Übung\n\n**1. Wo sind Kommissar Baumgartner und seine Kollegin?**\n\na) bei einem Haus\nb) auf einem Friedhof\nc) in einem Park\n\n**2. Wie ist das Wetter?**\n\na) die Sonne scheint\nb) es regnet\nc) es schneit\n\n**3. Wie ist der Zustand des Hauses?**\n\na) sehr gut\nb) mittelmäßig\nc) sehr schlecht"}, {"title": "🔍 Chapter 2: Der Tatort", "content": "\"Was wollte er bloß hier?\", fragte Kommissarin Momsen.\n\n\"Ich weiß es nicht. Aber was immer er hier gesucht hat, er war nicht allein\", antwortete Baumgartner.\n\nDie beiden Kommissare bahnten sich einen Weg durch die Scherben und Holzsplitter zur Küche.\n\nAuch hier waren alle Fenster eingeschlagen. Die beigen Gardinen flatterten im Wind. **Auf dem Boden war der Umriss des Opfers mit Kreide auf die dunklen Fliesen gezeichnet.**\n\nDer Wind heulte durch die Ritzen und die kahlen Bäume zitterten vor den zerschlagenen Fenstern.\n\n\"**Hast du schon Antwort von Grabowski?** \", fragte Baumgartner seine Kollegin. Kommissarin Katharina Momsen schüttelte den Kopf: \"Nein, aber ich rufe jetzt sofort das Labor an!\"\n\n\"**Moment mal**\", sagte Baumgartner.\n\n\"Was ist denn, Harald?\", fragte sie.\n\n\"Die Spurensicherung hat alles durchkämmt, richtig?\", fragte er.\n\n\"Ja, wieso?\", fragte sie.\n\nDas Innere des Hauses war in keinem besseren Zustand als das Äußere. Die Wände waren mit Graffiti beschmiert, überall lagen Papiere, zerstörte Möbelstücke und Scherben auf dem Boden.\n\nKommissar Baumgartner bückte sich, schob den Küchentisch ein paar Zentimeter zur Seite und sagte: \"**Kannst du mir sagen, was das hier ist?** \"\n\nZwischen Daumen und Zeigefinger hielt er ein kleines Plastikteil mit goldenem Aufdruck.\n\n---\n\n**Vocabulary:**\n\n| German | English |\n|--------|---------|\n| Untersuchung | analysis |\n| ergeben | to result |\n| Leiche | corpse |\n| Todesursache | cause of death |\n| Herzstillstand | cardiac arrest |\n| Druckstellen | pressure marks |\n| Hautabschürfung | abrasion |\n| Spuren | traces |\n| Eingriff von außen | external intrusion |\n| Gerichtsmediziner | forensic pathologist |\n| auf etw. hinweisen | to point to sth. |\n| einfach so | just like that |\n| Handschuh | glove |\n| entdecken | to discover |\n| Schachtel | box |\n\n---\n\n## Übung\n\n**1. Wo geschah der Mord?**\n\na) im Schlafzimmer\nb) im Wohnzimmer\nc) in der Küche\n\n**2. Was ist Grabowski von Beruf?**\n\na) Kommissar\nb) Staatsanwalt\nc) Gerichtsmediziner\n\n**3. Wie heißt Kommissar Baumgartner mit Vornamen?**\n\na) Harald\nb) Günter\nc) Manfred\n\n**4. Was hat Baumgartner gefunden?**\n\na) ein Telefonbuch\nb) einen Zettel\nc) eine SIM-Karte"}, {"title": "🔬 Chapter 3: Im Polizeilabor", "content": "\"Herzstillstand\", sagte Grabowski.\n\n\"Wie bitte?\", fragte Kommissarin Momsen.\n\n\"Wir haben keine Druckstellen oder Hautabschürfungen gefunden, die auf einen Eingriff von außen hinweisen könnten\", antwortete Grabowski.\n\n\"Wollen Sie uns sagen, der Junge ist einfach so plötzlich umgefallen?\", fragte Baumgartner.\n\nDer Gerichtsmediziner zuckte mit den Schultern.\n\n\"**Das einzige, was wir gefunden haben, ist das hier**\", sagte Grabowski und gab dem Kommissar ein Foto.\n\n\"Und?\", fragte Kommissar Baumgartner.\n\nGrabowski zog seine Handschuhe aus und deutete mit dem Finger auf das Foto: \"**Sehen Sie die zwei roten Punkte hier auf dem Hals der Leiche?** \"\n\nKatharina Momsen nickte und sagte: \"Ja, das erinnert mich an irgendwas.\"\n\n\"**An Vampirfilme?** \", fragte Baumgartner.\n\nSeine Kollegin runzelte die Augenbrauen und fragte: \"Todeszeit?\"\n\n\"Vermutlich gegen halb zwei.\"\n\n\"Morgens?\", fragte sie.\n\n\"Unsere Untersuchungen haben ergeben, dass die Leiche bereits mehrere Stunden am Tatort gelegen haben muss\", sagte Grabowski.\n\n\"Und die Todesursache?\", fragte Kommissar Baumgartner.\n\n\"Ja. Ziemlich genau sieben Stunden bevor ein Spaziergänger die Leiche entdeckt hat.\"\n\n\"Danke, Grabowski\", sagte Katharina. \"Kann ich das Foto haben?\"\n\n\"Natürlich. Nehmen Sie die ganze Serie\", sagte Grabowski und gab ihr eine kleine Schachtel.\n\n---\n\n## Übung\n\n**1. Warum denkt Baumgartner an Vampirfilme?**\n\na) weil er sehr gerne Horrorfilme sieht\nb) weil die Leiche zwei kleine rote Punkte am Hals hat\nc) weil die Leiche aussieht wie ein Vampir\n\n**2. Wann wurde der Tote ungefähr ermordet?**\n\na) 01:24\nb) 10:41\nc) 04:41\n\n**3. Welche Wunden hat die Leiche?**\n\na) eine Schusswunde\nb) eine Schnittwunde\nc) zwei kleine rote Punkte\n\n**4. Welcher der folgenden Sätze ist nicht korrekt?**\n\na) \"Wir haben keine Spuren gefunden.\"\nb) \"Spuren haben wir keine gefunden.\"\nc) \"Wir keine Spuren gefunden haben.\""}, {"title": "🚗 Chapter 4: Der nächste Schritt", "content": "\"Na der Spaziergänger\", sagte Baumgartner.\n\n\"Ach so, der Zeuge\", sagte Katharina und drehte die Heizung höher. \"Warum ist es immer so kalt in deiner Karre?\"\n\nHarald Baumgartner antwortete nicht.\n\n\"**Übrigens, wegen der SIM-Karte, ich habe die meinem Neffen gegeben** und er sagt, er versucht herauszufinden, auf welchen Namen sie registriert ist. Der hat ein Händchen für so was\", sagte Kommissarin Katharina Momsen.\n\nBaumgartner hupte und überholte einen Lastwagen. \"**Deinem Neffen? Bist du verrückt?** Nächstes Mal fragst du mich, bevor du Beweismaterial aus der Hand gibst!\", sagte er und trommelte mit den Fingern auf dem Lenkrad.\n\n\"**Nächstes Mal**\", sagte Katharina und lächelte. \"Versprochen!\"\n\n\"Das hast du auch letztes Mal gesagt!\", sagte Baumgartner und beschleunigte. \"Erinnerst du dich an die Sache mit dem japanischen Säbel?\"\n\n\"**Erstens** haben wir ihn am Ende nur deswegen festgenagelt, und **zweitens** war das kein Säbel, sondern ein Katana\", sagte sie.\n\n\"In Ordnung\", sagte Baumgartner. \"Wenn dein Neffe was findet, lad' ich dich zum Essen ein.\"\n\n\"Und wenn nicht?\", fragte Katharina.\n\n\"Dann kochst du für mich!\", sagte Harald.\n\n\"**Abgemacht**\", sagte sie und lächelte.\n\n\"Und was jetzt?\", fragte Katharina und schloss die Autotür.\n\n\"**Dreimal darfst du raten**\", sagte Harald Baumgartner und startete den Motor.\n\n\"Wir suchen nach dem Vampir?\", fragte sie.\n\n\"**Genau!** \", antwortete Harald und reihte sich in den Verkehr ein. \"Aber zuerst gucken wir uns den Kolbe an.\"\n\n\"Kolbe?\", fragte sie.\n\n---\n\n## Übung\n\n**1. Wohin fahren die Kommissare?**\n\na) ins Büro\nb) zu einem Zeugen\nc) ins Restaurant\n\n**2. Was hat Katharina Momsen mit der SIM-Karte gemacht?**\n\na) Sie hat sie verloren.\nb) Sie hat sie ihrem Neffen gegeben.\nc) Sie hat sie ins Labor geschickt.\n\n**3. Worin besteht die Wette zwischen Kommissar Baumgartner und Kommissarin Momsen?**\n\na) Wenn Katharinas Neffe Spuren auf der SIM-Karte findet, lädt Katharina Harald zum Essen ein.\nb) Wenn Katharinas Neffe Spuren auf der SIM-Karte findet, lädt Harald Katharina zum Essen ein.\nc) Wenn Katharinas Neffe Spuren auf der SIM-Karte findet, kocht Katharina für Harald."}, {"title": "🐕 Chapter 5: Ralfi", "content": "Herr Kolbe war ein Mann von ungefähr sechzig Jahren mit einem enormen schwarzen Hund, den er liebevoll \"Ralfi\" nannte.\n\nDie Kommissare hatten ihn auf der Straße vor seinem Haus getroffen. Es **nieselte**.\n\n\"**Bitte erzählen Sie uns noch einmal ganz genau, wie Sie die Leiche gefunden haben**\", sagte Kommissar Baumgartner.\n\nWährend Ralfi an einer Straßenlaterne schnupperte und das Bein hob, schaute Herr Kolbe auf den Bürgersteig und sagte: \"Da gibt es nicht viel zu erzählen. Ich war mit Ralfi im Wald spazieren und **plötzlich ist er weggerannt**. Ich habe ihn überall gesucht. Und dann habe ich ihn bellen gehört. Er stand vor diesem alten Haus. Ich folgte ihm ... und den Rest habe ich ja schon ihren Kollegen erzählt\", sagte Herr Kolbe und gab seinem kolossalen schwarzen Köter ein Leckerli.\n\nKommissarin Katharina Momsen fragte: \"Herr Kolbe, haben Sie den Jungen vorher schon einmal gesehen?\"\n\n\"**Nein.** \" Herr Kolbe schüttelte den Kopf. \"Das ist ein kleines Dorf. **Der ist nicht von hier**, sonst hätte ich den schon mal gesehen.\"\n\nHarald Baumgartner streichelte den Kopf des Hundes und fragte: \"**Was wissen Sie über das alte Haus, Herr Kolbe?** \"\n\n\"**Es steht schon seit Jahren leer.** Soweit ich weiß, hat irgendein Immobilienhai das Grundstück gekauft und will dort einen Supermarkt hinsetzen\", sagte Herr Kolbe.\n\nHarald warf Katharina einen Blick zu.\n\n\"Ein Immobilienhai?\", fragte sie.\n\n\"Ja, die kaufen hier alles auf. Drei Straßen weiter bauen Sie ein Fitnesscenter, als ob unsereins so was braucht\", sagte Herr Kolbe und kraulte seinem Hund die Ohren.\n\n---\n\n**Vocabulary:**\n\n| German | English |\n|--------|---------|\n| nieseln | to drizzle |\n| Straßenlaterne | street lamp |\n| schnuppern | to sniff |\n| Köter | dog (informal derogative) |\n| Leckerli | treat |\n| Immobilienhai | property shark |\n| unsereins | the likes of us |\n| kraulen | to ruffle |\n\n---\n\n## Übung\n\n**1. Wie hat Herr Kolbe die Leiche gefunden?**\n\na) Sie lag auf der Straße.\nb) Der Hund hat sie gefunden.\nc) Er hatte einen Schrei gehört.\n\n**2. Was weiß Herr Kolbe über den Toten?**\n\na) Er hat ihn noch nie gesehen.\nb) Er kennt ihn sehr gut.\nc) Er will nicht darüber sprechen.\n\n**3. Wem gehört das alte Haus, laut Herrn Kolbe?**\n\na) einem \"Immobilienhai\"\nb) einer alten Frau\nc) der Regierung\n\n**4. Welches der folgenden Wörter ist kein Synonym für \"Hund\"?**\n\na) Kläffer\nb) Köter\nc) Stubentiger"}, {"title": "🏗️ Chapter 6: Die Baustelle", "content": "Der Regen hatte aufgehört. Der dunkle Himmel öffnete sich und die Sonne schien für einen Augenblick. Doch bevor die Kommissare die Baustelle erreicht hatten, war die Sonne wieder verschwunden.\n\n\"**Wenigstens regnet es nicht**\", sagte Harald und stieg aus dem Auto.\n\nZwei Bauarbeiter waren dabei frischen Beton auf ein Fundament zu gießen. Katharina Momsen rief ihnen zu: \"Hallo! **Könnt ihr mir sagen, wer hier verantwortlich ist?** \"\n\nEiner der Bauarbeiter wischte sich den Schweiß von der Stirn und wies mit dem Arm in die Richtung eines Containers. Der andere streifte sie mit misstrauischem Blick.\n\nDie beiden Kommissare gingen über die matschige Baustelle, und Harald klopfte an der Containertür.\n\n\"Ja?\", sagte eine Männerstimme hinter der Tür.\n\n\"**Kriminalpolizei**\", antwortete Kommissarin Momsen.\n\nNach wenigen Sekunden hörten sie das Geräusch eines Schlüsselbunds, und die Tür stand offen.\n\nEin **unrasierter Mann im Unterhemd** startte aus müden Augen.\n\n\"**Was wollen Sie?** \", murrte er.\n\n\"**Können wir kurz reinkommen?** \", sagte Katharina und betrat den Container.\n\n\"**Dauert nicht lang**\", sagte Harald und folgte seiner Kollegin.\n\nKatharina setzte sich auf einen Plastikstuhl und spielte mit einer Kaffeetasse.\n\n\"Sagen Sie, Herr ...\"\n\n\"**Mahler**\", antwortete der Mann.\n\n\"So wie der Komponist?\", fragte Kommissar Baumgartner.\n\n\"**Ja**, genau.\"\n\n\"Mahler und Söhne?\", fragte Katharina.\n\n\"Ja, aber ich bin nur der Bauplaner. Mein Bruder ist der Architekt\", sagte der Mann.\n\n\"Was wurde hier früher gebaut?\", fragte Baumgartner.\n\n\"Früher?\", fragte der Bauplaner.\n\n\"Ja, vor diesem Haus, das jetzt leer steht\", sagte Baumgartner.\n\n\"Das war wohl 'ne Klinik oder so was. Aber ich arbeite hier erst seit zwei Monaten\", sagte Mahler.\n\n\"**Sie sind nicht zufällig mit dem alten Haus vertraut?** \", fragte Katharina.\n\n\"Nein.\"\n\n\"**Haben Sie eine Genehmigung für den Bau hier?** \", fragte Harald.\n\n\"Natürlich\", sagte Mahler und zeigte auf eine Reihe von Ordnern auf einem Regal.\n\n\"Wo kann man Ihren Bruder finden?\", fragte Katharina.\n\n\"Er ist eigentlich immer im Büro\", sagte Mahler.\n\n\"In Ordnung\", sagte Harald. \"**Wir werden uns das mal ansehen.** \"\n\n---\n\n**Vocabulary:**\n\n| German | English |\n|--------|---------|\n| matschig | muddy |\n| klopfen | to knock |\n| Geräusch | sound |\n| Schlüsselbund | key ring |\n| unrasiert | unshaven |\n| reinkommen | come in |\n| umherspazieren | to wander around |\n| Baupläne | blue prints |\n| Genehmigung | permission |\n| Grundstück | property |\n| ausdruckslos | expressionless |\n| zögern | to hesitate |\n| Schublade | drawer |\n| Zettel | piece of paper |\n| gemütlich | comfortable |\n| verdächtigen | to suspect |\n| Kneipe | bar/pub |\n| nachprüfen | to verify |\n| einfallen | to come to mind |\n\n---\n\n## Übung\n\n**1. Welche Kleidung trägt der Mann?**\n\na) einen Anzug mit Krawatte\nb) ein Unterhemd\nc) einen Schlafanzug\n\n**2. Was wird auf der Baustelle gebaut?**\n\na) ein Supermarkt\nb) ein Fitnessstudio\nc) eine Drogerie\n\n**3. Was gibt Herr Mahler den Kommissaren?**\n\na) eine Visitenkarte\nb) einen Zettel mit einer Adresse\nc) ein Ticket\n\n**4. Welcher der folgenden Sätze ist nicht korrekt?**\n\na) \"Er ist zuständig für die Bauplanung.\"\nb) \"Er ist für die Bauplanung zuständig.\"\nc) \"Er zuständig für die Bauplanung ist.\""}, {"title": "🏛️ Chapter 7: Der Architekt", "content": "An der Haustür stand: Architekturbüro Mahler und Söhne. \"**Schau mal einer an. Noch mehr Mahlers!** \" sagte Kommissar Harald Baumgartner und klingelte.\n\nNach wenigen Sekunden ertönte ein Summen und die Tür öffnete sich.\n\nEin **glatzköpfiger Mann mit einer schwarzen Brille** grüßte die Kommissare: \"Guten Tag, was kann ich für Sie tun?\"\n\nKommissarin Katharina Momsen zeigte ihm ihren Ausweis. \"**Kripo. Mordkommission.** \"\n\nDer Architekt zögerte für einen Moment und sagte: \"Mein Bruder hat mir schon davon erzählt. Es ist schrecklich! ... Bitte setzen Sie sich. Kaffee, Tee?\"\n\n\"Nein danke\", sagte Harald Baumgartner und nahm auf einem weißen Ledersofa Platz. \"**Ihr Bruder?** \"\n\n\"Sie meinen wegen dem Mahler und Söhne?\", fragte der Architekt und lächelte. Baumgartner nickte.\n\nDer Architekt antwortete: \"Unser Vater ist vor vielen Jahren gestorben. Aber wenn man sich einmal einen Namen gemacht hat ...\"\n\n\"In Ordnung\", sagte Katharina und zeigte dem Architekten ein Foto der Leiche. \"**Kennen Sie diesen Jungen?** \"\n\n\"**Nicht, dass ich wü...** \"\n\n\"Was ist, Herr Mahler?\", fragte Harald.\n\nDer Architekt nahm die Brille vom Kopf, putzte sie, rieb sich die Augen und setzte sie wieder auf.\n\n\"Herr Mahler?\", sagte Katharina.\n\n\"**Das ist Peter**\", erwiderte er. \"**Unser Praktikant.** \"\n\n\"**Der Mord ist vor zwei Tagen geschehen**\", sagte Harald Baumgartner. \"**Haben Sie ihn nicht vermisst?** \"\n\nDer Architekt stand auf und begann in seinem Büro auf und ab zu laufen.\n\n\"Nein, ich meine ... doch, natürlich!\"\n\n\"Aber...?\", fragte Katharina Momsen.\n\n\"Nun ja, wir hatten öfters Probleme mit ihm. Das war leider relativ normal, dass er für ein paar Tage verschwindet ...\"\n\n\"Probleme?\", fragte Katharina.\n\n\"Na ja, also ... er kam oft zu spät, weil er sich nachts auf Partys herumtrieb\", sagte der Architekt.\n\n\"Hatte er irgendwelche Feinde?\", fragte Harald.\n\n\"Feinde?\" Der Architekt lachte. \"Nein, das kann ich mir nicht vorstellen.\"\n\n\"**Wann haben Sie Ihren Praktikanten zuletzt gesehen?** \", fragte Harald Baumgartner.\n\nDer Architekt hatte wieder Platz genommen und sagte: \"Es war vor zwei Tagen, glaube ich. Ich hatte ihn zum Grundstück geschickt, um etwas nachzumessen.\"\n\n\"Wo das alte Haus steht?\", fragte Katharina.\n\n\"Ja, wo das alte Haus steht\", sagte der Architekt und schaute abwesend in den Raum.\n\n\"Ein Spaziergänger hat Ihren Praktikanten dort gefunden\", sagte Harald Baumgartner.\n\nDer Architekt seufzte und sagte: \"Vielleicht war es ein Unfall?\"\n\n\"Vielleicht\", sagte Kommissarin Momsen.\n\n\"**Wo waren Sie in der Nacht zum Freitag zwischen elf und zwei Uhr morgens?** \", fragte Harald.\n\n\"Im Bett\", sagte der Architekt. \"Bei meiner Freundin. Sie kann das bestätigen.\"\n\n---\n\n**Vocabulary:**\n\n| German | English |\n|--------|---------|\n| Schau mal einer an! | Well, well... |\n| ertönen | to resound |\n| Summen | buzz |\n| glatzköpfig | bald |\n| Ausweis | identification |\n| Kripo | clipping of Kriminalpolizei: criminal investigation department |\n| Mordkommission | homicide squad |\n| schrecklich | horrible |\n| einen Namen machen | to acquire renown |\n| reiben | rub |\n| erwidern | to respond |\n| Praktikant | intern |\n| auf und ab laufen | to walk to and fro |\n| herumtreiben | to hang around |\n| Feinde | enemies |\n| sich vorstellen | to imagine |\n| nachmessen | to remeasure |\n| abwesend | absently |\n| bestätigen | to confirm |\n\n---\n\n## Übung\n\n**1. Welche Beziehung hat der Architekt Mahler zu dem Bauplaner Mahler?**\n\na) er ist sein Bruder\nb) er ist sein Onkel\nc) er ist sein Vater\n\n**2. Hat der Architekt lange oder kurze Haare?**\n\na) lange\nb) kurze\nc) er hat eine Glatze\n\n**3. Kennt der Architekt den Toten?**\n\na) nein\nb) ja, er hat bei ihm als Praktikant gearbeitet\nc) ja, er hat bei ihm als Designer gearbeitet"}, {"title": "🌭 Chapter 8: Der Imbiss", "content": "\"**Einmal Currywurst mit Pommes**\", sagte Harald.\n\n\"**Mit oder ohne Darm?** \", fragte der Imbissbudenverkäufer.\n\n\"Mit\", sagte Harald. \"Und die Pommes rot weiß, bitte.\"\n\n\"Und für Sie?\", fragte er Katharina.\n\n\"**Einen O-Saft, bitte**\", sagte sie.\n\nWährend sie an einem Stehtisch auf das Essen warteten, sagte Katharina: \"**Irgendwas ist faul mit den Mahler-Brüdern.** \"\n\nHarald trommelte mit den Fingern auf dem Plastiktisch und sagte: \"Wieso? Die haben beide ein Alibi, müssen wir natürlich noch nachprüfen, aber es gibt doch gar kein Motiv!\"\n\n\"Kein Motiv?\", sagte Katharina und saugte an ihrem Strohhalm. \"Da ist sicher 'ne Menge Geld im Spiel!\"\n\n\"Aber warum sollten die ihren Praktikanten umbringen?\", fragte Harald.\n\n\"Vielleicht wusste der etwas, was er nicht wissen sollte\", sagte Katharina.\n\n\"Moment mal, mein Handy ...\" Sie nahm ihr Telefon aus der Jackentasche und sagte: \"Ja ... wann? ... ok, danke.\"\n\n\"Wer war das?\", fragte Harald.\n\n\"**Ich glaube, du darfst mich bald zum Essen einladen**\", sagte Katharina und lächelte.\n\n\"**Hat dein Neffe die SIM-Karte geknackt?** \", fragte Harald.\n\n\"Ja, sie ist auf den Namen des Praktikanten registriert. Und rate mal, wen er zuletzt angerufen hat.\"\n\n\"Den Mahler?\", fragte Harald.\n\n\"**Korrekt, aber welchen?** \", erwiderte Katharina.\n\n\"Den Architekten?\", fragte er.\n\n\"Nein, den anderen!\", sagte sie. \"Und noch was, der Praktikant war der Sohn des Bürgermeisters!\"\n\n\"**Im Ernst?** \", fragte Harald.\n\nKatharina nickte. \"Guck mal, da kommt deine Currywurst.\"\n\n---\n\n**Vocabulary:**\n\n| German | English |\n|--------|---------|\n| Pommes | french fries |\n| Currywurst | pork sausage with curry ketchup |\n| Darm | intestine sausage casing |\n| Imbiss | snack bar |\n| O-Saft | orange juice |\n| Stehtisch | bar table |\n| etwas ist faul | something is rotten |\n| umbringen | to kill |\n| raten | to guess |\n| bekannt vorkommen | to seem familiar |\n| knacken | to crack / hack |\n| verwandt | related |\n| Im Ernst? | Are you serious? |\n| Bürgermeister | mayor |\n\n---\n\n## Übung\n\n**1. Was bestellt Harald Baumgartner?**\n\na) eine Currywurst mit Pommes\nb) einen Hamburger mit Pommes\nc) eine Pizza\n\n**2. Was bestellt Katharina Momsen?**\n\na) einen Kaffee\nb) einen O-Saft\nc) eine Cola\n\n**3. Wer hat Katharina auf dem Handy angerufen?**\n\na) Grabowski\nb) ihre Mutter\nc) ihr Neffe\n\n**4. Welches der folgenden Wörter ist ein Synonym für Bürgermeister?**\n\na) Staatsanwalt\nb) Landsmann\nc) Stadtoberhaupt"}, {"title": "☕ Chapter 9: Der nächste Morgen", "content": "\"Morgen, Harald. **Du siehst schlecht aus**\", sagte Katharina.\n\n\"**Danke für die Blumen. Gib mir bitte 'n Kaffee!** \", sagte Harald.\n\n\"**Hast du wieder im Büro geschlafen?** \", fragte Katharina.\n\n\"**Halt mir keine Moralpredigt, guck dir lieber das hier an!** \", sagte Kommissar Harald Baumgartner und hielt ihr ein Papier vor die Nase.\n\n\"Was ist das?\", fragte Katharina.\n\n\"Das ist eine Tabelle mit den Alibis der Mahlers.\"\n\n\"Und?\", fragte Katharina.\n\n\"Schau mal hier! Die Freundin des Architekten sagt, er ist erst mitten in der Nacht bei ihr angekommen. Grabowski hat gesagt, der Praktikant ist gegen halb zwei gestorben ...\", sagte Harald.\n\n\"Aber warum hat seine Freundin ihn nicht gedeckt?\", fragte Katharina und gab ihrem Kollegen eine Tasse Kaffee.\n\n\"Ich glaube, sie hat nichts von dem Mord gewusst\", sagte Harald. \"Zuerst hat sie behauptet, Mahler wäre die ganze Nacht bei ihr gewesen, aber als ich ihr gesagt habe, dass der Sohn des Bürgermeisters tot ist, hat sie ihre Aussage geändert.\"\n\n\"Interessant. Aber was ist das Motiv?\", fragte Katharina.\n\n\"Ich habe gestern Abend Herrn Wernicke, den Bürgermeister, angerufen\", sagte Harald.\n\n\"Und?\", fragte Katharina.\n\n\"Er meinte, sein Sohn sei in Thailand!\"\n\n\"Hast du ihm die Wahrheit gesagt?\", fragte sie.\n\n\"Ja, er schien nicht überrascht. Er kommt in einer halben Stunde\", sagte Harald.\n\n\"In Ordnung\", sagte Katharina und ging zu ihrem Schreibtisch. \"Oh, und ... Harald?\"\n\n\"Ja?\", sagte er.\n\n\"Guck mal in den Spiegel. Vielleicht willst du dich rasieren, bevor der Bürgermeister kommt.\"\n\n---\n\nZwei Tassen Kaffee und eine schnelle Rasur später klopfte es an der Tür von Baumgartners Büro.\n\nHerr Wernicke trug einen italienischen Anzug. Seine blass-blonden Haare waren sorgfältig über den Schädel gekämmt.\n\n\"Guten Morgen\", sagte Komissar Harald Baumgartner. \"Setzen Sie sich doch, bitte!\"\n\n\"Danke\", sagte der Bürgermeister und nahm Platz. \"Hören Sie, ich will aus dem Ganzen keine große Sache machen ...\"\n\n\"Wie bitte?\", fragte Harald.\n\n\"Ich meine die Presse\", sagte der Bürgermeister.\n\nHarald Baumgartner rieb sich die Stirn und sagte: \"Herr Wernicke, solange wir ermitteln, geht das die Presse nichts an!\"\n\n\"Gut\", sagte Herr Wernicke. \"Aber nachher ...\"\n\nKommissarin Katharina Momsen betrat das Zimmer. \"**Jetzt interessiert uns erst einmal das Vorher!** \", sagte sie und schloss die Tür hinter sich.\n\nDer Bürgermeister verzog das Gesicht.\n\n\"**Wo waren Sie zum Beispiel in der Nacht zum Freitag zwischen elf und zwei Uhr morgens?** \", fragte Kommissarin Momsen und stützte sich mit der Hand auf einen Schreibtisch.\n\n\"Was?\", fragte der Bürgermeister. \"Verdächtigen Sie mich etwa meinen eigenen Sohn ermordet zu haben?\"\n\n\"Wir verdächtigen niemand. Wir ermitteln bloß\", sagte Kommissarin Katharina Momsen.\n\nHerr Wernickes Augen sprangen durch den Raum. \"**Das ist eine Frechheit!** \", sagte er.\n\n\"**Eine letzte Frage noch**\", sagte Baumgartner. \"Haben Sie vielleicht eine Idee, was Ihr Sohn in dem alten Haus gesucht hat?\"\n\n\"Nein\", sagte Herr Wernicke. \"Und ohne meinen Anwalt sage ich nichts mehr.\"\n\nHerr Wernicke stand auf und verließ kopfschüttelnd das Büro.\n\nHarald Baumgartner zuckte mit den Schultern.\n\n\"Politiker\", sagte Katharina.\n\nEin paar Minuten später klopfte es ein zweites Mal an der Tür. \"Herein!\", sagte Baumgartner.\n\nEin **Mädchen von knapp 17 Jahren mit blonden Haaren und verweinten Augen** betrat das Zimmer.\n\n\"Kann ich dir helfen?\", fragte Harald.\n\nDas Mädchen begann zu schluchzen: \"Es ist wegen ... Peter!\" und brach in Tränen aus.\n\n\"Peter?\", fragte Harald. Seine Kollegin flüsterte ihm ins Ohr: \"Mensch! Das ist der Praktikant!\" und legte einen Arm um die Schulter des Mädchens. Mit der anderen Hand reichte sie ihr eine Packung Taschentücher.\n\nNachdem sich das Mädchen beruhigt hatte, erzählte sie ihnen, dass Peter ein Internat in der Schweiz besuchte und ihr regelmäßig Briefe schrieb.\n\n\"Er war nur über die Ferien hier, um ein Praktikum zu machen\", sagte sie.\n\n\"**Aber was hat er bei dem Haus gemacht, mitten in der Nacht?** \", fragte Baumgartner.\n\n---\n\n## Übung\n\n**1. Wo hat Baumgartner geschlafen?**\n\na) in seiner Wohnung\nb) im Büro\nc) in einem Hotel\n\n**2. Wer war Peter Wernicke?**\n\na) der Sohn des Bürgermeisters\nb) der Neffe des Bürgermeisters\nc) der Enkel des Bürgermeisters\n\n**3. Wer ist das Mädchen, das im Büro erscheint?**\n\na) Peter Wernickes Freundin\nb) Harald Baumgartners Tochter\nc) Katharinas Nichte\n\n**4. Welcher der folgenden Sätze hat nicht die gleiche Bedeutung wie der Satz: \"Das ist eine Frechheit!\"**\n\na) \"Das ist respektlos!\"\nb) \"Das ist eine Unverschämtheit!\"\nc) \"Das ist eine Ungereimtheit!\""}, {"title": "💡 Chapter 10: Motive, Mörder, Waffen", "content": "\"Also ich versteh' das alles nicht\", sagte Katharina. \"Warum wollte der Wernicke unbedingt diesen Supermarkt?\"\n\n\"Überleg mal, Katharina. Da war bestimmt 'ne Menge Schmiergeld zu holen\", sagte Baumgartner. \"Da hatte er doppelt zu kassieren, als Bürgermeister und als rechtlicher Inhaber des Grundstücks.\"\n\n\"Rechtlicher Inhaber?\", fragte Katharina.\n\n\"Ja, Peter war noch nicht volljährig, auf dem Papier gehörte das Grundstück seinem Vater!\", sagte Harald.\n\n\"Okay, gut. Aber warum hat der Peter Wernicke bei den Mahlers als Praktikant gearbeitet?\", fragte sie.\n\n\"Das könnte ein Zufall gewesen sein. Ich glaube aber, dass der Wernicke seinen Sohn dorthin geschickt hat, damit er keinen Verdacht schöpft\", sagte Kommissar Harald Baumgartner.\n\n\"Verdacht?\", fragte Katharina Momsen.\n\n\"Der arme Junge dachte, er macht Berufserfahrung und träumt davon, sein eigenes Haus zu bauen, aber hinter seinem Rücken verkauft der Vater das Grundstück!\", sagte Baumgartner. \"**Eines Tages hat er dann den Plan für den Supermarkt gesehen.** Die Mahlers haben ihm alles erklärt und versucht ihn zu beruhigen, aber für ihn war es das Ende eines Traums. Er hat ihnen gedroht an die Presse zu gehen und die Geschäfte zwischen ihnen und seinem Vater aufzudecken, und ist weggerannt.\"\n\n\"Zu dem alten Haus!\", sagte Katharina.\n\n\"Richtig. Und dort hat man ihn dann aus dem Weg geschafft\", sagte Baumgartner.\n\n\"Harald, ich bin beeindruckt. Aber wir haben noch immer keine Tatwaffe\", sagte Katharina.\n\n\"Vielleicht doch\", sagte Harald und öffnete eine Internetseite auf seinem Laptop. \"Lies das!\", sagte er zu Katharina.\n\n\"**Laut Amnesty International sind in den USA zwischen 2001 und 2008 mehr als 300 Menschen bei Polizeieinsätzen mit Elektroschockern gestorben**\", las sie.\n\nHarald scrollte herunter und sagte: \"Siehst du die Fotos hier?\" Katharina nickte.\n\n\"**Zwei kleine rote Punkte ... das ist es!** Und ich dachte immer, das sind nicht-tödliche Waffen\", sagte sie.\n\n\"Sind sie auch\", sagte Harald. \"Zumindest auf dem Papier. Aber nicht jeder Körper hält 50.000 Volt stand.\"\n\n\"Du meinst, die Mahlers wollten Peter nicht umbringen?\", fragte Katharina.\n\n\"Möglicherweise\", sagte Harald. \"Vielleicht wollten sie ihn nur abschrecken, aber dann, als sie gemerkt haben, dass er tot ist, sind sie geflohen.\"\n\n\"Du willst sagen, das Ganze war nicht geplant?\", sagte Katharina.\n\n\"Ja\", sagte Harald. \"**Vielleicht war es wirklich ein Unfall, wie Mahler sagte.** \"\n\n---\n\n**Vocabulary:**\n\n| German | English |\n|--------|---------|\n| unbedingt | here at all means |\n| überleg mal | think about it |\n| kassieren | collect (money) |\n| rechtlicher Inhaber | legal owner |\n| volljährig | legal age |\n| Zufall | coincidence |\n| schicken | to send |\n| Verdacht schöpfen | to become suspicious |\n| Berufserfahrung | work experience |\n| träumen | to dream |\n| rücken | back |\n| drohen | to threaten |\n| wegrennen | to run away |\n| aus dem Weg schaffen | to get rid of |\n| beeindruckt | impressed |\n| Tatwaffe | murder weapon |\n| Polizeieinsatz | police operation |\n| standhalten | to withstand |\n| abschrecken | to scare |\n| fliehen | to flee |\n\n---\n\n## Übung\n\n**1. Warum wollte der Bürgermeister unbedingt den Supermarkt?**\n\na) Er wollte den Menschen im Dorf helfen.\nb) Er wollte viel Schmiergeld bekommen.\nc) Er wollte seinem Sohn einen Job geben.\n\n**2. Wem gehörte das Grundstück rechtlich?**\n\na) Peter Wernicke\nb) dem Bürgermeister\nc) den Mahlers\n\n**3. Was bedeutet das Wort Schmiergeld?**\n\na) finanzielles Bestechungsmittel\nb) gefärbtes Geld von einem Bankraub\nc) Banknoten mit verschmiertem Aufdruck\n\n**4. Welches der folgenden Wörter ist kein Synonym zu fliehen?**\n\na) abhauen\nb) entkommen\nc) abbrechen"}, {"title": "🚗 Chapter 11: Flucht und Fund", "content": "Als die Kommissare vor dem Haus des Architekturbüros **vorfuhren**, war es bereits dunkel geworden. Kommissarin Momsen stieg aus dem Auto und sagte: \"Hörst du das?\"\n\n\"Was?\", fragte Baumgartner.\n\nDa öffnete sich hinter ihm ein automatisches **Garagentor**. Ein Motor **sprang an**. Zwei **Scheinwerfer strahlten** in die Dämmerung. Der Architekt saß hinter dem Steuer. Bevor Baumgartner reagieren konnte, sprang der Wagen an ihm vorbei auf die Straße.\n\n\"**Schnell, Katharina!** \", rief Baumgartner und eilte zu seinem Auto.\n\nKatharina schnallte sich an und trat aufs Gaspedal. Am Ende der Straße hatten sie den Wagen des Architekten eingeholt. Baumgartner sah seine schwarze Brille im Rückspiegel. Da **schaltete** Mahler einen Gang **höher** und **raste** davon.\n\n\"**Schneller, Katharina!** \", rief Harald.\n\n\"**Ich fahr' so schnell ich kann!** \", sagte sie und der Motor **heulte**.\n\nDa hörten sie plötzlich einen Knall. Ein paar hundert Meter vor ihnen **überschlug** sich der Wagen des Architekten, die Scheinwerfer flackerten wild durch die Dunkelheit und das Auto **rutschte** eine Böschung **hinab**.\n\n\"Was ist passiert?\", fragte Harald.\n\n\"**Er ist gegen einen Baum gefahren!** \", sagte Katharina und **bremste** scharf.\n\nBaumgartner **befreite** sich aus seinem **Gurt** und rannte die Böschung hinunter.\n\nEin Scheinwerfer des Wagens strahlte auf ein **anliegendes Kartoffelfeld**. Es roch nach Motorenöl und Metall. Die Reifen des Autos drehten sich in der Luft.\n\n\"Harald!\", rief Katharina von der Straße.\n\nEtwas bewegte sich im Innern des Autos. Das Gesicht des Architekten **kam zum Vorschein**. Seine Brillengläser waren zerschlagen, das Kinn blutig.\n\nUnd bevor Baumgartner reagieren konnte, hörte er ein elektrisches **Knistern**.\n\n\"**Keine Bewegung**\", sagte der Architekt und hielt einen Elektroschocker in Haralds Gesicht.\n\nKommissar Baumgartner hob die Hände. \"**Da ist ja unsere Tatwaffe**\", sagte er.\n\nAn den Spitzen des Elektroschockers **zuckten** winzige blaue **Funken**, als Mahler den **Abzug** drückte und Baumgartner in den Bauch **rammte**.\n\n\"Harald!\", rief Kommissarin Katharina Momsen von der Straße. Sie stand breitbeinig neben ihrem Auto und hielt eine Pistole in beiden Händen.\n\nKommissar Baumgartner lag in Embryostellung auf dem erdigen Boden. Mahler blickte durch zerschlagene Brillengläser zur Straße und rannte über das unebene Kartoffelfeld in die **entgegengesetzte** Richtung.\n\nEin **Schuss hallte** durch die Dunkelheit.\n\n---\n\n**Vocabulary:**\n\n| German | English |\n|--------|---------|\n| vorfahren | to drive up |\n| Garagentor | garage door |\n| anspringen | to start |\n| Scheinwerfer | headlights |\n| strahlen | to shine |\n| Dämmerung | dusk |\n| Wagen | car |\n| einen Gang höher schalten | to shift up a gear |\n| rasen | to race |\n| heulen | to howl |\n| überschlagen | to overturn |\n| flackern | to flicker |\n| hinabrutschen | to slide down |\n| Böschung | embankment |\n| bremsen | to brake |\n| befreien | to free |\n| Gurt | seatbelt |\n| anliegend | adjacent |\n| Kartoffelfeld | potato field |\n| riechen | to smell |\n| Reifen | tires |\n| zum Vorschein kommen | to appear |\n| Knistern | crackle |\n| zucken | to twitch |\n| Funken | sparks |\n| Abzug | trigger |\n| rammen | to ram |\n| breitbeinig | straddle-legged |\n| Embryostellung | fetal position |\n| entgegengesetzt | opposite |\n| Schuss | shot |\n| hallen | to reverberate |\n\n---\n\n## Übung\n\n**1. Was passiert, als die Kommissare beim Architekturbüro ankommen?**\n\na) Der Architekt flieht mit dem Auto.\nb) Der Architekt ergibt sich.\nc) Der Architekt greift die Kommissare an.\n\n**2. Warum kann der Architekt nicht mehr weiterfahren?**\n\na) Die Polizei hat ihn gestoppt.\nb) Er ist gegen einen Baum gefahren.\nc) Ihm ist das Benzin ausgegangen.\n\n**3. Wie geht es dem Architekten nach dem Unfall?**\n\na) er ist tot\nb) er hat keine Verletzungen\nc) seine Brille ist zerbrochen und sein Kinn blutet\n\n**4. Welcher der folgenden Sätze hat die gleiche Bedeutung wie der Satz: \"Harald fiel zu Boden.\"?**\n\na) \"Er befand sich auf dem Boden.\"\nb) \"Er stürzte zu Boden.\"\nc) \"Er grub im Boden.\""}, {"title": "🏥 Chapter 12: Krankenhaus", "content": "\"**Der Doktor sagt, du hast Glück gehabt**\", sagte Katharina.\n\nKommissar Baumgartner lag in dem Krankenhausbett und versuchte zu **lächeln**. Alles, was seine Kollegin sah, war eine **schmerzverzerrte** Grimasse.\n\n\"**Nicht jeder verkraftet 50.000 Volt, hast du selber gesagt**\", sagte Katharina.\n\n\"Entweder du hast starke Nerven, oder die vielen Currywürste und Pommes haben den Schock **gedämpft**!\"\n\nBaumgartner versuchte zu lachen, aber **stöhnte** nur und flüsterte: \"**Habt ihr ihn gekriegt?** \"\n\nKatharina nickte und sagte: \"Ja, **ich hab' ihn am Bein erwischt**. Er hat alles **gestanden**. Du hattest Recht, sie haben das Ganze nicht geplant. Aber der Wernicke wusste, dass sein Sohn tot ist. Der wollte es nur **verschweigen**, wegen der Presse.\"\n\n\"Und der letzte Anruf von dem Telefon?\", flüsterte Harald.\n\n\"Das war der Architekt. Er hatte mit dem Handy des Jungen seinen Bruder angerufen und ihm gesagt, was passiert ist. **Daraufhin** hat Mahler seinem Bruder gesagt, dass er das Handy **loswerden** soll, bevor es jemand findet. Aber **anscheinend** hat er die SIM-Karte verloren\", sagte Katharina.\n\nHarald **nickte** langsam und **verzog das Gesicht**.\n\n\"Apropos, wegen der SIM-Karte ...\"\n\n\"Ist gut\", stöhnte Harald. \"**Ich lade dich zum Essen ein.** \"\n\n---\n\n**Vocabulary:**\n\n| German | English |\n|--------|---------|\n| lächeln | to smile |\n| schmerzverzerrt | contorted with pain |\n| verkraften | to bear sth. (cope with) |\n| dämpfen | to dampen |\n| stöhnen | to moan |\n| ihn am Bein erwischt | (bullet) caught him in the leg, to hit |\n| gestehen | to confess |\n| verschweigen | to conceal |\n| daraufhin | thereupon |\n| etw. loswerden | to get rid of sth. |\n| anscheinend | apparently |\n| nicken | to nod |\n| das Gesicht verziehen | to make a face |\n\n---\n\n## Übung\n\n**1. Wie geht es Harald Baumgartner?**\n\na) er ist traurig und hat Schmerzen\nb) er ist glücklich und hat keine Schmerzen\nc) er will lachen aber hat Schmerzen\n\n**2. An welcher Körperstelle hat Katharinas Pistolenkugel den flüchtenden Architekten getroffen?**\n\na) am Arm\nb) an der Schulter\nc) am Bein\n\n**3. Warum will Harald Katharina zum Essen einladen?**\n\na) weil er in sie verliebt ist\nb) weil sie die Wette gewonnen hat\nc) weil sie hungrig ist"}, {"title": "✅ Answer Key", "content": "**Chapter 1:** 1. a, 2. b, 3. c\n\n**Chapter 2:** 1. c, 2. c, 3. a, 4. c\n\n**Chapter 3:** 1. b, 2. a, 3. c, 4. c\n\n**Chapter 4:** 1. b, 2. b, 3. b\n\n**Chapter 5:** 1. b, 2. a, 3. a, 4. c\n\n**Chapter 6:** 1. b, 2. b, 3. b, 4. c\n\n**Chapter 7:** 1. a, 2. c, 3. b\n\n**Chapter 8:** 1. a, 2. b, 3. c, 4. c\n\n**Chapter 9:** 1. b, 2. a, 3. a, 4. c\n\n**Chapter 10:** 1. b, 2. b, 3. a, 4. c\n\n**Chapter 11:** 1. a, 2. b, 3. c, 4. b\n\n**Chapter 12:** 1. c, 2. c, 3. b"}, {"title": "📖 About the Author", "content": "André Klein was born in Germany, grew up in Sweden and Thailand and currently lives in Israel. He has been teaching languages for more than 15 years and is the author of various short stories, picture books and non-fiction works in English and German.\n\n**Website:** andreklein.net\n**Twitter:** twitter.com/barrencode\n**Blog:** learnoutlive.com/blog"}];

function addTranslationPair(index, de, en){
  const german=String(de||'').trim();
  const english=String(en||'').trim();
  if(!german || !english) return;
  if(/^german$/i.test(german) || /^english$/i.test(english) || /^[-:]+$/.test(german)) return;
  const bad=/^(translation not available|english translation|important word|wichtiger wortschatz)$/i.test(english);
  if(bad) return;
  index.set(german.toLocaleLowerCase(), english);
}
