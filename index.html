  try{ if(typeof MORD_BOOK_DATA !== 'undefined') sources.push(...MORD_BOOK_DATA); }catch(e){}
  try{ if(typeof DINO_BOOK_DATA !== 'undefined') sources.push(...DINO_BOOK_DATA); }catch(e){}
  try{ if(typeof LAWS_DATA !== 'undefined') sources.push(...LAWS_DATA); }catch(e){}
  try{ if(typeof PRINCE_DATA !== 'undefined') sources.push(...PRINCE_DATA); }catch(e){}
  try{ if(typeof RICH_DAD_DATA !== 'undefined') sources.push(...RICH_DAD_DATA); }catch(e){}
  try{ if(typeof EGO_ENEMY_DATA !== 'undefined') sources.push(...EGO_ENEMY_DATA); }catch(e){}
  for(const item of sources){
    const content=String(item?.content||'');
    const re=/^\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*$/gm;
    let m;
    while((m=re.exec(content))) addTranslationPair(index,m[1],m[2]);
    if(Array.isArray(item?.vocab)) item.vocab.forEach(row=>addTranslationPair(index,row?.[0],row?.[1]));
  }
  BOOK_MARKDOWN_VOCAB_INDEX=index;
  return index;
}

function getBookTranslationIndex(){
  if(BOOK_TRANSLATION_INDEX) return BOOK_TRANSLATION_INDEX;
  const index = new Map(getBookMarkdownVocabIndex());
  try{ Object.entries(CAFE_TRANSLATIONS||{}).forEach(([de,en])=>addTranslationPair(index,de,en)); }catch(e){}
  try{ Object.entries(FRANKFURT_TRANSLATIONS||{}).forEach(([de,en])=>addTranslationPair(index,de,en)); }catch(e){}
  try{ (EXTRA_BOOK_VOCAB||[]).forEach(row=>addTranslationPair(index,row?.[0],row?.[1])); }catch(e){}
  try{ (FRANKFURT_HIGHLIGHTS||[]).flat().forEach(row=>addTranslationPair(index,row?.[0],row?.[1])); }catch(e){}
  BOOK_TRANSLATION_INDEX=index;
  return index;
}

function resolveTermTranslation(raw, vocab=[]) {
  const rawText = String(raw || '').trim();
  const variants = [
    rawText,
    rawText.replace(/^[\s\"“”‘’¿¡]+|[\s\"“”‘’.,!?;:]+$/g,'')
  ].filter(Boolean);
  if(!variants.length) return '';

  const local = new Map();
  (Array.isArray(vocab) ? vocab : []).forEach(row=>addTranslationPair(local,row?.[0],row?.[1]));
  for(const variant of variants){
    const hit=local.get(variant.toLocaleLowerCase());
    if(hit) return hit;
  }

  const all=getBookTranslationIndex();
  for(const variant of variants){
    const hit=all.get(variant.toLocaleLowerCase());
    if(hit) return hit;
  }
  return '';
}

function buildBookVocab(t, maxItems=20){
  const source=String(t?.content||'');
  const local=Array.isArray(t?.vocab)?t.vocab:[];
  return collectBookHighlightTerms(source,local,null,maxItems).map(x=>[x.term,x.en]);
}

function cleanBookMarkup(markdown){
  return String(markdown||'')
    .replace(/\r/g,'')
    .replace(/^\s*\\?---\s*$/gm,'')
    .replace(/^\s*```(?:markdown|md|text)?\s*$/gmi,'')
    .replace(/^\s*```\s*$/gm,'')
    .replace(/[ \t]+([,.;:!?])/g,'$1')
    .replace(/([,.;:!?]) {2,}/g,'$1 ')
    .replace(/[ \t]{2,}/g,' ')
    .replace(/\n{3,}/g,'\n\n')
    .split('\n')
    .map(line=>line.trimEnd())
    .join('\n')
    .trim();
}

function renderBoldBookContent(markdown,vocab=[]){
  const cleaned=cleanBookMarkup(markdown);
  const blocks=cleaned.split(/\n\s*\n/);
  return blocks.map(block=>{
    const text=block.trim(); if(!text) return '';
    if(/^###\s+/.test(text)) return `<h3 class="cafe-subheading">${renderBookInline(text.replace(/^###\s+/,'').replace(/\*\*/g,''),vocab,null,20)}</h3>`;
    if(/^##\s+/.test(text)) return `<h3 class="cafe-subheading">${renderBookInline(text.replace(/^##\s+/,'').replace(/\*\*/g,''),vocab,null,20)}</h3>`;
    if(/^#\s+/.test(text)) return `<h2 class="cafe-subheading">${renderBookInline(text.replace(/^#\s+/,'').replace(/\*\*/g,''),vocab,null,20)}</h2>`;
    return `<p>${renderBookInline(text,vocab,null,20).replace(/\n/g,'<br>')}</p>`;
  }).join('');
}

function renderNewBookTopic(bookIndex,i){
  const book=lessonBookData(bookIndex);
  const t=book?.data?.[i];
  if(!t) return '<div class="empty">Noch kein Inhalt.</div>';
  if(book.type==='dino' || book.type==='mord'){
    const answers=book.type==='dino' ? DINO_BOOK_ANSWERS[i]||[] : MORD_BOOK_ANSWERS[i-1]||[];
    const parsed=parseBookExercise(t.content,answers);
    const chapterText=parsed.main.replace(/\*\*/g,'').replace(/^#\s+[^^\n]*\n*/,'').replace(/\n+/g,' ');
    const displayTitle=normalizeTopicTitle(t.title,true);
    const vocabMatch=book.type==='mord' ? parsed.main.match(/(?:^|\n)\*\*Vocabulary:\*\*[\s\S]*?(?=\n---|$)/i) : null;
    let mainText=parsed.main;
    let vocabHtml='';
    let rows=[];
    if(vocabMatch){
      const rowRe=/\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|/g;
      let rm; while((rm=rowRe.exec(vocabMatch[0]))){ if(rm[1].trim().toLowerCase()!=='german' && rm[1].trim()!=='--------') rows.push([rm[1].trim(),rm[2].trim()]); }
      if(rows.length) vocabHtml=`<div class="section"><div class="section-title">📚 Wortschatz</div>${renderVocab(rows)}</div>`;
      mainText=mainText.replace(vocabMatch[0],'').trim();
    }
    const parsedMain={main:mainText,exercise:parsed.exercise,vocab:book.type==='mord'?rows:(t.vocab||[])};
    return `<button class="back" onclick="showLessonBooks()">← Bücher</button><div class="lesson-book-heading">${esc(book.title)}</div><h2 class="story-heading" onclick='speak(${JSON.stringify(chapterText)})' title="Text anhören">${esc(displayTitle)}</h2><div class="lesson-vocab-note">Underlined words = useful vocabulary · Hover for English meaning · Click to hear</div><div class="lesson-reader">${book.type==='mord' ? renderMordBookContent(parsedMain.main, parsedMain.vocab||[], i) : renderBoldBookContent(parsedMain.main, parsedMain.vocab||[])}</div>${vocabHtml}${renderCafeExercise(parsedMain.exercise)}`;
  }
  const full=cleanBookMarkup(t.content||'');
  const displayFull=full.replace(/^\s*#{1,6}\s+/gm,'');
  const body=renderBookInline(displayFull,Array.isArray(t.vocab)?t.vocab:[],null,20);
  const paras=body.split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
  const translation=getBookTranslation(bookIndex,i);
  const translationBox=translation?`<div class="lesson-translation"><div class="lesson-translation-title">🇬🇧 Exact English translation</div><div>${esc(translation)}</div></div>`:'';
  const displayTitle=normalizeTopicTitle((bookIndex===4||bookIndex===5)?decorateBookSectionTitle(bookIndex,i,t.title):t.title,true);
  return `<button class="back" onclick="showLessonBooks()">← Bücher</button><div class="lesson-book-heading">${esc(book.title)}</div><h2 class="story-heading" onclick='speak(${JSON.stringify(full)})' title="Text anhören">${esc(displayTitle)}</h2><div class="lesson-vocab-note">Underlined words = useful vocabulary · Hover for English meaning · Click to hear</div><div class="lesson-reader">${paras}</div>${translationBox}`;
}

function openTopic(i){current=i;if(level==='instructions'){renderInstructions();return;}if(level==='vokabular'){ openVocabTopic(i); return; }
if(level==='lesen'){
  if(lessonBook<0){showLessonBooks();return;}
  const book=lessonBookData(lessonBook);
  renderTopics();
  const detailEl=$('#detail');const topicsEl=$('.topic-list');
  detailEl.innerHTML=book.type==='cafe'?renderCafeTopic(i):book.type==='frankfurt'?renderFrankfurtTopic(i):renderNewBookTopic(lessonBook,i);
  detailEl;topicsEl;void detailEl.offsetWidth;void topicsEl.offsetWidth;requestAnimationFrame(()=>{detailEl;topicsEl});window.scrollTo({top:document.querySelector('.detail').offsetTop-80,behavior:'smooth'});return;
}
if(level==='frankfurt'){renderTopics();const detailEl=$('#detail');const topicsEl=$('.topic-list');detailEl.innerHTML=renderFrankfurtTopic(i);detailEl;topicsEl;void detailEl.offsetWidth;void topicsEl.offsetWidth;requestAnimationFrame(()=>{detailEl;topicsEl});window.scrollTo({top:document.querySelector('.detail').offsetTop-80,behavior:'smooth'});return;}if(level==='sprechen'){renderSpeakingPanel();window.scrollTo({top:document.querySelector('.detail').offsetTop-80,behavior:'smooth'});return;}if(level==='cafe'){renderTopics();const detailEl=$('#detail');const topicsEl=$('.topic-list');detailEl.innerHTML=renderCafeTopic(i);detailEl;topicsEl;void detailEl.offsetWidth;void topicsEl.offsetWidth;requestAnimationFrame(()=>{detailEl;topicsEl});window.scrollTo({top:document.querySelector('.detail').offsetTop-80,behavior:'smooth'});return;}const t=(DATA[level]||[])[i];const detailEl=$('#detail');const topicsEl=$('.topic-list');renderTopics();if(!t){detailEl.innerHTML='<div class="empty">Noch keine Themen verfügbar.</div>';}else{const fullStory=t.story.join(' ');const highlightPlan=buildHighlightPlan(t.story,t.vocab,level==='simple'?20:10,level==='simple'?(SIMPLE_EXTRA_HIGHLIGHTS[i]||[]):[]);const highlightState={used:new Set(),count:0,limit:level==='simple'?18:10};detailEl.innerHTML=`<button class="back" onclick="window.scrollTo({top:0,behavior:'smooth'})">← Thema</button><h2 class="story-heading" onclick='speak(${JSON.stringify(fullStory)})' title="Gesamten Text anhören">${esc(normalizeTopicTitle(t.title,true))}</h2><div class="story">${t.story.map(p=>`<p>${renderHighlightedText(p,highlightPlan,highlightState)}</p>`).join('')}</div><div class="section translation-section"><div class="section-title">🌍 Übersetzung</div>${renderTable(t.translation,'translation')}</div><div class="section"><div class="section-title">📚 Wortschatz</div>${renderVocab(t.vocab)}</div>${t.grammar?`<div class="section"><div class="section-title">🧠 Grammatik</div><div class="section-note"><strong>${esc(t.grammar.title)}</strong><br>${esc(t.grammar.text)}<br><br>${t.grammar.examples.map(x=>'• '+esc(x)).join('<br>')}</div></div>`:''}${renderCultureNote(t.title)}<div class="section"><div class="section-title">🗣️ Nacherzählung</div>${renderTable(t.speaking,'speak')}</div>${t.listening?`<div class="section"><div class="section-title">🎧 Hörverstehen</div>${renderListening(t.listening)}</div>`:''}`;}focusDetail();window.scrollTo({top:document.querySelector('.detail').offsetTop-80,behavior:'smooth'});}

// Switch between Simple, Understandable, Dialoge, Café in Berlin, and Ferien in Frankfurt.
function setLevel(l){level=l;current=0;lessonBook=-1;document.querySelectorAll('.pill[data-level]').forEach(b=>b.classList.toggle('active',b.dataset.level===l));if(l==='welcome'){renderWelcome();return;}if(l==='comprehension'){comprehensionLevel=null;renderComprehensionPanel();window.scrollTo({top:document.querySelector('.detail').offsetTop-80,behavior:'smooth'});return;}if(l==='sprechen'){document.querySelector('.topic-shell')?.classList.remove('welcome-only');sprechenLevel=null;renderTopics();renderSpeakingRecorder();window.scrollTo({top:document.querySelector('.detail').offsetTop-80,behavior:'smooth'});return;}if(l==='schriben'){document.querySelector('.topic-shell')?.classList.remove('welcome-only');schribenLevel=null;schribenSection='exam';schribenExam=0;schribenEditorVisible=true;renderSchriben();window.scrollTo({top:document.querySelector('.detail').offsetTop-80,behavior:'smooth'});return;}if(l==='instructions'){instructionSection='how';renderInstructions();return;}renderTopics();if(l==='lesen'||l==='mord'){if(l==='lesen'){showLessonBooks();}else{document.querySelector('.detail').innerHTML='<div class="empty">Noch kein Inhalt.</div>';}return;}openTopic(0)}
document.querySelectorAll('.pill[data-level]').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled)setLevel(b.dataset.level);}));
const themeToggle=document.getElementById('themeToggle');
function applyTheme(light){document.body.classList.toggle('light',light);themeToggle.textContent=light?'☾ Dunkel':'☀︎ Hell';localStorage.setItem('thema-theme',light?'light':'dark');}
const savedTheme=localStorage.getItem('thema-theme');applyTheme(savedTheme==='light');themeToggle.addEventListener('click',()=>applyTheme(!document.body.classList.contains('light')));
window.addEventListener('beforeunload',()=>{if(recorderStream)recorderStream.getTracks().forEach(t=>t.stop());});
document.querySelectorAll('.pill[data-level]').forEach(b=>b.classList.remove('active'));renderWelcome();
</script></body></html>
