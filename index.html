const SCHRIBEN_B1_EXAMS = [{"title":"Exam 1","parts":[{"title":"Part 1 – Informal Email","body":["Task: You celebrated your birthday a week ago. A friend couldn't come because he/she was sick. Write an email to your friend. Describe: How was the party? Explain: Which gift do you find especially great and why? Make a suggestion for a meeting. About 80 words.","Liebe Anna,","vielen Dank für deine Nachricht! Meine Geburtstagsfeier war wirklich toll. Wir haben im Garten gegrillt und bis spät in die Nacht getanzt. Es waren ungefähr 15 Gäste da. Das beste Geschenk war ein Kochkurs-Gutschein von meinen Eltern. Ich liebe es zu kochen und freue mich schon sehr darauf. Wann hast du Zeit? Wie wäre es mit einem Treffen nächsten Samstag im Café am Marktplatz?","Ich freue mich auf deine Antwort.","Liebe Grüße","Maria"]},{"title":"Part 2 – Forum Post","body":["Task: You watched a TV discussion about \"Personal Contacts and the Internet\". In the online guestbook, you read Tanja's opinion: \"I think it's terrible that personal meetings are becoming rarer. Friends often live far apart. And then you're glad about the internet. But internet contacts can't replace personal meetings!\" Write your opinion. About 80 words.","Ich habe die Diskussion zum Thema \"Persönliche Kontakte und Internet\" verfolgt. Tanja hat meiner Meinung nach Recht, denn persönliche Treffen sind sehr wichtig. Man kann Gefühle und Mimik nur von Angesicht zu Angesicht richtig verstehen. Allerdings finde ich auch, dass das Internet eine große Hilfe ist. Ich habe einen guten Freund in Australien. Ohne Internet könnten wir uns gar nicht so oft austauschen. Ich bin überzeugt, dass beide Formen wichtig sind. Man sollte das Internet nutzen, aber persönliche Treffen nicht vergessen."]},{"title":"Part 3 – Formal Email","body":["Task: Your course leader, Mrs Müller, has invited you to a meeting about your personal learning goals. You cannot come to the appointment. Write an email to Mrs Müller. Apologise politely and explain why you cannot come. About 40 words.","Sehr geehrte Frau Müller,","vielen Dank für Ihre Einladung. Leider kann ich morgen nicht zu dem Gespräch kommen, weil ich einen dringenden Arzttermin habe. Können wir den Termin auf nächste Woche verschieben?","Mit freundlichen Grüßen","Thomas Weber"]}]},{"title":"Exam 2","parts":[{"title":"Part 1 – Informal Email","body":["Task: Your friend Thomas wrote to you that he wants to move to Munich. Write him a letter. How do you find that? What tips do you have for him? Do you want to visit him? About 80 words.","Lieber Thomas,","das sind ja tolle Neuigkeiten! Ich finde es super, dass du nach München ziehen willst. Die Stadt ist wirklich schön und es gibt dort viele tolle Museen und Parks. Mein Tipp: Suche dir eine Wohnung in der Nähe der U-Bahn, dann bist du überall schnell. Die Mieten sind hoch, aber in den Außenbezirken ist es günstiger. Ich würde dich natürlich gerne besuchen! Vielleicht im Herbst? Schreib mir, wann es bei dir passt.","Viele Grüße","Laura"]},{"title":"Part 2 – Forum Post","body":["Task: In an online forum, there is a discussion: \"Should children be paid for helping in the household?\" Write your opinion. About 80 words.","Meiner Meinung nach sollten Kinder nicht fürs Helfen im Haushalt bezahlt werden. Haushaltsaufgaben gehören zum Zusammenleben in einer Familie dazu. Ich finde, dass Kinder lernen sollten, Verantwortung zu übernehmen. Wenn sie für jede Aufgabe Geld bekommen, verstehen sie vielleicht nicht, dass man auch ohne Bezahlung helfen sollte. Natürlich kann man Kindern ein kleines Taschengeld geben, aber das sollte nicht direkt von der Hausarbeit abhängen. So lernen sie, dass Zusammenarbeit etwas Selbstverständliches ist."]},{"title":"Part 3 – Formal Email","body":["Task: You ordered a product that arrived damaged. Write an email to customer service. What did you order? What is the problem? What do you expect? About 40 words.","Sehr geehrte Damen und Herren,","am 15. März habe ich bei Ihnen einen Laptop bestellt (Bestellnummer 12345). Leider ist das Gerät beschädigt angekommen – der Bildschirm hat einen Riss. Ich erwarte, dass Sie mir ein neues Gerät schicken.","Mit freundlichen Grüßen","Julia Schmidt"]}]},{"title":"Exam 3","parts":[{"title":"Part 1 – Informal Email","body":["Task: You went on a city trip last weekend. Write an email to your friend Sarah. Tell her about your trip. About 80 words.","Liebe Sarah,","ich war letztes Wochenende in Berlin und es war fantastisch! Das Wetter war sonnig und warm, perfekt zum Bummeln. Ich habe das Brandenburger Tor und den Fernsehturm besichtigt. Besonders toll fand ich die East Side Gallery – die vielen Kunstwerke an der Mauer waren beeindruckend. Das Essen war auch super, ich habe zum ersten Mal Currywurst probiert. Leider war die Zeit viel zu kurz. Wir sollten unbedingt zusammen dorthin fahren! Hast du nächstes Wochenende Zeit?","Liebe Grüße","Anna"]},{"title":"Part 2 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should smartphones be banned in schools?\" Write your opinion. About 80 words.","Ich habe die Diskussion zum Thema \"Smartphones in der Schule\" verfolgt. Meiner Meinung nach sollte ein komplettes Verbot nicht die Lösung sein. Smartphones können im Unterricht nützlich sein, zum Beispiel für Recherchen oder als Wörterbuch. Allerdings sollte es klare Regeln geben, wann die Nutzung erlaubt ist und wann nicht. Ich finde, dass die Lehrer mit den Schülern zusammen Regeln aufstellen sollten. So lernen die Jugendlichen auch, verantwortungsvoll mit Technologie umzugehen."]},{"title":"Part 3 – Formal Email","body":["Task: You are ill and cannot come to work today. Write an email to your boss, Mr Schmidt. Apologise and explain. About 40 words.","Sehr geehrter Herr Schmidt,","ich kann heute leider nicht zur Arbeit kommen, weil ich starkes Fieber habe. Ich werde morgen zum Arzt gehen und mich krankschreiben lassen. Ich entschuldige mich für die kurzfristige Absage.","Mit freundlichen Grüßen","Markus Wagner"]}]},{"title":"Exam 4","parts":[{"title":"Part 1 – Informal Email","body":["Task: Your friend invited you to a party. Write back. Thank her for the invitation. Say that you will come. Ask what you can bring. About 80 words.","Liebe Anna,","vielen Dank für deine Einladung zur Party am Samstag! Ich komme sehr gerne und freue mich schon riesig darauf. Leider kann ich erst um 20 Uhr da sein, weil ich bis 19 Uhr arbeiten muss. Aber danach habe ich den ganzen Abend Zeit. Soll ich etwas mitbringen? Ich könnte einen Salat oder ein paar Getränke besorgen. Sag mir einfach Bescheid, was noch fehlt.","Bis Samstag!","Deine Maria"]},{"title":"Part 2 – Forum Post","body":["Task: In an online forum, there is a discussion: \"Is it better to live in the city or in the countryside?\" Write your opinion. About 80 words.","Ich habe die Diskussion zum Thema \"Leben in der Stadt oder auf dem Land\" verfolgt. Ich persönlich lebe lieber in der Stadt. In der Stadt gibt es mehr Möglichkeiten: viele Kinos, Restaurants und kulturelle Angebote. Auch die Arbeitsplatzauswahl ist größer. Außerdem ist alles näher – man braucht nicht immer ein Auto. Auf dem Land ist es zwar ruhiger und die Luft ist besser, aber ich finde, das ist nicht genug. Mir ist wichtig, dass ich schnell Freunde treffen und ausgehen kann."]},{"title":"Part 3 – Formal Email","body":["Task: You want to cancel a hotel reservation. Write an email to the hotel. Give your reservation number. Explain why you are cancelling. Ask about the refund. About 40 words.","Sehr geehrte Damen und Herren,","ich muss meine Reservierung (Nummer 7890) für den 10.-15. August leider stornieren. Mein Flug wurde gecancelt. Können Sie mir bitte mitteilen, ob ich eine Rückerstattung bekomme?","Mit freundlichen Grüßen","Lisa Müller"]}]},{"title":"Exam 5","parts":[{"title":"Part 1 – Informal Email","body":["Task: Your friend moved to a new flat. Write an email to congratulate and ask questions. About 80 words.","Lieber Paul,","herzlichen Glückwunsch zu deiner neuen Wohnung! Das ist ja eine tolle Nachricht. Wie groß ist die Wohnung eigentlich? Und in welchem Stadtteil wohnst du jetzt? Ich hoffe, du hast eine gute Anbindung an die U-Bahn. Ich würde mich sehr freuen, wenn du mich bald einlädst, damit ich sie mir anschauen kann. Wir könnten dann zusammen einen Umzugsbrunch machen.","Bis bald!","Deine Sophie"]},{"title":"Part 2 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Is it important to learn a foreign language?\" Write your opinion. About 80 words.","Ich finde es sehr wichtig, eine Fremdsprache zu lernen. In unserer globalisierten Welt kommt man ohne Englisch oder andere Sprachen kaum noch aus. Wenn man eine Sprache spricht, kann man im Urlaub besser kommunizieren und lernt die Kultur des Landes besser kennen. Außerdem verbessert es die eigenen beruflichen Chancen, denn viele Firmen suchen mehrsprachige Mitarbeiter. Natürlich ist es nicht immer einfach, aber ich bin überzeugt, dass es sich lohnt. Man sollte so früh wie möglich mit dem Lernen anfangen."]},{"title":"Part 3 – Formal Email","body":["Task: You are interested in a language course. Write to the language school. Ask about the course start date. Ask about the price. Ask about the course location. About 40 words.","Sehr geehrte Damen und Herren,","ich interessiere mich für Ihren Deutschkurs B1. Wann beginnt der nächste Kurs? Wie viel kostet der Kurs? Wo findet der Unterricht statt?","Ich freue mich auf Ihre Antwort.","Mit freundlichen Grüßen","Thomas Schmidt"]}]},{"title":"Exam 6","parts":[{"title":"Part 1 – Informal Email","body":["Task: You had a great weekend. Write an email to your friend Clara and tell her about it. About 80 words.","Liebe Clara,","ich hatte ein wunderschönes Wochenende! Ich war mit ein paar Freunden am See. Das Wetter war fantastisch, wir haben gebadet und gegrillt. Am Sonntag waren wir im Kletterwald. Das war total aufregend und ich habe mich sehr überwunden. Aber es hat so viel Spaß gemacht! Du hättest wirklich dabei sein sollen. Nächstes Mal kommst du einfach mit, versprochen! Wann hast du Zeit? Wir könnten das wiederholen.","Liebe Grüße","Mia"]},{"title":"Part 2 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should school uniforms be introduced?\" Write your opinion. About 80 words.","Ich habe die Diskussion über Schuluniformen verfolgt. Meiner Meinung nach wäre eine Schuluniform in Deutschland keine gute Idee. Ich finde, dass Schüler die Freiheit haben sollten, ihre eigene Kleidung zu wählen. Das ist ein Ausdruck der Persönlichkeit. Außerdem sind Uniformen oft teuer und nicht jeder mag den Stil. Allerdings verstehe ich, dass Uniformen soziale Unterschiede weniger sichtbar machen können. Aber ich denke, dass es bessere Wege gibt, um Gleichheit in der Schule zu fördern."]},{"title":"Part 3 – Formal Email","body":["Task: Your train was delayed and you will miss an appointment. Write an email to your business partner, Mr Meier. Apologise and explain. About 40 words.","Sehr geehrter Herr Meier,","mein Zug hat leider große Verspätung. Ich werde unseren Termin um 14 Uhr nicht rechtzeitig schaffen. Können wir den Termin auf 16 Uhr verschieben? Es tut mir sehr leid für die Unannehmlichkeiten.","Mit freundlichen Grüßen","Julia Wagner"]}]},{"title":"Exam 7","parts":[{"title":"Part 1 – Informal Email","body":["Task: Your friend is going on holiday. Write an email. Ask where he/she is going. Ask how long the holiday is. Say that you will miss him/her. About 80 words.","Hallo Max,","ich habe gehört, dass du in den Urlaub fährst! Das ist ja toll. Wohin geht die Reise eigentlich? Wie lange bleibst du weg? Eine Woche oder sogar länger? Ich hoffe, du hast ganz viel Sonne und Erholung. Ich werde dich auf jeden Fall vermissen. Wir müssen uns unbedingt treffen, wenn du wieder da bist, und du musst mir dann alles erzählen!","Gute Reise und ganz viele Grüße","Felix"]},{"title":"Part 2 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should pets be allowed in apartments?\" Write your opinion. About 80 words.","Ich finde, dass Haustiere in Wohnungen erlaubt sein sollten. Viele Menschen lieben ihre Tiere und können sich ein Leben ohne sie nicht vorstellen. Natürlich muss man auf die Nachbarn Rücksicht nehmen. Hunde sollten nicht den ganzen Tag bellen und Katzen sollten nicht in fremde Gärten laufen. Aber mit klaren Regeln funktioniert das Zusammenleben gut. Ich habe selbst eine Katze in meiner Wohnung und es gibt keine Probleme. Die Vermieter sollten nicht grundsätzlich verbieten, was den Mietern wichtig ist."]},{"title":"Part 3 – Formal Email","body":["Task: You want to volunteer at a local charity. Write an email to the organisation. Introduce yourself. Say why you want to help. Ask how you can get involved. About 40 words.","Sehr geehrte Damen und Herren,","mein Name ist Anna Fischer und ich möchte mich gerne ehrenamtlich engagieren. Ich habe viel Zeit und möchte anderen Menschen helfen. Können Sie mir bitte sagen, wie ich mich bei Ihnen einbringen kann?","Mit freundlichen Grüßen","Anna Fischer"]}]},{"title":"Exam 8","parts":[{"title":"Part 1 – Informal Email","body":["Task: You want to invite your friend to a cinema trip. Write an email. Suggest a film. Suggest a time and day. Ask if he/she wants to come. About 80 words.","Hallo Lisa,","hast du am Samstagabend Zeit? Ich möchte ins Kino gehen und dachte, wir könnten zusammen den neuen Film \"Avatar\" anschauen. Ich habe gehört, der soll richtig gut sein! Die Vorstellung beginnt um 19:30 Uhr im Cinemaxx. Vielleicht können wir uns vorher noch auf einen Kaffee treffen. Hast du Lust mitzukommen? Sag mir bitte Bescheid, damit ich die Tickets kaufen kann. Ich würde mich sehr freuen!","Liebe Grüße","Sarah"]},{"title":"Part 2 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Is it better to work from home or in the office?\" Write your opinion. About 80 words.","Ich habe die Diskussion zum Thema \"Arbeiten von zu Hause oder im Büro\" verfolgt. Meiner Meinung nach hat beides Vor- und Nachteile. Von zu Hause aus zu arbeiten ist praktisch, weil man sich die Zeit selbst einteilen kann und keine Fahrzeit hat. Aber im Büro ist der Kontakt zu den Kollegen viel direkter und man kann sich leichter austauschen. Ich finde, eine Mischung ist am besten. An manchen Tagen zu Hause, an anderen im Büro – so hat man die Vorteile von beiden Welten."]},{"title":"Part 3 – Formal Email","body":["Task: You need a document for your application. Write an email to the city administration. Request the document. Explain why you need it. Ask about the processing time. About 40 words.","Sehr geehrte Damen und Herren,","ich benötige für meine Bewerbung eine beglaubigte Kopie meines Geburtsurkunde. Kann ich diese bei Ihnen beantragen? Wie lange dauert die Bearbeitung?","Mit freundlichen Grüßen","Peter Müller"]}]},{"title":"Exam 9","parts":[{"title":"Part 1 – Informal Email","body":["Task: Your friend has lost his/her job. Write an email to comfort him/her. Say you are sorry. Give encouragement. Offer to help. About 80 words.","Liebe Nina,","es tut mir wirklich sehr leid, dass du deinen Job verloren hast. Das ist bestimmt ein großer Schock für dich. Aber gib nicht auf! Du bist eine tolle und kompetente Mitarbeiterin. Ich bin mir sicher, dass du ganz schnell etwas Neues findest. Vielleicht ist das sogar eine Chance, etwas zu machen, was dir noch mehr Spaß bringt. Wenn ich dir irgendwie helfen kann – bei Bewerbungen oder einfach zum Reden – dann sag mir bitte Bescheid. Ich bin für dich da.","Ganz liebe Grüße","Laura"]},{"title":"Part 2 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Is social media good or bad for young people?\" Write your opinion. About 80 words.","Ich finde, dass soziale Medien sowohl gute als auch schlechte Seiten haben. Einerseits kann man mit Freunden in Kontakt bleiben, die weit weg wohnen, und lernt neue Leute kennen. Andererseits verbringen viele Jugendliche zu viel Zeit vor dem Handy und vernachlässigen andere Aktivitäten. Außerdem kann der Druck, immer perfekt auszusehen, sehr belastend sein. Ich bin der Meinung, dass man soziale Medien bewusst nutzen sollte. Es kommt auf die Balance an – nicht zu viel, aber auch nicht gar nicht."]},{"title":"Part 3 – Formal Email","body":["Task: You have a complaint about your internet connection. Write an email to your provider. Describe the problem. Say how long it has been going on. Ask for a solution. About 40 words.","Sehr geehrte Damen und Herren,","ich habe seit drei Tagen kein Internet. Der Router zeigt keine Verbindung an. Das Problem tritt immer wieder auf. Bitte schicken Sie mir einen Techniker, um das Problem zu beheben.","Mit freundlichen Grüßen","Klaus Richter"]}]},{"title":"Exam 10","parts":[{"title":"Part 1 – Informal Email","body":["Task: You have started a new hobby. Write an email to your friend and tell him/her about it. Describe the hobby. Say why you like it. Invite him/her to join you. About 80 words.","Hallo Tim,","ich habe ein neues Hobby: Ich gehe jetzt jeden Samstag zum Yoga! Es ist wirklich super entspannend und tut meinem Rücken richtig gut. Die Übungen sind am Anfang etwas schwierig, aber man merkt schnell Fortschritte. Die Atmung hilft mir auch, nach der Arbeit abzuschalten. Du solltest unbedingt mal mitkommen! Der Kurs ist wirklich für Anfänger geeignet. Hast du nächsten Samstag Zeit? Ich kann dich gerne anmelden.","Bis bald!","Anna"]},{"title":"Part 2 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should fast food be banned in schools?\" Write your opinion. About 80 words.","Ich finde, dass Fast Food in Schulen nicht verboten werden sollte, aber es sollte weniger angeboten werden. Viele Schüler essen gerne Pizza oder Burger, das ist normal. Allerdings sollten Schulen auch gesündere Alternativen anbieten, wie Salate oder Vollkornbrote. So haben die Schüler die Wahl. Ein Verbot würde wahrscheinlich nur dazu führen, dass sie sich heimlich Fast Food kaufen. Ich bin der Meinung, dass Aufklärung wichtiger ist als Verbote. Man sollte den Kindern beibringen, was gesund ist und was nicht."]},{"title":"Part 3 – Formal Email","body":["Task: You want to change your gym membership. Write an email to the gym. Explain what you want to change. Give a reason. Ask about the procedure. About 40 words.","Sehr geehrte Damen und Herren,","ich möchte meinen Mitgliedsvertrag von Monatsbeitrag auf Jahresbeitrag umstellen. Das ist für mich günstiger. Können Sie mir bitte sagen, wie ich das machen muss?","Mit freundlichen Grüßen","Stefan Becker"]}]}];

const SCHRIBEN_B2_EXAMS = [{"title":"Exam 1","parts":[{"title":"Part 1 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should university education be free for everyone?\" Write your opinion. About 150 words.","Ich bin der Meinung, dass ein kostenloses Universitätsstudium eine wichtige Investition in die Zukunft eines Landes ist. Bildung sollte nicht vom Geldbeutel der Eltern abhängen, denn jeder Mensch hat das Recht auf gleiche Chancen.\n\nAllerdings muss man auch die finanzielle Belastung für den Staat bedenken. Wenn alle Studiengänge kostenlos wären, müssten die Steuern wahrscheinlich erhöht werden. Vielleicht könnte man eine Lösung finden, bei der das Grundstudium kostenlos ist, aber spezielle Programme kostenpflichtig werden.\n\nEin weiterer Punkt ist, dass kostenlose Bildung auch die Motivation der Studierenden beeinflussen könnte. Manche Studierende nehmen ihr Studium weniger ernst, wenn sie nichts dafür bezahlen müssen. Andererseits ist ein Studium auch eine Zeit der persönlichen Entwicklung.\n\nZusammenfassend denke ich, dass ein kostenloses Studium erstrebenswert ist, aber es sollte mit Maßnahmen kombiniert werden, die die Qualität sichern, wie Leistungskontrollen. Bildung ist der Schlüssel zu einer besseren Gesellschaft."]},{"title":"Part 2 – Formal Message","body":["Task: You are the head of a department. Your employee, Mr Klein, is consistently late to work. Write him an official email. Inform him that the punctuality issue must be resolved. Ask for a meeting to discuss the matter. About 100 words.","Sehr geehrter Herr Klein,\n\nich wende mich an Sie, da mir in den letzten Wochen wiederholt aufgefallen ist, dass Sie zu spät zur Arbeit erscheinen. Dies stellt eine Verletzung Ihrer Arbeitsvertragspflichten dar.\n\nIch möchte Sie bitten, dieses Verhalten umgehend zu korrigieren. Pünktlichkeit ist ein wesentlicher Bestandteil unseres Teamerfolgs.\n\nIch lade Sie daher zu einem Gespräch am Mittwoch, den 25. Oktober, um 9:30 Uhr in meinem Büro ein. Bitte bestätigen Sie diesen Termin.\n\nMit freundlichen Grüßen\nDr. Müller"]}]},{"title":"Exam 2","parts":[{"title":"Part 1 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should genetically modified food be banned?\" Write your opinion. About 150 words.","Die Diskussion über gentechnisch veränderte Lebensmittel ist sehr aktuell und emotional. Meiner Meinung nach ist ein pauschales Verbot nicht sinnvoll, da diese Technologie großes Potenzial hat.\n\nAuf der einen Seite könnten genetisch veränderte Pflanzen helfen, den Welthunger zu bekämpfen. Sie sind oft widerstandsfähiger gegen Schädlinge und Trockenheit, was in Zeiten des Klimawandels besonders wichtig ist.\n\nAuf der anderen Seite gibt es berechtigte Bedenken hinsichtlich der Langzeitfolgen für die Umwelt und die menschliche Gesundheit. Es fehlen noch ausreichende Studien, um alle Risiken auszuschließen.\n\nIch bin daher der Ansicht, dass ein Kompromiss gefunden werden sollte: Strenge Kontrollen und eine transparente Kennzeichnung, damit die Verbraucher selbst entscheiden können, aber keine generelle Ablehnung dieser Technologie."]},{"title":"Part 2 – Formal Message","body":["Task: You are a project manager. One of your team members, Ms Meier, has missed two project deadlines. Write an email to Ms Meier. Remind her of the deadlines and the consequences for the project. Offer a personal meeting to discuss her workload. About 100 words.","Sehr geehrte Frau Meier,\n\nmir ist aufgefallen, dass Sie die letzten beiden Abgabetermine für das Projekt \"Delta\" nicht einhalten konnten. Die Verspätungen haben bereits zu Verzögerungen in der Gesamtplanung geführt.\n\nIch bitte Sie, die nächsten Termine unbedingt einzuhalten, da ansonsten der Projektabschluss gefährdet ist. Sollten Sie Probleme mit Ihrer Arbeitsbelastung haben, stehe ich für ein persönliches Gespräch zur Verfügung.\n\nKönnen wir uns morgen kurz in meinem Büro treffen?\n\nMit freundlichen Grüßen\nThomas Wagner"]}]},{"title":"Exam 3","parts":[{"title":"Part 1 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Is artificial intelligence a danger to humanity?\" Write your opinion. About 150 words.","Die Frage, ob künstliche Intelligenz eine Gefahr für die Menschheit darstellt, beschäftigt viele Menschen. Ich persönlich sehe KI eher als Chance denn als Bedrohung, vorausgesetzt, wir setzen sie verantwortungsvoll ein.\n\nEs ist unbestritten, dass KI viele Bereiche revolutioniert, von der Medizin bis zur Logistik. Sie kann uns bei komplexen Problemen unterstützen und Prozesse effizienter gestalten. Allerdings birgt sie auch Risiken, besonders in Bezug auf Datenschutz und den Verlust von Arbeitsplätzen.\n\nDie eigentliche Gefahr sehe ich weniger in der Technologie selbst, sondern darin, wie Menschen sie nutzen. Deshalb ist es wichtig, dass wir klare ethische Richtlinien und Gesetze entwickeln, um den Missbrauch zu verhindern.\n\nZusammenfassend bin ich der Meinung, dass wir die Entwicklung von KI nicht aufhalten sollten, aber wir müssen sie aktiv und kritisch begleiten."]},{"title":"Part 2 – Formal Message","body":["Task: You are a customer. You ordered a product online, but the delivery was delayed by two weeks. Write to the customer service. Describe the situation, express your disappointment, and state your expectations. About 100 words.","Sehr geehrte Damen und Herren,\n\nich habe am 1. November den Artikel \"Smartwatch XY\" (Bestellnummer 45678) bestellt. Laut Ihrer Webseite sollte die Lieferung innerhalb von drei Tagen erfolgen. Die Ware ist jedoch bis heute nicht bei mir eingetroffen.\n\nDieses Versäumnis ist für mich äußerst enttäuschend, da es sich um ein Geschenk handelt. Ich fordere Sie auf, den Artikel umgehend zu liefern oder mir den Kaufpreis zurückzuerstatten. Bitte teilen Sie mir mit, wie Sie vorgehen."]}]},{"title":"Exam 4","parts":[{"title":"Part 1 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should everyone do a year of social service?\" Write your opinion. About 150 words.","Ich halte die Idee eines verpflichtenden Sozialjahres für alle jungen Menschen für sehr diskussionswürdig. Ein solches Pflichtjahr könnte viele positive Auswirkungen auf die Gesellschaft haben.\n\nZum einen würden junge Menschen frühzeitig lernen, Verantwortung zu übernehmen und sich in soziale Einrichtungen einzubringen. Dies fördert Empathie und das Verständnis für andere Lebenssituationen. Zum anderen würden viele Bereiche wie Krankenhäuser oder Schulen von dieser zusätzlichen Unterstützung profitieren.\n\nAllerdings frage ich mich, ob ein verpflichtendes Jahr die Freiheit des Einzelnen zu sehr einschränkt. Manche jungen Menschen haben bereits klare Karrierepläne oder familiäre Verpflichtungen.\n\nLetztlich könnte ein Freiwilligendienst mit finanziellen Anreizen eine bessere Lösung sein als eine gesetzliche Pflicht."]},{"title":"Part 2 – Formal Message","body":["Task: You are an event planner. You recently hired a catering service that did not meet your expectations (unpunctual, food quality poor). Write an email to the caterer, Mr Fischer. Describe the problems and state what you expect from him. About 100 words.","Sehr geehrter Herr Fischer,\n\nich wende mich an Sie, um meine Unzufriedenheit mit Ihrer Dienstleistung bei der Veranstaltung am 15. November auszudrücken. Ihre Mitarbeiter erschienen eine Stunde zu spät, und die Qualität des Essens entsprach nicht den vereinbarten Standards.\n\nDiese Mängel haben den Ablauf der Veranstaltung erheblich beeinträchtigt. Ich erwarte von Ihnen eine schriftliche Stellungnahme und eine angemessene Preisminderung für die nicht erbrachte Leistung.\n\nBitte setzen Sie sich bis zum Ende der Woche mit mir in Verbindung.\n\nMit freundlichen Grüßen\nKlaus Richter"]}]},{"title":"Exam 5","parts":[{"title":"Part 1 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Do we still need physical bookstores?\" Write your opinion. About 150 words.","Die Frage, ob wir heute noch physische Buchhandlungen brauchen, ist sehr berechtigt. Die Digitalisierung hat den Buchmarkt stark verändert, aber ich bin der festen Überzeugung, dass Buchhandlungen weiterhin eine wichtige Rolle spielen.\n\nEin Buchladen bietet ein Erlebnis, das man online nicht reproduzieren kann: das Stöbern, das Blättern in Büchern und die persönliche Beratung durch kompetentes Personal. Zudem sind Buchhandlungen Orte der Begegnung, in denen Lesungen und Diskussionen stattfinden.\n\nAllerdings haben es Buchhandlungen schwer, gegen die Preisvorteile großer Onlinehändler zu konkurrieren. Sie müssen sich weiterentwickeln und vielleicht mit Cafés oder Events kombinieren.\n\nMeiner Meinung nach werden Buchhandlungen nicht verschwinden, aber sie müssen sich anpassen, um relevant zu bleiben."]},{"title":"Part 2 – Formal Message","body":["Task: You are a tenant in an apartment building. Your upstairs neighbours are constantly making noise after 10 p.m. Write an official complaint to your landlord, Mr Schwarz. Describe the problem, mention the building's rules, and ask for a solution. About 100 words.","Sehr geehrter Herr Schwarz,\n\nich möchte Sie auf ein wiederkehrendes Problem in dem von Ihnen verwalteten Gebäude aufmerksam machen. Die Mieter der Wohnung über mir verursachen regelmäßig nach 22 Uhr laute Musik und Lärm, was gegen die Hausordnung verstößt.\n\nTrotz mehrmaliger freundlicher Hinweise konnte ich bisher keine Besserung feststellen. Der Lärm beeinträchtigt meinen Schlaf und somit meine Arbeitsleistung erheblich.\n\nIch bitte Sie, die betreffenden Mieter abzumahnen und für Ruhe zu sorgen. Können Sie mir bitte mitteilen, wie Sie vorzugehen gedenken?\n\nMit freundlichen Grüßen\nAnna Weber"]}]},{"title":"Exam 6","parts":[{"title":"Part 1 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should companies allow employees to work four days a week?\" Write your opinion. About 150 words.","Die Diskussion um die Vier-Tage-Woche gewinnt zunehmend an Bedeutung. Ich halte dieses Modell für vielversprechend, da es sowohl Arbeitgebern als auch Arbeitnehmern Vorteile bieten kann.\n\nFür die Mitarbeiter bedeutet ein freier Tag mehr Lebensqualität und weniger Stress. Studien zeigen, dass die Produktivität nicht sinkt, wenn die Arbeitszeit komprimiert wird. Zudem könnte dies die Work-Life-Balance erheblich verbessern.\n\nAllerdings gibt es auch Kritikpunkte. Nicht alle Branchen können auf die gleiche Weise flexibilisiert werden, und die Umstellung erfordert eine sorgfältige Planung. Für kleinere Unternehmen kann die Vier-Tage-Woche eine große finanzielle Herausforderung darstellen.\n\nAbschließend bin ich der Meinung, dass dieses Modell ein wichtiger Schritt in die Zukunft sein kann, aber es sollte nicht verpflichtend sein, sondern den Unternehmen freigestellt werden."]},{"title":"Part 2 – Formal Message","body":["Task: You are the manager of a team. You need to inform your colleagues about a mandatory training session next week. Send a formal email to your team. State the date, time, and purpose of the training. Request confirmation of attendance. About 100 words.","Sehr geehrte Kolleginnen und Kollegen,\n\nhiermit lade ich Sie zu einer verpflichtenden Weiterbildung zum Thema \"Datenschutzgrundverordnung\" ein. Die Schulung findet am Dienstag, den 10. Dezember, von 14:00 bis 17:00 Uhr im Konferenzraum 3 statt.\n\nDie Teilnahme ist für alle Mitarbeiter verpflichtend, da die neuen gesetzlichen Anforderungen für unsere Arbeit von großer Bedeutung sind.\n\nIch bitte Sie, die Teilnahme bis zum 5. Dezember per E-Mail zu bestätigen. Bei Terminkonflikten setzen Sie sich bitte mit mir in Verbindung.\n\nMit freundlichen Grüßen\nDr. Thomas Schmidt"]}]},{"title":"Exam 7","parts":[{"title":"Part 1 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should plastic bags be completely banned?\" Write your opinion. About 150 words.","Ich begrüße die Initiative, Plastiktüten zu verbieten, weil sie eine der größten Umweltbelastungen unserer Zeit darstellen. Sie sind nicht biologisch abbaubar und schaden der Tierwelt massiv.\n\nEin vollständiges Verbot würde den Verbrauch drastisch reduzieren und die Menschen dazu zwingen, auf umweltfreundliche Alternativen wie Stofftaschen umzusteigen. In vielen Ländern hat ein solches Verbot bereits zu messbaren Erfolgen geführt.\n\nAllerdings muss man auch sehen, dass Plastiktüten in bestimmten Bereichen nützlich sein können, etwa für den Transport von frischem Obst oder Fleisch. Hier könnten kompostierbare Alternativen die Lösung sein.\n\nInsgesamt bin ich jedoch überzeugt, dass ein Verbot der richtige Weg ist, um das Bewusstsein für Umweltfragen zu schärfen und unseren Planeten zu schützen."]},{"title":"Part 2 – Formal Message","body":["Task: You are a student. You missed the registration deadline for an exam because of an illness. Write an official email to your professor, Dr Wagner. Explain your situation. Ask if it is still possible to register late, and offer to provide a doctor's note. About 100 words.","Sehr geehrter Herr Dr. Wagner,\n\nich wende mich mit einer dringenden Bitte an Sie. Ich war in den letzten zwei Wochen krank und habe deshalb die Anmeldefrist für die Prüfung im Fach \"Makroökonomie\" verpasst.\n\nDie Prüfung ist für mein Studium von entscheidender Bedeutung. Könnte ich mich trotz der verspäteten Anmeldung noch für die Klausur einschreiben?\n\nIch kann selbstverständlich ein ärztliches Attest vorlegen, das meine Krankheit bestätigt. Über eine positive Rückmeldung würde ich mich sehr freuen.\n\nMit freundlichen Grüßen\nJulia Hoffmann"]}]},{"title":"Exam 8","parts":[{"title":"Part 1 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Is the use of social media making people isolated?\" Write your opinion. About 150 words.","Ich habe die Diskussion über die Auswirkungen von Social Media verfolgt und möchte meine Sichtweise teilen. Meiner Meinung nach ist die Behauptung, dass Social Media Einsamkeit fördert, zu pauschal.\n\nEs ist richtig, dass viele Menschen stundenlang auf ihren Handys verbringen und dadurch echte Gespräche vernachlässigen. Dies kann zu einer scheinbaren Isolation führen. Gleichzeitig ermöglichen Plattformen wie Facebook und Instagram aber auch den Kontakt zu Menschen, die man sonst nie getroffen hätte.\n\nIch habe zum Beispiel durch Instagram viele Freunde in anderen Ländern gefunden, mit denen ich mich regelmäßig austausche. Entscheidend ist die Nutzungsdauer und die Fähigkeit, digitale mit realen Kontakten zu kombinieren.\n\nLetztendlich liegt es an jedem Einzelnen, wie er die Technologie nutzt."]},{"title":"Part 2 – Formal Message","body":["Task: You are a business partner. Your company's supplier delivered the wrong material. Write an email to the supplier. Describe the mistake. State the consequences for your production. Ask for immediate replacement or compensation. About 100 words.","Sehr geehrte Damen und Herren,\n\nwir haben heute Ihre Lieferung der Bestellung Nr. 789 erhalten. Leider haben Sie nicht das bestellte Aluminium, sondern Stahl geliefert.\n\nDieser Fehler hat schwerwiegende Konsequenzen für unsere Produktion, da wir nun nicht wie geplant fertigen können. Wir bitten Sie dringend, die korrekte Ware umgehend zu liefern und den falschen Artikel abzuholen.\n\nSollte dies nicht möglich sein, erwarten wir eine angemessene finanzielle Kompensation. Bitte informieren Sie uns über Ihr weiteres Vorgehen.\n\nMit freundlichen Grüßen\nPeter Meier"]}]},{"title":"Exam 9","parts":[{"title":"Part 1 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should public transport be free?\" Write your opinion. About 150 words.","Die Idee eines kostenlosen öffentlichen Nahverkehrs wird immer lauter diskutiert. Ich sehe darin viele Vorteile, allerdings auch erhebliche Herausforderungen.\n\nEin kostenloser Nahverkehr würde mehr Menschen dazu bewegen, auf das Auto zu verzichten, was den CO₂-Ausstoß reduzieren könnte. Gerade in großen Städten würde dies die Verkehrsprobleme entschärfen. Zudem wäre es ein großer Schritt in Richtung sozialer Gerechtigkeit, da jeder Zugang zu Mobilität hätte.\n\nAuf der anderen Seite stehen die enormen Kosten für den Staat. Wer soll diese finanzieren? Steuererhöhungen sind unpopulär. Die Bahnen und Busse würden sehr voll werden, wenn sie kostenlos wären, und die Qualität könnte leiden.\n\nIch denke, man sollte zunächst mit günstigeren Tickets experimentieren, bevor man alle Züge kostenlos macht."]},{"title":"Part 2 – Formal Message","body":["Task: You are an editor at a magazine. You need to book a speaker for your upcoming conference. Write an email to a potential speaker, Professor Berger. Introduce yourself and your magazine. Explain the topic of the conference. Ask if she would be available to give a talk and ask for her fee. About 100 words.","Sehr geehrte Frau Professor Berger,\n\nmein Name ist Hans Müller und ich bin Chefredakteur der Zeitschrift \"Wissen heute\". Wir planen für den 15. März 2026 eine Konferenz zum Thema \"Klimawandel und seine sozialen Auswirkungen\".\n\nDa Sie eine anerkannte Expertin auf diesem Gebiet sind, würden wir Sie sehr gerne als Hauptrednerin gewinnen. Wären Sie bereit, einen Vortrag von etwa 45 Minuten zu halten? Wir würden uns über eine Zusage sehr freuen.\n\nKönnten Sie uns bitte mitteilen, mit welchem Honorar wir rechnen müssten? Über Ihre Rückmeldung würden wir uns freuen.\n\nMit freundlichen Grüßen\nHans Müller"]}]},{"title":"Exam 10","parts":[{"title":"Part 1 – Forum Post","body":["Task: In an online forum, there is a discussion about: \"Should students be required to learn a second foreign language?\" Write your opinion. About 150 words.","In der Diskussion um die zweite Fremdsprache als Pflicht bin ich zwiegespalten. Auf der einen Seite ist es sehr wertvoll, mehrere Sprachen zu beherrschen, besonders in einem vereinten Europa. Es erweitert den Horizont und verbessert die beruflichen Chancen.\n\nAuf der anderen Seite wird der Lehrplan bereits jetzt sehr voll. Viele Schüler kämpfen schon mit Englisch und Mathematik. Eine zusätzliche Pflicht könnte überfordern und den Spaß am Lernen nehmen.\n\nIch finde, dass man den Schülern die Wahl lassen sollte. Vielleicht könnte man eine verpflichtende Einführung in mehrere Sprachen anbieten, aber die Vertiefung in eine oder zwei Sprachen freistellen. So könnte jeder seinen persönlichen Interessen folgen.\n\nLetztlich ist die Motivation der Schlüssel zum erfolgreichen Sprachenlernen, und die ist bei Zwang nicht immer gegeben."]},{"title":"Part 2 – Formal Message","body":["Task: You are a participant in a training seminar. You need to change your room in the seminar hotel because it is too noisy. Write to the hotel reception. Explain the problem. Request a room change. Specify what type of room you would prefer. About 100 words.","Sehr geehrte Damen und Herren,\n\nich bin Teilnehmer des Seminars \"Leadership\" und wohne derzeit in Zimmer 345. Leider ist das Zimmer sehr laut, da es direkt zur Hauptstraße liegt. Der Verkehrslärm stört meine Nachtruhe erheblich.\n\nIch bitte höflich um einen Zimmerwechsel. Könnten Sie mir ein Zimmer zur Rückseite des Hotels geben? Idealerweise ein ruhiges Zimmer mit Einzelbett.\n\nIch würde mich freuen, wenn dies noch heute möglich wäre. Bitte lassen Sie mich wissen, wann ich den Schlüssel abholen kann.\n\nMit freundlichen Grüßen\nLaura Becker"]}]}];

function renderSchribenGermanText(text, seen, terms){
  const available=Object.entries(terms||{}).filter(([term])=>!seen.has(term.toLocaleLowerCase()));
  if(!available.length) return esc(text);
  const patterns=available.map(([term])=>term).sort((a,b)=>b.length-a.length).map(escapeRegExp);
  const re=new RegExp('(^|[^\p{L}])('+patterns.join('|')+')(?=$|[^\p{L}])','giu');
  let out='',last=0,m;
  while((m=re.exec(text))){
    const token=m[2];
    const matched=available.find(([term])=>term.toLocaleLowerCase()===token.toLocaleLowerCase());
    if(!matched) continue;
    const start=m.index+(m[1]?m[1].length:0);
    out+=esc(text.slice(last,start));
    out+=`<span class="term-link" onclick='event.stopPropagation();speak(${JSON.stringify(token)})' aria-label="${esc(matched[1])}">${esc(token)}<span class="term-tip">${esc(matched[1])}</span></span>`;
    seen.add(matched[0].toLocaleLowerCase());
    last=start+token.length;
  }
  out+=esc(text.slice(last));
  return out;
}

}
function downloadSchribenText(){
  const editor=document.getElementById('schreibenEditor');
  const text=editor ? editor.value : '';
  const data='\ufeff'+text;

function runSchreibenFeedback(){
  const editor=document.getElementById('schreibenEditor');
  const out=document.getElementById('schreibenFeedback');
  if(!editor||!out)return;
  const text=editor.value.trim();
  if(!text){out.textContent='Write a little German first, then run the check.';return;}
  const sentences=text.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);
  const words=text.split(/\s+/).filter(Boolean);
  const repeated=words.map(w=>w.toLocaleLowerCase().replace(/[^\p{L}\-']/gu,'')).filter(Boolean).reduce((acc,w,i,a)=>{if(i&&w===a[i-1])acc.add(w);return acc},new Set());
  const tips=[];
  if(words.length<20)tips.push('Your text is very short. Add a little more detail if the task asks for a longer response.');
  if(!/[.!?]$/.test(text))tips.push('Add punctuation at the end of your text.');
  if(sentences.some(x=>x[0] && x[0]!==x[0].toLocaleUpperCase()))tips.push('Check sentence starts: German sentences normally begin with a capital letter.');
  if(repeated.size)tips.push(`Check repeated words: ${[...repeated].slice(0,3).join(', ')}.`);
  if(sentences.length<2 && words.length>12)tips.push('Consider splitting the text into shorter sentences to make it easier to read.');
  if(!tips.length)tips.push('Looks good at a basic level. Now check the task requirements, word choice, articles, cases and verb position carefully.');
  out.innerHTML=`<strong>${words.length} words · ${sentences.length} sentence${sentences.length===1?'':'s'}</strong><br>${tips.map(t=>'• '+esc(t)).join('<br>')}`;
}

function buildHighlightPlan(story,rows,maxItems=10,extraRows=[]){
  const text=(story||[]).join(' ');
  const candidates=[];
  (rows||[]).concat(extraRows||[]).forEach((r,idx)=>{
    const term=String(r[0]||'').trim();
    const en=String(r[1]||'').trim();
    if(!term) return;
    let matched='';
    for(const variant of vocabMatchTerm(term)){
      const re=new RegExp('(^|[^\p{L}])'+escapeRegExp(variant)+'(?=$|[^\p{L}])','iu');
      if(re.test(text)){matched=variant;break;}
    }
    if(matched) candidates.push({term,en,matched,idx});
  });
  // Prefer useful phrases/longer terms first, then preserve vocabulary-table order.
  candidates.sort((a,b)=>b.matched.length-a.matched.length || a.idx-b.idx);
  return candidates.slice(0,maxItems);
}
function renderHighlightedText(text,plan,state){
  if(!plan.length) return esc(text);
  const choices=plan.filter(v=>!state.used.has(v.matched.toLocaleLowerCase()));
  if(!choices.length) return esc(text);
  const byPhrase=choices.map(v=>v.matched).sort((a,b)=>b.length-a.length);
  const re=new RegExp('(^|[^\p{L}])('+byPhrase.map(escapeRegExp).join('|')+')(?=$|[^\p{L}])','giu');
  let out='',last=0,m;
  while((m=re.exec(text))){
    const token=m[2];
    const hit=choices.find(v=>v.matched.toLocaleLowerCase()===token.toLocaleLowerCase());
    if(!hit) continue;
    const key=hit.matched.toLocaleLowerCase();
    if(state.used.has(key)) continue;
    const start=m.index+(m[1]?m[1].length:0);
    const end=start+token.length;
    out+=esc(text.slice(last,start));
    out+=`<span class="term-link" onclick='event.stopPropagation();speak(${JSON.stringify(token)})' aria-label="${esc(hit.en)}">${esc(token)}<span class="term-tip">${esc(hit.en)}</span></span>`;
    state.used.add(key);
    state.count++;
    last=end;
    if(state.count>=(state.limit||10)){
      out+=esc(text.slice(last));
      return out;
    }
  }
  out+=esc(text.slice(last));
  return out;
}

"If you are the weaker one, do not fight for the sake of honor. Pretend to surrender. That gives you time to recover. Wait until the victor becomes weak. Then strike. Apparent weakness can be a weapon.",
"Do not spread your energy across too many things. Concentrate on the most important point. Deep work is better than many small projects. Find a powerful ally. A strong source is better than many weak ones.",
"In the world of power, skill matters. Be polite and flatter your master. Claim power in an elegant way. Follow all the rules of etiquette. Then your rise will be easier. A perfect courtier always moves forward.",
"Do not accept the role that other people give you. Create your own identity. Be interesting and dramatic. Decide for yourself how you are seen. Then you will appear greater and more powerful. Be the director of your own life.",

"When you are unsure, leave it. Hesitation is dangerous. Be brave and take the initiative. Mistakes made through courage can be corrected. But mistakes made through fear are worse. Be bold and act decisively.",
"Plan every step to the end. Think about every possible problem. If you have a plan, you can adapt it. Without a plan you will fail. A good plan is half the work. But stay flexible if something goes wrong.",
"Make your work look effortless. If something looks difficult, it looks exhausting. If it looks easy, it looks elegant. Hide your effort. Show only the result. People admire what seems easy to achieve.",
"Control the game, not the players. Give other people the tools, but keep control. Set the rules. Then you always win. If other people play by your rules, you can guide them.",
"People have dreams and wishes. Use that to your advantage. Promise to fulfill their dreams. Then they will follow you. But never fulfill every dream. Keep them waiting. That gives you power over them.",
"Everyone has a weakness. Find it out. Then you can control them. Some people are greedy, others are vain. Use their weaknesses. That is the key to their power.",
"If you behave like a king, you will be treated like one. Show confidence and dignity. Expect respect. Then you will receive it. People treat you the way you treat yourself. Be royal.",
"The right moment is everything. Wait for the perfect moment. Do not act too early or too late. Patience is a virtue. If you choose the right moment, you win. If you get the timing wrong, you lose.",
"If you cannot get something, ignore it. That is the best revenge. Show that you do not care. That makes other people angry. If you grieve, you show weakness. Ignoring shows strength.",
"People love spectacle. Stage dramatic events. That attracts attention. With theater and show you can influence people. Be a good actor. The stage is your tool.",
"Think what you want, but behave like the others. Think freely, but do not show it. Behave like everyone else. Otherwise you will be excluded. Adapt on the outside while keeping your own thoughts inside. That is clever. Outward conformity, inner freedom.",
"Create a stir to attract attention. If you move something, people will come. Use controversy and surprise. That gets people talking about you. But be careful that you do not sink yourself.",
"Nothing is free. Free offers always have a catch. If something sounds too good, it usually is. Pay for what you get. That gives you more control. Free things can make you dependent.",
"Do not follow a great person's footsteps. Do not be a copy. If you follow someone great, you will never become as great. Create your own story. Be original. That makes you unique.",
"Strike down the shepherd, and the sheep scatter. If you defeat the leader of a group, the group falls apart. Attack the leader. Without him, the others are confused and weak. This is a quick way to victory. Destroy the leadership.",
"Understand what other people feel and think. Use their hearts and minds for your purposes. If you know their emotions, you can guide them. That is powerful. Empathy can be a weapon.",
"Show people what they want to see. Reflect their behavior and desires. Then they will like you. They see themselves in you. That creates trust. Use the mirror to win them over.",
"Change is good, but too much is dangerous. Change things slowly and step by step. Otherwise people will rebel. Preach change, but be careful. Too much change leads to chaos.",
"Perfection makes people jealous. Show your mistakes too. That makes you human and likable. People do not like perfect people. They feel threatened. Be good, but not perfect.",
"When you have won, stop. Wanting more can destroy you. Enjoy your victory. Do not go too far. The goal has been reached. Now is the best time to stop.",
"Be flexible and adaptable. Be like water that takes every shape. If you are formless, your enemies cannot assess you. They cannot develop countermeasures. Keep moving. That is the highest art of power."

"Mercenaries are unreliable and dangerous. They fight only for money, not for loyalty. In war they often run away or change sides. Auxiliary troops from other countries are even worse. They can betray you or conquer your country. A clever prince builds his own army. He needs citizens who fight for their country. An army of your own is expensive, but it is the best investment. Only in this way can a ruler remain independent.",

"Machiavelli says that fortune (Fortuna) is like a woman. It can be conquered only by brave men. Whoever hesitates loses. Whoever is willing to take risks wins. The prince must challenge fortune. He must not wait idly. Fortune belongs to the brave. But the prince should not rely only on luck. He must also be capable. Luck alone is not enough. A clever ruler creates his own luck.",
"A prince must respect the people, but he must not fear them. The people are powerful, but they are also lazy. If the ruler treats the people well, they will support him. A wise ruler listens to the voice of the people. He gives the people what they need. But he never gives them too much power. The people should be satisfied, but they should not rebel. A clever ruler knows that the people are his strongest weapon — or his greatest danger.",
"A prince must take a clear position. He should be either a true friend or a true enemy. Neutrality is weakness. Whoever does not decide will be despised by both sides. A clever ruler chooses his alliances wisely. He supports his friends and fights his enemies. He leaves no doubt about his loyalty. That gives him respect and power. Indecision is the enemy of a ruler.",
"Many princes build fortresses to protect themselves. But a fortress does not protect against a dissatisfied people. If the people hate the ruler, no wall will help. A wise prince wins the hearts of the people. He needs no fortresses if the people love him. But if they hate him, fortresses are useless. The best fortress is the loyalty of the people. A clever ruler invests in his people, not only in stone and mortar.",
"A prince is always surrounded by flatterers. They tell him what he wants to hear. That is dangerous. A clever ruler surrounds himself with honest advisers. He listens to the truth, even when it hurts. But he decides alone. He does not allow one adviser to dominate him. A wise prince creates a system in which he hears the truth but keeps control. Flatterers are like poison. A good ruler recognizes them and keeps them away.",

const DINO_BOOK_DATA = [{"title": "📖 Introduction", "content": "### Introduction\n\nIn this follow-up to \"Ahoi aus Hamburg\", Dino travels back home to his place of birth, Palermo – coastal city and capital of Sicily – to join the wedding party of his big brother Alfredo.\n\nExcited about the prospect of meeting old friends and family, and a special guest from England, Dino stumbles into the nuptial celebrations completely underdressed, when a strange incident suddenly throws everyone's plans into turmoil.\n\nDiscover the culture and cuisine of northern Sicily, learn about sights and sounds of Palermo and improve your German effortlessly along the way.\n\nThis book is designed to help beginners make the leap from studying isolated words and phrases to reading (and enjoying) naturally flowing German texts.\n\nUsing simplified sentence structures and a very basic vocabulary, this collection of short stories is carefully crafted to allow even novice learners to appreciate and understand the intricacies of coherent German speech.\n\nEach chapter comes with a complete German-English dictionary, with a special emphasis on collocative phrases (high frequency word combinations), short sentences and expressions.\n\nBy working with these \"building blocks\" instead of just single words, learners can accelerate their understanding and active usage of new material and make the learning process more fluid and fun.\n\n### How To Read This Book\n\n1. If you want to get the most out these stories, you'll have to establish some kind of **Lesefluss** (reading flow). You might be reading quickly or slowly, it doesn't matter – as long as you keep on reading and allow context and continuity to clear your questions.\n\n2. Furthermore, important or difficult words (and short phrases) are appended to each chapter with an English translation for quick look-ups.\n\n3. If you're reading this book on an e-reader or tablet, you can get instant translations by clicking/tapping on the word. To find out if your device supports this feature and how to enable it, please consult your manual or customer support.\n\n4. As a final option we recommend using a good German-English online dictionary on your computer or mobile device while reading the following stories."},{"title":"✈️ Chapter 1: Wieder zu Hause","content":"**Heute Nachmittag bin ich am Flughafen von Palermo-Punta Raisi gelandet. Mein Bruder Alfredo stand vor dem Ausgang.** Er trug einen schwarzen Smoking und eine weinrote Krawatte.\n\nEigentlich wollten wir zusammen von Frankfurt nach Palermo fliegen, aber **am Ende kam alles anders.** Alfredo hatte **mal wieder** keine Zeit. Er **musste kurzfristig** nach Schanghai fliegen, **wegen** seiner **Arbeit.** Also habe ich **ein paar Tage** in Alfredos Wohnung in Frankfurt **verbracht** und bin dann **alleine** nach Palermo **geflogen.**\n\n**\"Ciao, Dino!\", rief er und winkte. Wir umarmten uns.** \"Wie war dein Flug?\", fragte er. \"**In Ordnung**\", sagte ich. \"Ein bisschen **rumpelig**.\"\n\n\"Ist das **dein ganzes Gepäck?**\", fragte er und **zeigte auf** meinen Rollkoffer. \"Ja\", sagte ich und **zuckte mit den Schultern.** \"Das ist **alles, was ich besitze.** \"\n\nAlfredo **schaute auf** die **Uhr** und sagte: \"Okay. **Wir müssen los!** \"\n\n\"Moment!\", sagte ich. \"Ich muss auf Elisabeth warten.\"\n\n\"Was?\", sagte Alfredo. \"Wer ist Elisabeth?\"\n\n\"Meine ... eine Freundin\", sagte ich. \"Sie kommt um **halb vier** mit einer **Maschine** aus London Heathrow.\"\n\nAlfredo **zupfte nervös** an seiner Krawatte. \"Die **Hochzeit** ist in **weniger als einer Stunde!** \", sagte er. \"Wir haben keine Zeit!\"\n\n\"**Keine Sorge!** \", sagte ich. \"**Ihr heiratet** in **unserem Garten**, **oder?** \" Alfredo **nickte.** \"**Na also!** \", sagte ich. \"Das ist **nur ein Katzensprung.** Komm, wir gehen einen Kaffee trinken!\"\n\n\"**Nun gut ...** \", sagte Alfredo und **seufzte.** \"Aber **wenn ich zu spät komme**, ist es **deine Schuld!** \"\n\nWir **gingen** zu einem kleinen Stehcafé und **bestellten** zwei **überteuerte** Espressos. \"Es ist schön, **wieder zu Hause zu sein**\", sagte ich und schaute **durch ein großes Fenster** auf die **Landebahn.**\n\n\"Ja\", sagte Alfredo. \"Es hat sich **nicht viel verändert.** \"\n\n\"**Wie geht es Mama und Papa?** \", fragte ich. Alfredo **hob seine Augenbrauen.** \"Gut\", sagte er. \"**Dafür, dass ...** \"\n\n\"Dass was?\", sagte ich.\n\n\"**Na ja**, sie sind **alt geworden**\", sagte Alfredo. \"Papa hat Probleme mit den **Knien** und Mama **klagt ständig über** ihren **Rücken.** \"\n\n**Da spürte** ich plötzlich einen **Finger** auf meiner **Schulter. Ich drehte mich um.** Vor mir stand Elisabeth.\n\n\"Wa... wie ... wo ...?\", **stammelte** ich.\n\n\"**Freut mich auch, dich wiederzusehen**, Dino\", sagte sie und **lächelte.** Sie trug ein blaues **Kleid** mit weißen **Punkten.** Ihre langen **Haare** hatte sie **zu einem Pferdeschwanz gebunden.** Ihre grünen **Augen strahlten** und ihr **Lächeln** machte mich **schwindelig.**\n\n\"Sorry\", sagte ich und umarmte sie. \"Ich ... ich habe dich nicht so **früh erwartet.** \"\n\n\"Ja\", sagte Elisabeth. \"Wir hatten **Rückenwind.** \"\n\nAlfredo **räusperte sich.** \"Oh\", sagte ich. \"Das ist **übrigens** mein Bruder, Alfredo!\"\n\n\"Ciao!\", sagte er und **küsste** Elisabeth **auf die Wange.** Dann **kippte** er seinen Espresso **in einem Zug herunter** und sagte: \"**Auf geht's!** \"\n\nWenig später saßen wir in einem schwarzen Mercedes und **fuhren an der Küste entlang.** Das **Mittelmeer glitzerte** in der Nachmittagssonne. Der **Himmel** war blau und **wolkenlos.** Alfredo **saß am Steuer,** Elisabeth und ich **auf der Rückbank.**\n\n\"**Warst du schon einmal** auf Sizilien?\", fragte ich. Elisabeth **schüttelte ihren Kopf.** \"Ich habe **vor vielen Jahren einmal** als Au-pair-Mädchen in der **Toskana** gearbeitet. Aber auf Sizilien war ich **noch nie.** Es ist **wunderschön** hier!\", sagte sie. \"Schön, ja ...\", steht dir sehr gut.** \"\n\nDa drehte sie sich um. Sie **musterte mich von oben bis unten** und begann plötzlich zu lachen.\n\n\"Was?\", sagte ich. \"Was ist?\"\n\n\"Der ... du ...\", **stammelte** sie und **brach erneut in Gelächter aus.**\n\n\"Das ist Onkel Vincentes Anzug\", sagte ich **zu meiner Verteidigung.** \"Er **passt** vielleicht nicht **hundertprozentig,** aber es ist **besser als nichts...** \"\n\nElisabeth **wischte** sich eine Träne aus den Augen und sagte: \"Nicht hundertprozentig? **Du siehst aus wie eine Wurst im Schlafrock!** \"\n\nIch **schaute an mir herab.** Die **Hosenbeine** baumelten über meinen Knöcheln. Die Ärmel des **Sakkos** waren **viel zu kurz.**\n\n\"**Was schlägst du vor?** \", sagte ich. Sie schaute aus dem Fenster. \"Dino, wir haben keine Zeit. Sie beginnen. Komm!\"\n\nWir gingen in den Flur, **stiegen** schnell die Treppenstufen **hinunter** und **traten hinaus in** den Garten.\n\nDie Hochzeitsgäste saßen **in drei Reihen** auf Plastikstühlen. Unter einem kleinen **Baldachin stand** mein Bruder Alfredo **neben** einem katholischen **Priester.** Die Band spielte den Hochzeitsmarsch.\n\n\"**Dort drüben!** \", flüsterte Elisabeth und zeigte auf zwei **freie Stühle** in der **Mitte** der zweiten Reihe.\n\nWährend Lorettas Vater die **Braut** in **Richtung** des Bräutigams manövrierte, **drängten** Elisabeth und ich uns zwischen den Gästen **hindurch.**\n\n\"**Pass doch auf!** \", beschwerte sich ein älterer Herr. \"Meine Füße!\", rief eine junge Dame.\n\n\"Oh ... **Entschuldigung!** \", sagte ich und **ließ** mich neben Elisabeth auf einen Stuhl **fallen.**\n\nDie Braut stand **jetzt** neben dem Bräutigam. Der Priester **murmelte** etwas. Alfredo und Loretta **gaben sich das Jawort.** Dann nahm Alfredo einen Ring und steckte ihn an Lorettas Finger. Die Gäste **applaudierten.** Das Brautpaar **küsste sich,** und die Band spielte einen flotten Marsch.\n\n\"**Ich kann es nicht glauben**\", sagte ich und schüttelte den Kopf. \"Alfredo! Verheiratet!\"\n\nDie Gäste **um uns herum erhoben sich** von ihren Stühlen und **stürmten** das Buffet. Elisabeth und ich **blieben sitzen.**\n\nSie wischte sich über die Augen und **schluchzte.** \"Sorry\", sagte sie. \"**Ich hasse** Hochzeiten!\"\n\n\"Hier\", sagte ich und gab ihr ein Taschentuch, **das** ich in der Hosentasche von Vincentes Anzug **gefunden hatte.**\n\n\"Danke\", sagte Elisabeth und **schniefte** in das Taschentuch. \"**Du hättest mich bei** der Hochzeit meiner **Schwester sehen sollen. Ich habe geheult wie ein Schlosshund!** \"\n\n\"**Ich wusste nicht, dass** du eine Schwester hast\", sagte ich.\n\n\"Na ja, Adoptivschwester. Aber sie ist die Lieblingstochter\", sagte Elisabeth. \"Früher akademischer Abschluss, dann Hochzeit, Kinder, Karriere in der Wirtschaft ... **verstehst du?** \"\n\nIch nickte. \"**Klingt wie** Alfredo\", sagte ich. \"**Bis auf** die Kinder ...\"\n\n\"**Was nicht ist, kann noch werden** ...\", sagte sie und wischte mit dem Taschentuch über ihre Wangen. Nach einer kurzen Pause sagte sie: \"**Kann es sein, dass** das Taschentuch nach Knoblauch **riecht?** \"\n\n---\n\n## Übung\n\n**1. Was hat Dino in seinem Koffer?**\n\na) ein paar T-Shirts, eine Jeans und zwei Anzüge\nb) ein paar T-Shirts, drei Jeans und eine Regenjacke\nc) ein paar T-Shirts, zwei Jeans und eine Regenjacke\n\n**2. Wer ist Vincente?**\n\na) Dinos Cousin\nb) Dinos Onkel\nc) Dinos Vater\n\n**3. Warum ist Dino noch nicht angezogen?**\n\na) Er hat nichts zum Anziehen.\nb) Er hat zu lange geschlafen.\nc) Er hat keine Zeit.\n\n**4. Vincente gibt Dino ...**\n\na) eine Regenjacke\nb) ein T-Shirt\nc) einen Anzug\n\n**5. Warum lacht Elisabeth?**\n\na) Vincentes Anzug ist zu klein für Dino.\nb) Vincentes Anzug ist zu groß für Dino.\nc) Vincentes Anzug ist zu teuer für Dino.\n\n**6. Elisabeth ... Hochzeiten.**\n\na) liebt\nb) hasst\nc) mag\n\n**7. Elisabeths Schwester ist ...**\n\na) verheiratet\nb) ledig\nc) geschieden"},{"title":"🌅 Chapter 3: Der Sonnenuntergang","content":"Das Buffet war sehr **umfangreich.** Es gab **Arancini** (frittierte Reisbällchen), Makkaroni und Spaghetti mit **Sardinen** oder **Auberginen,** Involtini alla Siciliana (sizilianische **Rouladen**), **gegrillte Thunfischfilets,** Couscous, Obstsalat und eine enorme **Auswahl** von **Weinen.**\n\nElisabeth und ich saßen an einem Tisch zusammen mit ein paar **Verwandten** von Loretta. Die Sonne **brannte** auf unsere Köpfe und wir **tranken kühlen Weißwein.**\n\nElisabeth **biss** in ein Reisbällchen und sagte: \"Mmh!\"\n\n\"**Schmeckt es?** \", sagte ich und lächelte. \"Das ist eine sizilianische **Spezialität.** \"\n\n\"**Ich wusste schon immer,** dass die englische **Küche schlecht** ist\", sagte sie und **schluckte.** \"Aber **erst jetzt** weiß ich, **was ich verpasse! Gibst du** mir **noch einen Schluck** Wein, bitte?\"\n\nDie Band spielte eine Instrumentalversion von \"Last Christmas\", **obwohl** es **über dreißig Grad** war. Die ersten Paare begannen zwischen den Palmen am Ufer zu tanzen.\n\nIch hatte gerade mit dem Nachtisch begonnen, da **hörte** ich eine Stimme. \"Dino! Bambino!\"\n\nEs war meine Mutter. Sie **drückte** mich an ihre breite Brust und rief: \"Mein Sohn!\"\n\nElisabeth **schaute amüsiert zu.** \"Mama\", sagte ich. \"**Darf ich vorstellen,** das ist Elisabeth. Sie kommt aus England.\"\n\nMeine Mutter **gab ihr die Hand** und **setzte sich** zwischen Elisabeth und mich an den Tisch. \"Wie geht es dir?\", fragte ich.\n\n\"Ach\", sagte sie und lächelte. \"In meinem **Alter** bin ich **froh, wenn** ich morgens ohne **Schmerzen aufwache.** \"\n\n\"Schmerzen?\", fragte ich, und **bereute** es **sofort.** **Denn** meine Mutter begann **augenblicklich** mit einer **detaillierten Auflistung** ihrer letzten Arztbesuche.\n\n**Als** sie **endlich** eine Pause machte, sagte Elisabeth **auf Italienisch:** \"Das Essen ist sehr **lecker!** \"\n\n\"**Wirklich?** \", sagte meine Mutter und lächelte. \"Ich weiß nicht. Alfredo hat so einen Catering-Service **bestellt.** Die Arancini sind ein bisschen zu hart, und die Pasta ist nicht ganz al dente. Aber **Sie als Ausländerin bemerken** das vielleicht nicht. Dino aber weiß sehr gut, dass meine Arancini und meine Pasta ...\"\n\n\"Mama!\", sagte ich. \"Bitte!\"\n\nIn dem Moment begann die Band \"I will survive\" zu spielen und **überall erhoben** sich Menschen von den Tischen und **stürmten** auf die **Tanzfläche** am Ufer.\n\n\"Oh\", sagte Elisabeth und **grinste.** \"Mein **Lieblingslied!** Willst du tanzen?\"\n\n\"**Gerne**\", sagte ich und nahm Elisabeths Hand.\n\n\"**Seid vorsichtig!** Es ist sehr **heiß!** \", **rief** meine Mutter uns **hinterher.**\n\n**Auf dem Weg** zum Ufer sagte ich zu Elisabeth: \"Das ist **nicht wirklich** dein Lieblingslied, **oder?** \"\n\n\"**Natürlich nicht**\", sagte Elisabeth. Die Sonne glitzerte auf der Wasseroberfläche wie unzählige Diamanten. \"**Außerdem** ist es viel zu heiß zum Tanzen!\"\n\n\"**Stimmt**\", sagte ich. \"**Komm,** ich habe eine Idee!\"\n\nWir gingen **an** der Tanzfläche **vorbei** und **spazierten** am Ufer entlang, **bis** die Musik **leiser wurde.** Elisabeth **hielt** noch immer meine Hand.\n\nIch **führte** sie auf einen Bootssteg. Wir gingen bis ans Ende des Stegs, **zogen unsere Schuhe aus** und ließen die Füße ins Wasser baumeln.\n\n\"**Als kleiner Junge** bin ich oft **hierhergekommen**\", sagte ich. \"**Wenn du die Augen halb schließt,** ist da kein Unterschied mehr zwischen Himmel und Meer und alles ist blau.\"\n\nElisabeth **lehnte ihren Kopf zurück,** schloss die Augen und sagte: \"Ich kann kaum glauben, dass du hier **aufgewachsen** bist. Das ist wie im **Paradies** hier!\"\n\n\"Vielleicht\", sagte ich. \"Aber das **Leben** hier ist sehr **eintönig.** Die meisten Leute sind **Bauern** oder **Fischer.** Der Tourismus ist die **einzig gute Einnahmequelle.** \"\n\n\"**Kannst du dir vorstellen, eines Tages** wieder **zurückzukehren?** \", fragte sie.\n\n\"Ich weiß nicht\", sagte ich. \"Wenn ich alt, **fett** und **reich** bin, vielleicht ...\"\n\nElisabeth **kicherte.** Wir saßen so **eine ganze Weile still nebeneinander.** Die leichten Wellen des Mittelmeers **schwappten gegen** den Bootssteg. Eine kleine **Brise wehte** über unsere **Gesichter** und die Sonne begann **langsam zu sinken.**\n\n\"Weißt du was?\", sagte Elisabeth und **schaute mich an.** \"Ich habe dich **ziemlich vermisst.** \"\n\nIch **blickte** in ihre grünen Augen. Das goldene **Licht** des **Sonnenuntergangs** glitzerte auf ihren Wangen. Ihre Lippen **glühten korallenrot.** Sie schloss die Augen. Unsere Gesichter **näherten sich.**\n\nDa hörten wir plötzlich einen **Schrei.** \"Sa'iduni!\", rief eine **Stimme.**\n\n\"Was war das?\", sagte Elisabeth. Wir hörten es **abermals.** Es **klang wie** eine Frauenstimme. Ich **stand auf.** Die untergehende Sonne **blendete** meine Sicht.\n\n\"**Siehst du etwas?** \", fragte ich und **legte** die Hand über meine Augen.\n\n\"Da!\", rief Elisabeth und zeigte auf das **offene** Meer. \"Wo?\", sagte ich. Ich **kniff die Augen zusammen.** Und da sah ich es. Ein paar Dutzend Meter vor dem Steg stand eine Frau in einem Schlauchboot. Das Boot schien bereits zur Hälfte mit Wasser **gefüllt.**\n\n\"Sa'iduni!\", rief die Frau und **ruderte mit den Armen.**\n\nIch nahm einen Rettungsring vom Steg und **schleuderte** ihn ins Meer. Die Frau **stürzte** aus dem Boot und **klammerte** sich an den Ring. Das Schlauchboot füllte sich **nun völlig** mit Wasser und begann zu sinken.\n\n\"**Schnell! Hol Hilfe!** \", sagte ich zu Elisabeth. Dann **sprang** ich ins Wasser.\n\n---\n\n## Übung\n\n**1. Was gibt es nicht zu essen?**\n\na) Reisbällchen\nb) Obstsalat\nc) Döner Kebab\n\n**2. Wie findet Elisabeth das Essen?**\n\na) sehr lecker\nb) sehr schlecht\nc) langweilig\n\n**3. Wie viel Grad ist es?**\n\na) über 30 °C\nb) circa 20 °C\nc) unter 10 °C\n\n**4. Dinos Mutter ist froh, wenn sie ...**\n\na) mittags ohne Schmerzen einschläft\nb) morgens ohne Schmerzen aufwacht\nc) abends ohne Schmerzen einschläft\n\n**5. Wie findet Dinos Mutter das Essen?**\n\na) sehr gut\nb) sehr schlecht\nc) nicht so gut\n\n**6. Wo ist die Tanzfläche?**\n\na) im Haus\nb) am Ufer\nc) im Garten\n\n**7. Warum gehen Elisabeth und Dino nicht tanzen?**\n\na) Es ist zu heiß.\nb) Die Tanzfläche ist zu voll.\nc) Sie haben zu viel getrunken.\n\n**8. Wohin führt Dino Elisabeth?**\n\na) in ein Bootshaus\nb) auf einen Bootssteg\nc) auf ein Motorboot\n\n**9. Was bedeutet \"eintönig\"?**\n\na) interessant\nb) dynamisch\nc) langweilig\n\n**10. Dino und Elisabeth hören plötzlich ...**\n\na) eine Sirene\nb) einen Schrei\nc) laute Musik\n\n**11. Dino wirft ... ins Meer.**\n\na) einen Rettungsring\nb) ein Schlauchboot\nc) eine Schwimmweste"},{"title":"🚨 Chapter 4: Die Rettung","content":"**Innerhalb von wenigen Minuten** war der Bootssteg voll mit Menschen. **Sogar** die Musiker der Band hatten ihre Instrumente **abgelegt** und beobachteten, wie ich die Frau an dem Rettungsring durch das Wasser **zog. Niemand gab einen Ton von sich.** Alfredo und Lorettas Vater **hievten** die Frau auf den Steg. Während ich an einer Leiter nach oben **kletterte, brach** sie auf den Holzplanken **zusammen.**\n\nSie war **nicht älter als** dreißig Jahre. Ihr Gesicht war **schneeweiß, gerahmt von** einem schwarzen **Kopftuch.** Auf der linken Wange hatte sie eine lange **Narbe.** Sie trug einen kleinen **Rucksack.**\n\n\"Ist **irgendjemand** hier ein **Arzt?** \", rief Alfredo. \"Loretta hat eine **Ausbildung zur Krankenschwester**\", sagte Lorettas Vater. \"**Wirklich?** \", sagte Alfredo. \"**Seit wann?** \"\n\n\"Wo ist sie?\", rief ich. Loretta **drängte** sich durch die Menschen. Sie trug noch immer ihr weißes **Brautkleid.** \"Legt sie auf den Rücken!\", rief sie und **kniete** sich neben die Frau. \"Und **nimm ihr den Rucksack ab!** \", sagte sie zu Alfredo.\n\nLoretta legte ihre Finger auf das **Handgelenk** der Frau und **suchte nach** einem Puls. Als Alfredo begann, den Rucksack von ihren Schultern zu **entfernen, öffnete** sie plötzlich die Augen und **ergriff** Alfredos Hände. \"No!\", rief sie. \"No take!\"\n\n\"Okay okay ...\", sagte Alfredo und hob die Hände **in die Luft.** \"**Schon gut!** \"\n\nDoch die Frau **schrie weiter.** \"**Gebt ihr Raum!** \", sagte Loretta und **scheuchte** die Schaulustigen mit einer Hand **beiseite.** \"Es gibt hier **nichts zu sehen.** Bitte geht zurück in den Garten!\"\n\nDie Hochzeitsgäste **verließen** langsam den Steg. Alfredo, Loretta, ihr Vater, Elisabeth und ich **blieben bei** der Frau. Die Sonne war **mittlerweile vollständig untergegangen.** Im Garten meiner Eltern **leuchteten** ein paar Fackeln. Auch die Band spielte wieder, aber **niemand** tanzte **mehr.**\n\nMeine Kleidung war **patschnass** und **es wurde kühler.** Elisabeth gab mir ein Handtuch. Loretta **wickelte** die Frau in eine **Decke.**\n\n\"**Wo kommen Sie her?** \", fragte ich die Frau auf Englisch. Sie **setzte sich aufrecht** und sagte **leise:** \"Chalab.\"\n\n\"Das ist der **arabische** Name für Aleppo!\", sagte Elisabeth. \"Eine **Stadt** in **Syrien** ...\"\n\n\"Aber was macht sie auf Sizilien?\", sagte ich. \"Syrien ist **mehr als Tausend Kilometer von hier entfernt!** \"\n\n\"**Ich nehme an,** sie ist von der **nordafrikanischen** Küste hierhergekommen\", sagte Lorettas Vater.\n\n\"In einem Schlauchboot?\", sagte ich. \"**Wohl kaum.** \"\n\nDie Frau folgte mit ängstlichen Augen unserer **Unterhaltung.** Da sagte Elisabeth etwas zu ihr in **gebrochenem** Arabisch. Die Frau lächelte **vorsichtig.** Elisabeth gab ihr die Hand und sie stand langsam auf. Alfredo und Lorettas Vater **stützten** sie und wir verließen **gemeinsam** den Steg.\n\n\"**Ich wusste nicht, dass** du Arabisch sprichst\", sagte ich zu Elisabeth **auf dem Rückweg** zum Haus.\n\n\"Ich habe ein paar **Stunden** in der Uni **genommen.** Nur absolute Grundlagen ...\", sagte sie. \"Aber ich habe **seit langem** eine Schwäche für **ägyptische Schmonzetten.** \"\n\nWir führten die Frau vorbei an den verwirrten **Blicken** der Gäste in das **Wohnzimmer** meiner Eltern. Dort setzten wir sie auf ein Sofa und gaben ihr etwas zu trinken.\n\n\"Was machen wir jetzt mit den Gästen?\", fragte Alfredo nach einer Weile.\n\n\"**Du hast Recht!** \", sagte Loretta. \"**Es wäre taktlos,** wenn wir jetzt **weiterfeiern.** \"\n\n\"Soll ich eine **Ankündigung machen?** \", fragte Lorettas Vater.\n\n\"Danke, John!\", sagte Alfredo. \"Aber Loretta und ich sollten es tun. **Immerhin** ist es unsere Hochzeit.\" Zu Elisabeth und mir sagte er: \"**Kommt ihr hier zurecht?** \"\n\nWir nickten. Loretta, Alfredo und John verließen das Wohnzimmer und ließen Elisabeth und mich mit der Frau alleine.\n\n\"Wie heißt du?\", fragte ich die Frau auf Englisch. \"Fadiyah\", **antwortete** sie.\n\nElisabeth sagte etwas auf Arabisch und Fadiyah erzählte eine Weile.\n\n\"Was hat sie gesagt?\", fragte ich.\n\n\"Sie ist aus **Tunesien** gekommen\", sagte Elisabeth. \"Sie war auf einem kleinen **Schiff** mit **vierzig** Personen. Aber es gab ein Problem mit dem Motor. Das Schiff ist auf einer **Insel** gestrandet. Ustica, **richtig?** \" Fadiyah nickte. \"Ah\", sagte ich. \"Das ist eine kleine Insel **nördlich von** Palermo.\"\n\n\"Sie sagt, die **Küstenwache** wollte die Menschen dort registrieren, aber sie ist **weggelaufen.** Dann hat sie in einem **Laden** ein kleines Schlauchboot **gekauft** und begann, nach Sizilien zu **paddeln**\", sagte Elisabeth.\n\n\"Was?\", sagte ich. \"Das ist **Wahnsinn!** Die **Strömungen** sind viel zu **stark!** \"\n\nFadiyah begann wieder zu **sprechen.** Elisabeth **übersetzte:** \"**Zuerst** ging es gut. Aber dann wurden meine Arme **schwach.** Ich **sah** das Land **vor mir,** aber das Boot füllte sich mit Wasser. Ich **betete zu Gott.** Alles schien **verloren.** Aber ihr habt mir das Leben **gerettet!** \"\n\n\"Aber warum?\", fragte ich sie auf Englisch. \"Warum bist du weggelaufen? Die Küstenwache wollte dir nur **helfen!** \"\n\nFadiyah schüttelte den Kopf und sagte in gebrochenem Englisch: \"Ich will nach Deutschland. Mein Bruder **wohnt** in München. Aber wenn die Italiener mich **registrieren, muss** ich in Italien **bleiben.** \"\n\nFadiyah gähnte. \"Sie ist **erschöpft** ...\", sagte Elisabeth.\n\nWir **brachten** ihr ein paar Kleider, ein **frisches** Handtuch, eine Zahnbürste, Zahnpasta und **zeigten** ihr das Badezimmer.\n\n\"Du kannst hier auf dem Sofa **schlafen**\", sagte ich. \"**Wenn du etwas brauchst,** wir sind **oben,** okay?\" Elisabeth übersetzte, Fadiyah nickte und wir verließen das Wohnzimmer.\n\n---\n\n## Übung\n\n**1. Fadiyah trägt ...**\n\na) ein schneeweißes Kopftuch\nb) einen alten Strohhut\nc) ein schwarzes Kopftuch\n\n**2. Warum ruft Alfredo nach einem Arzt?**\n\na) Fadiyah ist verwundet.\nb) Fadiyah ist zusammengebrochen.\nc) Fadiyah hat Fieber.\n\n**3. Wer hat eine Ausbildung zur Krankenschwester?**\n\na) Elisabeth\nb) Dinos Mutter\nc) Loretta\n\n**4. Woher kommt Fadiyah?**\n\na) aus Aleppo\nb) aus Damaskus\nc) aus Homs\n\n**5. Elisabeth mag ägyptische ...**\n\na) Filme\nb) Bücher\nc) Zeitungen\n\n**6. Fadiyah ist mit einem Schiff aus ... gekommen.**\n\na) Algerien\nb) Tunesien\nc) Libyen\n\n**7. Warum ist das Schiff auf Ustica gestrandet?**\n\na) Es war zu voll.\nb) Der Kapitän war betrunken.\nc) Es gab ein Problem mit dem Motor.\n\n**8. Warum ist Fadiyah alleine nach Sizilien gepaddelt?**\n\na) Die Küstenwache wollte sie registrieren.\nb) Die Polizei wollte sie festnehmen.\nc) Sie hat einen Bruder in Palermo.\n\n**9. Fadiyah will nicht registriert werden, weil ...**\n\na) sie dann in Deutschland bleiben darf.\nb) sie dann in Italien bleiben muss.\nc) sie dann nach Syrien zurück muss.\n\n**10. Fadiyah will zu ihrem ...**\n\na) Cousin in Berlin\nb) Vater in Hamburg\nc) Bruder in München"},{"title":"🌅 Chapter 5: Der Morgen danach","content":"Alfredo und Loretta hatten die Hochzeitsparty **frühzeitig beendet.** Die Gäste **stiegen** noch vor Mitternacht in ihre Mietwagen und fuhren zurück in ihre Hotels und **Ferienwohnungen.** Die Band **packte** ihre Instrumente und der Catering-Service **sammelte** das restliche Essen **ein.**\n\nAuch das Hochzeitspaar fuhr noch **am selben Abend** zum Flughafen. Alfredo hatte **Flitterwochen** auf den Malediven **gebucht.** Nach dem Vorfall mit Fadiyah war Loretta und Alfredos **Stimmung gedrückt,** aber ich glaube, sie waren irgendwie auch froh, die Insel zu **verlassen.**\n\nEs war sehr still in der Nacht. Bis auf das **Zirpen** der **Grillen** war kein **Geräusch** zu **hören.** Elisabeth und ich **schliefen** in meinem alten **Kinderzimmer** zwischen Guns N'Roses-Postern und **Stapeln** von alten Comics. Am Ende des Flurs wohnte Onkel Vincente in zwei großen Zimmern. Das Schlafzimmer meiner Eltern **befand sich** im Erdgeschoss.\n\n**Am nächsten Morgen erwachte** ich durch einen Schrei. Ich zog mir schnell etwas an, **rannte** die Treppen **herunter** und fand meinen Vater im Wohnzimmer. Er trug einen alten weißen **Bademantel** und stand verwirrt vor dem Sofa. Fadiyah hatte die Augen **weit aufgerissen.** Sie schüttelte den Kopf, **fuchtelte** mit den Armen und **redete** irgendetwas auf Arabisch.\n\n\"**Guten Morgen**, Papa\", sagte ich. \"**Was ist passiert?** \" Mein Vater **zuckte mit den Schultern** und sagte: \"**Keine Ahnung.** Ich habe gestern Abend das **Fußballspiel verpasst** und wollte gerade die Wiederholung gucken. Aber da **liegt** diese Frau auf dem Sofa!\"\n\n\"Das ist Fadiyah\", sagte ich. \"Hast du sie gestern Abend nicht gesehen?\"\n\n\"Ich weiß nicht\", sagte mein Vater. \"Es waren **so viele** Leute hier. Du weißt, **ich mag keine** Menschenmassen.\"\n\n\"Ja ... aber\", begann ich. \"Was hast du zu ihr gesagt?\"\n\n\"**Gar nichts**\", sagte mein Vater. \"Ich habe **bloß** ein bisschen ihre Schulter **geschüttelt.** Und plötzlich hat sie **geschrien wie am Spieß!** \"\n\n\"Sie ist ein **Flüchtling!** \", erklärte ich. \"Aus Syrien.\"\n\n\"**Na und?** \", sagte mein Vater. \"Ich bin doch kein **Unmensch!** \"\n\n\"Ähm, Papa\", sagte ich und zeigte auf seinen Bierbauch, der **aus** dem Bademantel **herausguckte.** \"Vielleicht solltest du dir **erst einmal** etwas anziehen.\"\n\n\"Pfft!\", sagte er. \"Jetzt sagt mir mein eigener Sohn, wie ich mich anziehen soll. In meinen **eigenen vier Wänden!** \" Er schüttelte den Kopf und verließ das Wohnzimmer.\n\nFadiyah **atmete auf.** \"**Keine Angst!** \", sagte ich auf Englisch. \"Das ist mein Vater. Er ist manchmal ein bisschen **schwierig,** aber er hat ein gutes **Herz.** \"\n\nFadiyah nickte. Dann wurde sie plötzlich unruhig. Sie fasste sich an die Schultern und sagte: \"Wo ist mein Rucksack?\"\n\n\"Hier!\", sagte ich und ging zum Fenster. \"Er war sehr **nass.** Wir haben ihn auf die Fensterbank gelegt, zum **Trocknen.** \"\n\nIch **gab** Fadiyah ihren Rucksack **zurück.** Er war noch immer **feucht. Sie ergriff** das Gepäckstück mit **beiden** Händen, öffnete den Reißverschluss und **nahm** eine kleine Plastiktüte **heraus.**\n\n\"Aufladen ...\", sagte sie. \"Telefon!\"\n\n\"Ah, verstehe!\", sagte ich und zeigte auf eine Steckdose hinter dem Sofa. \"Hier!\"\n\nAls Fadiyah ihr **Handy in** die Steckdose **steckte, erschien** Elisabeth im Wohnzimmer. \"Sabach el Cher!\", sagte sie. Fadiyah lächelte. \"Das bedeutet ,Guten Morgen' auf Arabisch\", sagte Elisabeth zu mir.\n\n\"**Angeberin!** \", sagte ich.\n\nDie beiden begannen eine kleine Unterhaltung. **Ich verstand kein Wort.** Nach einer Weile **betrat** Onkel Vincente das Wohnzimmer.\n\n\"Ein wunderschöner Tag!\", rief er und öffnete die **Vorhänge.** Die **Morgensonne flutete** in das Zimmer. \"Wer hat **Lust auf** Frühstück? Ich habe einen **Bärenhunger!** \"\n\nWenig später saßen wir alle am **Küchentisch:** Elisabeth, Fadiyah, meine Mutter, mein Vater und ich. Onkel Vincente stand am **Herd** und **briet** Würstchen und Spiegeleier. Wir aßen **warmes Weißbrot** mit Fetakäse und Oliven. Dazu tranken wir Kaffee und **frischgepressten O
