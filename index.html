ber sind beide Geschäftsleute.","Mr. Schmidt and Mr. Weber are both businessmen."],["Sie haben kleine Firmen in derselben Stadt.","They have small companies in the same city."],["Herr Schmidt ist sehr streng.","Mr. Schmidt is very strict."],["Alle Mitarbeiter haben Angst vor ihm.","All employees are afraid of him."],["Er kontrolliert alles und macht klare Regeln.","He controls everything and makes clear rules."],["Wenn jemand zu spät kommt, gibt es Probleme.","If someone comes late, there are problems."],["Die Mitarbeiter arbeiten hart, aber sie mögen ihren Chef nicht.","The employees work hard, but they do not like their boss."],["Sie haben trotzdem Respekt vor ihm.","Nevertheless, they respect him."],["Herr Weber ist ganz anders.","Mr. Weber is completely different."],["Er ist sehr nett und freundlich.","He is very nice and friendly."],["Er sagt immer: \"Kein Problem! Macht, was ihr wollt.\"","He always says: \"No problem! Do what you want.\""],["Die Mitarbeiter lieben ihren Chef.","The employees love their boss."],["Sie kommen oft zu spät oder machen Pausen.","They often come late or take breaks."],["Sie arbeiten nicht so gut.","They do not work as well."],["Herr Weber ist unzufrieden, aber er sagt nichts.","Mr. Weber is dissatisfied, but he says nothing."],["Eines Tages kommt eine große Krise.","One day a big crisis comes."],["Beide Firmen haben wenig Geld.","Both companies have little money."],["Herr Schmidt sagt zu seinen Mitarbeitern: \"Wir müssen jetzt alle hart arbeiten!\"","Mr. Schmidt says to his employees: \"We all have to work hard now!\""],["Die Mitarbeiter haben Angst und arbeiten sofort mehr.","The employees are afraid and immediately work more."],["Sie retten die Firma.","They save the company."],["Herr Weber sagt zu seinen Mitarbeitern: \"Bitte, helft mir!\"","Mr. Weber says to his employees: \"Please help me!\""],["Aber die Mitarbeiter lachen und machen weiter Pause.","But the employees laugh and continue taking breaks."],["Seine Firma geht fast kaputt.","His company almost goes bankrupt."],["Herr Weber lernt eine wichtige Lektion: Manchmal ist es besser, wenn die Menschen Respekt und ein bisschen Angst haben.","Mr. Weber learns an important lesson: Sometimes it is better when people have respect and a little fear."],["Zu viel Freundlichkeit ist nicht immer gut.","Too much friendliness is not always good."]],"vocab":[["der Geschäftsmann","businessman"],["die Firma","company"],["streng","strict"],["der Mitarbeiter","employee"],["die Angst","fear"],["kontrollieren","to control"],["die Regel","rule"],["hart","hard"],["der Respekt","respect"],["nett","nice"],["freundlich","friendly"],["unzufrieden","dissatisfied"],["die Krise","crisis"],["das Geld","money"],["retten","to save"],["kaputt gehen","to go bankrupt"],["die Freundlichkeit","friendliness"],["die Lektion","lesson"],["trotzdem","nevertheless"],["sofort","immediately"]],"speaking":[["Wie unterscheiden sich Herr Schmidt und Herr Weber?","Herr Schmidt ist streng, Herr Weber dagegen sehr freundlich und locker.","Mr. Schmidt is strict, while Mr. Weber is very friendly and relaxed."],["Warum arbeiten die Mitarbeiter bei Herrn Schmidt so hart?","Sie haben Angst vor ihm, aber sie respektieren ihn auch.","They are afraid of him, but they also respect him."],["Was passiert, als beide Firmen in eine Krise geraten?","Herr Schmidt fordert mehr Arbeit, während Herr Weber die Mitarbeiter um Hilfe bittet.","Mr. Schmidt demands more work, while Mr. Weber asks his employees for help."],["Wie reagieren die Mitarbeiter auf die Krise?","Bei Herrn Schmidt arbeiten sie sofort mehr; bei Herrn Weber machen sie weiter Pause.","At Mr. Schmidt’s company they work harder immediately; at Mr. Weber’s they keep taking breaks."],["Was lernt Herr Weber am Ende?","Er merkt, dass klare Regeln und Respekt manchmal wichtiger sind als zu viel Freundlichkeit.","He realizes that clear rules and respect can sometimes be more important than being too lenient."]],"wordCount":186},{"title":"Das kleine Haus und das große Glück 🏠","story":["Ein kluger Mann lebt in einem kleinen Haus am Rand der Stadt. Er hat nicht viel Geld, aber er ist zufrieden. Er lacht oft und hilft gerne den Nachbarn. Sein Nachbar wohnt in einem großen Haus. Er besitzt viele schöne Sachen, aber er ist unglücklich. Er will immer mehr haben. Eines Tages fragt er den zufriedenen Mann: \"Warum bist du sehr glücklich?\" Der Mann lächelt und antwortet: \"Glück kommt nicht von draußen. Es kommt von innen. Ich habe genug. Das ist mein Geheimnis.\" Der reiche Nachbar denkt lange nach. Er versteht: Er hat viel, aber er genießt nichts. Von nun an versucht er, die kleinen Dinge zu schätzen. Er lernt, dankbar zu sein. Jetzt ist er auch einfach zufrieden."],"translation":[["Ein kluger Mann lebt in einem kleinen Haus am Rand der Stadt.","A clever man lives in a small house on the edge of the city."],["Er hat nicht viel Geld, aber er ist zufrieden.","He does not have much money, but he is content."],["Er lacht oft und hilft gerne den Nachbarn.","He often laughs and gladly helps the neighbors."],["Sein Nachbar wohnt in einem großen Haus.","His neighbor lives in a large house."],["Er besitzt viele schöne Sachen, aber er ist unglücklich.","He owns many nice things, but he is unhappy."],["Er will immer mehr haben.","He always wants to have more."],["Eines Tages fragt er den zufriedenen Mann: \"Warum bist du sehr glücklich?\"","One day he asks the content man: \"Why are you so happy?\""],["Der Mann lächelt und antwortet: \"Glück kommt nicht von draußen.","The man smiles and answers: \"Happiness does not come from outside."],["Es kommt von innen.","It comes from within."],["Ich habe genug.","I have enough."],["Das ist mein Geheimnis.\"","That is my secret.\""],["Der reiche Nachbar denkt lange nach.","The rich neighbor thinks about it for a long time."],["Er versteht: Er hat viel, aber er genießt nichts.","He understands: He has a lot, but he enjoys nothing."],["Von nun an versucht er, die kleinen Dinge zu schätzen.","From then on he tries to appreciate the little things."],["Er lernt, dankbar zu sein.","He learns to be grateful."],["Jetzt ist er auch einfach zufrieden.","Now he is simply content too."]],"vocab":[["klug","clever, wise"],["zufrieden","content, satisfied"],["der Nachbar","neighbor"],["besitzen","to own, possess"],["unglücklich","unhappy"],["das Geheimnis","secret"],["reich","rich"],["genießen","to enjoy"],["schätzen","to appreciate"],["dankbar","grateful"],["einfach","simply"],["von nun an","from now on"],["draußen","outside"],["innen","inside"],["genug","enough"],["der Rand","edge, border"]],"speaking":[["Warum ist der Mann trotz seines kleinen Hauses glücklich?","Weil er zufrieden ist und die kleinen Dinge schätzt.","Because he is content and appreciates the little things."],["Warum ist sein reicher Nachbar unglücklich?","Weil er immer mehr haben will und nichts richtig genießt.","Because he always wants more and does not really enjoy what he has."],["Was fragt der Nachbar den Mann?","Er fragt, warum der Mann so glücklich ist.","He asks why the man is so happy."],["Was antwortet der Mann?","Er sagt, dass Glück von innen kommt und dass er genug hat.","He says that happiness comes from within and that he has enough."],["Was verändert sich beim Nachbarn?","Er beginnt, die kleinen Dinge zu schätzen und dankbar zu sein.","He starts appreciating the little things and being grateful."]],"wordCount":119},{"title":"Der kluge Hund und der faulende Bär 🐻🐕","story":["Ein kluger Hund und ein fauler Bär leben im Wald. Der Hund sammelt Beeren und Nüsse. Der Bär schläft oder spielt. Der Hund sagt: \"Winter kommt bald! Wir brauchen Vorräte.\" Der Bär lacht: \"Keine Sorge, es gibt genug.\" Der Winter kommt. Es schneit. Der Hund hat viel zu essen. Der Bär ist unglücklich, weil er nichts hat. Er friert und hat Hunger. Er bittet den Hund um Hilfe. Der Hund teilt sein Essen, weil der Bär hungrig ist. Der Bär ist dankbar. Der Hund sagt: \"Nächstes Jahr arbeiten wir zusammen.\" Der Bär versteht. Im Herbst hilft er dem Hund. Sie sammeln viele Vorräte. Beide haben genug. Sie sind Freunde und ein Team."],"translation":[["Ein kluger Hund und ein fauler Bär leben im Wald.","A clever dog and a lazy bear live in the forest."],["Der Hund sammelt Beeren und Nüsse.","The dog collects berries and nuts."],["Der Bär schläft oder spielt.","The bear sleeps or plays."],["Der Hund sagt: \"Winter kommt bald! Wir brauchen Vorräte.\"","The dog says: \"Winter is coming soon! We need supplies.\""],["Der Bär lacht: \"Keine Sorge, es gibt genug.\"","The bear laughs: \"No worries, there is enough.\""],["Der Winter kommt.","Winter comes."],["Es schneit.","It snows."],["Der Hund hat viel zu essen.","The dog has plenty to eat."],["Der Bär ist unglücklich, weil er nichts hat.","The bear is unhappy because he has nothing."],["Er friert und hat Hunger.","He is cold and hungry."],["Er bittet den Hund um Hilfe.","He asks the dog for help."],["Der Hund teilt sein Essen, weil der Bär hungrig ist.","The dog shares his food because the bear is hungry."],["Der Bär ist dankbar.","The bear is grateful."],["Der Hund sagt: \"Nächstes Jahr arbeiten wir zusammen.\"","The dog says: \"Next year we will work together.\""],["Der Bär versteht.","The bear understands."],["Im Herbst hilft er dem Hund.","In autumn he helps the dog."],["Sie sammeln viele Vorräte.","They collect many supplies."],["Beide haben genug.","Both have enough."],["Sie sind Freunde und ein Team.","They are friends and a team."]],"vocab":[["klug","clever, smart"],["faul","lazy"],["sammeln","to collect"],["die Beere","berry"],["die Nuss","nut"],["brauchen","to need"],["der Vorrat","supply (pl. Vorräte)"],["die Sorge","worry"],["schneien","to snow"],["unglücklich","unhappy"],["frieren","to freeze, be cold"],["der Hunger","hunger"],["bitten um","to ask for"],["teilen","to share"],["dankbar","grateful"],["verstehen","to understand"],["der Herbst","autumn"],["das Team","team"]],"speaking":[["Wer denkt früh an den Winter?","Der Hund denkt früh daran und sammelt Vorräte.","The dog thinks about it early and collects supplies."],["Warum hat der Bär im Winter Probleme?","Weil er vorher nichts gesammelt hat.","Because he did not collect anything beforehand."],["Wie hilft der Hund dem Bären?","Er teilt sein Essen mit ihm.","He shares his food with him."],["Was verspricht der Bär für das nächste Jahr?","Er will im Herbst mit dem Hund zusammenarbeiten.","He wants to work together with the dog in autumn."],["Wie endet die Geschichte?","Beide sammeln gemeinsam Vorräte und werden ein gutes Team.","They collect supplies together and become a good team."]],"wordCount":112},{"title":"Die zwei Töpfe","story":["Ein Mann hat zwei Töpfe. Einer ist neu und perfekt. Der andere ist alt und hat einen Riss. Der Mann trägt beide Töpfe jeden Tag zum Fluss, um Wasser zu holen. Der neue Topf ist stolz auf sich. Der alte Topf ist traurig, weil er viel Wasser verliert. Eines Tages sagt der alte Topf zu dem Mann: \"Ich bin nutzlos. Du solltest mich wegwerfen.\" Der Mann lächelt und antwortet: \"Schau auf den Weg neben dir! Siehst du die schönen Blumen? Sie wachsen nur auf deiner Seite.\" Der alte Topf schaut genau hin und versteht. Durch seinen Riss bewässert er die Blumen auf dem Weg. Jeder Topf hat seine eigene Stärke. Der alte Topf lernt, sich selbst zu akzeptieren. Er ist nicht mehr traurig."],"translation":[["Ein Mann hat zwei Töpfe.","A man has two pots."],["Einer ist neu und perfekt.","One is new and perfect."],["Der andere ist alt und hat einen Riss.","The other is old and has a crack."],["Der Mann trägt beide Töpfe jeden Tag zum Fluss, um Wasser zu holen.","Every day the man carries both pots to the river to fetch water."],["Der neue Topf ist stolz auf sich.","The new pot is proud of itself."],["Der alte Topf ist traurig, weil er viel Wasser verliert.","The old pot is sad because it loses a lot of water."],["Eines Tages sagt der alte Topf zu dem Mann: \"Ich bin nutzlos. Du solltest mich wegwerfen.\"","One day the old pot says to the man: \"I am useless. You should throw me away.\""],["Der Mann lächelt und antwortet: \"Schau auf den Weg neben dir! Siehst du die schönen Blumen? Sie wachsen nur auf deiner Seite.\"","The man smiles and answers: \"Look at the path next to you! Do you see the beautiful flowers? They grow only on your side.\""],["Der alte Topf schaut genau hin und versteht.","The old pot looks closely and understands."],["Durch seinen Riss bewässert er die Blumen auf dem Weg.","Through its crack, it waters the flowers along the path."],["Jeder Topf hat seine eigene Stärke.","Every pot has its own strength."],["Der alte Topf lernt, sich selbst zu akzeptieren.","The old pot learns to accept itself."],["Er ist nicht mehr traurig.","He is no longer sad."]],"vocab":[["der Topf","pot"],["der Riss","crack"],["der Fluss","river"],["holen","to fetch, get"],["stolz","proud"],["traurig","sad"],["verlieren","to lose"],["nutzlos","useless"],["wegwerfen","to throw away"],["der Weg","path, way"],["die Blume","flower"],["wachsen","to grow"],["die Seite","side"],["genau hin","closely, carefully"],["bewässern","to water"],["die Stärke","strength"],["akzeptieren","to accept"],["nicht mehr","no longer"]],"speaking":[["Warum ist der alte Topf traurig?","Weil er einen Riss hat und Wasser verliert.","Because it has a crack and loses water."],["Was möchte der alte Topf deshalb?","Er möchte weggeworfen werden, weil er sich für nutzlos hält.","It wants to be thrown away because it thinks it is useless."],["Was zeigt der Mann dem alten Topf?","Er zeigt ihm die schönen Blumen am Weg.","He shows it the beautiful flowers along the path."],["Warum wachsen die Blumen auf dieser Seite?","Weil das Wasser durch den Riss des alten Topfes auf den Weg tropft.","Because water leaks through the old pot’s crack onto that side of the path."],["Was lernt der alte Topf am Ende?","Er erkennt, dass auch seine Schwäche eine besondere Stärke sein kann.","It realizes that even its weakness can be a special strength."]],"wordCount":123},{"title":"Die Reise zur Heimatstadt ✈️","story":["Anna ist aufgeregt. Sie fliegt zum ersten Mal allein in ihre Heimatstadt. Am Flughafen zeigt sie einem erfahrenen Passagier ihre Flugkarte. \"Ist das der richtige Flug?\", fragt sie. Der Mann antwortet freundlich: \"Ja, aber Sie müssen beinahe rennen! Ihr Flug geht schon in 10 Minuten.\" Anna rennt und kommt gerade noch an. Im Flugzeug sitzt sie neben einem Reiseführer. Er empfiehlt ihr ein günstiges Restaurant. Anna vergisst, nach der Vorwahl zu fragen. Sie bittet den Reiseführer um Hilfe. Er stellt ihr sein Handy zur Verfügung. Vor allem ist sie dankbar, dass sie nicht umsonst gereist ist. Der Reiseführer ist stark und hilfsbereit. Anna nimmt seine Hilfe gerne an. Sie ist nicht mehr verschlafen."],"translation":[["Anna ist aufgeregt.","Anna is excited."],["Sie fliegt zum ersten Mal allein in ihre Heimatstadt.","She is flying to her hometown alone for the first time."],["Am Flughafen zeigt sie einem erfahrenen Passagier ihre Flugkarte.","At the airport she shows an experienced passenger her flight ticket."],["\"Ist das der richtige Flug?\", fragt sie.","\"Is that the right flight?\" she asks."],["Der Mann antwortet freundlich: \"Ja, aber Sie müssen beinahe rennen! Ihr Flug geht schon in 10 Minuten.\"","The man answers kindly: \"Yes, but you almost have to run! Your flight leaves in 10 minutes.\""],["Anna rennt und kommt gerade noch an.","Anna runs and arrives just in time."],["Im Flugzeug sitzt sie neben einem Reiseführer.","On the plane she sits next to a tour guide."],["Er empfiehlt ihr ein günstiges Restaurant.","He recommends an affordable restaurant to her."],["Anna vergisst, nach der Vorwahl zu fragen.","Anna forgets to ask for the area code."],["Sie bittet den Reiseführer um Hilfe.","She asks the tour guide for help."],["Er stellt ihr sein Handy zur Verfügung.","He makes his phone available to her."],["Vor allem ist sie dankbar, dass sie nicht umsonst gereist ist.","Above all, she is grateful that she did not travel for nothing."],["Der Reiseführer ist stark und hilfsbereit.","The tour guide is strong and helpful."],["Anna nimmt seine Hilfe gerne an.","Anna gladly accepts his help."],["Sie ist nicht mehr verschlafen.","She is no longer sleepy."]],"vocab":[["aufgeregt","excited"],["allein","alone"],["die Heimatstadt","hometown"],["der Flughafen","airport"],["die Flugkarte","flight ticket"],["erfahren","experienced"],["der Passagier","passenger"],["der Reiseführer","tour guide"],["antworten","to answer"],["freundlich","friendly"],["beinahe","almost"],["schon","already"],["empfohlen (empfehlen)","recommended (to recommend)"],["günstig","cheap, affordable"],["vergessen","to forget"],["die Vorwahl","area code"],["bitten","to ask (for)"],["die Hilfe","help"],["stellen","to provide, place"],["vor allem","above all"],["umsonst","for nothing, in vain"],["stark","strong"],["annehmen","to accept"],["verschlafen","sleepy, tired"]],"speaking":[["Warum ist Anna am Flughafen nervös?","Weil sie zum ersten Mal allein in ihre Heimatstadt fliegt.","Because she is flying to her hometown alone for the first time."],["Was sagt der erfahrene Passagier zu ihr?","Er sagt, dass sie beinahe rennen muss, weil ihr Flug bald geht.","He says she almost has to run because her flight is leaving soon."],["Wer hilft Anna später im Flugzeug?","Ein Reiseführer sitzt neben ihr und hilft ihr weiter.","A tour guide sits next to her and helps her."],["Was vergisst Anna zu fragen?","Sie vergisst, nach der Vorwahl zu fragen.","She forgets to ask for the area code."],["Wie endet die Reise für Anna?","Sie ist dankbar, nimmt die Hilfe gern an und fühlt sich wieder besser.","She is grateful, accepts the help gladly, and feels better again."]],"wordCount":113},{"title":"Der geduldige Mann und die lange Wartezeit ⏰","story":["Ein Mann kommt zum Arzt. Er hat starke Schmerzen und braucht Medizin. Aber der Arzt ist nicht da. Die Sprechstundenhilfe sagt, dass er warten muss. Der Mann ist ungeduldig, denn er hat keine Zeit. Er denkt, dass der Arzt ihn vergessen hat. Die Sprechstundenhilfe erklärt, dass der Arzt einen Notfall hat. Der Mann wartet, obwohl er aufgeregt ist. Er versteht, dass Geduld wichtig ist. Endlich kommt der Arzt. Er untersucht den Mann und verschreibt Medizin. Der Mann geht zur Apotheke. Die Medizin kostet nicht viel, weil sie günstig ist. Der Mann ist dankbar, dass er gesund wird. Er lernt, dass Warten manchmal notwendig ist, aber es lohnt sich."],"translation":[["Ein Mann kommt zum Arzt.","A man goes to the doctor."],["Er hat starke Schmerzen und braucht Medizin.","He has severe pain and needs medicine."],["Aber der Arzt ist nicht da.","But the doctor is not there."],["Die Sprechstundenhilfe sagt, dass er warten muss.","The receptionist says that he has to wait."],["Der Mann ist ungeduldig, denn er hat keine Zeit.","The man is impatient because he has no time."],["Er denkt, dass der Arzt ihn vergessen hat.","He thinks that the doctor has forgotten him."],["Die Sprechstundenhilfe erklärt, dass der Arzt einen Notfall hat.","The receptionist explains that the doctor has an emergency."],["Der Mann wartet, obwohl er aufgeregt ist.","The man waits even though he is anxious."],["Er versteht, dass Geduld wichtig ist.","He understands that patience is important."],["Endlich kommt der Arzt.","Finally the doctor arrives."],["Er untersucht den Mann und verschreibt Medizin.","He examines the man and prescribes medicine."],["Der Mann geht zur Apotheke.","The man goes to the pharmacy."],["Die Medizin kostet nicht viel, weil sie günstig ist.","The medicine does not cost much because it is inexpensive."],["Der Mann ist dankbar, dass er gesund wird.","The man is grateful that he will get better."],["Er lernt, dass Warten manchmal notwendig ist, aber es lohnt sich.","He learns that waiting is sometimes necessary, but it is worth it."]],"vocab":[["geduldig","patient"],["warten","to wait"],["der Arzt","doctor"],["stark","strong"],["der Schmerz","pain"],["die Medizin","medicine"],["die Sprechstundenhilfe","receptionist"],["ungeduldig","impatient"],["denn","because"],["der Notfall","emergency"],["obwohl","although"],["aufgeregt","excited, agitated"],["die Geduld","patience"],["untersuchen","to examine"],["verschreiben","to prescribe"],["die Apotheke","pharmacy"],["kosten","to cost"],["günstig","cheap, affordable"],["notwendig","necessary"],["sich lohnen","to be worth it"]],"speaking":[["Warum muss der Mann beim Arzt warten?","Weil der Arzt gerade einen Notfall hat.","Because the doctor is dealing with an emergency."],["Wie fühlt sich der Mann zuerst?","Er ist ungeduldig, weil er starke Schmerzen hat und keine Zeit hat.","He is impatient because he is in pain and has no time."],["Warum bleibt er trotzdem da?","Er versteht, dass der Arzt gerade einem Notfall helfen muss.","He understands that the doctor has to deal with an emergency."],["Was macht der Arzt schließlich?","Er untersucht den Mann und verschreibt ihm Medizin.","He examines the man and prescribes him medicine."],["Was lernt der Mann aus der Situation?","Er lernt, dass Warten manchmal notwendig ist und sich lohnen kann.","He learns that waiting is sometimes necessary and can be worthwhile."]],"wordCount":108},{"title":"Der ehrliche Freund und die Lüge 😌","story":["Maria und Lisa sind beste Freundinnen. Sie haben eine starke Beziehung. Eines Tages erzählt Lisa eine Lüge. Sie behauptet, dass sie Maria nicht gesehen hat. Maria ist verwirrt, denn sie weiß, dass Lisa lügt. Sie fragt: \"Warum sagst du nicht die Wahrheit?\" Lisa schweigt, obwohl sie die Antwort kennt. Sie hat Angst, dass Maria wütend wird. Aber Maria ist geduldig. Sie erklärt, dass Vertrauen wichtiger ist als Angst. Lisa weint und gesteht, dass sie die Wahrheit versteckt hat. Maria verzeiht ihr, weil sie eine echte Freundin ist. Lisa verspricht, dass sie nie wieder lügt. Die Freundinnen umarmen sich und bleiben zusammen. Sie lernen, dass Ehrlichkeit die beste Lösung ist."],"translation":[["Maria und Lisa sind beste Freundinnen.","Maria and Lisa are best friends."],["Sie haben eine starke Beziehung.","They have a strong relationship."],["Eines Tages erzählt Lisa eine Lüge.","One day Lisa tells a lie."],["Sie behauptet, dass sie Maria nicht gesehen hat.","She claims that she did not see Maria."],["Maria ist verwirrt, denn sie weiß, dass Lisa lügt.","Maria is confused because she knows that Lisa is lying."],["Sie fragt: \"Warum sagst du nicht die Wahrheit?\"","She asks: \"Why don't you tell the truth?\""],["Lisa schweigt, obwohl sie die Antwort kennt.","Lisa stays silent although she knows the answer."],["Sie hat Angst, dass Maria wütend wird.","She is afraid that Maria will become angry."],["Aber Maria ist geduldig.","But Maria is patient."],["Sie erklärt, dass Vertrauen wichtiger ist als Angst.","She explains that trust is more important than fear."],["Lisa weint und gesteht, dass sie die Wahrheit versteckt hat.","Lisa cries and confesses that she hid the truth."],["Maria verzeiht ihr, weil sie eine echte Freundin ist.","Maria forgives her because she is a true friend."],["Lisa verspricht, dass sie nie wieder lügt.","Lisa promises that she will never lie again."],["Die Freundinnen umarmen sich und bleiben zusammen.","The friends hug each other and stay together."],["Sie lernen, dass Ehrlichkeit die beste Lösung ist.","They learn that honesty is the best solution."]],"vocab":[["die Wahrheit","truth"],["die Lüge","lie"],["die Beziehung","relationship"],["beste","best"],["behaupten","to claim"],["verwirrt","confused"],["lügen","to lie"],["schweigen","to be silent"],["die Angst","fear"],["wütend","angry"],["geduldig","patient"],["das Vertrauen","trust"],["weinen","to cry"],["gestehen","to confess"],["verstecken","to hide"],["verzeihen","to forgive"],["echte","real, true"],["die Ehrlichkeit","honesty"],["die Lösung","solution"],["umarmen","to hug"],["bleiben","to stay"]],"speaking":[["Warum ist Maria zuerst enttäuscht von Lisa?","Weil Lisa lügt, obwohl Maria weiß, was wirklich passiert ist.","Because Lisa lies even though Maria knows what really happened."],["Warum sagt Lisa zunächst nicht die Wahrheit?","Sie hat Angst, dass Maria wütend wird.","She is afraid Maria will be angry."],["Wie reagiert Maria auf Lisas Angst?","Sie bleibt geduldig und erklärt, dass Vertrauen wichtig ist.","She stays patient and explains that trust is important."],["Was macht Lisa schließlich?","Sie gesteht die Wahrheit und verspricht, nicht wieder zu lügen.","She admits the truth and promises not to lie again."],["Was lernen die beiden Freundinnen?","Sie lernen, dass Ehrlichkeit die beste Lösung ist.","They learn that honesty is the best solution."]],"wordCount":109},{"title":"Die Nachbarin und das Vertrauen 🏠","story":["Frau Müller wohnt seit Jahren in ihrer Wohnung. Sie ist eine ältere Dame und lebt allein. Ihr neuer Nachbar, Herr Klein, ist sehr nett. Er bietet ihr oft Hilfe an. Eines Tages beginnt ein heftiger Sturm. Frau Müller hat Angst, weil ihr Fenster kaputt ist. Sie ruft Herrn Klein an. Er kommt sofort und repariert das Fenster. Frau Müller ist sehr erleichtert. Sie vertraut ihm nun vollkommen. Von nun an gehen sie jeden Sonntag zusammen spazieren. Sie unterhalten sich über das Wetter, den Beruf und die Familie. Herr Klein erzählt, dass seine Tochter in München studiert. Frau Müller lacht und sagt, dass sie früher auch dort gewohnt hat. Sie haben viel gemeinsam. Am Ende ist Frau Müller froh, dass sie einen vertrauenswürdigen Nachbarn hat."],"translation":[["Frau Müller wohnt seit Jahren in ihrer Wohnung.","Mrs. Müller has lived in her apartment for years."],["Sie ist eine ältere Dame und lebt allein.","She is an older woman and lives alone."],["Ihr neuer Nachbar, Herr Klein, ist sehr nett.","Her new neighbor, Mr. Klein, is very nice."],["Er bietet ihr oft Hilfe an.","He often offers her help."],["Eines Tages beginnt ein heftiger Sturm.","One day a severe storm begins."],["Frau Müller hat Angst, weil ihr Fenster kaputt ist.","Mrs. Müller is afraid because her window is broken."],["Sie ruft Herrn Klein an.","She calls Mr. Klein."],["Er kommt sofort und repariert das Fenster.","He comes immediately and repairs the window."],["Frau Müller ist sehr erleichtert.","Mrs. Müller is very relieved."],["Sie vertraut ihm nun vollkommen.","She now trusts him completely."],["Von nun an gehen sie jeden Sonntag zusammen spazieren.","From now on they go for a walk together every Sunday."],["Sie unterhalten sich über das Wetter, den Beruf und die Familie.","They talk about the weather, work and family."],["Herr Klein erzählt, dass seine Tochter in München studiert.","Mr. Klein says that his daughter studies in Munich."],["Frau Müller lacht und sagt, dass sie früher auch dort gewohnt hat.","Mrs. Müller laughs and says that she also lived there before."],["Sie haben viel gemeinsam.","They have a lot in common."],["Am Ende ist Frau Müller froh, dass sie einen vertrauenswürdigen Nachbarn hat.","In the end Mrs. Müller is happy that she has a trustworthy neighbor."]],"vocab":[["seit Jahren","for years"],["die Wohnung","apartment"],["älter","elderly, older"],["die Dame","lady"],["allein","alone"],["der Nachbar","neighbor"],["anbieten","to offer"],["heftig","heavy, severe"],["der Sturm","storm"],["kaputt","broken"],["anrufen","to call (on phone)"],["reparieren","to repair"],["erleichtert","relieved"],["vertrauen","to trust"],["vollkommen","completely"],["der Sonntag","Sunday"],["spazieren gehen","to go for a walk"],["sich unterhalten","to talk/converse"],["das Wetter","weather"],["der Beruf","profession/job"],["die Familie","family"],["die Tochter","daughter"],["studieren","to study (at university)"],["früher","earlier, before"],["gemeinsam","together, in common"],["froh","happy, glad"],["vertrauenswürdig","trustworthy"]],"speaking":[["Warum ruft Frau Müller Herrn Klein an?","Weil ihr Fenster während eines heftigen Sturms kaputtgeht.","Because her window breaks during a severe storm."],["Was macht Herr Klein für sie?","Er kommt sofort und repariert das Fenster.","He comes immediately and repairs the window."],["Wie verändert sich Frau Müllers Vertrauen?","Sie vertraut Herrn Klein danach vollkommen.","After that, she completely trusts Mr. Klein."],["Was machen die beiden von da an sonntags?","Sie gehen zusammen spazieren und unterhalten sich.","They go for walks together and talk."],["Warum ist Frau Müller am Ende froh?","Weil sie einen zuverlässigen und vertrauenswürdigen Nachbarn hat.","Because she has a reliable and trustworthy neighbor."]],"wordCount":124},{"title":"Die Überraschung 🎁","story":["Max will seiner Freundin eine Überraschung machen. Er überlegt, ob er einen Kuchen backen oder ein Geschenk basteln soll. Es kommt darauf an, wie viel Zeit er hat. Zurzeit hat er nicht viel Zeit, denn er arbeitet viel. Außerdem braucht er für den Kuchen viele Zutaten, einschließlich Mehl und Eier. Wenn er backt, muss er eine Stunde warten. Deshalb entscheidet er sich für das Geschenk. Er macht eine schöne Karte und schreibt einen netten Text. Allerdings ist die Karte etwas klein. Trotzdem ist sie persönlich und kreativ. Er schafft es, die Karte rechtzeitig fertig zu machen. Seine Freundin freut sich sehr. Sie findet, dass die Karte besser ist als ein Kuchen. Max ist glücklich."],"translation":[["Max will seiner Freundin eine Überraschung machen.","Max wants to surprise his girlfriend."],["Er überlegt, ob er einen Kuchen backen oder ein Geschenk basteln soll.","He considers whether he should bake a cake or make a gift."],["Es kommt darauf an, wie viel Zeit er hat.","It depends on how much time he has."],["Zurzeit hat er nicht viel Zeit, denn er arbeitet viel.","At the moment he does not have much time because he works a lot."],["Außerdem braucht er für den Kuchen viele Zutaten, einschließlich Mehl und Eier.","In addition, he needs many ingredients for the cake, including flour and eggs."],["Wenn er backt, muss er eine Stunde warten.","If he bakes, he has to wait an hour."],["Deshalb entscheidet er sich für das Geschenk.","Therefore he decides on the gift."],["Er macht eine schöne Karte und schreibt einen netten Text.","He makes a nice card and writes a kind message."],["Allerdings ist die Karte etwas klein.","However, the card is a little small."],["Trotzdem ist sie persönlich und kreativ.","Nevertheless, it is personal and creative."],["Er schafft es, die Karte rechtzeitig fertig zu machen.","He manages to finish the card on time."],["Seine Freundin freut sich sehr.","His girlfriend is very happy."],["Sie findet, dass die Karte besser ist als ein Kuchen.","She thinks the card is better than a cake."],["Max ist glücklich.","Max is happy."]],"vocab":[["es kommt darauf an","it depends","Ausdruck"],["zurzeit","currently, at the moment","Adverb"],["außerdem","furthermore, besides","Adverb"],["einschließlich","including","Präposition"],["wenn","if / when","Konjunktion"],["deshalb","therefore, that's why","Adverb"],["allerdings","however","Adverb"],["trotzdem","nevertheless","Adverb"],["überlegen","to consider, think about","Verb"],["ob","whether","Konjunktion"],["schaffen","to manage, to create","Verb"],["machen","to make, to do","Verb"],["basteln","to craft, to make (by hand)","Verb"],["backen","to bake","Verb"],["die Zutat","ingredient","Nomen"],["das Mehl","flour","Nomen"],["das Ei","egg","Nomen"],["die Karte","card","Nomen"],["der Text","text","Nomen"],["rechtzeitig","on time, in time","Adverb"],["persönlich","personal","Adjektiv"],["kreativ","creative","Adjektiv"],["finden (in this context)","to think / find (opinion)","Verb"]],"speaking":[["Was möchte Max für seine Freundin machen?","Er möchte ihr eine Überraschung machen.","He wants to surprise his girlfriend."],["Welche Idee hat er zuerst?","Er überlegt, ob er einen Kuchen backen oder ein Geschenk basteln soll.","He considers whether to bake a cake or make a gift."],["Warum entscheidet er sich gegen den Kuchen?","Weil er zurzeit wenig Zeit hat und der Kuchen viele Zutaten braucht.","Because he has little time and the cake needs many ingredients."],["Was macht Max stattdessen?","Er bastelt eine persönliche Karte und schreibt einen netten Text.","He makes a personal card and writes a nice message."],["Wie findet seine Freundin die Karte?","Sie findet, dass die Karte sogar besser ist als ein Kuchen.","She thinks the card is even better than a cake."]],"wordCount":114},{"title":"Der Umzug in die neue Stadt 🚚","story":["Laura zieht um. Sie fährt mit ihrem Auto in die neue Stadt. Ihre alte Wohnung ist ohne Balkon. Die neue Wohnung hat einen großen Balkon gegenüber dem Park. Laura stellt ihre Möbel in das Wohnzimmer und an die Wand. Sie hängt ein Bild über das Sofa und stellt eine Lampe neben den Tisch. Der Umzug dauert bis zum Abend. Sie ist müde, aber glücklich. Sie geht ohne ihre Freunde in ein Restaurant. Für das Essen bezahlt sie viel. Nach dem Essen spaziert sie durch die Stadt. Sie läuft an dem Fluss entlang und setzt sich auf eine Bank. Sie genießt die Ruhe. Seit heute hat sie ein neues Zuhause."],"translation":[["Laura zieht um.","Laura is moving."],["Sie fährt mit ihrem Auto in die neue Stadt.","She drives to the new city in her car."],["Ihre alte Wohnung ist ohne Balkon.","Her old apartment has no balcony."],["Die neue Wohnung hat einen großen Balkon gegenüber dem Park.","The new apartment has a large balcony opposite the park."],["Laura stellt ihre Möbel in das Wohnzimmer und an die Wand.","Laura puts her furniture in the living room and against the wall."],["Sie hängt ein Bild über das Sofa und stellt eine Lampe neben den Tisch.","She hangs a picture above the sofa and puts a lamp next to the table."],["Der Umzug dauert bis zum Abend.","The move lasts until the evening."],["Sie ist müde, aber glücklich.","She is tired but happy."],["Sie geht ohne ihre Freunde in ein Restaurant.","She goes to a restaurant without her friends."],["Für das Essen bezahlt sie viel.","She pays a lot for the food."],["Nach dem Essen spaziert sie durch die Stadt.","After the meal she walks through the city."],["Sie läuft an dem Fluss entlang und setzt sich auf eine Bank.","She walks along the river and sits on a bench."],["Sie genießt die Ruhe.","She enjoys the peace and quiet."],["Seit heute hat sie ein neues Zuhause.","Since today she has a new home."]],"vocab":[["der Umzug","move, moving"],["die Wohnung","apartment"],["der Balkon","balcony"],["die Möbel","furniture"],["das Wohnzimmer","living room"],["die Wand","wall"],["das Sofa","sofa"],["die Lampe","lamp"],["der Tisch","table"],["der Abend","evening"],["das Restaurant","restaurant"],["der Fluss","river"],["die Bank","bench"],["die Ruhe","peace, quiet"],["das Zuhause","home"],["bezahlen","to pay"],["spazieren","to stroll, walk"],["genießen","to enjoy"],["mit","with · Dativ"],["ohne","without · Akkusativ"],["gegenüber","opposite · Dativ"],["in","into · Akkusativ (Bewegung)"],["an","to/against · Akkusativ (Bewegung) / Dativ (Ort)"],["über","above/to · Akkusativ (Bewegung)"],["neben","next to · Akkusativ (Bewegung)"],["bis","until · Akkusativ"],["für","for · Akkusativ"],["nach","after · Dativ"],["durch","through · Akkusativ"],["entlang","along · Akkusativ"],["auf","onto · Akkusativ (Bewegung)"],["seit","since · Dativ"]],"speaking":[["Warum zieht Laura um?","Sie möchte in ihrer neuen Stadt ein neues Zuhause haben.","She wants a new home in her new city."],["Was fällt Laura an der neuen Wohnung besonders auf?","Der große Balkon gegenüber dem Park gefällt ihr.","She likes the big balcony opposite the park."],["Was macht sie, nachdem der Umzug geschafft ist?","Sie geht etwas essen und spaziert danach durch die Stadt.","She goes out to eat and then walks through the city."],["Wie fühlt sich Laura am Abend?","Sie ist müde, aber glücklich mit ihrem neuen Zuhause.","She is tired but happy with her new home."],["Was macht Laura bei ihrem Spaziergang?","Sie läuft am Fluss entlang, setzt sich auf eine Bank und genießt die Ruhe.","She walks along the river, sits on a bench and enjoys the quiet."]],"wordCount":135},{"title":"Inge und die neue Liebe 💕","story":["Inge ist eine ältere Dame. Ihr Mann Günther ist vor zwei Jahren gestorben. Sie waren nicht nur Ehepartner, sondern auch beste Freunde. Zuerst haben sie Freundschaft geschlossen und später haben sie sich verliebt. Sie hatten eine wunderbare Zeit zusammen. Inge war sehr glücklich. Sie haben erst 1993 geheiratet, weil sie sehr lange verlobt waren.","Eines Tages lernt Inge Jacques in einem Restaurant kennen. Er ist charmant und nett. Sie essen zusammen und unterhalten sich lange. Jacques erzählt, dass er geschieden ist. Er hatte viel Streit mit seiner Ex-Frau.","Inge denkt über eine neue Beziehung nach, obwohl sie noch trauert. Sie erinnert sich an Günthers Worte, dass das Leben weitergeht. Vielleicht ist es Zeit für einen Neuanfang."],"translation":[["Inge ist eine ältere Dame.","Inge is an elderly lady."],["Ihr Mann Günther ist vor zwei Jahren gestorben.","Her husband Günther died two years ago."],["Sie waren nicht nur Ehepartner, sondern auch beste Freunde.","They were not only spouses, but also best friends."],["Zuerst haben sie Freundschaft geschlossen und später haben sie sich verliebt.","First they became friends and later they fell in love."],["Sie hatten eine wunderbare Zeit zusammen.","They had a wonderful time together."],["Inge war sehr glücklich.","Inge was very happy."],["Sie haben erst 1993 geheiratet, weil sie sehr lange verlobt waren.","They only married in 1993 because they were engaged for a very long time."],["Eines Tages lernt Inge Jacques in einem Restaurant kennen.","One day Inge meets Jacques in a restaurant."],["Er ist charmant und nett.","He is charming and nice."],["Sie essen zusammen und unterhalten sich lange.","They eat together and talk for a long time."],["Jacques erzählt, dass er geschieden ist.","Jacques tells that he is divorced."],["Er hatte viel Streit mit seiner Ex-Frau.","He had a lot of arguments with his ex-wife."],["Inge denkt über eine neue Beziehung nach, obwohl sie noch trauert.","Inge thinks about a new relationship, although she is still grieving."],["Sie erinnert sich an Günthers Worte, dass das Leben weitergeht.","She remembers Günther's words that life goes on."],["Vielleicht ist es Zeit für einen Neuanfang.","Maybe it is time for a new beginning."]],"vocab":[["älter","elderly, older"],["die Dame","lady"],["sterben (ist gestorben)","to die"],["vor zwei Jahren","two years ago"],["nicht nur ... sondern auch","not only ... but also"],["der Ehepartner","spouse"],["die Freundschaft","friendship"],["schließen (geschlossen)","to close, to form"],["sich verlieben","to fall in love"],["heiraten","to marry"],["verlobt sein","to be engaged"],["kennenlernen","to get to know, to meet"],["charmant","charming"],["erzählen","to tell"],["geschieden","divorced"],["der Streit","argument, quarrel"],["die Ex-Frau","ex-wife"],["trauern","to grieve, mourn"],["sich erinnern an","to remember"],["das Leben","life"],["der Neuanfang","new beginning"],["weitergehen","to go on, continue"],["vielleicht","maybe"]],"speaking":[["Wer ist Inge?","Inge ist eine ältere Dame.","Inge is an elderly lady."],["Was ist mit Günther passiert?","Er ist vor zwei Jahren gestorben.","He died two years ago."],["Wie war die Beziehung zwischen Inge und Günther?","Sie waren nicht nur Ehepartner, sondern auch beste Freunde.","They were not only spouses, but also best friends."],["Wo lernt Inge Jacques kennen?","Sie lernt ihn in einem Restaurant kennen.","She meets him in a restaurant."],["Was denkt Inge am Ende über ihr Leben?","Sie denkt über einen Neuanfang und eine neue Beziehung nach.","She thinks about a new beginning and a new relationship."]],"wordCount":116,"grammar":{"title":"Präteritum von „sein“ und „haben“","text":"Im gesprochenen Deutsch benutzt man meist das Perfekt; „sein“ und „haben“ stehen aber oft im Präteritum: war, waren, hatte, hatten.","examples":["Inge war sehr glücklich.","Sie hatten eine wunderbare Zeit."]},"listening":[["vor zwei Jahren","two years ago","Ihr Mann ist vor zwei Jahren gestorben."],["geschieden","divorced","Jacques erzählt, dass er geschieden ist."],["trauern","to grieve","Inge trauert noch."],["weitergehen","to go on, continue","Das Leben geht weiter."]]},{"title":"Das Geheimnis im Film 🎥","story":["Ein Regisseur dreht einen neuen Film. Er sucht eine Schauspielerin für die Hauptrolle. Die Bewerbung von Lisa ist gut, aber der Regisseur hat Zweifel. Jemand sagt, dass Lisa nicht ehrlich ist. Sie hat in einem anderen Film eine Lüge erzählt. Der Regisseur ist verwirrt, denn die Lösung ist nicht einfach. Er ruft Lisas alten Kollegen an. Der Kollege erklärt, dass Lisa die Wahrheit gesagt hat. Der Regisseur ist erleichtert. Er lädt Lisa zum Vorsprechen ein. Sie spielt perfekt. Am Ende bekommt Lisa die Rolle. Sie ist glücklich, weil die Wahrheit gesiegt hat. Der Regisseur lernt, dass man nicht immer den Gerüchten glauben soll."],"translation":[["Ein Regisseur dreht einen neuen Film.","A director is making a new film."],["Er sucht eine Schauspielerin für die Hauptrolle.","He is looking for an actress for the main role."],["Die Bewerbung von Lisa ist gut, aber der Regisseur hat Zweifel.","Lisa's application is good, but the director has doubts."],["Jemand sagt, dass Lisa nicht ehrlich ist.","Someone says that Lisa is not honest."],["Sie hat in einem anderen Film eine Lüge erzählt.","She told a lie in another film."],["Der Regisseur ist verwirrt, denn die Lösung ist nicht einfach.","The director is confused, because the solution is not simple."],["Er ruft Lisas alten Kollegen an.","He calls Lisa's old colleague."],["Der Kollege erklärt, dass Lisa die Wahrheit gesagt hat.","The colleague explains that Lisa told the truth."],["Der Regisseur ist erleichtert.","The director is relieved."],["Er lädt Lisa zum Vorsprechen ein.","He invites Lisa to the audition."],["Sie spielt perfekt.","She plays perfectly."],["Am Ende bekommt Lisa die Rolle.","In the end, Lisa gets the role."],["Sie ist glücklich, weil die Wahrheit gesiegt hat.","She is happy because the truth has won."],["Der Regisseur lernt, dass man nicht immer den Gerüchten glauben soll.","The director learns that one should not always believe rumors."]],"vocab":[["der Regisseur","director"],["drehen","to shoot (a film)"],["die Schauspielerin","actress"],["die Hauptrolle","main role"],["die Bewerbung","application"],["die Zweifel","doubts"],["ehrlich","honest"],["die Lüge","lie"],["verwirrt","confused"],["die Lösung","solution"],["der Kollege","colleague"],["die Wahrheit","truth"],["erleichtert","relieved"],["einladen","to invite"],["das Vorsprechen","audition"],["perfekt","perfect"],["die Rolle","role"],["siegen","to win, to triumph"],["das Gerücht","rumor"],["glauben","to believe"]],"speaking":[["Was ist Lisas Problem?","Jemand sagt, dass sie nicht ehrlich ist.","Someone says that she is not honest."],["Was passiert am Ende?","Lisa bekommt die Rolle.","Lisa gets the role."],["Was lernt der Regisseur?","Man soll nicht immer den Gerüchten glauben.","One should not always believe rumors."]],"wordCount":103,"grammar":{"title":"Perfekt mit „sein“","text":"Bewegung oder eine Zustandsänderung nutzt oft „sein“ im Perfekt.","examples":["Ich bin nach Berlin gefahren.","Er ist gestern gekommen.","Wir sind durch den Park gelaufen."]}},{"title":"Die verlorene Erinnerung 🧠💭","story":["Ein alter Mann sitzt im Kino. Er sieht einen Liebesfilm. Plötzlich weint er, weil er sich an seine verstorbene Frau erinnert. Seine Enkelin fragt: \"Opa, warum weinst du?\" Der Mann erklärt, dass er viele Jahre glücklich war. Die Enkelin möchte die Geschichte hören. Der Opa erzählt von ihrer ersten Begegnung. Sie hatten wundervolle Momente. Die Enkelin ist berührt. Sie möchte den Film mit ihrem Opa zu Ende sehen. Am Ende sagt der Opa: \"Die Liebe ist stärker als der Tod.\" Die Enkelin versteht, dass wahre Gefühle niemals verschwinden. Sie umarmt ihren Opa und verspricht, immer für ihn da zu sein."],"translation":[["Ein alter Mann sitzt im Kino.","An old man sits in the cinema."],["Er sieht einen Liebesfilm.","He is watching a romantic film."],["Plötzlich weint er, weil er sich an seine verstorbene Frau erinnert.","Suddenly he cries because he remembers his deceased wife."],["Seine Enkelin fragt: \"Opa, warum weinst du?\"","His granddaughter asks: \"Grandpa, why are you crying?\""],["Der Mann erklärt, dass er viele Jahre glücklich war.","The man explains that he was happy for many years."],["Die Enkelin möchte die Geschichte hören.","The granddaughter wants to hear the story."],["Der Opa erzählt von ihrer ersten Begegnung.","The grandfather tells about their first meeting."],["Sie hatten wundervolle Momente.","They had wonderful moments."],["Die Enkelin ist berührt.","The granddaughter is moved."],["Sie möchte den Film mit ihrem Opa zu Ende sehen.","She wants to watch the film to the end with her grandfather."],["Am Ende sagt der Opa: \"Die Liebe ist stärker als der Tod.\"","At the end the grandfather says: \"Love is stronger than death.\""],["Die Enkelin versteht, dass wahre Gefühle niemals verschwinden.","The granddaughter understands that true feelings never disappear."],["Sie umarmt ihren Opa und verspricht, immer für ihn da zu sein.","She hugs her grandfather and promises to always be there for him."]],"vocab":[["das Kino","cinema"],["der Liebesfilm","romantic movie"],["weinen","to cry"],["sich erinnern an","to remember"],["verstorben","deceased"],["die Enkelin","granddaughter"],["die Begegnung","meeting, encounter"],["wundervoll","wonderful"],["der Moment","moment"],["berührt","moved, touched"],["zu Ende sehen","to watch until the end"],["der Tod","death"],["die Liebe","love"],["die Gefühle","feelings"],["verschwinden","to disappear"],["umarmen","to hug"],["versprechen","to promise"],["da sein","to be there"],["die Geschichte","story"]],"speaking":[["Warum weint der Mann?","Er erinnert sich an seine verstorbene Frau.","He remembers his deceased wife."],["Was erzählt der Opa?","Er erzählt von ihrer ersten Begegnung.","He tells about their first meeting."],["Was versteht die Enkelin?","Wahre Gefühle verschwinden nicht.","True feelings do not disappear."]],"wordCount":100,"grammar":{"title":"Präteritum der Modalverben","text":"Modalverben haben kurze Präteritumformen wie „musste“, „konnte“ und „wollte“.","examples":["Ich musste gestern arbeiten.","Sie konnte nicht kommen.","Wir wollten ins Kino gehen."]}},{"title":"Die falsche Identität 🎭🕵️","story":["Ein junger Mann will Schauspieler werden. Er bekommt eine Rolle als Detektiv. Im Film muss er einen Verbrecher finden. Die Dreharbeiten beginnen. Der Regisseur ist streng und die Schauspieler haben Respekt vor ihm. Eines Tages passiert etwas Seltsames. Ein fremder Mann betritt das Set. Er behauptet, der echte Detektiv zu sein. Alle sind schockiert, denn sie kennen diesen Mann nicht. Der junge Schauspieler muss entscheiden, wem er glaubt. Er fragt den Regisseur um Rat. Der Regisseur ruft die Polizei. Es stellt sich heraus, dass der Mann ein Fan ist. Der Schauspieler lernt, dass man immer vorsichtig sein sollte."],"translation":[["Ein junger Mann will Schauspieler werden.","A young man wants to become an actor."],["Er bekommt eine Rolle als Detektiv.","He gets a role as a detective."],["Im Film muss er einen Verbrecher finden.","In the film he has to find a criminal."],["Die Dreharbeiten beginnen.","The filming begins."],["Der Regisseur ist streng und die Schauspieler haben Respekt vor ihm.","The director is strict and the actors have respect for him."],["Eines Tages passiert etwas Seltsames.","One day something strange happens."],["Ein fremder Mann betritt das Set.","A strange man enters the set."],["Er behauptet, der echte Detektiv zu sein.","He claims to be the real detective."],["Alle sind schockiert, denn sie kennen diesen Mann nicht.","Everyone is shocked because they do not know this man."],["Der junge Schauspieler muss entscheiden, wem er glaubt.","The young actor has to decide who he believes."],["Er fragt den Regisseur um Rat.","He asks the director for advice."],["Der Regisseur ruft die Polizei.","The director calls the police."],["Es stellt sich heraus, dass der Mann ein Fan ist.","It turns out that the man is a fan."],["Der Schauspieler lernt, dass man immer vorsichtig sein sollte.","The actor learns that one should always be careful."]],"vocab":[["die Identität","identity"],["der Detektiv","detective"],["der Verbrecher","criminal"],["die Dreharbeiten","filming, shooting"],["seltsam","strange"],["fremd","strange, foreign"],["betreten","to enter"],["das Set","set (film set)"],["behaupten","to claim"],["echt","real, genuine"],["schockiert","shocked"],["entscheiden","to decide"],["der Rat","advice"],["die Polizei","police"],["sich herausstellen","to turn out"],["der Fan","fan"],["vorsichtig","careful"]],"speaking":[["Wer betritt das Set?","Ein fremder Mann betritt das Set.","A strange man enters the set."],["Was macht der Regisseur?","Er ruft die Polizei.","He calls the police."],["Was stellt sich heraus?","Der Mann ist ein Fan.","The man is a fan."]],"wordCount":98,"grammar":{"title":"Lokale Präpositionen","text":"Bei „Wo?“ steht oft Dativ, bei Bewegung mit „Wohin?“ Akkusativ.","examples":["Er sitzt im Kino.","Er geht ins Kino.","Das Buch liegt auf dem Tisch."]}},{"title":"Die große Enttäuschung 😔🎬","story":["Eine berühmte Schauspielerin erfährt, dass sie ihre Traumrolle verliert. Ein anderer Star bekommt die Hauptrolle. Sie ist sehr traurig und fühlt sich betrogen. Ihr Freund versucht, sie zu trösten. Nachdem sie eine Woche geweint hat, entscheidet sie sich, nicht aufzugeben. Bevor sie eine neue Rolle sucht, macht sie eine Pause. Sie reist ans Meer, um neue Kraft zu schöpfen. Als sie zurückkommt, ist sie optimistisch. Sie bewirbt sich für einen unabhängigen Film. Der Regisseur ist begeistert von ihr. Sie bekommt die Rolle und ist wieder glücklich. Sie versteht, dass Enttäuschungen manchmal zu besseren Chancen führen."],"translation":[["Eine berühmte Schauspielerin erfährt, dass sie ihre Traumrolle verliert.","A famous actress learns that she is losing her dream role."],["Ein anderer Star bekommt die Hauptrolle.","Another star gets the main role."],["Sie ist sehr traurig und fühlt sich betrogen.","She is very sad and feels betrayed."],["Ihr Freund versucht, sie zu trösten.","Her friend tries to comfort her."],["Nachdem sie eine Woche geweint hat, entscheidet sie sich, nicht aufzugeben.","After she cried for a week, she decides not to give up."],["Bevor sie eine neue Rolle sucht, macht sie eine Pause.","Before she looks for a new role, she takes a break."],["Sie reist ans Meer, um neue Kraft zu schöpfen.","She travels to the sea to gather new strength."],["Als sie zurückkommt, ist sie optimistisch.","When she returns, she is optimistic."],["Sie bewirbt sich für einen unabhängigen Film.","She applies for an independent film."],["Der Regisseur ist begeistert von ihr.","The director is enthusiastic about her."],["Sie bekommt die Rolle und ist wieder glücklich.","She gets the role and is happy again."],["Sie versteht, dass Enttäuschungen manchmal zu besseren Chancen führen.","She understands that disappointments sometimes lead to better chances."]],"vocab":[["berühmt","famous"],["die Enttäuschung","disappointment"],["erfahren","to learn, to find out"],["die Traumrolle","dream role"],["betrogen","betrayed"],["trösten","to comfort"],["aufgeben","to give up"],["die Pause","break, pause"],["reisen","to travel"],["das Meer","sea"],["die Kraft","strength"],["schöpfen","to gather"],["zurückkommen","to return"],["optimistisch","optimistic"],["sich bewerben für","to apply for"],["unabhängig","independent"],["begeistert","enthusiastic"],["die Chance","chance, opportunity"],["führen zu","to lead to"]],"speaking":[["Was verliert die Schauspielerin?","Sie verliert ihre Traumrolle.","She loses her dream role."],["Was macht sie nach der Enttäuschung?","Sie reist ans Meer und bewirbt sich später für einen Film.","She travels to the sea and later applies for a film."],["Wie endet die Geschichte?","Sie bekommt die Rolle und ist wieder glücklich.","She gets the role and is happy again."]],"wordCount":95,"grammar":{"title":"Temporale Nebensätze","text":"„nachdem“, „bevor“ und „als“ schicken das Verb ans Ende.","examples":["Nachdem sie geweint hat, entscheidet sie sich.","Bevor sie sucht, macht sie eine Pause.","Als sie zurückkommt, ist sie optimistisch."]}},{"title":"Die beste Freundin 👯💔","story":["Zwei Schauspielerinnen sind beste Freundinnen. Sie arbeiten oft zusammen im Film. Die eine ist talentiert und die andere ist fleißig. Eines Tages bekommt die fleißige Freundin einen großen Preis. Die talentierte Freundin ist neidisch, aber sie zeigt es nicht. Sie lächelt und gratuliert. Später spricht sie mit ihrem Therapeuten. Der Therapeut erklärt, dass Neid ein normales Gefühl ist. Die Freundin versteht, dass sie nicht perfekt sein muss. Sie entscheidet sich, offen mit ihrer Freundin zu reden. Die Freundin versteht die Situation. Ihre Freundschaft wird noch stärker als vorher. Am Ende lernen beide, dass Ehrlichkeit der beste Weg ist."],"translation":[["Zwei Schauspielerinnen sind beste Freundinnen.","Two actresses are best friends."],["Sie arbeiten oft zusammen im Film.","They often work together in films."],["Die eine ist talentiert und die andere ist fleißig.","One is talented and the other is hardworking."],["Eines Tages bekommt die fleißige Freundin einen großen Preis.","One day the hardworking friend gets a big prize."],["Die talentierte Freundin ist neidisch, aber sie zeigt es nicht.","The talented friend is jealous, but she does not show it."],["Sie lächelt und gratuliert.","She smiles and congratulates."],["Später spricht sie mit ihrem Therapeuten.","Later she speaks with her therapist."],["Der Therapeut erklärt, dass Neid ein normales Gefühl ist.","The therapist explains that envy is a normal feeling."],["Die Freundin versteht, dass sie nicht perfekt sein muss.","The friend understands that she does not have to be perfect."],["Sie entscheidet sich, offen mit ihrer Freundin zu reden.","She decides to speak openly with her friend."],["Die Freundin versteht die Situation.","The friend understands the situation."],["Ihre Freundschaft wird noch stärker als vorher.","Their friendship becomes even stronger than before."],["Am Ende lernen beide, dass Ehrlichkeit der beste Weg ist.","In the end both learn that honesty is the best way."]],"vocab":[["die Schauspielerin","actress"],["talentiert","talented"],["fleißig","hardworking"],["der Preis","prize, award"],["neidisch","jealous, envious"],["lächeln","to smile"],["gratulieren","to congratulate"],["der Therapeut","therapist"],["der Neid","envy, jealousy"],["das Gefühl","feeling"],["perfekt","perfect"],["offen","open"],["die Situation","situation"],["die Freundschaft","friendship"],["stärker","stronger"],["vorher","before"],["der Weg","way, path"]],"speaking":[["Was bekommen die Freundinnen?","Eine Freundin bekommt einen großen Preis.","One friend receives a big prize."],["Worüber spricht die talentierte Freundin mit ihrem Therapeuten?","Über Neid und ihre Gefühle.","About envy and her feelings."],["Was lernen beide?","Ehrlichkeit ist der beste Weg.","Honesty is the best way."]],"wordCount":98,"grammar":{"title":"Finalsatz mit „um ... zu“","text":"„um ... zu“ zeigt einen Zweck: etwas wird gemacht, um ein Ziel zu erreichen.","examples":["Ich lerne Deutsch, um in Deutschland zu arbeiten.","Ich gehe zur Bank, um Geld abzuheben."]}},{"title":"Der beste Schauspieler 🏆🎭","story":["Ein junger Schauspieler träumt von einer Karriere. Er ist gut, aber er ist nicht der Beste. Sein Kollege ist viel erfahrener und erfolgreicher. Der junge Schauspieler trainiert jeden Tag. Nach einem Jahr ist er besser. Er spielt in einem großen Film mit. Die Kritiker finden, dass seine Leistung beeindruckend ist. Der Regisseur ist sehr zufrieden. Der junge Schauspieler wird berühmt. Er vergisst aber seine Freunde nicht. Er hilft jungen Talenten, weil er weiß, wie schwer der Weg ist. Am Ende sagt er: \"Der beste Schauspieler ist nicht der, der am meisten Erfolg hat, sondern der, der niemals aufgibt.\" Seine Geschichte ist eine Inspiration für viele."],"translation":[["Ein junger Schauspieler träumt von einer Karriere.","A young actor dreams of a career."],["Er ist gut, aber er ist nicht der Beste.","He is good, but he is not the best."],["Sein Kollege ist viel erfahrener und erfolgreicher.","His colleague is much more experienced and successful."],["Der junge Schauspieler trainiert jeden Tag.","The young actor trains every day."],["Nach einem Jahr ist er besser.","After a year he is better."],["Er spielt in einem großen Film mit.","He plays in a big film."],["Die Kritiker finden, dass seine Leistung beeindruckend ist.","The critics find that his performance is impressive."],["Der Regisseur ist sehr zufrieden.","The director is very satisfied."],["Der junge Schauspieler wird berühmt.","The young actor becomes famous."],["Er vergisst aber seine Freunde nicht.","But he does not forget his friends."],["Er hilft jungen Talenten, weil er weiß, wie schwer der Weg ist.","He helps young talents because he knows how difficult the path is."],["Am Ende sagt er: \"Der beste Schauspieler ist nicht der, der am meisten Erfolg hat, sondern der, der niemals aufgibt.\"","In the end he says: \"The best actor is not the one who has the most success, but the one who never gives up.\""],["Seine Geschichte ist eine Inspiration für viele.","His story is an inspiration for many."]],"vocab":[["träumen von","to dream of"],["die Karriere","career"],["erfahren","experienced"],["erfolgreich","successful"],["trainieren","to train"],["der Kritiker","critic"],["die Leistung","performance, achievement"],["beeindruckend","impressive"],["zufrieden","satisfied"],["berühmt","famous"],["vergessen","to forget"],["das Talent","talent"],["schwer","difficult"],["der Erfolg","success"],["aufgeben","to give up"],["die Inspiration","inspiration"],["niemals","never"]],"speaking":[["Wer ist erfahrener?","Sein Kollege ist erfahrener.","His colleague is more experienced."],["Was macht der junge Schauspieler jeden Tag?","Er trainiert jeden Tag.","He trains every day."],["Was ist seine wichtigste Lektion?","Der beste Schauspieler ist der, der niemals aufgibt.","The best actor is the one who never gives up."]],"wordCount":105,"grammar":{"title":"Komparativ & Superlativ","text":"Komparativ vergleicht zwei Dinge; Superlativ zeigt die höchste Stufe.","examples":["besser als","am besten","der beste Schauspieler"]}},{"title":"Die schwierige Entscheidung 🤔⚖️","story":["Ein Filmproduzent muss eine wichtige Entscheidung treffen. Er hat zwei Drehbücher. Das eine ist spannend und das andere ist romantisch. Er kann sich nicht entscheiden. Sein Partner gibt ihm einen guten Rat. Der Produzent denkt lange nach. Er möchte einen Film machen, der die Zuschauer berührt. Nach vielen Diskussionen entscheidet er sich für das romantische Drehbuch. Der Film wird ein großer Erfolg. Die Kritiker sind begeistert. Der Produzent lernt, dass manchmal das Herz wichtiger ist als der Verstand. Er weiß jetzt, dass Emotionen und Gefühle für die Kunst entscheidend sind. Seine nächsten Filme werden noch erfolgreicher."],"translation":[["Ein Filmproduzent muss eine wichtige Entscheidung treffen.","A film producer has to make an important decision."],["Er hat zwei Drehbücher.","He has two scripts."],["Das eine ist spannend und das andere ist romantisch.","One is exciting and the other is romantic."],["Er kann sich nicht entscheiden.","He cannot decide."],["Sein Partner gibt ihm einen guten Rat.","His partner gives him good advice."],["Der Produzent denkt lange nach.","The producer thinks for a long time."],["Er möchte einen Film machen, der die Zuschauer berührt.","He wants to make a film that touches the audience."],["Nach vielen Diskussionen entscheidet er sich für das romantische Drehbuch.","After many discussions he decides on the romantic script."],["Der Film wird ein großer Erfolg.","The film becomes a big success."],["Die Kritiker sind begeistert.","The critics are enthusiastic."],["Der Produzent lernt, dass manchmal das Herz wichtiger ist als der Verstand.","The producer learns that sometimes the heart is more important than the mind."],["Er weiß jetzt, dass Emotionen und Gefühle für die Kunst entscheidend sind.","He now knows that emotions and feelings are decisive for art."],["Seine nächsten Filme werden noch erfolgreicher.","His next films will be even more successful."]],"vocab":[["der Filmproduzent","film producer"],["die Entscheidung","decision"],["treffen","to make (a decision)"],["das Drehbuch","script, screenplay"],["spannend","exciting, thrilling"],["romantisch","romantic"],["sich entscheiden","to decide"],["der Partner","partner"],["der Rat","advice"],["nachdenken","to think, reflect"],["die Zuschauer","audience, viewers"],["berühren","to touch, move"],["die Diskussion","discussion"],["der Erfolg","success"],["begeistert","enthusiastic"],["das Herz","heart"],["der Verstand","mind, intellect"],["die Emotion","emotion"],["die Kunst","art"],["entscheidend","decisive, crucial"]],"speaking":[["Worin liegt die Entscheidung?","Der Produzent wählt zwischen einem spannenden und einem romantischen Drehbuch.","The producer chooses between an exciting and a romantic script."],["Was macht der Film?","Er wird ein großer Erfolg.","It becomes a big success."],["Was lernt der Produzent?","Manchmal ist das Herz wichtiger als der Verstand.","Sometimes the heart is more important than the mind."]],"wordCount":96,"grammar":{"title":"Adjektivdeklination im Nominativ","text":"Adjektive vor Nomen können sich im Nominativ ändern.","examples":["der große Erfolg","ein großer Erfolg","gute Freunde"]}},{"title":"Das Geständnis 🗣️😢","story":["Ein berühmter Regisseur macht einen Kriminalfilm. Er hat ein Geheimnis. Vor vielen Jahren hat er einen Fehler gemacht. Er hat seinem Freund nicht geholfen. Jetzt fühlt er sich schuldig. Sein Gewissen belastet ihn. Eines Tages trifft er seinen alten Freund wieder. Er gesteht ihm seine Schuld. Der Freund ist überrascht, aber er verzeiht. Der Regisseur fühlt sich erleichtert. Er ändert das Ende seines Films. Jetzt zeigt der Film, wie wichtig Vergebung ist. Die Zuschauer sind begeistert. Der Regisseur sagt: \"Die Wahrheit macht frei.\" Seine Geschichte lehrt uns, dass Ehrlichkeit die beste Lösung ist. Das Geständnis war schwer, aber notwendig."],"translation":[["Ein berühmter Regisseur macht einen Kriminalfilm.","A famous director is making a crime film."],["Er hat ein Geheimnis.","He has a secret."],["Vor vielen Jahren hat er einen Fehler gemacht.","Many years ago he made a mistake."],["Er hat seinem Freund nicht geholfen.","He did not help his friend."],["Jetzt fühlt er sich schuldig.","Now he feels guilty."],["Sein Gewissen belastet ihn.","His conscience burdens him."],["Eines Tages trifft er seinen alten Freund wieder.","One day he meets his old friend again."],["Er gesteht ihm seine Schuld.","He confesses his guilt to him."],["Der Freund ist überrascht, aber er verzeiht.","The friend is surprised, but he forgives."],["Der Regisseur fühlt sich erleichtert.","The director feels relieved."],["Er ändert das Ende seines Films.","He changes the ending of his film."],["Jetzt zeigt der Film, wie wichtig Vergebung ist.","Now the film shows how important forgiveness is."],["Die Zuschauer sind begeistert.","The audience is enthusiastic."],["Der Regisseur sagt: \"Die Wahrheit macht frei.\"","The director says: \"The truth sets you free.\""],["Seine Geschichte lehrt uns, dass Ehrlichkeit die beste Lösung ist.","His story teaches us that honesty is the best solution."],["Das Geständnis war schwer, aber notwendig.","The confession was difficult, but necessary."]],"vocab":[["das Geständnis","confession"],["der Kriminalfilm","crime film"],["das Geheimnis","secret"],["der Fehler","mistake"],["schuldig","guilty"],["das Gewissen","conscience"],["belasten","to burden"],["gestehen","to confess"],["die Schuld","guilt"],["überrascht","surprised"],["verzeihen","to forgive"],["erleichtert","relieved"],["ändern","to change"],["das Ende","ending"],["die Vergebung","forgiveness"],["die Wahrheit","truth"],["frei","free"],["lehren","to teach"],["notwendig","necessary"]],"speaking":[["Was belastet den Regisseur?","Sein Gewissen belastet ihn.","His conscience burdens him."],["Was gesteht er?","Er gesteht seine Schuld.","He confesses his guilt."],["Was zeigt der Film?","Er zeigt, wie wichtig Vergebung ist.","It shows how important forgiveness is."]],"wordCount":99,"grammar":{"title":"Kausale Nebensätze mit „weil“ & „da“","text":"„weil“ und „da“ bedeuten „because“; das Verb steht am Ende.","examples":["Ich bleibe zu Hause, weil es regnet.","Da sie krank ist, kommt sie nicht."]}},{"title":"Der letzte Film 🎬👋","story":["Ein alter Regisseur dreht seinen letzten Film. Er ist krank, aber er gibt nicht auf. Der Film handelt von einem Mann, der seine große Liebe sucht. Der Regisseur arbeitet mit jungen Schauspielern. Sie lernen viel von ihm. Während der Dreharbeiten wird der Regisseur schwächer. Er kann nicht mehr stehen. Die Schauspieler sind besorgt. Der Regisseur lächelt und sagt: \"Macht weiter!\" Nach dem letzten Drehtag stirbt der Regisseur. Sein Film wird ein Meisterwerk. Die Schauspieler sind traurig, aber sie sind auch dankbar. Sie haben von einem großen Künstler gelernt. Der Film gewinnt viele Preise. Alle erinnern sich an den Regisseur."],"translation":[["Ein alter Regisseur dreht seinen letzten Film.","An old director is shooting his last film."],["Er ist krank, aber er gibt nicht auf.","He is sick, but he does not give up."],["Der Film handelt von einem Mann, der seine große Liebe sucht.","The film is about a man who is looking for his great love."],["Der Regisseur arbeitet mit jungen Schauspielern.","The director works with young actors."],["Sie lernen viel von ihm.","They learn a lot from him."],["Während der Dreharbeiten wird der Regisseur schwächer.","During the filming, the director becomes weaker."],["Er kann nicht mehr stehen.","He cannot stand anymore."],["Die Schauspieler sind besorgt.","The actors are worried."],["Der Regisseur lächelt und sagt: \"Macht weiter!\"","The director smiles and says: \"Keep going!\""],["Nach dem letzten Drehtag stirbt der Regisseur.","After the last day of shooting, the director dies."],["Sein Film wird ein Meisterwerk.","His film becomes a masterpiece."],["Die Schauspieler sind traurig, aber sie sind auch dankbar.","The actors are sad, but they are also grateful."],["Sie haben von einem großen Künstler gelernt.","They have learned from a great artist."],["Der Film gewinnt viele Preise.","The film wins many prizes."],["Alle erinnern sich an den Regisseur.","Everyone remembers the director."]],"vocab":[["der letzte","last"],["krank","sick"],["aufgeben","to give up"],["handeln von","to be about"],["die Liebe","love"],["suchen","to search for"],["während","during"],["schwächer","weaker"],["stehen","to stand"],["besorgt","worried"],["weiter","further, continue"],["der Drehtag","shooting day"],["sterben","to die"],["das Meisterwerk","masterpiece"],["traurig","sad"],["dankbar","grateful"],["der Künstler","artist"],["gewinnen","to win"],["sich erinnern an","to remember"],["der Preis","prize, award"]],"speaking":[["Was macht der Regisseur?","Er dreht seinen letzten Film.","He is shooting his last film."],["Was passiert während der Dreharbeiten?","Der Regisseur wird schwächer.","The director becomes weaker."],["Was passiert nach dem letzten Drehtag?","Der Regisseur stirbt.","The director dies."]],"wordCount":99,"grammar":{"title":"Temporale Präpositionen","text":"Zeitpräpositionen zeigen Beziehungen wie vor, nach, während und seit.","examples":["Vor dem Film.","Nach dem Film.","Während der Dreharbeiten."]}},{"title":"Die verbotene Liebe 💔🎭","story":["Ein junger Schauspieler verliebt sich in seine Kollegin. Sie spielen ein Liebespaar im Film. Die Gefühle werden echt. Er liebt sie, aber sie ist schon verheiratet. Das ist eine schwierige Situation. Der Schauspieler kämpft mit seinen Emotionen. Er spricht mit seinem besten Freund. Der Freund sagt: \"Manchmal muss man loslassen.\" Der Schauspieler versteht, dass er nicht egoistisch sein darf. Er entscheidet sich, seine Gefühle zu kontrollieren. Er konzentriert sich auf seine Arbeit. Der Film wird ein großer Erfolg. Die Kollegin ist glücklich in ihrer Ehe. Der Schauspieler lernt, dass wahre Liebe auch loslassen bedeutet. Seine Erfahrung macht ihn stärker."],"translation":[["Ein junger Schauspieler verliebt sich in seine Kollegin.","A young actor falls in love with his colleague."],["Sie spielen ein Liebespaar im Film.","They play a couple in the film."],["Die Gefühle werden echt.","The feelings become real."],["Er liebt sie, aber sie ist schon verheiratet.","He loves her, but she is already married."],["Das ist eine schwierige Situation.","That is a difficult situation."],["Der Schauspieler kämpft mit seinen Emotionen.","The actor struggles with his emotions."],["Er spricht mit seinem besten Freund.","He speaks with his best friend."],["Der Freund sagt: \"Manchmal muss man loslassen.\"","The friend says: \"Sometimes one has to let go.\""],["Der Schauspieler versteht, dass er nicht egoistisch sein darf.","The actor understands that he cannot be selfish."],["Er entscheidet sich, seine Gefühle zu kontrollieren.","He decides to control his feelings."],["Er konzentriert sich auf seine Arbeit.","He concentrates on his work."],["Der Film wird ein großer Erfolg.","The film becomes a big success."],["Die Kollegin ist glücklich in ihrer Ehe.","The colleague is happy in her marriage."],["Der Schauspieler lernt, dass wahre Liebe auch loslassen bedeutet.","The actor learns that true love also means letting go."],["Seine Erfahrung macht ihn stärker.","His experience makes him stronger."]],"vocab":[["sich verlieben in","to fall in love with"],["die Kollegin","female colleague"],["das Liebespaar","couple in love"],["echt","real, genuine"],["verheiratet","married"],["schwierig","difficult"],["die Situation","situation"],["kämpfen mit","to struggle with"],["die Emotion","emotion"],["loslassen","to let go"],["egoistisch","selfish"],["kontrollieren","to control"],["konzentrieren sich auf","to concentrate on"],["die Ehe","marriage"],["bedeuten","to mean"],["die Erfahrung","experience"],["stärker","stronger"],["erlaubt","allowed"]],"speaking":[["Was fühlt der Schauspieler?","Er verliebt sich in seine Kollegin.","He falls in love with his colleague."],["Was entscheidet er?","Er kontrolliert seine Gefühle und konzentriert sich auf seine Arbeit.","He controls his feelings and focuses on his work."],["Was lernt er?","Wahre Liebe kann auch Loslassen bedeuten.","True love can also mean letting go."]],"wordCount":99,"grammar":{"title":"Modale Angaben: gern, lieber, am liebsten","text":"Diese Wörter zeigen Vorlieben.","examples":["Ich esse gern Pizza.","Ich trinke lieber Wasser als Cola.","Ich lese am liebsten Krimis."]}}],"moderate":[]}
