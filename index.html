<style>
:root{--bg:#08090c;--panel:#11131a;--line:rgba(255,255,255,.11);--text:#f8f8fb;--text-soft:rgba(248,248,251,.86);--muted:rgba(248,248,251,.72);--dim:rgba(248,248,251,.58);--soft-panel:rgba(255,255,255,.045);--soft-panel-hover:rgba(255,255,255,.09);--accent:#d8dbe2;--accent-border:rgba(255,255,255,.18)}

#hero{padding:120px 20px 38px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:16px}#hero h1{white-space:nowrap;font-size:clamp(44px,6vw,68px);line-height:.98;letter-spacing:-.05em;margin:0 0 14px}#hero h1 span{display:inline-block;white-space:nowrap;word-break:keep-all;overflow-wrap:normal;text-wrap:nowrap;color:#fff!important;background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important}.subtitle{margin:0 auto;color:var(--text-soft);font-size:17px}.hero-philosophy{max-width:840px;margin:12px auto 0;color:var(--muted);font-size:12px;line-height:1.7}.desc{max-width:780px;margin:10px auto 0;color:var(--muted);line-height:1.65;font-size:13px}
.top-area{position:sticky;top:70px;z-index:50;background:rgba(9,10,15,.80);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.10);padding:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.14)}.level-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.pill{padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);color:var(--muted);font-size:13px;font-weight:650;transition:.2s}.pill:hover{background:rgba(96,165,250,.16);color:#eaf4ff;border-color:rgba(96,165,250,.36)}.pill.active{background:#fff;color:#0b0b0f;border-color:#fff;box-shadow:0 0 30px rgba(255,255,255,.16)}.pill:disabled{opacity:.42;cursor:not-allowed}
.main{padding:22px 0 64px;flex:1}.topic-shell{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}.topic-list,.detail{background:rgba(17,19,26,.88);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 45px rgba(0,0,0,.14)}.topic-list{padding:12px;position:sticky;top:92px;box-shadow:0 12px 35px rgba(0,0,0,.12)}.topic-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:7px 9px 10px}.topic-btn{width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 11px;margin:2px 0;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;line-height:1.38} .topic-btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topic-btn:hover{background:rgba(96,165,250,.13);color:var(--text);border-color:rgba(96,165,250,.24)}.topic-btn.active{background:rgba(255,255,255,.07);border-color:var(--accent-border);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}.empty{padding:38px 18px;color:var(--dim);text-align:center;font-size:13px}.detail{padding:26px 28px}.detail h2{font-size:32px;line-height:1.08;margin:0 0 18px;letter-spacing:-.035em;color:var(--text)}.story-meta{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--dim);text-align:right;margin:-6px 0 10px}.story{color:var(--text-soft);font-size:15px;line-height:1.75}.story p{margin:0 0 14px;padding:0;border-radius:0}
.section{margin-top:30px}.section-title{font-size:15px;font-weight:750;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:8px;color:var(--text)}.section-note{color:var(--muted);font-size:12px;margin:-2px 0 10px;line-height:1.5}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.08)}.data-table{width:100%;border-collapse:collapse;min-width:560px}.data-table th,.data-table td{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top;text-align:left;line-height:1.5;font-size:13px}.data-table th{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.045)}.data-table td:first-child{color:var(--text)}.data-table td:last-child{color:var(--muted)}.data-table tr:last-child td{border-bottom:0} .speaker{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:var(--text);border-radius:8px;padding:5px 8px;font-size:13px;float:right}.speaker:hover{background:rgba(255,255,255,.08)}.vocab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.vocab-item{padding:14px 14px;min-height:58px;border:1px solid var(--line);background:rgba(255,255,255,.032);border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.08)}.vocab-item:hover{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.28)}.vocab-de{font-weight:700;font-size:13px;line-height:1.4;color:var(--text)}.vocab-en{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-size:12px;margin-bottom:15px;padding:0}.back:hover{color:var(--text)}footer{padding:24px 0 46px;margin-top:auto;flex-shrink:0;text-align:center;color:var(--dim);font-size:11px}
.theme-toggle{position:fixed;right:20px;top:78px;z-index:100;border:1px solid rgba(255,255,255,.16);background:rgba(17,19,26,.90);color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 22px rgba(0,0,0,.20)}.speakable{cursor:pointer;border-radius:9px;transition:.18s;padding:2px 5px;margin:-2px -5px}.speakable:hover{background:rgba(96,165,250,.12)}.qa-list{display:grid;gap:8px}.qa-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qa-bubble{padding:10px 12px;border-radius:18px;border:1px solid var(--line);line-height:1.55;min-height:0;box-shadow:0 8px 24px rgba(0,0,0,.08)}.qa-question{background:rgba(255,255,255,.035)}.qa-answer{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.045));border-color:rgba(255,255,255,.15)}.qa-bubble:hover{transform:translateY(-1px)}.qa-label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;font-weight:800}.qa-en{margin-top:4px;font-size:11.5px;color:var(--muted)}

}

/* Final dialogue/table fit: no horizontal scrolling */

/* Interactive language terms: normal weight, dotted underline, hover translation, click-to-pronounce. */

.sprechen-levels{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.sprechen-level-btn{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font-size:12px;font-weight:750;cursor:pointer}.sprechen-level-btn:hover{background:var(--hover-bg);color:var(--hover-fg);border-color:var(--hover-border)}.sprechen-level-btn.active{background:#fff;color:#0b0b0f;border-color:#fff}.speaking-placeholder{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;line-height:1.6}.speaking-section{margin:0 0 18px;padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.speaking-section-title{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;font-weight:800;padding:0 0 10px;margin:0 0 10px;cursor:pointer}.speaking-section-title:hover{color:var(--text)}.speaking-section-title span{font-size:13px;opacity:.7}.speaking-section p,.speaking-section li{font-size:13px;line-height:1.65;color:var(--text-soft)}.speaking-section ul{margin-top:8px}.speaking-meta{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);color:var(--text-soft);line-height:1.6}.speaking-table{width:100%;border-collapse:collapse;table-layout:fixed}.speaking-table th,.speaking-table td{padding:10px 11px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top;font-size:12.5px;line-height:1.55;text-align:left;overflow-wrap:anywhere}.speaking-table th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;background:rgba(255,255,255,.035)}.speaking-table tr:last-child td{border-bottom:0}.speaking-quote{padding:12px 13px;border-left:3px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(255,255,255,.035);color:var(--text-soft);line-height:1.6}.speaking-english{color:var(--muted)}.important-title{color:#fff}.speaking-success{padding:15px 16px;text-align:center;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);font-weight:800;color:var(--text)}body.light .sprechen-level-btn.active{background:#000;color:#fff;border-color:#000}body.light .speaking-section{background:rgba(20,24,35,.025)}body.light .speaking-section-title{color:#171b24}body.light .speaking-section p,body.light .speaking-section li{color:#303846}body.light .speaking-meta,body.light .speaking-quote,body.light .speaking-success{background:#fafbfc}.a2-nav-grid{display:grid;grid-template-columns:1fr;gap:0;margin:0 0 16px}.a2-nav-card{width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 11px;margin:2px 0;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;font-weight:400;line-height:1.38;cursor:pointer;transition:.18s}.a2-nav-card:hover{background:var(--hover-bg);color:var(--hover-fg);border-color:var(--hover-border)}.a2-nav-card.active{background:rgba(255,255,255,.07);border-color:var(--accent-border);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}.a2-nav-card .nav-small{display:none}.a2-subpanel{margin-top:0}.speaking-section-title:focus,.speaking-section-title:focus-visible{outline:none;box-shadow:none}
</style>

<style>

.back:hover *,

.term-link:hover{color:inherit;background:transparent}

<style>

<script>
// =========================
